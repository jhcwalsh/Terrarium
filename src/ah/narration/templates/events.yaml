      headline: "Unemployment holds at {actual_fmt}%"
      body: "Consensus was {consensus_fmt}%. Derived from the trend-growth state by a fixed Okun map registered at world build."
    - id: e03-s0-b
      headline: "Labour market steady, unemployment {actual_fmt}%"
      body: "A panel of {n_forecasters} looked for {consensus_fmt}%. A derived observable, per the register."
  "1":
    - id: e03-s1-a
      headline: "Unemployment at {actual_fmt}%, {direction} consensus"
      body: "{surprise_sd_fmt} standard deviations against {consensus_fmt}%. Derived observable; see the register."
    - id: e03-s1-b
      headline: "Payrolls hold up, awkwardly"
      body: "Unemployment came in at {actual_fmt}% against a consensus of {consensus_fmt}% — the labour market has refused to soften on schedule."
      traced_to: "DN-9 §C.2"
    - id: e03-s1-c
      headline: "Jobless rate {actual_fmt}%"
      body: "Forecasters had {consensus_fmt}%. The reading gave the Committee no reason to change course."
  "2":
    - id: e03-s2-a
      headline: "Unemployment reaches {actual_fmt}%, {direction} what the panel expected"
      body: "{surprise_sd_fmt} standard deviations from {consensus_fmt}%. Forecasters have now missed in the same direction repeatedly, a run one economist described as a model problem rather than a data problem."
    - id: e03-s2-b
      headline: "Labour market turns: unemployment {actual_fmt}%"
      body: "Against a consensus of {consensus_fmt}%. The map from trend growth to this figure is registered and disclosed."
  "3":
    - id: e03-s3-a
      headline: "Unemployment at {actual_fmt}%, the largest miss in the series"
      body: "{surprise_sd_fmt} standard deviations against {consensus_fmt}%, from a panel of {n_forecasters}."

