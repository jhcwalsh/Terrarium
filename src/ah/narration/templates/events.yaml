# THE WIRE — Tier-1 event bank
#
# STATUS: PLACEHOLDER — not the editorial golden set.
#
# `docs/editorial/voices-golden-set-v0.md` fixes the register of the Committee,
# the four columnists and the House Economist, and those three banks
# (fomc.yaml, columnists.yaml, economist.yaml) carry `traced_to` on every entry
# that comes from it. THIS file is the per-class headline/standfirst bank, which
# the golden set does not cover: it fixes voices, not the paper's own reporting
# copy. Everything here is therefore placeholder written to the register the
# golden set establishes (flat, attributed, no adjective that carries judgement)
# and must be replaced by editorial before anything ships.
#
# DN-9 §3.3 targets twelve variants per severity band. These banks are far
# thinner than that, deliberately: the repetition panel in diagnostics.html is
# the instrument that says how thin, and a bank sized by guess would hide it.
#
# Structure:  <class> -> "<severity>" -> [ {id, headline, body, vocab?} ]
# A missing (class, severity) emits [[NO TEMPLATE: class=EXX sev=N]] rather
# than prose. That marker is a measurement.
STATUS: "PLACEHOLDER — not the editorial golden set"

E01:
  "0":
    - id: e01-s0-a
      headline: "Committee {verb} at {target_pct}%"
      body: "No change, and the rule monitor puts the anchor at {smoothed_pct}%. The residual is {epsilon_bp}bp."
    - id: e01-s0-b
      headline: "Committee leaves the target range at {target_pct}%"
      body: "The decision was in line with what the reaction function implied. Two members told this paper the discussion lasted under an hour."
  "1":
    - id: e01-s1-a
      headline: "Committee {verb} to {target_pct}%"
      body: "A move of {move_bp} basis points against a rule that implied {smoothed_pct}%. The residual is {epsilon_bp}bp."
    - id: e01-s1-b
      headline: "Committee {verb} to {target_pct}%, and changes two words"
      body: "The statement's alterations were confined to the description of activity. The anchor implied {smoothed_pct}%."
    - id: e01-s1-c
      headline: "Policy set at {target_pct}% as the rule and the room agree"
      body: "The decomposition puts the neutral rate and the inflation gap at {anchor_pct}% before smoothing. Judgement accounted for {epsilon_bp}bp."
  "2":
    - id: e01-s2-a
      headline: "Committee {verb} to {target_pct}%, further than the rule asked"
      body: "The smoothed anchor implied {smoothed_pct}%. The extra {epsilon_bp}bp is judgement, not arithmetic."
    - id: e01-s2-b
      headline: "Committee {verb} to {target_pct}% and hardens the language"
      body: "A move of {move_bp} basis points, with the residual at {epsilon_bp}bp against an anchor of {smoothed_pct}%."
  "3":
    - id: e01-s3-a
      headline: "Committee {verb} to {target_pct}%, and drops the sentence everyone was watching"
      body: "{move_bp} basis points that almost nobody expected, and a deletion that mattered more. The rule implied {smoothed_pct}%; the residual is {epsilon_bp}bp."
    - id: e01-s3-b
      headline: "Committee goes to {target_pct}% against a rule that implied {smoothed_pct}%"
      body: "The largest departure from the reaction function in this cycle. The extra {epsilon_bp}bp is where the judgement is written down."

E02:
  "0":
    - id: e02-s0-a
      headline: "Inflation at {actual_fmt}%, in line"
      body: "Consensus looked for {consensus_fmt}%. The reading was {surprise_sd_fmt} standard deviations from the panel's median."
    - id: e02-s0-b
      headline: "Prices steady at {actual_fmt}%"
      body: "A panel of {n_forecasters} forecasters had {consensus_fmt}%. Nothing in the composition changed the argument."
  "1":
    - id: e02-s1-a
      headline: "Inflation {direction} consensus at {actual_fmt}%"
      body: "The median of {n_forecasters} forecasts put the reading at {consensus_fmt}%. Services led; goods did the rest."
    - id: e02-s1-b
      headline: "Inflation prints {actual_fmt}%, a tenth {direction} expectations"
      body: "{surprise_sd_fmt} standard deviations against a consensus of {consensus_fmt}%."
    - id: e02-s1-c
      headline: "Consumer prices at {actual_fmt}%"
      body: "Forecasters had {consensus_fmt}%. The composition was unremarkable, which is itself the story after a year of it not being."
  "2":
    - id: e02-s2-a
      headline: "Inflation {direction} at {actual_fmt}%, and the panel was on the wrong side"
      body: "{surprise_sd_fmt} standard deviations against {consensus_fmt}%. Of {n_forecasters} forecasters, few were positioned for it."
    - id: e02-s2-b
      headline: "Prices come in at {actual_fmt}% against {consensus_fmt}% expected"
      body: "The largest miss in several quarters. Services led; goods stopped helping."
  "3":
    - id: e02-s3-a
      headline: "Inflation rises to {actual_fmt}%, and nobody had it"
      body: "The reading came in {surprise_sd_fmt} standard deviations from a consensus of {consensus_fmt}% that {n_forecasters} forecasters had built. Services led; goods, which had done the disinflationary work, stopped helping."
      traced_to: "DN-9 §A.2 (the print that ended the argument)"

E03:
  "0":
