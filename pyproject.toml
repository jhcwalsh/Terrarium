[project]
name = "alternate-histories"
version = "0.1.0"
description = "Alternate Histories Platform — Step 0 rails: WorldSpec contract, validator, deterministic toy engine, stores, compiler harness, validation battery, CLI."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Alternate Histories" }]
dependencies = [
    # Runtime models + contract interchange (STEP0-PLAN §1)
    "pydantic>=2.7",
    "jsonschema>=4.21",       # Draft 2020-12 contract validation
    "numpy>=1.26",            # engine only; no pandas in core/
    "typer>=0.12",            # CLI
    "pyyaml>=6.0",            # battery thresholds.yaml + regime rulesets
    "pandas>=2.2",            # allowed in battery/ and data/ (never core/)
    "anthropic>=0.34",        # behind an interface; live calls only via CLI --live
    # Step 1 data layer (STEP1-DATA-PLAN §1)
    "duckdb>=1.0",            # catalog + SQL over parquet
    "pyarrow>=16.0",          # parquet read/write for normalized series
    "openpyxl>=3.1",          # Shiller / Treasury HQM xlsx parsing
    "xlrd>=2.0",
    # Step 2 generator layer, L1/L2 runtime (STEP2-GENERATOR-PLAN §1)
    "jax>=0.4.30",            # CPU wheels work natively on Windows (verified; NUTS = CPU hours)
    "numpyro>=0.15",          # L1 climate model + L2 semi-Markov skeleton
    # Step 2 generator layer, L3 runtime (STEP2-GENERATOR-PLAN §1: PyTorch 2.x)
    "torch>=2.4",             # cu126 wheels verified on this machine (RTX 3080, driver 591.86)
    # Single-user product, client-plane server (KICKOFF-PRODUCT-SU su-eng-02;
    # justified by ratified DN-3 decision W1: FastAPI session service)
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
ah = "ah.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-socket>=0.7",     # enforce: no network in tests/CI
    "hypothesis>=6.100",      # property tests for the engine
    "ruff>=0.5",              # lint + format
    "pyright>=1.1.370",       # type-check (basic mode)
    "httpx2>=0.1",            # starlette TestClient transport (su-eng-02 tests)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ah"]

# ---------------------------------------------------------------------------
# Tooling configuration
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# pytest-socket: block all network by default. Tests that need a loopback
# socket (none in Step 0) can opt in explicitly. --live CLI path is never tested.
addopts = "--disable-socket -q"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["ah.core"]          # G0 coverage gate is on core/
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# ruff 0.16 began formatting Python code blocks inside Markdown. This repo's
# docs are prose ABOUT code: plan documents quote fragments -- keyword-argument
# lists, partial call sites, snippets with the surrounding function elided --
# which are not valid standalone modules. The formatter parses them as modules
# and rewrites them into something that no longer means what the document says
# (measured: `drawdown_depth=dd,` in a kwargs block became
# `drawdown_depth = (dd,)`, a tuple assignment, in
# docs/superpowers/plans/2026-08-04-private-programme-console-section.md).
# Formatting documentation is not a check this project ever opted into, and
# applying it corrupts the record -- so Markdown is excluded. Python files are
# unaffected: `ruff check` and `ruff format` cover src/, tests/ and scripts/
# exactly as before.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pyflakes + pycodestyle
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "RUF",           # ruff-specific
]
ignore = [
    "E501",          # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# The artifact builder embeds display typography (en-dashes, ×) in chart titles.
"scripts/build_artifact.py" = ["RUF001", "RUF002", "RUF003"]
# Same reason: the results-figure builder embeds minus signs, en-dashes and
# ellipses in axis labels and captions, where the typographic character is the
# correct one and the ASCII lookalike would be wrong in print.
"scripts/build_results_figures.py" = ["RUF001", "RUF002", "RUF003"]
# The QA console renders HTML: en-dashes, minus signs and middots are display
# typography, and the ASCII lookalike would be wrong on the page.
"src/ah/console.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# Typer's (and FastAPI's) function-call-in-default is the intended idiom,
# not a B008 mutable default.
extend-immutable-calls = ["typer.Option", "typer.Argument", "fastapi.Depends"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = true
venvPath = "."
venv = ".venv"

# The data layer is pandas-heavy; pandas' inline type stubs produce many false
# positives (.to_numpy on ndarray, .dt on Series, groupby overloads). Silence just
# those categories here — real checks (undefined names, imports, etc.) stay on, and
# the rest of the codebase keeps full basic-mode strictness.
[[tool.pyright.executionEnvironments]]
root = "src/ah/data"
reportAttributeAccessIssue = "none"
reportCallIssue = "none"
reportArgumentType = "none"
reportReturnType = "none"
reportIndexIssue = "none"
reportOperatorIssue = "none"
reportOptionalMemberAccess = "none"

# The Step-2 generator/eval layers are numpy/pandas/torch-heavy — same stub noise.
[[tool.pyright.executionEnvironments]]
root = "src/ah/gen"
reportAttributeAccessIssue = "none"
reportCallIssue = "none"
reportArgumentType = "none"
reportReturnType = "none"
reportIndexIssue = "none"
reportOperatorIssue = "none"
reportOptionalMemberAccess = "none"

[[tool.pyright.executionEnvironments]]
root = "src/ah/eval"
reportAttributeAccessIssue = "none"
reportCallIssue = "none"
reportArgumentType = "none"
reportReturnType = "none"
reportIndexIssue = "none"
reportOperatorIssue = "none"
reportOptionalMemberAccess = "none"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
