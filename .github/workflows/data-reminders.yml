name: data-reminders

# Calendar-driven reminders to perform manual/licensed intakes (not automatable).
on:
  schedule:
    - cron: "0 7 5 1,4,7,10 *"   # 07:00 UTC on the 5th, quarterly
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Open manual-intake reminder issue
        uses: actions/github-script@v7
        with:
          script: |
            const due = [
              "Albourne quarterly PM/HF strategy returns drop",
              "Albourne derived cashflow groups A-E (per spec)",
              "Cliffwater CDLI quarterly",
              "Nareit monthly REIT total return",
              "NCREIF NPI/ODCE quarterly (when licensed)",
              "JST annual macrohistory refresh check",
            ];
            github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Manual data intakes due (${new Date().toISOString().slice(0,10)})`,
              body: "Calendar reminder — validate each drop with `ah data intake validate <file>`:\n\n- " + due.join("\n- ")
            })
