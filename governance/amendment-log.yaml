  rationale: 'CORRECTION OF A FALSE PROSE GLOSS IN THE SEALED multi_seed_decision_rule.tail_tier_definition,
    MADE AFTER RESULTS EXIST. THIS IS THE FIRST post_hoc: true ENTRY IN THIS LOG,
    and that flag is the substance of the entry rather than a formality: every prior
    amendment (AM-2026-07-26-001 through -008) is post_hoc: false because at the time
    of each one no generator had been fitted and no G2 evidence existed. That is no
    longer true. WP2.10''s 18-cell multi-seed ablation grid completed before this
    defect was found.


    WHAT THE GLOSS SAID. tail_tier_definition defined the comparison set as ''the
    five d4_strategies minus reference_run.uncomputable_d4_strategies, which on this
    vintage is sixty_forty, momentum and carry''. WHAT THE FIELD SAYS: reference_run.uncomputable_d4_strategies:
    [eqw_factors, endowment_proxy]. The gloss named the COMPLEMENT of the very field
    it glossed.


    THREE INDEPENDENT CONFIRMATIONS THAT THE FIELD IS RIGHT AND THE GLOSS IS WRONG.
    (1) The sealed field itself reads [eqw_factors, endowment_proxy], and it is the
    field, never this prose, that ah.eval.prereg''s threshold-availability check and
    ah/eval/ablation.py''s comparison_set() read. (2) The same sealed document, rationale.d4_commodities_consequence,
    says: ''TWO of the five sealed D4 strategies have NO COMPUTABLE REFERENCE STATISTICS
    on the sealed campaign vintage: eqw_factors and endowment_proxy ... The other
    three (sixty_forty, momentum, carry) are computable and are where every sealed
    thresholds.strategies entry lives'' -- and every sealed thresholds.strategies
    key is in fact on one of those three. limitations.the_campaign_vintage_is_missing_two_of_fourteen_factors
    says the same. (3) WP2.10''s measurements: on every one of the 18 grid cells,
    sixty_forty, momentum and carry carry finite elicitability_score values (bootstrap-v1
    seed 0: -2.5168, -2.3914, -1.7309) while eqw_factors and endowment_proxy are NaN
    in all 18. elicitability_score scores the GENERATED forecast against the HISTORICAL
    realizations, so a finite value is proof that the historical side exists.


    WHY IT IS NOT INERT -- THE TWO READINGS GIVE OPPOSITE G2 VERDICTS, WHICH IS WHY
    THIS IS AN AMENDMENT AND NOT A FOOTNOTE. Reading the FIELD (what the code does):
    the comparison set is {sixty_forty, momentum, carry}, all computable, the rule
    executes, and on the WP2.10 grid hier-flow-v1 satisfies clause (1) against bootstrap-v1
    in all three seeds. Reading the GLOSS literally: the comparison set is {eqw_factors,
    endowment_proxy}, both NaN on the generated side in every cell, and beats_definition''s
    NaN rule (''if either side''s elicitability_score is NaN for any strategy in the
    comparison set, the seed is NOT a beat -- not a tie, not an exclusion'') then
    makes NO SEED A BEAT FOR ANY SYSTEM, EVER: an automatic SHIP-BENCHMARK independent
    of all evidence, for all time. THIS AMENDMENT ADOPTS THE FIELD''S READING.


    WHEN IT WAS FOUND, AND WHO BENEFITS -- STATED WITHOUT SOFTENING, BECAUSE THIS
    IS THE PART A REVIEWER MUST WEIGH. It was found while extracting WP2.10''s results,
    i.e. WITH THE RESULTS ALREADY IN HAND, and after it was already visible that hier-flow-v1
    beats bootstrap-v1 on clause (1) in every seed. So: A CORRECTION THAT MAKES A
    PROMOTION POSSIBLE HAS BEEN MADE BY THE PARTY THAT WOULD BENEFIT FROM A PROMOTION,
    AFTER SEEING THAT A PROMOTION WAS IN REACH. That is the worst possible moment
    to touch a sealed decision rule, and nothing in this entry disposes of it. It
    is recorded here, undiluted, so a reviewer can weigh it against the evidence rather
    than have it argued away. The project owner was shown the WP2.10 results first,
    was told plainly that the correction was being made at the worst possible moment,
    and approved it explicitly. What can be said on the other side, and no more than
    this: two of the three confirmations above (the field itself; d4_commodities_consequence)
    were sealed on 2026-07-26 and have been visible in the committed document since
    long before any generator existed, so the reading adopted here is not one invented
    after the fact; and no number moved.


    WHAT MOVED AND WHAT DID NOT. Exactly one clause of prose inside tail_tier_definition,
    plus an in-place record of the correction beside it (the same in-document convention
    ensemble_size.mc_error_grid.reading''s CLAIMS-SWEEP CORRECTION already uses).
    NO THRESHOLD, BAND, GATE, FLOOR, SPLIT, ENSEMBLE SIZE, SEVERITY, SELECTION WEIGHT
    OR RULE TEXT MOVED -- not one. beats_definition (including the NaN rule, the pooled
    inequality and clause (ii)''s scope), rule, benchmark_draw_span_bias, criterion_bearing_runs_only,
    minimum_seeds, reference_run, the whole thresholds block, ensemble_size, tuning_protocol
