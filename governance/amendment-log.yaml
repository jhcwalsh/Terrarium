      thresholds.panel.nn_distance_p50: 1.0830 -> 1.0371. Half the pooled null p50,
        which moved from 2.1660 to 2.0742 -- policy_rate's own p50 (1.053) sits below
        the pool's.
      thresholds.strategies.carry.elicitability_score: 'NEW: max 5.0, the same authored
        bound the other two carry. Still the one family of thresholds in this file
        derived from no run.'
      thresholds.strategies.carry.es_95: 'NEW: [0.0173, 0.1561], same rule on a measured
        ES95 of 0.05203.'
      thresholds.strategies.carry.kupiec_pof_chi2_tail_1path: 'NEW: min 0.01, the
        derived chi-square(1) 1% point, identical to the other two strategies''.'
      thresholds.strategies.carry.var_95: 'NEW: [0.0116, 0.1045], the sealed [historical/3,
        historical*3] rule on a measured VaR95 of 0.03482 over 708 months (1962-2020).'
    restored_by_the_move:
    - policy_rate joins reference_run.coverage (1954-07..2020-12, n=798) and bootstrap_v1.factor_set
      (eleven factors -> twelve)
    - the `carry` D4 strategy becomes computable; reference_run.uncomputable_d4_strategies
      goes from three names to two
    - term_premium, equity_risk_premium and policy_anchor_deviation stop being NaN
      on every possible ensemble
    - thresholds.blocks.us.policy_rate.excess_kurtosis is RESTORED, at severity report
      (the first seal removed it; the pre-seal draft had it at enforce)
    sealed_at: '2026-07-26'
    still_broken_after_the_refresh:
    - 'hy_spread: 37 observations, 2023-07..2026-07, all inside the holdout. ICE licensing
      limits what FRED serves; no refresh fixes it. The registered ah.data.splice
      hy_oas_pre1996 rule is the only route and applying it is another campaign restart.'
    - 'commodities: no free, already-connectored total-return series exists (RFR-8).
      eqw_factors and endowment_proxy stay uncomputable.'
    - 'bootstrap_v1.block_draw_span: still 1990-2020, bound by equity_vol (VIX), so
      bootstrap-v1 still cannot pose WP2.11''s severe test.'
    superseded_lock_digest: sha256:a714783a7349808a95d63516dd92d737c21739a8a76a189863cc53b483e99bf7
    unchanged_and_checked:
    - all ten pre-existing per-name absurdity bounds -- bit-identical bands, so bit-identical
      K=4 bounds
    - sixty_forty and momentum D4 statistics -- identical to every digit
    - the spread-floor evidence behind S2-SPREAD-FLOOR -- 54.0% of ig_spread (n=1224,
      min 0.32) and 86.9% of funding_spread (n=420, min 0.118) below 100bp, none below
      0.0
    - bootstrap_v1.block_draw_span -- 1990-01..2020-12, 372 months; equity_vol binds
      it and policy_rate does not
    - the twelve structurally_unavailable_statistics -- all blocked by a missing factors.yaml
      mapping or an unimplemented generator capability, neither of which a refresh
      touches
  post_hoc: false
  rationale: 'CAMPAIGN VINTAGE MOVE AND FULL RE-DERIVATION. The first seal (pre-registration.lock
    digest sha256:a714783a...) froze campaign vintage 2026-07-24, a snapshot taken
    BEFORE fred.FEDFUNDS was registered in requirements.yaml by WP2.2 Task 1. As a
    result the factor `policy_rate` -- declared active in factors.yaml, and an input
    to five sealed estimators -- had no train+validation data, for reasons that had
    nothing to do with the data existing. It is a free, connectored FRED series serving
    864 monthly observations from 1954-07. That took `cash_tr_1m`, the `carry` D4
    strategy, `term_premium`, `equity_risk_premium` and `policy_anchor_deviation`
    out of the Step-2 campaign entirely, and the seal made that permanent. A live
    `ah data refresh --live` restored the series and the campaign vintage moves to
    2026-07-26.1. EVERY band, floor, strategy statistic and measured claim in pre-registration.yaml
    was re-derived on the new vintage from scratch; nothing was carried over. THE
    CHECK THAT THE MOVE TOUCHED ONLY WHAT DEPENDED ON IT: every per-factor band for
    the eleven factors that were already present came back BIT-IDENTICAL, as did sixty_forty''s
    and momentum''s D4 statistics. post_hoc is FALSE: no generator has been fitted,
    no training run has happened and no G2 evidence exists, so there is nothing the
    new numbers could have been fitted to -- which is also why a campaign restart
    is free at this point and would not have been later. WHAT THE REFRESH DID NOT
    FIX, stated so it is not assumed: `hy_spread` is still absent (FRED serves ~3
    years of BAMLH0A0HYM2 under ICE licensing, all of it inside the holdout -- a licensing
    limit, not a stale snapshot), `commodities` is still unsourced, and bootstrap_v1.block_draw_span
    is still 1990-2020 because `equity_vol` (VIX) binds it, not `policy_rate`.'
  type: protocol_change
- amendment_id: AM-2026-07-26-004
  date: '2026-07-26'
  payload:
    amends:
    - AM-2026-07-26-001
    - AM-2026-07-26-002
    changed_values:
      decisions.S2-ENDOWMENT-WEIGHTS: NEW, closing RFR-9. endowment_proxy's credit_xs_hy
        0.15 is a notional/risk budget, not a capital share; 0.15 of capital is uninvested.
        The duration-matched-government-leg alternative was rejected because it authors
        a new sealed derived series with no evidence for a strategy with no computable
        historical path.
      decisions.S2-NUMERAIRE-BIAS: RE-TAKEN on measured evidence. Still option (b).
        Option (a) truncates momentum's sample 1134 -> 798 months (ES99 0.15597 ->
        0.12923) while changing VaR95/ES95/VaR99/ES99 by nothing at five decimals
        on that same span -- it corrects a mean-level bias invisible to every statistic
        sealed for momentum, at the cost of the worst tail in the record.
      ensemble_size.mc_error_grid: 'NEW, and moved INTO the seal from governance/decision-register.md,
        where it was editable with no amendment and no lock violation while a sealed
        value rested on it. Re-measured on campaign vintage 2026-07-26.1 at the sealed
        mean_block_months. Provenance script: scripts/measure_mc_error_grid.py.'
      ensemble_size.n_paths: '1000 -> 1024. Sealed because 1024 is a MEASURED point
        of ensemble_size.mc_error_grid; 1000 never was. Downstream: WP2.4 and WP2.8-2.10
        must produce criterion-bearing ensembles at 1024 x 120.'
      multi_seed_decision_rule.beats_definition: NEW. See rationale item (2).
      multi_seed_decision_rule.benchmark_draw_span_bias: NEW. See rationale item (3).
      multi_seed_decision_rule.tail_tier_definition: NEW. See rationale item (2).
      tuning_protocol.selection_lambda: 1.0, NEW. AUTHORED, not derived -- no generator
        exists, so no evidence about the two objective terms' relative scale exists.
        The load-bearing property is INVARIANCE (the same lambda for every system,
        sampler, seed and trial), not level. It may NEVER be selected from the trials.
    code_changes_inside_the_seal:
    - 'ah/eval/prereg.py: verify() now ERRORS when the pre-registration is sealed
      and a named lock_path is absent. It previously skipped the lock check entirely,
      so deleting pre-registration.lock made every battery run verify clean and silent.
      Docstring corrected on which backfills the vintage demonstrates are unapplied.'
    - 'factors.yaml: factor_sources.policy_rate.proxy_for corrected -- the series
      is present on the new vintage, and its 1954-07 start (fred.FEDFUNDS''s own first
      observation, not fred.TB3MS''s 1934-01) is now the direct demonstration that
      the splice rule is unapplied.'
    code_changes_outside_the_seal:
    - 'ah/data/catalog.py + ah/data/refresh.py: refresh now CARRIES FORWARD every
      already-held series it did not refetch. Without it a vintage was not the complete
      as-of snapshot every pinned read assumes: fred.TEDRATE (retired, never stale)
      silently dropped out of the first refresh, taking funding_spread with it. This
      is why the campaign vintage is 2026-07-26.1 and not 2026-07-26. See governance/retrofit-register.md
      RFR-62.'
    corrections:
    - 'structurally_unavailable_statistics header: ''All eleven names'' -> twelve.
      The LIST was always twelve and is machine-checked in both directions; only the
      count of it was wrong.'
    - 'rationale.d4_commodities_consequence: two of five D4 strategies are uncomputable,
      but not ''on the strength of commodities alone'' -- endowment_proxy is independently
      blocked by hy_spread via credit_xs_hy.'
    - limitations.the_campaign_vintage_is_missing_three_of_fourteen_factors -> ..._two_of_fourteen_factors.
    - 'limitations.the_economics_tier_reduces_to_two_audits -> ..._to_five_of_eleven:
      three names are restored by the vintage move, but the tier''s ENFORCE surface
      is still exactly two audits.'
    - governance/decision-register.md's S2-ENSEMBLE-SIZE claimed a non-criterion-bearing
      run 'is rejected by ah/eval/g2.py'. It is not -- g2.py contains only the holdout-token
      mint, and that refusal is a sealed requirement on WP2.11, not an existing check.
      The sealed file already said so; the register did not.
    ratifying_body: D6 workshop
    sealed_at: '2026-07-26'
    what_is_provisional_and_added_here:
      bootstrap_v1.mean_block_months: still 6, but the window it sits in was RE-MEASURED
        and MOVED (roughly 4<=L<=8 -> 5<=L<=9), which is direct evidence that this
        window is a property of the factor set and not of the method. 6 is now one
        step from the lower edge. WP2.4 must re-confirm at the sealed 1024 paths.
      ensemble_size.n_paths: 1024. The MC-error grid is measured, but HOW MUCH smaller
        than a band the Monte-Carlo error must be is a judgment, and the gates' power
        rises without limit in n_paths. D6 ratifies.
      thresholds.strategies.carry.*: carry's var_95/es_95 inherit the same three-fold
        order-of-magnitude width, and its elicitability_score bound the same un-derived
        5.0, as the other two strategies. Provisional on exactly the same terms.
      tuning_protocol.selection_lambda: 1.0, authored with no evidence. Same standing
        as tuning_protocol.trial_budget_per_system (AM-2026-07-26-002).
  post_hoc: false
  rationale: 'THE RE-SEAL''S OWN CHANGES, separate from the vintage move (AM-2026-07-26-003)
    so the two are auditable apart: a value that moved because the DATA changed and
    a value that moved because the DOCUMENT was wrong are different kinds of amendment.
    Six items, each a defect in what was sealed on 2026-07-26 rather than a consequence
    of the new vintage. (1) ensemble_size.n_paths was 1000 while the MC-error grid
    justifying it was measured at 1024 -- a round number standing in for a measured
    one; 1024 is now sealed, and the grid itself has moved from the UNSEALED governance/decision-register.md
    into ensemble_size.mc_error_grid, inside the hash. (2) multi_seed_decision_rule''s
    first clause said ''beats bootstrap-v1 on the tail tier'' and NOTHING RESOLVED
    IT: ah.eval.battery.TIERS has no tail tier and every tails-suite metric is registered
    tier=monthly, so WP2.11 would have had to invent the gating definition after seeing
    results. tail_tier_definition and beats_definition now state both exactly. (3)
    The benchmark''s 1990-2020 draw span biases the head-to-head TOWARD promotion
    -- sealed as benchmark_draw_span_bias, with a reporting obligation on WP2.11.
    (4) tuning_protocol referred to ''the config''s own sealed lambda'' and sealed
    no lambda anywhere; selection_lambda: 1.0 is now pinned, and it is AUTHORED, not
    derived. (5) RFR-12''s option (a) became buildable on the new vintage, so the
    numeraire decision was re-taken on measured evidence rather than inherited from
    an impossibility argument that no longer holds; it stays option (b). (6) RFR-9
    -- whether endowment_proxy''s weights are capital shares or a risk budget -- was
    assigned to WP2.3 and never answered; it is now sealed as a risk budget. Two count
    corrections travel with them (the structurally-unavailable header said eleven
    for a twelve-name list; d4_commodities_consequence attributed both uncomputable
    strategies to commodities alone). post_hoc is FALSE for the same reason as the
    first three entries: no generator, no trial, no G2 evidence exists, so nothing
    here could have been fitted to a result.'
  type: protocol_change
- amendment_id: AM-2026-07-26-005
  date: '2026-07-26'
  payload:
    amends:
    - AM-2026-07-26-003
    - AM-2026-07-26-004
    code_changes_inside_the_seal:
    - 'ah/eval/battery.py: criterion_bearing now compares THE VINTAGE as well as the
