  rationale: 'THE HOLDOUT WAS NOT SPENT, AND THAT IS THE CONSERVATIVE ACT RATHER THAN AN
    OMISSION.


    THE DEFECT THAT FORCED THE DECISION. This document pins the holdout''s span, its
    guard, its at-most-once budget and an absolute no-tuning prohibition -- and never
    says what the single permitted evaluation should COMPUTE. The plan is no more
    specific. Critically, NONE OF multi_seed_decision_rule''s FOUR CLAUSES READS THE
    HOLDOUT: all four are computed on the WP2.10 ablation grid against a train+validation
    reference, so the G2 verdict is fully determined without it. The holdout''s role at
    G2 was therefore never a defined test -- only a defined guard around an undefined
    one.


    WHY SPENDING IT WOULD HAVE BEEN WORSE THAN NOT. Any procedure run against it at
    WP2.11 would have been authored at WP2.11, with the ablation grid, both severe arms,
    the head-to-head and the restricted-window re-run all already in hand. That is the
    forking path this file exists to close, applied to the one resource in the project
    that cannot be restored. A holdout number produced that way is uninterpretable: a
    reader cannot distinguish "the system generalizes" from "the author picked a
    procedure that showed it does". Not spending costs the gate nothing, because the
    verdict does not depend on it, and leaves the resource worth exactly what it was.


    WHAT A LATER GATE MUST DO TO SPEND IT. Write the evaluation down FIRST -- what is
    generated, at what size, from what conditioning state, scored on which metrics,
    against which realizations, with what decision consequence if any -- seal that
    specification before the campaign it will judge, and only then mint the token. That
    is what pre-registration means, and it is the one thing WP2.3 did not do for this
    resource.


    WHY AN AMENDMENT RATHER THAN A NOTE. The sealed sentence asserts a fact about this
    project''s conduct ("is spent EXACTLY ONCE, by WP2.11") that is no longer true.
    Leaving it unamended would leave the sealed document making a false statement about
    what actually happened -- which is EXACTLY the defect class this project has now
    recorded five times against other prose (RFR-76, -77, -78, -81, -82: the seal
    asserting or assuming something nothing verifies). Filing this amendment is the
    author holding their own document to the standard they applied to those.


    THE LITERAL READING, NAMED RATHER THAN GLOSSED. "Spent EXACTLY ONCE" can be read as
    REQUIRING a spend, in which case not spending departs from the sealed text and this
    amendment is what makes that departure legitimate and dated. It can also be read as
    BOUNDING spending at one, in which case zero conforms. The first reading is the
    stricter one and is the reason this is filed as a protocol_change rather than left as
    a decision-register row. Both readings are recorded so a reviewer weighs the choice
    rather than inherits it.


    post_hoc IS TRUE: the WP2.10 grid, both severe arms and the head-to-head all existed
    when this was decided. The flag records the state of the world, not the size of the
    change. Nothing about the verdict moves either way -- the rule never read this data.'
