  post_hoc: true
  rationale: 'THE EXECUTABLE FORM OF multi_seed_decision_rule, WHICH THE SEALED DOCUMENT
    ITSELF SAID DID NOT EXIST. pre-registration.yaml''s own header says: "WP2.11
    implements it in ah/eval/g2.py, which today contains only the sanctioned
    holdout-token mint and no decision logic at all ... g2.py is already inside the seal,
    so when WP2.11 writes the executable form it cannot diverge from these words without
    a dated amendment and a re-seal, and this block is what it will be read against."
    This is that amendment.


    ONE SUBSTANTIVE READING WHERE THE TABLE AND THE SENTENCE DISAGREE, AND THE SENTENCE
    WINS. ABLATION.md section 6 reports "pooled beat" and "clause (ii) every seed" as
    INDEPENDENT columns, and by those columns hier-diffusion-v1 is a pooled beat.
    beats_definition says: "Clause (ii) must still hold in every seed for the pooled
    route -- the pooled arm relaxes the objective, not the band-regression check."
    hier-diffusion-v1 fails clause (ii) in every seed, so its POOLED ROUTE FAILS and its
    clause (1) does not hold. The executor implements the sentence. This is exactly why
    it was composed from the sealed words rather than from the generated table, and it is
    recorded here because a reader comparing the two documents will otherwise think one
    of them is wrong.


    ONE AMBIGUITY FOUND AND NOT RESOLVED UNILATERALLY. rule clause (2), "NO ENFORCE-TIER
    REGRESSION on the monthly or 1_5yr tiers relative to bootstrap-v1", admits a BY-COUNT
    reading (the challenger''s number of failing enforce metrics is <= the benchmark''s)
    and a BY-METRIC reading (no metric the benchmark PASSES is FAILED by the challenger,
    which additionally forbids trading one failure for another). g2.py COMPUTES BOTH,
    reports both, sets `holds` to their AND (the stricter reading), and emits a NOTE when
    they disagree -- the same posture S2-HORIZON-TIER took for "the horizon tier". They
    AGREE on every cell of the WP2.10 grid, so nothing turns on it here; narrowing the
    sealed sentence is a dated protocol_change amendment for a later work package, taken
    before results exist, not a choice made inside this one.


    A VACUOUS GUARD FOUND AND REPLACED WHILE TESTING. The first draft refused a seed
    whose challenger and benchmark comparison sets differed by strategy_ids. Those ids
    are derived from the sealed arguments alone and are identical by construction, so the
    guard could never fire -- dead code wearing the appearance of a safety check. It now
    guards the resolved metric NAMES, which ARE read off each report and CAN differ, and
    which clause (ii) counts over; a test pins the distinction so the guard cannot quietly
    revert to the vacuous form.


    post_hoc IS TRUE and the ordering is the mitigation. The WP2.10 grid, both severe
    arms and the head-to-head all existed before a line of this code was written -- the
    verdict could not have been otherwise, since the rule is executed on stored reports.
    What makes it defensible is that the implementation was validated against numbers
    produced by a DIFFERENT program before being trusted, that it discriminates rather
    than approving everything, and that the clause it most plausibly could have been bent
    on -- clause (1) for hier-diffusion-v1 -- was implemented AGAINST the reading that
    would have promoted a second system.'
