  cliffwater.bdc_ret_m:  {source: cliffwater, code: CWBDC, frequency: "M", units: ret, min_start: 2004-10, sla_days: 45, license_tier: REG, priority: P1, intake: manual, enforce: true, notes: "Cliffwater BDC Index total return. Registered 2026-08-08 under the WP1.9 emergent-requirements rule on delivery of data/CWBDC-monthly-2004-2026.csv; landed by scripts/ingest_cwbdc.py. DISTINCT FROM cdli above and deliberately so: CDLI is quarterly asset-level appraisal-marked direct lending, this is MONTHLY LISTED BDC prices -- marked to market, not smoothed. It is therefore the de-smoothing VALIDATION ANCHOR for private credit rather than another series needing correction (measured on delivery: ann vol 21.6%, 2020-03 -35.5%, lag-1 ACF +0.087 where an appraisal index shows 0.4-0.8). Read as an UPPER bound on de-smoothed asset-level risk: BDCs are levered and listed. min_start is 2004-10 because the vendor's 2004-09 row is the index base and carries no return."}
