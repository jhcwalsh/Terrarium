# requirements.yaml — the machine-readable requirements manifest (STEP1-DATA-PLAN §3).
#
# The single source of truth for what series the platform requires. Any workstream
# that needs an unregistered series adds it here in the same PR (§WP1.9 emergent-
# requirements rule). Each entry:
#   source        connector/source id
#   code          upstream code (source-specific); null for derived/manual groups
#   frequency     native->emit, e.g. "D->M", "M", "Q", "A", "per-spec"
#   units         units class hint (pct | index | idx | lvl | 0/1 | ret | rate | curve | cf)
#   min_start     earliest expected observation (YYYY-MM), or null
#   sla_days      freshness SLA in days
#   license_tier  FREE | REG | COMM
#   priority      P0 | P1 | P2
#   intake        auto | manual
#   enforce       QC severity default (true=enforce, false=warn)
#   notes         free text

series:
