  fred.SAHMREALTIME: {source: fred, code: SAHMREALTIME, frequency: "M", units: pct, min_start: 1959-12, sla_days: 40, license_tier: FREE, priority: P1, intake: auto, enforce: false, notes: "Real-time Sahm Rule recession indicator. Registered under the WP1.9 emergent-requirements rule by WP2.11; see governance/retrofit-register.md RFR-81. NOT mapped to any factor and NOT consumed by the sealed campaign -- factors.yaml is a sealed judged source and mapping a new factor needs an amendment plus a full retrain, so this entry makes the series AVAILABLE and closes nothing on its own. Complements fred.USREC rather than replacing it: USREC is the NBER 0/1 chronology, revised and published with long lags, while this is a continuous percentage-point rule computed from unemployment in real time and NEVER revised -- so it is the honest input wherever a recession label must be as-of rather than in-hindsight. min_start is the series' documented start and is UNVERIFIED here (this environment has no network); enforce is false, so a first live refresh warns rather than blocks if it is wrong."}

