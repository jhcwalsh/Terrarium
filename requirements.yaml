  fred.TEDRATE:  {source: fred, code: TEDRATE, frequency: "D->M", units: pct,  min_start: 1986-01, sla_days: 9999, license_tier: FREE, priority: P1, intake: auto, enforce: false, notes: "RETIRED 2022-01 (last obs 2022-01-21). The documented replacement leg is the CP-bill spread from fred.CPF3M - fred.TB3M_SEC below, which OVERLAPS TED 1997-2022 so the join can be calibrated rather than assumed. derive.funding_stress already accepts a replacement argument; wiring it into the `funding_spread` factor is a factors.yaml change and therefore a sealed decision, NOT something registering these series performs."}
  fred.CPF3M:    {source: fred, code: DCPF3M, frequency: "D->M", units: pct,   min_start: 1997-01, sla_days: 7,   license_tier: FREE, priority: P1, intake: auto, enforce: true, notes: "90-day AA financial commercial paper rate. Registered 2026-08-08 under the WP1.9 emergent-requirements rule as the LIVE leg of a funding-stress spread after TEDRATE's retirement. TED was 3M LIBOR minus 3M T-bill; CP minus T-bill is the same construction using the surviving unsecured bank-funding rate, and unlike 3M term SOFR it needs no CME licence. See docs/data/LICENSE-REGISTRY.md."}
  fred.TB3M_SEC: {source: fred, code: DTB3,   frequency: "D->M", units: pct,   min_start: 1954-01, sla_days: 7,   license_tier: FREE, priority: P1, intake: auto, enforce: true, notes: "3-month Treasury bill, secondary market, discount basis -- the RISK-FREE leg of the CP-bill funding spread. Deliberately distinct from fred.TB3MS above (monthly average, the pre-1954 policy-rate splice donor): this is the daily secondary-market series the spread convention uses, and conflating the two would silently change what the spread means."}
  fred.SOFR:     {source: fred, code: SOFR,   frequency: "D->M", units: pct,   min_start: 2018-04, sla_days: 7,   license_tier: FREE, priority: P2, intake: auto, enforce: false, notes: "Overnight SOFR. Registered for reference, NOT as the funding-stress leg: overnight SECURED repo is not the same quantity as TED's unsecured 3-month bank funding, and the 3-month TERM SOFR that would be comparable is CME-licensed (docs/data/LICENSE-REGISTRY.md). enforce is false because nothing consumes it yet."}
  # --- commodity PRICE indices: available, and NOT the `commodities` factor ---
  # Registered 2026-08-08 under the WP1.9 emergent-requirements rule after an
  # explicit search for a long-history free commodities series. Both are PRICE
  # indices; factors.yaml's `commodities` declares numeraire total_return and a
  # futures total return additionally needs roll and collateral yield, which no
  # free source carries. So these make a real global/long commodity signal
  # AVAILABLE for inflation and macro conditioning and close NOTHING sealed --
  # the same registration pattern as fred.SAHMREALTIME and fred.SOFR below.
  # See docs/data/LICENSE-REGISTRY.md for what a licence would buy instead.
  fred.CMDTY_GLOBAL: {source: fred, code: PALLFNFINDEXM, frequency: "M", units: index, min_start: 1992-01, sla_days: 80, license_tier: FREE, priority: P2, intake: auto, enforce: false, notes: "IMF Primary Commodity Price System, global all-commodities price index (2016=100). The best FREE GLOBAL commodity signal found; its 1992-01 start is the IMF's own, verified 2026-08-08 across the whole PCPS family on FRED (monthly, quarterly and annual all begin that month), so 'IMF for a long history' does not hold. NOT the `commodities` factor: price, not total return."}
  fred.CMDTY_PPI:    {source: fred, code: PPIACO,        frequency: "M", units: index, min_start: 1913-01, sla_days: 80, license_tier: FREE, priority: P2, intake: auto, enforce: false, notes: "US producer price index, all commodities (1982=100). Registered for its LENGTH -- 1913 onward, the longest free commodity-linked series available -- not for its fit: it is US producer prices, not global commodity spot, and not investable. Use where century-scale coverage matters more than precision; prefer fred.CMDTY_GLOBAL from 1992. NOT the `commodities` factor."}
  fred.SAHMREALTIME: {source: fred, code: SAHMREALTIME, frequency: "M", units: pct, min_start: 1959-12, sla_days: 40, license_tier: FREE, priority: P1, intake: auto, enforce: false, notes: "Real-time Sahm Rule recession indicator. Registered under the WP1.9 emergent-requirements rule by WP2.11; see governance/retrofit-register.md RFR-81. NOT mapped to any factor and NOT consumed by the sealed campaign -- factors.yaml is a sealed judged source and mapping a new factor needs an amendment plus a full retrain, so this entry makes the series AVAILABLE and closes nothing on its own. Complements fred.USREC rather than replacing it: USREC is the NBER 0/1 chronology, revised and published with long lags, while this is a continuous percentage-point rule computed from unemployment in real time and NEVER revised -- so it is the honest input wherever a recession label must be as-of rather than in-hindsight. min_start is the series' documented start and is UNVERIFIED here (this environment has no network); enforce is false, so a first live refresh warns rather than blocks if it is wrong."}

