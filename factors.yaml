# factors.yaml — the factor manifest with a block layer (WP2.1b Item 2).
#
# A "block" is a named, self-contained group of generator factors that share a
# jurisdiction or scope (a global market-factor block, a US rates/inflation block,
# a UK block, and so on). `active_blocks` selects which blocks the current campaign
# runs, trains, and reports over; any block declared in `factor_blocks` but omitted
# from `active_blocks` is inert — its factors are not generated and no thresholds are
# expected for it.
#
# Block membership is sealed by `pre-registration.yaml` (WP2.3): once sealed, existing
# block contents do not change. Adding a jurisdiction later (e.g. activating `uk`, or
# adding an `fx` block) is a `block_addition` amendment — additive by construction, it
# adds new per-block and new cross-block thresholds without invalidating or reopening
# any existing block's sealed thresholds. It is never a re-seal of existing blocks.
#
# Known data gap: no Step-1 series in requirements.yaml currently sources `commodities`.
# It stays in the `global` block below because it is the declared factor namespace the
# generator is expected to fill; its reference statistics are unavailable until a
# commodities series is registered under the requirements.yaml §WP1.9
# emergent-requirements rule. That registration is deferred to WP2.3 as an explicit
# pre-seal decision with a stated reason (no free, already-connectored commodities
# total-return series exists -- the honest candidates are licensed), recorded in
# governance/retrofit-register.md RFR-8. RFR-1 originally assigned it to WP2.2; RFR-8
# supersedes that assignment, since WP2.2 Task 1 was citing RFR-1 as its own reason.
#
# WP2.3 DECIDED (2026-07-26): option (b) -- seal with `commodities` absent, as a named
# limitation. And it is not the only one: `hy_spread` ALSO produces no train+validation
# data on the frozen campaign vintage, because fred.HY_OAS's ~3 licensed years all fall
# inside the holdout. `pre-registration.yaml`'s `reference_run.missing_factors` is the
# sealed list of BOTH -- [commodities, hy_spread] -- and `ah.eval.prereg.verify()` now
# REJECTS any threshold keyed to either.
#
# CLAIMS-SWEEP CORRECTION (2026-07-26, after the re-seal): this paragraph read
# "`policy_rate` and `hy_spread` ALSO produced no train+validation data ... the sealed
# list of all three". That was true of campaign vintage 2026-07-24 and FALSE from the
# moment vintage 2026-07-26.1 was sealed: `policy_rate` carries 798 train+validation
# months (1954-07..2020-12) on the sealed vintage, is NOT in `missing_factors`, and is
# in `bootstrap_v1.factor_set`. The correct wording was carried into this file's own
# `factor_sources.policy_rate.proxy_for` entry below and into `pre-registration.yaml`,
# but not into this header -- the THIRD surviving instance of one wrong sentence, after
# `seal_scope.splice_py_reason` and `ah.eval.prereg._check_threshold_data_availability`'s
# docstring. Nothing downstream rested on it: the sealed `missing_factors` list itself
# was always [commodities, hy_spread], and it is the list, never this prose, that
# `verify()` reads.

factor_blocks:
  global:  [equity_mkt, smb, hml, mom, equity_vol, commodities, ig_spread, hy_spread]
  us:      [policy_rate, ust_2y, ust_10y, cpi, hqm_curve, funding_spread]
  uk:      [bank_rate, gilt_nominal_10y, gilt_real_10y, rpi, cpi_uk]
  # campaign-2 block additions (owner-ratified 2026-08-02): fx executes the R5
  # re-entry (S2R-FX-NEXT-CAMPAIGN); valuation closes RFR-18's factor gap
  # (S2-VALUATION-FACTOR) -- owner: "include CAPE in this seal". Each activated
  # by its own block_addition amendment; see governance/amendment-log.yaml.
  fx:        [fx_usd]
  valuation: [cape_v]
active_blocks: [global, us, fx, valuation]

# --------------------------------------------------------------------------- #
# factor_sources -- the factor -> Step-1 catalog series mapping (WP2.2 Task 1).
#
# The one genuinely blocking gap WP2.1b left open: until this section existed, no
# mapping anywhere in the repository bound a factor id to a catalog series, so no
# reference statistic (ah.eval.reference) or generator-facing panel (ah.eval.panel)
# could honestly be computed. SEALED as of WP2.3 (2026-07-26): this whole file is
# hashed into pre-registration.lock, so an edit to any mapping below is a dated
# amendment. ah.factors.load_manifest() validates coverage (below) but this section
# itself carries no acceptance thresholds.
#
# One entry per factor in EVERY block declared above, including inactive `uk` (which
# is declared but never read while inactive -- see ah.eval.reference's inactive-block
# exclusion test). `load_manifest()` rejects a missing entry for any declared factor
# and rejects an entry that names a factor no block declares.
#
# `kind` is one of:
#   series      -- read directly from one requirements.yaml series id, in that
#                   series' own units, no transform.
#   derived     -- computed by one existing ah.data.derive.py helper (`expr`) over one
#                   or more requirements.yaml series ids (`inputs`, positional, in the
#                   order the helper expects them). Reuses derive.py; never a new
#                   ad-hoc transform defined here or in ah.eval.panel.
#   unavailable -- no Step-1 series honestly sources this factor. `reason` is
#                   required and names the governing record (a retrofit-register row,
#                   a deferred connector work package, or a J3/R5 decision) rather
#                   than inventing a proxy.
#
# Three optional fields cut across all three kinds (WP2.2 Task 1 fix pass):
#   numeraire   -- `total_return`, `zero_cost` or `excess_return`, for a return-bearing
#                   factor; absent for a level (a level has no numeraire). This is the
#                   machine-checked half of pre-registration.yaml's
#                   conventions.numeraire: ah.strategies refuses to load a D4 strategy
#                   whose legs do not all resolve to the sealed numeraire or to a
#                   declared zero-cost overlay, which is what stops an excess-return
#                   equity leg being weighted beside a total-return bond leg. On an
#                   `unavailable` entry it records the numeraire D4 ASSUMES the factor
#                   will carry once sourced.
#   proxy /     -- set together, never separately. `proxy: true` means a substitution
#   proxy_for       or splice-backed backfill is in play and `proxy_for` names it
#                   (donor series plus the governing ah.data.splice rule). Machine-
#                   visible on purpose: a backfill used to be free text inside `notes`,
#                   invisible to any check.
#
# UNITS CONSISTENCY (machine-checked, tests/test_factors.py): a `series`/`derived`
# entry's `units` must agree with pre-registration.yaml's
# conventions.return_bearing_factors / conventions.level_factors classification for
# that factor -- a return-bearing factor's units here must be exactly `ret`; a level
# factor's units here must NOT be `ret`. These two files are sealed together, and a
# divergence between them (a factor classified return-bearing here sourced from a
# level series, or vice versa) is exactly the defect class this project keeps finding.
# --------------------------------------------------------------------------- #
factor_sources:
  # --- global block ---
  equity_mkt:
    kind: derived
    expr: add
    inputs: [french.mkt_rf, french.rf]
    units: ret
    numeraire: total_return
    notes: >-
      Equity market TOTAL RETURN = Mkt-RF + RF (ah.data.derive.add). Fama-French's
      Mkt-RF is an EXCESS return over the one-month bill; french.rf is that same bill
      rate, already registered in requirements.yaml with the same `units: ret`, so
      adding them restores the total return. This is deliberate and is the sealed
      numeraire decision (pre-registration.yaml conventions.numeraire): sixty_forty
      and endowment_proxy weight this factor beside govt_tr_10y, which is a long-
      government TOTAL return, and a fully-invested portfolio may not mix an excess
      leg with a total-return leg. Mapping equity_mkt to french.mkt_rf alone would do
      exactly that, and ah.strategies now refuses to load such a portfolio.
  smb:
    kind: series
    series_id: french.smb
    units: ret
    numeraire: zero_cost
    notes: >-
      Fama-French SMB, a long-short spread return. ZERO-COST: a self-financing
      overlay commits no capital, so it is numeraire-neutral and may be combined with
      total-return legs (its weight in eqw_factors is a notional/risk budget, not a
      capital share). Used directly, no transform.
  hml:
    kind: series
    series_id: french.hml
    units: ret
    numeraire: zero_cost
    notes: >-
      Fama-French HML, a long-short spread return. ZERO-COST: a self-financing
      overlay commits no capital, so it is numeraire-neutral and may be combined with
      total-return legs (its weight in eqw_factors is a notional/risk budget, not a
      capital share). Used directly, no transform.
  mom:
    kind: series
    series_id: french.mom
    units: ret
    numeraire: zero_cost
    notes: >-
      Fama-French Mom (UMD), a long-short spread return. ZERO-COST: a self-financing
      overlay commits no capital, so it is numeraire-neutral and may be combined with
      total-return legs (its weight in eqw_factors is a notional/risk budget, not a
      capital share). Used directly, no transform.
  equity_vol:
    kind: derived
    expr: equity_vol_extended
    inputs: [fred.VIX, fred.VXO]
    units: idx
    proxy: true
    proxy_for: >-
      fred.VXO 1986-01..1989-12 via PROXY-EQUITY-VOL-VXO-V1 (ah.data.vol_extend,
      log-log fit on the 1990+ overlap, corr 0.9827) and the ONE pinned HAR
      ensemble draw 1953-04..1985-12 via PROXY-EQUITY-VOL-HAR-V1
      (ah.data.vol_backcast.pinned_draw_series: seed 20260809 on the registered
      provenance artifact, materialized once, sha pinned by the campaign-3
      pre-registration). APPLIED AT THE READ SURFACE as of the campaign-3
      wiring (AM-2026-08-09-002, owner ruling D6: backcast months are admitted
      span data and say so). The HAR months are MODEL OUTPUT; the K3 masked
      ablation cell measures their effect and every verdict table disclosed
      over the extended span reports the per-factor proxy share. On a vintage
      without fred.VXO the read is plain fred.VIX, unchanged from campaign-2.
    notes: >-
      CBOE VIX index level (requirements.yaml units: idx) -- a level, never a return,
      matching pre-registration.yaml's level_factors classification. Extended
      backward per proxy_for; the fred.VXO donor input is optional in
      ah.eval.panel's sense (empty on a pre-donor vintage; the helper falls back).
  commodities:
    kind: unavailable
    numeraire: total_return
    reason: >-
      no Step-1 series registered; see governance/retrofit-register.md RFR-8 (RFR-1
      originally assigned this to WP2.2, but WP2.2 Task 1 was citing RFR-1 as its own
      reason -- circular -- so RFR-8 supersedes it with a real owner and reason; see
      this file's header note). Carries weight in two D4 strategies (eqw_factors,
      endowment_proxy) whose reference statistics are consequently unavailable at seal
      time (pre-registration.yaml's rationale.d4_commodities_consequence).
  ig_spread:
    kind: derived
    expr: difference
    inputs: [fred.BAA, fred.AAA]
    units: pct
    notes: >-
      Baa minus Aaa investment-grade credit spread, in percentage points;
      ah.data.derive.difference(BAA, AAA).
  hy_spread:
    kind: derived
    expr: hy_oas_spliced
    inputs: [fred.HY_OAS, fred.BAA, fred.AAA]
    units: pct
    proxy: true
    proxy_for: >-
      derived.baa_aaa_spread via the ah.data.splice PROXY_RULES['hy_oas_pre1996']
      rule, APPLIED AT THE READ SURFACE as of the campaign-2 seal (this is RFR-50's
      recorded re-entry condition firing: splice.py is now on the read path and
      joins the seal scope). The fit is PINNED (splice.PINNED_FITS; owner decision
      2026-08-02): the rule's only licensed fitting window (2023-08..2026-07, 36
      obs, RFR-92) lies entirely inside the HOLDOUT span, so calibrating at read
      time would breach the train_val-only read surface -- instead the two fitted
      scalars (a=1.4068184862787785, b=2.53288508610114, overlap RMSE 0.206) were
      frozen offline and their post-2020 provenance is the disclosed residual
      information flow. On a train+validation read fred.HY_OAS is empty and every
      observation is proxy (Baa-Aaa transformed); post-2020 actuals, where a read
      is entitled to them, are never touched.
    notes: >-
      ICE BofA US High Yield OAS via FRED (BAMLH0A0HYM2). requirements.yaml notes FRED
      serves only ~3 years of history for this series under ICE licensing terms, so it
      alone does not cover the full campaign window. A splice rule to extend it
      backward with the Baa-Aaa proxy is REGISTERED in ah.data.splice but NOT applied
      upstream of this mapping today (see proxy_for above and RFR-10) -- as things
      stand, this factor's train+validation history is honestly limited to
      fred.HY_OAS's own ~3 years, unextended.

  # --- us block ---
  policy_rate:
    kind: derived
    expr: policy_rate_extended
    inputs: [fred.FEDFUNDS, fred.TB3MS]
    units: pct
    proxy: true
    proxy_for: >-
      fred.TB3MS before 1954-07 (FRED's first FEDFUNDS observation), via the
      ah.data.splice PROXY_RULES['fedfunds_pre1954'] rule (regression on the
      1954-1990 overlap). APPLIED AT THE READ SURFACE as of the campaign-3 wiring
      (AM-2026-08-09-002; ah.data.derive.policy_rate_extended) -- the sentence
      "REGISTERED BUT NOT YET APPLIED" that stood here from the first seal is
      retired by that wiring, and the demonstration reverses: on the campaign-3
      vintage this factor's train+validation history starts at fred.TB3MS's
      1934-01, proxy-flagged at source before 1954-07. On a vintage without the
      donor the read is plain fred.FEDFUNDS, unchanged from campaign-2.
      HISTORY of the campaign-2-era statement, kept because its corrections are
      part of the record: WP2.3 CONFIRMED (2026-07-26) the then-sealed campaign
      vintage contained NEITHER backfill; on vintage 2026-07-26.1 the
      train+validation history visibly started at 1954-07. CORRECTION TO THE
      FIRST SEAL (2026-07-26, same day): the 2026-07-24 vintage predated
      fred.FEDFUNDS's own registration and held no parquet for it at all, so
      `policy_rate` was in reference_run.missing_factors and `cash_tr_1m`,
      `carry`, `term_premium`, `equity_risk_premium` and
      `policy_anchor_deviation` were all uncomputable. A live refresh restored
      the series (864 monthly observations, 1954-07 to 2026-06; 798 in
      train+validation) and the campaign vintage moved to 2026-07-26.1. All five
      are computable. See governance/retrofit-register.md RFR-48/50/51 for the
      superseded state and RFR-61/62/63 for the restoration.
    notes: >-
      Effective federal funds rate -- the ADMINISTERED US policy rate. Registered in
      requirements.yaml by WP2.2 Task 1 under the WP1.9 emergent-requirements rule
      (governance/retrofit-register.md RFR-7). It replaces an earlier mapping to
      fred.TB3MS, which was wrong twice over: a 3-month bill is a market yield carrying
      term premium, three months of policy expectations and flight-to-quality effects,
      and it decouples from the funds rate in exactly the episodes the tail and severe
      tiers judge (Dec-2008 bills near 0.01% against a 0-0.25% target; March-2020 bills
      negative); and `funding_spread` is TED = 3m LIBOR minus that same 3m bill, so the
      policy-rate factor and the funding-stress factor would have shared a
      construction-driven stress component and the sealed cross-block correlation and
      crisis-correlation-lift bands would have been sealed over an artifact of the
      mapping. tests/test_factors.py asserts the two factors share no input series.
  ust_2y:
    kind: derived
    expr: ust_2y_extended
    inputs: [fred.DGS2, fred.GS1, fred.GS3]
    units: pct
    proxy: true
    proxy_for: >-
      fred.GS1/fred.GS3 curve interpolation before 1976-06 (fred.DGS2's first
      observation), via PROXY-UST2Y-GS1GS3-V1 (ah.data.ust2y_extend, two-donor
      regression on the observed overlap; corr 0.9999, RMSE 0.055). APPLIED AT
      THE READ SURFACE as of the campaign-3 wiring (AM-2026-08-09-002). THE
      BINDING FACTOR of the ratified 1953-04 span -- the GS1/GS3 donor floor is
      what the amendment's block_draw_span start rests on. Donor inputs optional;
      without them the read is plain fred.DGS2, unchanged from campaign-2.
  ust_10y:
    kind: derived
    expr: ust_10y_extended
    inputs: [fred.DGS10, fred.GS10]
    units: pct
    proxy: true
    proxy_for: >-
      fred.GS10 before 1962-01 (fred.DGS10's first observation), via
      PROXY-UST10Y-GS10-V1 (ah.data.ust10y_extend, the same instrument at
      monthly frequency; overlap corr 1.000, RMSE 0.003). APPLIED AT THE READ
      SURFACE as of the campaign-3 wiring (AM-2026-08-09-002). Donor input
      optional; without it the read is plain fred.DGS10, unchanged from
      campaign-2.
  cpi:
    kind: series
    series_id: fred.CPI
    units: index
    notes: "CPI-U, NSA index level (requirements.yaml units: index); a level, not a YoY rate."
  hqm_curve:
    kind: derived
    expr: hqm_curve_extended
    inputs: [treasury.hqm_curve, fred.AAA]
    units: pct
    proxy: true
    proxy_for: >-
      fred.AAA before 1984-01 (the HQM series' first observation), via
      PROXY-HQM10-AAA-V1 (ah.data.hqm_extend, level fit on the 1984+ overlap;
      corr 0.9871, RMSE 0.393; the slope diagnostic against GS10 came back
      quiet, max divergence 0.081pp). APPLIED AT THE READ SURFACE as of the
      campaign-3 wiring (AM-2026-08-09-002). Donor input optional; without it
      the read is plain treasury.hqm_curve, unchanged from campaign-2.
    notes: "10y HQM corporate spot rate via FRED (HQMCB10YR); see requirements.yaml's note."
  funding_spread:
    kind: derived
    expr: funding_spread_extended
    inputs: [fred.TEDRATE, fred.CPF3M, fred.CP3M, fred.CP3M_NBER, fred.TB3M_SEC, fred.TB3MS]
    units: pct
    proxy: true
    proxy_for: >-
      the fitted CP-bill spread (PROXY-FUNDING-CPBILL-V1, ah.data.funding_extend:
      CP leg CPF3M<-CP3M<-NBER chained by mean offset, bill leg
      TB3M_SEC<-TB3MS; TED = a + b*(CP-bill) on the observed overlap, corr
      0.9652) on BOTH ends of observed TED -- before 1986-01 floored at 1934-01
      (owner rulings F1-F3) AND after TEDRATE's 2022-01 retirement, which
      closes the post-2022 hole the previous entry disclosed. APPLIED AT THE
      READ SURFACE as of the campaign-3 wiring (AM-2026-08-09-002). Donor
      inputs optional; without them the read is funding_stress(ted), unchanged
      from campaign-2.
    notes: >-
      ah.data.derive.funding_spread_extended over TEDRATE plus the five CP/bill
      donor series. The campaign-2 entry's disclosure -- "history honestly
      incomplete after 2022-01 until a replacement series is registered" -- is
      discharged by the both-ends extension rather than by a SOFR-basis series:
      the CP-bill spread is itself the live funding-stress instrument post-2022,
      proxy-flagged at source like every extension month.

  # --- fx block (campaign-2 block_addition; R5 re-entry) ---
  fx_usd:
    kind: derived
    expr: fx_usd_extended
    inputs: [fred.DTWEXBGS, fred.DTWEXM]
    units: index
    proxy: true
    proxy_for: >-
      fred.DTWEXM (the discontinued major-currencies index) before 2006-01
      (fred.DTWEXBGS's first observation), via the ah.data.splice
      PROXY_RULES['fx_usd_pre2006'] rule, APPLIED AT THE READ SURFACE as of the
      campaign-2 seal; and, as of the campaign-3 wiring (AM-2026-08-09-002),
      the vendored Bretton-Woods parity index before 1973-01 via
      PROXY-FX-PARITY-V1 (ah.data.fx_parity: geometric equal-weight over six
      published parities, single-point junction pin to DTWEXM, then the same
      pre2006 splice transform into DTWEXBGS units -- one conversion, not two
      conventions). The splice still fits at read time on the 2006-2019 overlap,
      entirely inside train+validation. Pegged-era months are NEAR-CONSTANT BY
      CONSTRUCTION (the era's true value); correlation/ACF consumers apply the
      degenerate-variance guard rather than propagating NaN. Verified on
      vintage 2026-08-02.4 (pre-parity): 643 monthly observations
      1973-01..2026-07, 396 proxy-flagged, overlap RMSE 2.04 index points.
    notes: >-
      Trade-weighted broad US dollar index (goods and services), a LEVEL. The
      generator's first FX exposure factor (decision R5's re-entry;
      S2R-FX-NEXT-CAMPAIGN). Institutions with unhedged foreign-currency
      exposure remain out of scope until the institutional layer consumes this
      factor -- this mapping puts the macro driver in the world, not the hedge
      accounting in the twin.

  # --- valuation block (campaign-2 block_addition; closes RFR-18's factor gap) ---
  cape_v:
    kind: derived
    expr: demeaned_log_cape
    inputs: [shiller.cape]
    units: log
    notes: >-
      DN-1's v_t: log(CAPE) demeaned by its full-sample mean
      (ah.data.derive.demeaned_log_cape -- registered in Step 1, mapped to a
      generator factor by the campaign-2 seal at owner direction: "include CAPE
      in this seal"). A LEVEL in log units, unbounded in both directions (the
      demeaning makes it signed), hence the identity coordinate transform in
      ah.gen.blocks.constraints. Activating this factor is what turns the
      ten_year_return_vs_valuation_{slope,r2} metrics from STRUCTURALLY
      UNAVAILABLE into judged statistics (RFR-18; RFR-81's discovery that only
      the mapping was missing). Note the demeaning constant is computed over the
      read span -- on a train+validation read that is train+validation only, so
      no holdout information enters the training panel through the mean.

  # --- uk block (inactive; declared, never read -- see active_blocks above) ---
  bank_rate:
    kind: unavailable
    reason: >-
      uk block inactive (decision J3, CLOSED-deferred); no Step-1 UK series registered.
      Instructions/WP1.12-UK-CONNECTORS.md scopes the planned boe.bank_rate connector.
  gilt_nominal_10y:
    kind: unavailable
    reason: >-
      uk block inactive (decision J3); planned boe.glc_nominal_10y connector, see
      Instructions/WP1.12-UK-CONNECTORS.md.
  gilt_real_10y:
    kind: unavailable
    reason: >-
      uk block inactive (decision J3); planned boe.glc_real_10y connector, see
      Instructions/WP1.12-UK-CONNECTORS.md.
  rpi:
    kind: unavailable
    reason: >-
      uk block inactive (decision J3); planned ons.rpi connector, see
      Instructions/WP1.12-UK-CONNECTORS.md.
  cpi_uk:
    kind: unavailable
    reason: >-
      uk block inactive (decision J3); planned ons.cpi connector, see
      Instructions/WP1.12-UK-CONNECTORS.md.
