    # ----------------------------------------------------------------------- #
    # WP2.2c Item 3 -- the band-exceedance gates. THE ONLY THRESHOLDS IN THIS FILE
    # THAT ARE NOT PROVISIONAL PLACEHOLDERS awaiting a real run, because their value is
    # not an empirical quantity: 0.5 is a majority rule, and the null it is judged
    # against is fixed by this file's own sealed band `level` (0.9), not by data.
    # Derivation, in full, once, for all three (see also
    # band_exceedance_gate_estimator in the conventions block and
    # ah.eval.metrics.monthly's module docstring):
    #   - a `level`-percentile band has miss rate (1 - level) = 0.10 BY CONSTRUCTION, so
    #     under the null (a generator matching history) E[fraction] <= 0.10;
    #   - Markov: P(fraction > 0.5) <= 0.10/0.5 = 0.2 under ARBITRARY dependence between
    #     the comparisons -- i.e. assuming nothing at all about the factor panel's
    #     correlation structure. Under anything near independence the same probability
    #     is ~3.0e-8 (P(Binom(26, 0.1) > 13), moment family) to ~1.0e-10
    #     (P(Binom(39, 0.1) > 19), dependence family) -- corrected in WP2.2c's honesty
    #     fix pass from a previously-stated ~1e-30, which was wrong by 20 orders of
    #     magnitude; the qualitative point (astronomically small under near-independence)
    #     is unaffected.
    # A per-NAME band gate was rejected and the rejection is the reason these exist: at
    # ~570 monthly comparisons, gating each name at enforce rejects a PERFECT generator
    # with probability indistinguishable from 1.
    #
    # Per-metric severity decisions, on WP2.2b's control table as evidence, recorded
    # per the WP2.2c brief's Item 3:
    #
    # moment_band_exceedance_fraction -- ENFORCE. Location and scale are first-order:
    # a generator whose marginals have drifted is wrong in a way no amount of correct
    # higher-moment behaviour excuses, and nothing else in the battery measures them
    # (that was WP2.2b's primary finding). Measured: nc3-shifted-bootstrap 0.654
    # (17 of 26 comparisons) against nc5-condition-ignoring -- the SAME bootstrap with
    # the distortion switched off -- at 0.231, nc1/nc2 at 0.308 and nc4 at 0.000.
    # THE MARGIN IS THE SMALLEST OF THE THREE GATES AND IS STATED RATHER THAN GLOSSED:
    # nc3 clears 0.5 by 4 comparisons out of 26. The reason it is not larger is
    # instructive -- for a persistent LEVEL factor the length-matched band on a
    # 120-month mean is enormous (the mean of a decade of a near-random-walk moves a
    # long way), so a 0.5-sigma shift measured in FULL-sample sigma sits inside it;
    # nc3's exceedances are concentrated in the return-bearing factors, where the band
    # is tight and the shift is 3+ half-widths out. WP2.3 should expect this gate's
    # power to be carried by the return factors and should NOT read a pass as evidence
    # that a level factor's drift was checked.
    # Note also that 0.231-0.308 for the three UNDISTORTED controls is not a measured
    # false-positive rate: none of them is a known-good generator (iid, shuffled and
    # 24-month-block-stitched series all genuinely have the wrong local dispersion at a
    # 120-month scale). The null rate cannot be measured at all until WP2.4 supplies a
    # generator that is meant to match history; the 0.10-per-comparison premise above is
    # the band's own definition, not an empirical claim, and WP2.3 must check it against
    # bootstrap-v1 before sealing.
    #
    # dependence_band_exceedance_fraction -- ENFORCE, over the JOINT statistics
    # (acf_r_sum, acf_abs_sum, acf_abs_decay), not the 31 per-lag ones. Serial
    # dependence is DN-1.1's named monthly stylized fact ("ACF |r|") and destroying it
    # is what makes a generated path not a history. Measured: nc1-iid-gaussian 0.615,
    # nc2-shuffled 0.718 (both destroy it outright) against nc3 0.077, nc4 0.128,
    # nc5 0.128 (all three preserve it), bound 0.5.
    # RECORDED BECAUSE IT IS THE NON-OBVIOUS HALF OF THE DESIGN: the first version of
    # this gate aggregated all 403 per-lag comparisons and scored nc1 at 0.367 and nc2
    # at 0.377 -- a real 4.5x separation from a block bootstrap's 0.082, but nowhere
    # near a majority, and no honest false-positive argument puts the bound below ~0.5.
    # A 120-month per-lag band is wide (SE ~0.09 at lag 24), so aggregating the
    # COMPARISONS aggregates the noise with the signal; summing the ACF VALUES and
    # banding the sum pools the signal. A two-stage "majority of factors, each by a
    # majority of its lags" variant was measured and is strictly worse (0.077 for both
    # nc1 and nc5 -- no separation). The BOUND did not move; the STATISTIC did. That
    # distinction is the whole difference between deriving a gate and fitting one.
    # STATED LIMIT: a generator breaking a single lag while preserving the cumulative
    # profile would not move this gate.
    #
    # tail_band_exceedance_fraction -- REPORT, deliberately, and this is the honest
    # half of the decision. A tail failure is usually confined to the return-bearing
    # factors (4 of 13 active factors today), so it cannot reach a majority of the
    # family however severe it is: nc1-iid-gaussian, which replaces every fat tail in
    # the panel with a Gaussian one, scores 0.234. Sealing this at enforce would
    # be a gate that cannot fire, which reads in the artifact as a check that passed.
    # CONSEQUENCE, stated rather than hidden: nc1-iid-gaussian is NOT blocked by the
    # tail machinery that correctly detects it (11 substantive tail band failures,
    # exactly on the excess_kurtosis / hill_tail_index statistics DN-1.1 names) -- it is
    # blocked by the dependence gate, for a different, also real defect. A generator
    # that got the dynamics right and the tails wrong would therefore pass at enforce
    # today. Closing that needs a per-family gate scoped to
    # the return-bearing factors, or a sealed absolute band on the tail statistics
    # derived from a real run; both are WP2.3's, and the gap is recorded in
    # governance/retrofit-register.md rather than papered over with a bound chosen to
    # make one control fire.
    # ----------------------------------------------------------------------- #
    "moment_band_exceedance_fraction": {min: null, max: 0.5, severity: enforce}
    "dependence_band_exceedance_fraction": {min: null, max: 0.5, severity: enforce}
    "tail_band_exceedance_fraction": {min: null, max: 0.5, severity: report}
    # WP2.2 Task 5. money_pump_violations/floor_violations are audits of a HARD
