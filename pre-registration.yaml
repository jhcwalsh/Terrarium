    # TWO-SIDED, not a bare max (CRITICAL 1, WP2.2 Task 5 fix pass): a one-sided
    # {min: null, max: 10.0} band scores a DETERMINISTIC anchor-follower (policy_rate
    # exactly equal to anchor_t every month) at 0.0, the numerically best possible
    # value, despite being less realistic than a generator with genuine idiosyncratic
    # variation -- real policy rates deviate from a Taylor-type anchor by roughly 1-2pp
