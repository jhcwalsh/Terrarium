    # Sec.II.4's own floors; WP2.8's constraints.py makes them structurally impossible
    # by construction) -- max: 0 is not a provisional placeholder the way the other
    # entries in this section are, it is the definition itself: any count above zero is
    # a real violation. severity: enforce, so a single violation blocks G2.
    "money_pump_violations": {min: null, max: 0.0, severity: enforce}
    "floor_violations": {min: null, max: 0.0, severity: enforce}
