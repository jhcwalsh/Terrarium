    # NOT derived from a band, and cannot be: see the next sentence. The 10.0 is a
    # loose absolute ceiling on a Frobenius distance over the sealed cross-block pair
    # set, sealed `report`.
    # cross_block_corr_matrix_distance is a DISTANCE between the generated ensemble's
    # cross-block correlation matrix and the reference's own, so its value on history is
