decisions:
  R5:  # FX / unhedged foreign-currency exposure -- out-of-scope-for-v1 deferral.
    status: CLOSED-deferred
    consequence: "Institutions with material unhedged foreign-currency exposure are out of scope for v1. Adding FX later requires a block_addition amendment and retraining the generator, since cross-block correlation cannot be added to trained weights."
  J3:  # UK block activation -- deferred until a block_addition amendment.
    status: CLOSED-deferred
    consequence: "UK-domiciled institution twins are blocked until a block_addition amendment; the InstitutionProfile interface accommodates them without rework. Same retraining consequence applies."
  S2-NC5-EXEMPTION:  # WP2.3. The plan contradicts itself; the owner resolved it.
    status: CLOSED
    consequence: "STEP2-GENERATOR-PLAN contradicts itself: Sec.WP2.2b requires every negative control to fail its designated tier AT ENFORCE, while Sec.WP2.3's sealed decision rule makes conditional-tier results non-gating. NC5's designated tier IS conditional, so both cannot hold. The project owner has ruled that Sec.WP2.3 governs: the conditional tier stays non-gating, every conditional threshold stays severity report, and NC5's exemption from the enforce criterion is a NAMED, NARROWLY-SCOPED exception covering exactly one control and exactly its designated cell. The exception is not a hole -- NC5 is still detected substantively in that cell (14 of 16 conditional metrics fire) and is still BLOCKED, by near_duplicate_fraction at enforce, because a 24-month-block resampler emits verbatim historical windows. tests/test_negative_controls.py pins which gate blocks it, not merely that something does."
  S2-SPREAD-FLOOR:  # WP2.3 ratification of governance/retrofit-register.md RFR-41.
    status: RATIFIED
    consequence: "ah.eval.metrics.economics.SPREAD_FLOOR_PCT is 0.0, a stated deviation from DN-1.1 Sec.II.4's literal 100bp. RATIFIED at seal time on the evidence: measured on the sealed campaign vintage's own train+validation panel, 54.0% of ig_spread's 1224 observations (minimum 0.32) and 86.9% of funding_spread's 420 (minimum 0.118) sit BELOW 100bp, and NONE of either sits below 0.0. RE-MEASURED on campaign vintage 2026-07-26.1 at the re-seal (scripts/measure_seal_evidence.py, spread_floor_evidence) and IDENTICAL to every digit -- neither spread factor is touched by the policy_rate restoration, and funding_spread's 420 observations were carried forward unchanged rather than refetched. The third SPREAD_FLOOR_FACTORS member, hy_spread, has no train+validation data on this vintage and could not be checked either way. A 100bp floor is therefore a gate that rejects the historical record itself -- it fired identically for all five negative controls including the three that replay real history verbatim, making the only firing enforce gate in the battery incapable of discriminating anything. DN-1.1's floors are a GENERATIVE device (a softplus offset keeping a modelled spread positive); the falsifiable statement that survives as an audit of a generator's OUTPUT is that a credit or funding spread cannot be negative. The alternative deliberately NOT taken, and recorded so it is not rediscovered as novel: a per-factor floor derived from each factor's own observed minimum, which would convert a structural constraint into a data-dependent band and could not be checked against a generator emitting a factor history never covered."
  S2-NUMERAIRE-BIAS:  # WP2.3 resolution of governance/retrofit-register.md RFR-12.
    status: CLOSED
    consequence: "RFR-12's two options were (a) add a cash_tr_1m residual leg to eqw_factors, endowment_proxy and momentum so uncommitted/flat capital earns the cash rate, or (b) seal as-is and record the bias as a named limitation. (b) IS SEALED. THE GROUND HAS CHANGED AND IS RESTATED IN FULL, because the first seal chose (b) on a ground that no longer exists. That ground was: cash_tr_1m derives from policy_rate, which had no data on the 2026-07-24 vintage, so (a) was IMPOSSIBLE. On campaign vintage 2026-07-26.1 policy_rate has 798 train+validation months and (a) is fully buildable -- so (b) is now a CHOICE, made on measured evidence, and the evidence is that (a) would make the D4 criterion worse. MEASURED (scripts/measure_seal_evidence.py, momentum_cash_counterfactual). momentum is the one live strategy carrying the bias: it books exactly 0.0 in its 12-month warm-up and in every flat-signal month -- 24.6% of its own full 1926-2020 sample, and 23.2% of the shorter 1954-2020 span option (a) could cover. Option (a) is realized_t = position_t*equity_mkt_t + (1-position_t)*cash_tr_1m_t. Building it requires joining equity_mkt to policy_rate, which TRUNCATES momentum's historical sample from 1926-07..2020-12 (n=1134) to 1954-07..2020-12 (n=798) -- 336 months lost, 29.6% of the sample, including the 1929-33 crash, 1937, and the entire pre-war record. WHAT THAT COSTS, on the four statistics D4 actually seals for momentum: on the truncated span, ES99 falls from 0.15597 to 0.12923 (-17.1%), ES95 from 0.09102 to 0.07710, VaR95 from 0.05613 to 0.05160 -- i.e. the sealed tail thresholds would be set against a history with its worst tail deleted. WHAT THE CASH LEG ITSELF BUYS, measured on that same truncated span so the two effects are separated: VaR95 0.05160 -> 0.05160, ES95 0.07710 -> 0.07710, VaR99 0.08448 -> 0.08448, ES99 0.12923 -> 0.12923. IDENTICAL TO FIVE DECIMALS ON ALL FOUR. It moves the MEAN (0.00737 -> 0.00834, about 1.2%/yr) and the sd by 0.0001, and nothing else -- which is structural, not a coincidence of this sample: a flat month books a small POSITIVE number instead of 0.0, and neither value is anywhere near the 5% left tail that VaR95/ES95/elicitability_score are computed from. SO OPTION (a) CORRECTS A MEAN-LEVEL BIAS THAT IS INVISIBLE TO EVERY STATISTIC THIS FILE SEALS FOR MOMENTUM, AT THE COST OF DELETING THE WORST TAIL IN THE RECORD FROM THE ONE LIVE D4 TAIL BENCHMARK. That is a bad trade for a tail criterion, and it is why (b) is sealed. THE SEALED CONSEQUENCE, unchanged and still a real defect: eqw_factors (0.6 of weight in zero-cost overlays), endowment_proxy (0.15) and momentum (warm-up and flat months) realize ZERO on uncommitted or unallocated capital instead of the cash rate, so each strategy's realized series sits BELOW the total-return numeraire by the uncommitted-capital cash return for every affected month. eqw_factors and endowment_proxy remain uncomputable for other reasons; momentum's sealed thresholds must be read as thresholds on a series biased low in flat months, and its sealed MEAN-bearing statistics (none are sealed today) would be the ones to distrust. RE-ENTRY, now concrete rather than aspirational: apply ah.data.splice PROXY_RULES['fedfunds_pre1954'] (a regression backfill from fred.TB3MS, which begins 1934-01) and refresh. That shrinks the truncation from 336 months to about 90 and changes the trade -- at which point (a) becomes the better option and the switch is a threshold_change amendment plus recomputed momentum bands. Note also that ah.strategies' 'weights sum to 1.0' check sums capital shares and zero-cost notionals together, so it is NOT evidence of full investment and was not read as such here."
  S2-ENDOWMENT-WEIGHTS:  # WP2.3 resolution of governance/retrofit-register.md RFR-9.
    status: CLOSED
    consequence: "RFR-9 asked WP2.3 to decide whether endowment_proxy's weights are capital shares throughout -- which would mean adding a duration-matched government leg at HY spread duration (4.0y) so the credit sleeve becomes a genuine total return -- or explicitly a RISK BUDGET for the zero-cost leg. RISK BUDGET is sealed, and it is stated in the definition rather than left to be inferred: endowment_proxy's equity_mkt 0.65, govt_tr_10y 0.10 and commodities 0.10 are CAPITAL SHARES summing to 0.85; credit_xs_hy 0.15 is a NOTIONAL/RISK BUDGET on a self-financing, duration-hedged position, not a capital share, and the remaining 0.15 of capital is uninvested and earns nothing (see S2-NUMERAIRE-BIAS, which is the portfolio-level statement of the same fact). The alternative was rejected on two grounds. (1) It requires a NEW derived series -- a government total return at 4.0y duration, distinct from the sealed govt_tr_10y at 8.5y -- which is a new sealed transform authored with no evidence, for a strategy that has NO COMPUTABLE HISTORICAL PATH on this vintage and cannot be validated either way (reference_run.uncomputable_d4_strategies). (2) It would change a sealed D4 strategy definition to make an economic claim about a series nothing can currently compute, which is precisely the shape of change the seal exists to make expensive. CONSEQUENCE: endowment_proxy's `weights` table must be read as a mixed capital/notional table, ah.strategies' sum-to-1.0 load check is NOT a full-investment check for it, and the sealed thresholds for it are -- none, because it is uncomputable. RE-ENTRY: if hy_spread ever acquires train+validation history (which needs the hy_oas_pre1996 splice and a campaign restart), whoever recomputes its bands should revisit this with real data rather than inheriting the decision."

  # Campaign-3 additions (AM-2026-08-10-001): the four K-rulings, sealed with
