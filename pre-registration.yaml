# pre-registration.yaml
#
# STATUS: SEALED (WP2.3, 2026-07-26). `sealed: true` below.
#
# RE-SEALED 2026-07-26, SAME DAY, ON A NEW CAMPAIGN VINTAGE. The first seal (lock digest
# sha256:a714783a...) froze a campaign in which `policy_rate` had NO DATA -- not because
# the series does not exist, but because the frozen 2026-07-24 vintage predated
# fred.FEDFUNDS's own registration. That took `cash_tr_1m`, the `carry` strategy,
# `term_premium`, `equity_risk_premium` and `policy_anchor_deviation` out of the campaign
# for no reason other than a stale snapshot. A live refresh restored it (864 monthly
# observations, 1954-07 to 2026-06), the campaign vintage moved to `2026-07-26.1`, and
# EVERY band, floor, strategy statistic and measured claim in this file was re-derived on
# that vintage. The re-seal is recorded as amendments AM-2026-07-26-003 and -004 in
# governance/amendment-log.yaml; the superseded first-seal values are in git history and
# in the amendment entries, not silently overwritten. What the refresh did NOT fix is
# stated in `limitations:` and is unchanged: `hy_spread` is still dead (ICE licensing --
# 37 observations, all inside the holdout), `commodities` is still unsourced, and
# `bootstrap_v1.block_draw_span` is still 1990-2020 because `equity_vol` (VIX) binds it,
# not `policy_rate`.
# [Every clause of that sentence has since been discharged, each by its own
# amendment: hy_spread restored at campaign-2 (AM-2026-08-02-009, pinned splice),
# the draw span extended to 1953-04..2020-12 by the span-53 ratification
# (AM-2026-08-09-002), and commodities sourced at campaign-3 (AM-2026-08-10-001,
# ruling K2). The sentence above is kept as first-seal history, not as a live claim.]
#
# THIS IS THE ONE-WAY DOOR. Every change to this file -- and to any file listed in
# pre-registration.lock's `hashed_files`, which is every module that can move a
# pass/fail verdict -- is from now on a dated, post-hoc-flagged amendment in
# governance/amendment-log.yaml, visible in every evaluation report thereafter.
# `ah.eval.battery.run_battery` verifies this document AND the lock on every
# invocation, so a modified YAML or a modified enforce-metric implementation stops the
# battery rather than quietly judging with code the seal never saw.
#
# HOW TO CHANGE SOMETHING AFTER THE SEAL (the procedure, stated once):
#   1. append an entry to governance/amendment-log.yaml via
#      ah.eval.prereg.append_amendment (type, caller-supplied date, rationale,
#      post_hoc flag) -- the log is append-only by construction;
#   2. make the edit;
#   3. re-run `ah.eval.prereg.seal(...)` to write a NEW pre-registration.lock, and
#      commit the lock in the same commit as the edit and the amendment.
# Skipping step 1 is not prevented by the machinery -- nothing can prevent it -- but it
# is DETECTABLE: the lock's digest and the amendment log are both in the history, and a
# lock that changed with no amendment beside it is the audit finding.
#
# WHAT IS PROVISIONAL, AND WHAT RATIFICATION IT AWAITS. STEP2-GENERATOR-PLAN Sec.WP2.3's
# human gate reads: "merges only after the D6 workshop ratifies (or with provisional
# values pre-authorized in the amendment log)." The project owner has taken the second
# branch: this file seals now with provisional values, pre-authorized as amendment
# AM-2026-07-26-001 (governance/amendment-log.yaml), which names exactly what is
# provisional and what D6 must ratify. Sealing provisional values is not the same as
# leaving them unsealed: a provisional value that later changes is a dated amendment
# with a stated reason, which is the whole point.
#
# THRESHOLD PROVENANCE. Every band below that is derived from history comes from ONE
# reference run -- see the `reference_run:` block -- reproduced by
# `uv run python scripts/compute_campaign_reference.py --out <path>`. A threshold that
# is NOT derived from a run says so in its own comment and states what it is instead
# (a structural definition, a majority rule, a stated margin). No value below is a
# placeholder in the WP2.1b sense of "a stand-in nobody derived"; the WP2.1b header
# that said so has been removed rather than left contradicting the file.
#
# WHY EVERY BAND HAD TO BE RECOMPUTED HERE (governance/retrofit-register.md RFR-25).
# WP2.2's fix passes changed what six sealed names MEAN (the backtest family's
# `..._lr_1path`/`..._chi2_tail_1path` rename compounded with the one-path
# normalization; `discriminative_score`'s balanced-accuracy handling) and what two
# RETURN for identical input (`predictive_score`/`tstr_degradation`, via `_fit_gd`'s
# convergence change). A band computed before those changes is a band over a definition
# that no longer exists, so no pre-WP2.2c number survives into this file.
#
# SELF-CONTAINMENT RULE (WP2.1b Item 1 acceptance, line 25). Every value below must be
# sufficient, on its own, to reconstruct the D4 strategy set with no reference to code
# outside the sealed hash. Nothing in this file may *define* behaviour by pointing at a
# source file. Where a module is named, it is named only as the place the sealed
# definition happens to be implemented -- the definition itself is here, in full, and
# the code is checked against it by tests. If the two ever disagree, this file wins.
#
# The factor ids referenced below are the active factor namespace declared in
# factors.yaml (`global` + `us` blocks; the manifest loader is ah.factors.load_manifest).
#
# WHAT THE SEAL COVERS -- deliberately wider than STEP2-GENERATOR-PLAN Sec.WP2.3.
# CLAUDE.md states the invariant as "thresholds AND THE CODE THAT JUDGES THEM are hashed
# together before any training run." STEP2-GENERATOR-PLAN Sec.WP2.3 words the same
# requirement more narrowly (this file, the source of every enforce-tier metric, and
# eval/g2.py), which would leave outside the seal several modules that can move a
# pass/fail verdict on their own. The project owner has ruled that the invariant governs,
# so ah.eval.prereg.seal() hashes, by category:
#   - the acceptance thresholds and the factor namespace they are keyed to: this file and
#     the factors.yaml it names above, plus src/ah/factors.py (which decides which blocks
#     and factors are active at all);
#   - the metrics being judged: the enforce-tier metric suites under src/ah/eval/metrics/
#     that exist yet (WP2.2 adds the rest; a suite that does not exist yet is skipped).
#     NOTE: this is a fixed name list in prereg.py (_METRIC_SUITE_NAMES), not a directory
#     scan -- a helper module beside the suites, or a judging module anywhere else, joins
#     the seal only by being added to that list in the same PR that adds the module;
#   - the statistics the bands are derived from: src/ah/eval/reference.py;
#   - the split boundaries that define the reference data: src/ah/splits.py, which
#     hardcodes where train, validation and holdout begin and end -- moving
#     VALIDATION.end by a year silently changes every band in every block with no lock
#     violation unless this module is itself hashed;
#   - the code that compares values to thresholds and decides: src/ah/eval/prereg.py and
#     src/ah/eval/g2.py;
#   - the code that interprets the sealed D4 definitions above: src/ah/strategies.py;
#   - the code that renders the verdict: src/ah/battery/report.py and
#     src/ah/battery/stylized.py;
#   - the code that orchestrates metric suites into that verdict, and the code that
#     reads the historical panel feeding ah.eval.reference in the first place (WP2.2
#     Task 1): src/ah/eval/battery.py and src/ah/eval/panel.py -- judging code created
#     outside src/ah/eval/metrics/, joined to this list in the same commit that added
#     them;
#   - CLAIMS-SWEEP ADDITION, and the reason it is an addition rather than a change: two
#     hashed files were named nowhere in this accounting or in ah.eval.prereg's, so a
#     reader could not reconstruct the sealed set from either of the two documents
#     seal_scope: calls the full accounting. They were always hashed -- they are in
#     _REQUIRED_JUDGED_SOURCES and in pre-registration.lock's hashed_files -- so the
#     SEAL never had a hole; the accounting of it did. src/ah/eval/metrics/_pooling.py
#     is the shared ensemble-pooling convention every suite calls, which sits under
#     eval/metrics/ but is NOT a suite, so _METRIC_SUITE_NAMES does not reach it and it
#     is exactly the "helper module beside the suites" case the note above warns joins
#     only by being named; src/ah/eval/negative_controls.py defines what "the battery
#     caught this control" MEANS (the substantive-vs-NaN split and the reference-band
#     criterion the battery itself does not apply), and G2-EVIDENCE.md cites its table.
#     tests/test_prereg.py::test_the_sealed_seal_scope_accounts_for_every_hashed_file
#     now asserts this list against the lock, so the accounting cannot fall behind the
#     hash again.
# prereg.py hashing its own source is intentional and non-circular: the digest lands in
# pre-registration.lock, never back inside prereg.py.
# CONSEQUENCE, stated plainly so it is not a surprise during WP2.2: WP2.3 inherits this
# set, and once it seals, an edit to ANY of those files -- including a refactor of
# prereg.py or a new statistic registered in reference.py -- is a dated, post-hoc-flagged
# amendment in governance/amendment-log.yaml, exactly like an edit to this file.
# The lock records every hashed file as a repository-relative, forward-slashed path, so a
# lock sealed on one machine verifies in CI, in a reviewer's clone, and under WSL2.
#
# CONSIDERED AND EXCLUDED, deliberately, not by omission. READ THIS LIST AGAINST THE
# `seal_scope:` BLOCK, WHICH SUPERSEDES ITS LAST TWO ENTRIES: this paragraph was written
# by WP2.1b, before the questions were decided, and is left standing so the record of
# what was open survives. WP2.3 decided all three: `battery/thresholds.yaml` is SEALED,
# `data/derive.py` is SEALED, `data/splice.py` is NOT. Where this paragraph and
# `seal_scope:` disagree, `seal_scope:` and `pre-registration.lock`'s `hashed_files` win.
#   - src/ah/gen/base.py (Ensemble.factor()) -- the generator layer's container, the
#     defendant whose output is judged, not the judge itself. Hashing it would turn
#     every WP2.5-2.9 generator change into a dated amendment, inverting the seal's
#     purpose: it exists to freeze the judge, not the thing being judged.
#   - src/ah/battery/thresholds.yaml -- Step-0 legacy threshold data, every entry
#     status: todo (never blocking today), judged by the sealed battery/report.py but
#     not itself sealed. Its fate is a WP2.3 decision: seal it explicitly, or state
#     that this file's thresholds supersede it and it is inert. See
#     governance/retrofit-register.md.
#   - src/ah/data/derive.py and src/ah/data/splice.py -- NOT excluded on principle, just
#     not yet decided. derive.py supplies every `kind: derived` factor's transform (add,
#     difference, funding_stress) and assemble_panel; splice.py supplies the PROXY_RULES
#     that backfill policy_rate and hy_spread. Both therefore move sealed band values.
#     ah/eval/panel.py's _DERIVED_EXPRS table -- which IS sealed -- pins which helper
#     each factor uses and its units algebra, so the *binding* is inside the hash even
#     though the helper bodies are not. Sealing the modules themselves would make every
#     future Step-1 change a dated amendment. WP2.3 must decide explicitly; see
#     governance/retrofit-register.md RFR-10.

schema_version: "1.0"

# WP2.3 flipped this. See the header for the post-seal amendment procedure.
sealed: true

# THE FROZEN CAMPAIGN VINTAGE (STEP2-GENERATOR-PLAN Sec.1, "Campaign vintage freeze").
# The entire Step-2 campaign -- every reference band in this file, every generator fit,
# every battery run cited at G2 -- runs on this one Step-1 vintage. Monthly refreshes
# continue and are not consumed here. A deliberate vintage change restarts the campaign
# and is a dated amendment.
#
# THE VINTAGE MOVED ONCE, BEFORE ANY GENERATOR EXISTED (amendment AM-2026-07-26-003).
# `2026-07-24` -> `2026-07-26.1`. The first seal froze a snapshot taken before
# fred.FEDFUNDS was registered, so `policy_rate` -- a factor the manifest declares
# active and five sealed estimators depend on -- had no data for reasons that had
# nothing to do with the data existing. A live refresh restored it. This is a campaign
# restart in the strict sense the paragraph above means, and it is free of the usual
# cost precisely because no generator had been fitted and no G2 evidence existed: there
# was nothing to re-do and nothing that could have been fitted to the new numbers.
# Every band below was recomputed on `2026-07-26.1` from scratch.
#
# THE VINTAGE MOVED A SECOND TIME AT CAMPAIGN-2 (amendment AM-2026-08-02-009,
# owner-ratified). `2026-07-26.1` -> `2026-08-02.4`: the campaign-2 refresh landed
# fred.DTWEXBGS/DTWEXM (the fx block), corrected the hy_oas_pre1996 splice rule
# (RFR-92) and re-served every pre-existing series. This IS a campaign restart in
# the paragraph-above sense, taken deliberately: the Step-2 generator promoted at
# G2 remains the generator of record FOR G2's claims on `2026-07-26.1`; campaign-2
# retrains against this vintage under its own seal. The RFR-61 discipline applies:
# pre-existing factors' bands are re-derived on the new vintage at the same seed
# and any movement is disclosed in the campaign-2 reference-run artifact
# (artifacts/campaign2/reference-run.json) rather than silently absorbed.
#
# CAMPAIGN-3 (AM-2026-08-10-001): the vintage moved deliberately -- the campaign
# restart the paragraph above prices in. The 2026-08-02.4 record is the
# campaign-2 record and is closed; this vintage is the first to carry the
# extension donors (VXO, CPF3M, CP3M, CP3M_NBER, TB3M_SEC, GS1, GS3) and the
# AQR commodities series, so the extended reads of AM-2026-08-09-003 engage
# here for the first time.
campaign_vintage_id: "2026-08-10.1"

# The sealed factor namespace (WP2.1b Task 1, ah.factors.load_manifest). Path is
# relative to this file; ah.eval.prereg.seal() reads it to know which factors.yaml to
# include in the sealed digest.
factor_manifest: factors.yaml

# Must equal factors.yaml's active_blocks at seal time -- ah.eval.prereg.verify()
# checks this exactly against the live FactorManifest, so the pre-registration can
# never silently drift from the manifest it was authored against.
# Campaign-2: fx and valuation activated by block_addition amendments
# AM-2026-08-02-007/-008; merged here as part of the campaign-2 re-seal (the
# amendment payloads are the audit record; pre-existing blocks' thresholds are
# byte-identical, which is the block_addition acceptance criterion).
active_blocks: [global, us, fx, valuation]

# --------------------------------------------------------------------------- #
# splits -- the sealed train / validation / holdout boundaries.
#
# governance/retrofit-register.md RFR-6. `ah/splits.py` hardcodes these dates and is
# itself a hashed judged source, so an edit to it already invalidates the lock -- but a
# lock violation says "some hashed file changed", not "the reference span moved". This
# block is the normative statement; ah.eval.prereg.verify() checks ah.splits.SPLITS
# against it exactly, on every battery invocation, and the document wins if they ever
# disagree (the self-containment rule).
#
# `start` is inclusive, `end` is EXCLUSIVE, both ISO YYYY-MM-DD -- the half-open
# convention ah.splits.DataAccess.frame applies, stated here so a reader does not have
# to infer it. The holdout is the final ~5 years and is spent EXACTLY ONCE, by WP2.11,
# through a FinalEvaluationToken mintable only in ah/eval/g2.py.
#
# AMENDED BY AM-2026-07-31-002 (2026-07-31, protocol_change, post_hoc TRUE): THE HOLDOUT
# WAS NOT SPENT AT G2, AND REMAINS UNSPENT. The sentence above is left standing because
# this file is a record and not a wish, but it no longer describes what WP2.11 did, and a
# reader must not take "is spent EXACTLY ONCE, by WP2.11" as an account of events.
# THE REASON, in one line: this document specifies the holdout's SPAN, its GUARD, that it
# may be spent at most once, and that nothing may EVER be tuned on it -- and NOWHERE
# specifies WHAT THE ONE-SHOT EVALUATION COMPUTES. STEP2-GENERATOR-PLAN Sec.WP2.11 says
# only "the one-shot holdout evaluation through the explicit-purpose path -- once,
# logged, never repeated". None of multi_seed_decision_rule's four clauses reads the
# holdout: all four are computed on the WP2.10 ablation grid against a train+validation
# reference. So any holdout procedure run at G2 would have been CHOSEN BY THE AUTHOR AT
# WP2.11, with the grid, both severe arms and the head-to-head already in hand -- the
# exact forking path this file exists to close, applied to a resource that cannot be
# restored once spent. Declining is the conservative act: an unspent holdout stays worth
# exactly what it was, while a holdout spent on a post-hoc procedure is worth little and
# is gone. THE PROHIBITIONS ARE UNCHANGED AND STILL BIND -- at most once, ever, through
# the token, and no tuning on it under any circumstance. See
# governance/decision-register.md S2-HOLDOUT-NOT-SPENT and
# governance/retrofit-register.md RFR-83, which owns the general defect: a sealed GUARD
# with no sealed TEST behind it.
# --------------------------------------------------------------------------- #
splits:
  train:      {start: "1871-01-01", end: "2011-01-01"}
  validation: {start: "2011-01-01", end: "2021-01-01"}
  holdout:    {start: "2021-01-01", end: "2026-08-01"}

# --------------------------------------------------------------------------- #
# future_accruing_holdout -- ruling K1 (AM-2026-08-10-001). The one-shot
# historical holdout was SPENT at WP5.6 and no past data can be un-seen; the
# future is the only place a holdout can still come from. Sealed here so the
# rule predates the data it protects, which no historical holdout can ever
# claim again.
# --------------------------------------------------------------------------- #
future_accruing_holdout:
  accrual_start: "2026-09-01"   # data first PUBLISHED after 2026-08
  earliest_read: "2029-01-01"
  protocol: >-
    Data first published after 2026-08 is UNTOUCHABLE by any fit, tuning
    run, reference derivation or verdict until 2029-01 at the earliest.
    ONE READ, EVER, in WP5.6's protocol shape: the evaluation spec is
    written and sealed BEFORE the read; results publish both ways; nothing
    re-runs. Monthly refreshes continue to STORE accruing data (the vintage
    machinery is append-only and storage is not reading); the read surface
    for every campaign remains train+validation, whose end does not move.
    Operationalizing the fence (a splits-layer accrual boundary and its
    leakage-guard test) is a sealed requirement on the work package that
    first touches post-2026-08 data, in the same posture as
    criterion_bearing_runs_only's requirement on WP2.11.

# --------------------------------------------------------------------------- #
# reference_run -- the single run every historical band in this file came from.
#
# Reproduce with:
#   uv run python scripts/compute_campaign_reference.py --out <path>
# whose module constants are asserted equal to the values below by
# tests/test_prereg.py, so the script that produced the bands and the file that seals
# them cannot silently diverge. `data/` is gitignored, so that JSON is the artifact a
# reader without the catalog checks these numbers against.
#
# The bootstrap draw flows from `seed` through numpy.random.Generator(PCG64(seed)); the
# same seed against the same vintage gives bit-identical bands.
# --------------------------------------------------------------------------- #
reference_run:
  # Campaign-2 (AM-2026-08-02-009): re-run on the new vintage at the SAME seed so
  # pre-existing factors' bands are comparable bit-for-bit (RFR-61 discipline).
  # Campaign-3 (AM-2026-08-10-001): re-run on `2026-08-10.1` -- the first vintage
  # carrying the extension donors and the AQR commodities series -- at the SAME
  # seed, kept so any factor whose data is genuinely unchanged reproduces its
  # campaign-2 band bit-for-bit; every band that moves is attributable to the
  # data (artifacts/campaign3/reference-run.json).
  vintage_id: "2026-08-10.1"
  seed: 20260726
  n_resamples: 1000
  level: 0.9
  block_length: 120
  resample_length: 120
  script: scripts/compute_campaign_reference.py
  split_reader: train_val  # ah.splits.DataAccess.train_val -- the holdout is unreachable

  # WHAT THE RUN COULD NOT COMPUTE, and why it matters (governance/retrofit-register.md
  # RFR-5). ah.eval.prereg.verify() reads the two lists below and REJECTS any threshold
  # keyed to a factor or D4 strategy named in them -- a threshold on a factor with no
  # computable statistic judges nothing, silently, forever, which is precisely the
  # failure the key checks exist to stop. This is the machine-checked half of the
  # cross-check RFR-5 asked WP2.3 to perform.
  #
  # TWO of the fourteen declared active factors produced no train+validation data on
  # the sealed vintage:
  #   commodities  -- DECLARED unavailable (factors.yaml `kind: unavailable`); no free,
  #                    already-connectored total-return series exists (RFR-8).
  #   hy_spread    -- RESTORED AT CAMPAIGN-2 (AM-2026-08-02-009; the paragraph below
  #                    records the superseded state). The hy_oas_pre1996 splice rule is
  #                    now APPLIED AT THE READ SURFACE (factors.yaml kind: derived,
  #                    expr: hy_oas_spliced) with a PINNED fit -- the rule's only
  #                    licensed fitting window lies inside the holdout span, so the two
  #                    fitted scalars were frozen offline by owner decision (2026-08-02)
  #                    rather than fit at read time (splice.PINNED_FITS; the residual
  #                    post-2020 information flow is exactly those two published
  #                    constants). Superseded state, kept for the record: FRED serves
  #                    only ~3 licensed years of fred.HY_OAS (all inside the holdout
  #                    span), the rule was REGISTERED BUT NOT APPLIED (RFR-10), and the
  #                    2026-07-26.1 train+validation sample was empty -- a licensing
  #                    limit, not a stale snapshot.
  #
  # WHAT THE VINTAGE MOVE FIXED, recorded here because the first seal recorded the
  # opposite: `policy_rate` was in this list at the first seal, with THREE names in it.
  # It is not a data-availability fact at all -- fred.FEDFUNDS is registered, free,
  # connectored, and serves 864 monthly observations from 1954-07. The 2026-07-24
  # snapshot simply predated its registration. A live refresh restored it, and with it
  # `cash_tr_1m`, the `carry` strategy, `term_premium`, `equity_risk_premium` and
  # `policy_anchor_deviation`. Its train+validation coverage is 1954-07 to 2020-12,
  # n = 798 -- shorter than the equity factors' 1926, which has consequences of its own
  # (see decisions.S2-NUMERAIRE-BIAS).
  # Campaign-2: hy_spread leaves this list (restored via the pinned splice above);
  # commodities remains the one declared-unavailable factor (RFR-8).
  # Campaign-3 (AM-2026-08-10-001): commodities RESTORED -- sourced by
  # `aqr.cmdty_ew_excess + french.rf` (expr: add, the exact equity_mkt pattern).
  # RFR-8's "no free connectored series" reason is discharged by the REG-licensed
  # manual intake (AM-2026-08-08-001 precedent); the superseded state is kept in
  # the paragraphs above for the record. The list is EMPTY for the first time.
  missing_factors: []

  # CONSEQUENCE FOR D4. rationale.d4_commodities_consequence names TWO strategies as
  # unevaluable (eqw_factors, endowment_proxy) on the strength of `commodities` alone.
  # On this vintage that count is right, but one of its two REASONS is not: it is
  # `commodities` AND `hy_spread`, and either alone is sufficient for endowment_proxy.
  #   eqw_factors      -- 0.20 commodities.
  #   endowment_proxy  -- 0.10 commodities AND 0.15 credit_xs_hy (derived from
  #                        hy_spread), so it would still be uncomputable if commodities
  #                        were sourced tomorrow.
  # THREE of five ARE computable on this vintage: sixty_forty (equity_mkt +
  # govt_tr_10y<-ust_10y), momentum (equity_mkt) and -- restored by the vintage move --
  # carry (govt_tr_10y<-ust_10y funded at cash_tr_1m<-policy_rate). Every sealed
  # thresholds.strategies entry is on one of those three, and verify() rejects one on
  # either of the two below.
  # Campaign-2 note (AM-2026-08-02-009): hy_spread's restoration does NOT shrink
  # this list -- commodities alone keeps both strategies uncomputable (0.20 in
  # eqw_factors, 0.10 in endowment_proxy). The paragraph above's "if commodities
  # were sourced tomorrow" hypothetical is now the LIVE condition: sourcing
  # commodities would make endowment_proxy computable, since credit_xs_hy's
  # hy_spread leg is restored.
  # Campaign-3 (AM-2026-08-10-001): the LIVE condition fired exactly as written --
  # "sourcing commodities would make endowment_proxy computable, since
  # credit_xs_hy's hy_spread leg is restored." Commodities is sourced (K2);
  # eqw_factors and endowment_proxy both become computable and carry sealed
  # thresholds.strategies entries. The list is EMPTY for the first time.
  uncomputable_d4_strategies: []

  # Per-factor train+validation coverage of the run, verbatim from its output. Sealed
  # because a band that does not say how much history it rests on is not auditable, and
  # the spread here is roughly threefold.
  coverage:
    # CAMPAIGN-3 (AM-2026-08-10-001): verbatim from the campaign-3 reference run
    # (artifacts/campaign3/reference-run.json) on the extended panel -- every
    # extension family engaged (the seven extended firsts below were verified
    # against the wiring's expected values before this table was written, the
    # runbook's abort rule). Proxy months are IN these counts; the per-factor
    # proxy share is a sealed reporting requirement
    # (multi_seed_decision_rule.proxy_share_disclosure). hy_spread's 1224 months
    # remain ALL proxy on a train+validation read (the pinned splice).
    # equity_vol's pre-1986 months are the ONE pinned HAR draw -- MODEL OUTPUT
    # (pinned_artifacts below). Superseded campaign-2 table: policy_rate
    # 1954-07/798, ust_10y 1962-01/708, ust_2y 1976-06/535, fx_usd 1973-01/576,
    # hqm_curve 1984-01/444, funding_spread 1986-01/420, no commodities row;
    # the eight unextended factors' rows are unchanged.
    cape_v:         {first: "1881-01-01", last: "2020-12-01", n_obs: 1680}
    cpi:            {first: "1913-01-01", last: "2020-12-01", n_obs: 1296}
    ig_spread:      {first: "1919-01-01", last: "2020-12-01", n_obs: 1224}
    hy_spread:      {first: "1919-01-01", last: "2020-12-01", n_obs: 1224}
