    "endowment_proxy.var_95": {min: 0.0137, max: 0.1236, severity: report}
    "endowment_proxy.es_95": {min: 0.0211, max: 0.1896, severity: report}
    # elicitability_score is the D4 tail objective WP2.8's auxiliary loss optimizes --
    # the average of the Fissler-Ziegel-style joint (VaR, ES) consistent scoring
    # function of the GENERATED returns against the HISTORICAL forecast. It is a loss,
    # so lower is better and only an upper bound is meaningful. No band exists for it
    # either; 5.0 is retained from the pre-seal draft as a deliberately loose upper
    # bound and IS NOT DERIVED FROM A RUN -- the one value in this file's thresholds
    # block of which that is true, and it is sealed `report` and named here rather than
    # dressed up. WP2.4 must report bootstrap-v1's measured value so a derived bound
    # replaces it by amendment.
    "sixty_forty.elicitability_score": {min: null, max: 5.0, severity: report}
    "momentum.elicitability_score": {min: null, max: 5.0, severity: report}
    "carry.elicitability_score": {min: null, max: 5.0, severity: report}
    # Campaign-3: the two restored strategies carry the same deliberately loose
    # underived 5.0 ceiling as the three above, for the same stated reason --
    # no run-derived bound exists until a campaign reports measured values.
    "eqw_factors.elicitability_score": {min: null, max: 5.0, severity: report}
    "endowment_proxy.elicitability_score": {min: null, max: 5.0, severity: report}
    # WP2.2 Task 4 fix pass 2 (BLOCKING 1): renamed from `kupiec_pof_pvalue`, and the
    # statistic pinned to the SEALED one-path reference count (T = 120), not to a pooled
    # count ~1000x larger. The 0.01 floor is now DERIVED rather than provisional: it is
    # the conventional 1% point of the chi-square(1) reference distribution, LR = 6.635,
    # which at T = 120 and a nominal 95% VaR level corresponds to a realized exceedance
    # rate outside roughly [0.0083, 0.1088] -- i.e. fewer than about 1 or more than
    # about 13.1 exceedances in 120 months against an expected 6. CLAIMS-SWEEP
    # CORRECTION: that interval was sealed as [0.0042, 0.1125] ("about 0.5 or more than
    # about 13.5"), which is not the LR = 6.635 contour of the statistic this file
    # defines -- it is the interval whose ENDPOINTS are half-integer exceedance counts,
    # and at p_hat = 0.0042 the sealed statistic gives LR = 8.76, not 6.635. Solving
    # 2 * T * KL(p_hat || 0.05) = 6.635 at T = 120 gives p_hat in [0.008328, 0.108796],
    # counts [1.00, 13.06]. THE THRESHOLD IS UNCHANGED at min: 0.01 and no severity
    # moved: what was wrong is the sentence describing what that floor implies, and the
    # correct interval is NARROWER than the one stated, i.e. the floor is slightly more
    # demanding than the sealed prose claimed, not less. That interval is wide,
    # and saying so is the point: at a 120-month reference length a Kupiec test simply
    # cannot resolve the size of miscalibration G2 would care about, which is why this
    # is `report` and why governance/retrofit-register.md RFR-24's coverage-band
    # reformulation stays on the table (see limitations.named_estimator_substitutions
    # for why it was not adopted here).
    "sixty_forty.kupiec_pof_chi2_tail_1path": {min: 0.01, max: null, severity: report}
    "momentum.kupiec_pof_chi2_tail_1path": {min: 0.01, max: null, severity: report}
    "carry.kupiec_pof_chi2_tail_1path": {min: 0.01, max: null, severity: report}

