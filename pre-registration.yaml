# --------------------------------------------------------------------------- #
# ensemble_size -- THE SIZE THE GATE BOUNDS ARE CALIBRATED AT.
#
# WHY THIS IS SEALED AT ALL. Every acceptance band in this file is the sampling
# distribution of a statistic computed on ONE length-matched series (a `months`-row
# bootstrap replicate of history). The ensemble side of the comparison reports the
# average over `n_paths` paths. Those are not the same object: at 16 paths the ensemble
# estimator is roughly 4x tighter than the band's own null; at 1024 paths, roughly 8x
# tighter again. The DIRECTION is conservative -- a tighter estimator is never pushed
# outside a band it belongs inside, so no bound below is VIOLATED by running larger --
# but the gates' POWER rises without limit in n_paths, so `max: 0.5` sealed at 16 paths
# is simply not the same criterion as `max: 0.5` at 1024. Leaving the size free would
# leave the strength of every gate free.
#
# THE RULE. A run at any other size is NOT criterion-bearing. What enforces that today,
# and what does not, stated exactly -- a sealed file must not claim a check it does not
# have. TODAY: ah.eval.prereg.verify(..., ensemble_n_paths=, ensemble_months=) rejects a
# mismatch when it is asked, and ah.eval.battery.run_battery compares every run's own
# size against this block -- AND its ensemble's vintage against campaign_vintage_id, the
# other half of `multi_seed_decision_rule.criterion_bearing_runs_only`; see that entry
# for what the earlier seal checked and did not -- recording `criterion_bearing` on the
# report, with the markdown printing "NO -- diagnostic run, may not be cited as G2
# evidence" in bold when it is false. The battery does NOT refuse such a run, deliberately: small-ensemble runs
# are legitimate and necessary (the negative-control suite runs at 16 paths, CI smoke
# tests smaller). NOT YET: ah/eval/g2.py implements only the holdout-token mint; the
# multi-seed rule and its refusal of a non-criterion-bearing report are WP2.11's to
# build, and multi_seed_decision_rule.criterion_bearing_runs_only is the sealed
# requirement it must satisfy. Running the campaign at a different ensemble size
# requires a dated `protocol_change` amendment either way.
#
# DOWNSTREAM CONSTRAINT, stated plainly: WP2.4 (bootstrap-v1) and WP2.8-2.10 (the
# neural systems and the ablation) must produce their criterion-bearing ensembles at
# exactly this size, or amend.
# --------------------------------------------------------------------------- #
ensemble_size:
  n_paths: 1024
  months: 120

  # --- WHY 1024 AND NOT 1000. Re-seal fix, review Important 3. ------------------ #
  # The first seal sealed 1000 and cited an MC-error grid measured at 64/256/1024.
  # Nothing was ever measured at 1000: a round number stood in for a measured one, which
  # is the substitution this whole file exists to prevent. The grid below is what the
  # decision rests on, so the sealed size is one of its rows.
  #
  # AND WHY THE GRID IS IN HERE. It lived in governance/decision-register.md -- which is
  # NOT hashed -- while a sealed value rested on it, so the evidence behind a sealed
  # number could be edited with no amendment and no lock violation. It is now inside the
  # hash. Reproduce with:
  #   uv run python scripts/measure_mc_error_grid.py --out <path>
  # tests/test_prereg.py asserts the sealed size is a MEASURED row of the grid, that the
  # grid's sizes equal the script's, and that the grid's mean_block_months equals
  # bootstrap_v1's -- so the table, the script and the sealed size cannot drift apart.
  mc_error_grid:
    script: scripts/measure_mc_error_grid.py
    vintage_id: "2026-07-26.1"
    seed: 20260726
    mean_block_months: 6
    n_subsamples: 20
    generator: >-
      A bootstrap-v1-shaped prototype: the sealed stationary form at the sealed
      mean_block_months, drawn from the sealed block_draw_span over the sealed
      factor_set. Not a fitted generator -- none exists -- but the right shape, which is
      what an ensemble-size question needs.
    ratio_definition: >-
      ratio = mc_error / (band.hi - band.lo), where mc_error is
      ah.eval.battery.mc_error (batch means over n_subsamples disjoint path subsamples,
      the SAME estimator the battery records on every report) and the band is this same
      reference run's own band for that name. A ratio of 0.04 says the Monte-Carlo noise
      is 4% of the interval the value is judged against. STEP2-GENERATOR-PLAN Sec.WP2.2's
      sizing rule is "MC error << band width", and this is the quantity it names.
    what_is_deliberately_absent: >-
      NO *_band_exceedance_fraction COLUMN, and its absence is a decision rather than an
      omission. limitations.band_exceedance_gate_mc_error_is_not_trustworthy_for_sizing
      (governance/retrofit-register.md RFR-44) states that the batch-means estimator does
      not estimate the right quantity for those three gates: a gate is a fraction over a
      FIXED family of comparisons, and subsampling paths changes the metric values the
      fraction is computed from, so the subsample spread is not the full-count sampling
      variability. The first seal's grid carried a gate column anyway, which put a number
      inside the seal that the same document said must not be used for sizing. It is gone.
      The size rests entirely on the five rows below.
    metric_selection: >-
      Five representative per-name statistics spanning the band widths in this file: one
      location/shape (skew), two tail (excess_kurtosis, hill_tail_index_5pct), one
      dependence (acf_abs_sum), and -- the one the decision actually turns on -- the
      TIGHTEST band in the file, ust_10y.acf_r_lag1, whose width is 0.0542 against
      equity_mkt.excess_kurtosis's 5.83, a factor of 108. A grid that sampled only wide
      bands would report reassuring ratios everywhere and say nothing.
    band_widths:
      "equity_mkt.skew": 1.755740
      "equity_mkt.excess_kurtosis": 5.833119
      "equity_mkt.acf_abs_sum": 3.529339
      "equity_mkt.hill_tail_index_5pct": 3.984019
      "ust_10y.acf_r_lag1": 0.054223
    rows:
      64:
        "equity_mkt.skew": 0.0217
        "equity_mkt.excess_kurtosis": 0.0203
        "equity_mkt.acf_abs_sum": 0.0319
        "equity_mkt.hill_tail_index_5pct": 0.0359
        "ust_10y.acf_r_lag1": 0.1737
      256:
        "equity_mkt.skew": 0.0115
        "equity_mkt.excess_kurtosis": 0.0105
        "equity_mkt.acf_abs_sum": 0.0113
        "equity_mkt.hill_tail_index_5pct": 0.0314
        "ust_10y.acf_r_lag1": 0.0774
      1024:
        "equity_mkt.skew": 0.0048
        "equity_mkt.excess_kurtosis": 0.0055
        "equity_mkt.acf_abs_sum": 0.0057
        "equity_mkt.hill_tail_index_5pct": 0.0205
        "ust_10y.acf_r_lag1": 0.0463
    reading: >-
      THE WORST RATIO IS WHAT MATTERS, and it is ust_10y.acf_r_lag1's at every size:
      0.174 at 64 paths, 0.077 at 256, 0.046 at 1024. At 64 the Monte-Carlo noise is a
      sixth of the band the value is judged against -- not "much less than", by any
      reading. At 1024 it is a twentieth. Every other name is under 0.021 at 1024. The
      ratios fall close to the 1/sqrt(n) a batch-means error should follow (a 16-fold
      path increase gives roughly a 3.8-fold reduction on skew and acf_abs_sum), which is
      a consistency check on the estimator rather than a result. (CLAIMS-SWEEP
      CORRECTION: that parenthesis named the wrong two rows. Read off the table above,
      64 -> 1024 gives 3.75x on ust_10y.acf_r_lag1 and 3.69x on
      equity_mkt.excess_kurtosis -- those are the ~3.8-fold reductions -- against 4.52x
      on skew and 5.60x on acf_abs_sum, which fall FASTER than 1/sqrt(n) rather than
      close to it. The consistency conclusion is unchanged; the two names attached to
      the number were wrong, and the table that falsifies them was already sealed
      directly above.)
      WHAT THIS DOES NOT ESTABLISH: 1024 is where "MC error << band width" holds with
      margin, but HOW MUCH margin is required is a judgment, not a measurement, and the
      gates' POWER keeps rising in n_paths past the point where their noise stops
      mattering. That is why ensemble_size.n_paths is named provisional in
      governance/amendment-log.yaml and why D6 ratifies it. Nothing here says 1024 is
      optimal; it says 64 and 256 are visibly too small on the tightest band in the file.

rationale:
  d4_factor_level: >-
    the generator's outputs are factors; tail fidelity is therefore assessed on
    factor-level portfolios. The endowment proxy stands in for the institutional mix
    at the factor level. Sleeve-level tail behaviour is a Step-3 property, evaluated
    separately once mappings exist, and is not a G2 criterion.

  d4_derived_series: >-
    the generator emits some factors as period returns and others as levels (rates and
    spreads). A level is not a return and must never be summed with one. Every D4
    strategy is therefore defined over return-bearing factors directly, or over a
    *declared derived series* -- a named, fully-specified transform of exactly one
    level factor into a monthly decimal return. The `derived_series` block below is
    that declaration; it is sealed with the strategies and is the only route by which
    a level enters a D4 portfolio.

  d4_commodities_consequence: >-
    CONSEQUENCE AT SEAL TIME, stated for the D4 criterion as a whole and not only
    per-strategy, and CORRECTED at the re-seal so the count and its reasons agree.
    TWO of the five sealed D4 strategies have NO COMPUTABLE REFERENCE STATISTICS on the
    sealed campaign vintage: `eqw_factors` and `endowment_proxy`. The count is two, but
    it does not rest on `commodities` alone, which is how this paragraph read at the
    first seal and what made it wrong in substance even when its number happened to be
    right. `commodities` has no Step-1 data source registered (factors.yaml; RFR-8) and
    carries 0.20 of `eqw_factors` and 0.10 of `endowment_proxy`; INDEPENDENTLY,
    `hy_spread` has no train+validation data on this vintage (its entire licensed
    history falls inside the holdout) and `endowment_proxy` carries 0.15 of
    `credit_xs_hy`, which derives from it. Sourcing a commodities series tomorrow would
    therefore restore `eqw_factors` and NOT `endowment_proxy`. NO THRESHOLD IS SEALED
    FOR EITHER -- reference_run.uncomputable_d4_strategies names them and
    ah.eval.prereg.verify() rejects a threshold keyed to them, so this is a machine-
    checked fact rather than a note. The other three (`sixty_forty`, `momentum`,
    `carry`) are computable and are where every sealed thresholds.strategies entry
    lives. `carry` is computable only because the campaign vintage moved: it funds at
    `cash_tr_1m`, which derives from `policy_rate`, which the 2026-07-24 snapshot did
    not contain.
    CAMPAIGN-3 SUPERSESSION (AM-2026-08-10-001), the paragraph above kept as
    history: BOTH strategies are now computable, exactly through the two
    independent restorations the paragraph's own analysis required -- hy_spread
    at campaign-2 (AM-2026-08-02-009, the pinned splice) and commodities at
    campaign-3 (ruling K2, the REG-licensed AQR intake). ALL FIVE D4 strategies
    carry sealed thresholds.strategies entries; reference_run's two lists are
    empty for the first time.

# --------------------------------------------------------------------------- #
# Conventions -- one set of rules, applied to every definition in this file.
# --------------------------------------------------------------------------- #
conventions:
  # READ THIS FIRST (WP2.3). Several estimator blocks below end with a sentence of the
  # form "WP2.3 must decide X before sealing". EVERY ONE OF THOSE IS NOW DECIDED. The
  # sentences are left standing rather than rewritten, because erasing them would erase
  # the record of what was genuinely open at seal time -- which is precisely the kind of
  # history a pre-registration exists to preserve. Read each as "this was open; here is
  # where it was closed":
  #   - band semantics, length matching, NaN percentiles, knife-edge comparisons, the
  #     tail gate's inability to fire, within-block correlation, the 10yr tier, the
  #     backtest level, and the four named estimator substitutions -> the `limitations:`
  #     block, which states each as a sealed, accepted limitation with what would close
  #     it;
  #   - which modules and documents the seal covers -> the `seal_scope:` block;
  #   - the NC5 enforce exemption, SPREAD_FLOOR_PCT, and the D4 numeraire bias -> the
  #     `decisions:` block (S2-NC5-EXEMPTION, S2-SPREAD-FLOOR, S2-NUMERAIRE-BIAS);
  #   - the statistics that are NaN on every ensemble forever -> the
  #     `structurally_unavailable_statistics:` block, which verify() now enforces
  #     against any `enforce` threshold;
  #   - the memorization floors and the benchmark's block length -> the `thresholds:`
  #     panel section and the `bootstrap_v1:` block.
  # governance/retrofit-register.md rows RFR-48..RFR-60 are the audit trail for all of
  # it, one row per closed or sealed item.
  #
  # THE ONE NUMERAIRE. Every capital-committing leg of every D4 strategy is a monthly
  # TOTAL return in decimal units. Machine-enforced by ah.strategies at load time
  # against factors.yaml's `factor_sources.<factor>.numeraire` and each derived
  # series' own `numeraire:` field -- not prose.
  numeraire: total_return
  # The self-financing, long-short overlay legs. A zero-cost leg commits no capital, so
  # it is numeraire-neutral and may be combined with total-return legs; its weight is a
  # notional/risk budget rather than a capital share. This list must name exactly the
  # legs that declare `numeraire: zero_cost` -- the loader rejects an undeclared
  # zero-cost leg AND a dead entry here, so the exception can never grow silently.
  numeraire_zero_cost_legs: [smb, hml, mom, credit_xs_hy]
  numeraire_statement: >-
    ONE NUMERAIRE, TOTAL RETURN, applied to every capital-committing leg of every D4
    strategy. WP2.2 Task 1 originally mapped equity_mkt to french.mkt_rf -- Fama-
    French Mkt-RF, an EXCESS return over the one-month bill -- while govt_tr_10y is a
    long-government TOTAL return; sixty_forty (0.6 equity_mkt + 0.4 govt_tr_10y) and
    endowment_proxy therefore summed an excess-return leg with a total-return leg
    inside a fully-invested portfolio, understating the equity leg by the risk-free
    rate, and were about to be sealed that way. equity_mkt is now `kind: derived`,
    `add(french.mkt_rf, french.rf)` -- Mkt-RF plus the one-month bill that Mkt-RF is
    quoted net of -- a genuine total return, consistent with govt_tr_10y. The
    remaining legs are either total returns (govt_tr_10y, cash_tr_1m, and commodities
    once sourced) or DECLARED ZERO-COST overlays (smb, hml, mom -- long-short factor
    spreads; credit_xs_hy -- high yield excess of the duration-matched government leg,
    i.e. a duration-hedged long-HY/short-govt position). A zero-cost overlay commits no
    capital and so does not change the portfolio's numeraire; an `excess_return` leg
    would -- it is capital-committing yet quoted net of a rate -- and the loader rejects
    one outright. That distinction, not a general tolerance for mixing, is why this
    file can carry one numeraire and still hold long-short legs.
    CONSEQUENCE, not covered by the leg-level check above: the leg taxonomy governs
    what each LEG is quoted on, not what the STRATEGY's realized return series is
    quoted on, and those are different claims. A strategy holding a zero-cost overlay
    at less than 100% of its weight (eqw_factors at 0.6, endowment_proxy at 0.15 --
    both via credit_xs_hy and, for eqw_factors, also smb/hml/mom), or a `rule` strategy
    that is flat under its own rule for some months (momentum, in its 12-month warm-up
    and every month its signal is non-positive), is CASH-UNCOLLATERALIZED BY
    CONSTRUCTION: static_weights_composition and the rule strategies' own arithmetic
    (see their `notes`) credit no return at all to the uncommitted or unallocated
    capital, rather than crediting it the cash rate a genuinely fully-invested
    total-return portfolio would earn on an uninvested balance. The realized series is
    therefore below the total-return numeraire by exactly that uncommitted-capital cash
    return, for every affected month -- a strategy-level consequence the leg-level
    `zero_cost` declaration does not, and cannot, capture. See
    governance/retrofit-register.md RFR-12 for the full accounting (which strategies,
    by how much) and the options WP2.3 must choose between before sealing.
  units_of_return_bearing_factors: >-
    equity_mkt, smb, hml, mom and commodities are treated by D4 as monthly returns in
    DECIMAL units (0.01 = +1% for the month). They are used directly, with no
    transform. As of WP2.2 Task 1, factors.yaml's `factor_sources` section is the
    factor-to-series mapping, and it is a fact, not an assumption: equity_mkt is
    `kind: derived`, add(french.mkt_rf, french.rf) -- Mkt-RF put back onto a TOTAL
    return by adding the one-month risk-free rate it is quoted net of, per
    conventions.numeraire above; smb maps to french.smb, hml to french.hml, mom to
    french.mom (all `units: ret` in requirements.yaml), each a long-short spread return
    declared `numeraire: zero_cost`. commodities has no Step-1 series
    (`factor_sources.commodities.kind: unavailable`, governance/retrofit-register.md
    RFR-8); D4 assumes it will be a return-bearing TOTAL return once sourced (recorded
    machine-visibly as `factor_sources.commodities.numeraire: total_return`), and that
    assumption is recorded here rather than presented as a property of the manifest.

  # Machine-checked version of the prose above: EVERY active factor in factors.yaml
  # (global + us blocks) must appear in exactly one of return_bearing_factors /
  # level_factors below. The loader (ah.strategies) enforces both exhaustiveness and
  # disjointness at load time, and rejects a `d4_strategies.*.weights` entry that
  # names a level_factors member directly -- the only route by which a level enters a
  # D4 portfolio is a declared `derived_series` (see rationale.d4_derived_series). This
  # is the sealed source for that rule; there is no separate hand-maintained list
  # anywhere else, in code or in tests.
  return_bearing_factors:
    - equity_mkt
    - smb
    - hml
    - mom
    - commodities

  units_of_level_factors: >-
    policy_rate, ust_2y, ust_10y, hqm_curve, ig_spread, hy_spread, funding_spread, cpi
    and equity_vol are LEVELS, never period returns: seven of the nine are rates or
    spreads QUOTED IN PERCENT PER ANNUM (a generated value of 4.25 means 4.25 percent,
    not 0.0425). As of WP2.2 Task 1, factors.yaml's `factor_sources` section is the
    definitive factor-to-series mapping (this paragraph previously named "candidate"
    series before that mapping existed): policy_rate -> fred.FEDFUNDS (the ADMINISTERED
    effective federal funds rate, registered by WP2.2 Task 1 under the requirements.yaml
    WP1.9 rule -- NOT fred.TB3MS itself, which is a market bill yield and shares its
    construction with funding_spread's TED leg. A rule to backfill pre-1954-07 history
    from fred.TB3MS via ah.data.splice, flagged is_proxy, is REGISTERED but not applied
    by ah.data.refresh today, so read_factor_frames reads fred.FEDFUNDS unextended;
    factors.yaml's factor_sources.policy_rate.proxy_for and
    governance/retrofit-register.md RFR-10 have the current status), ust_2y ->
    fred.DGS2, ust_10y -> fred.DGS10, hqm_curve -> treasury.hqm_curve, ig_spread ->
    derived from fred.BAA - fred.AAA, hy_spread -> fred.HY_OAS, funding_spread ->
    derived from fred.TEDRATE -- all `units: pct` there or in requirements.yaml. cpi
    maps to fred.CPI (`units: index`), an index level; equity_vol maps to fred.VIX
    (`units: idx`), a volatility level. Neither cpi nor equity_vol is a
    percent-per-annum rate, but both are still a level rather than a return and are
    excluded from D4 on the same "not a return" basis -- no `derived_series` transform
    is declared for either, so neither currently has a route into a D4 portfolio at
    all. Levels are never summed with returns and never appear in a strategy's
    `weights` directly; they enter only through a `derived_series` entry. level_factors
    below is the sealed, exhaustive, machine-checked version of this list.
  level_factors:
    - policy_rate
    - ust_2y
    - ust_10y
    - hqm_curve
    - ig_spread
    - hy_spread
    - funding_spread
    - cpi
    - equity_vol
    # campaign-2 block additions (AM-2026-08-02-007/-008, the hand-edited half a
    # block_addition requires -- see governance/amendment-log.yaml's header):
    # fx_usd is a trade-weighted dollar INDEX level (factors.yaml units: index,
    # derived fx_usd_spliced); cape_v is DN-1's v_t, a demeaned natural log of a
    # valuation ratio (units: log, derived demeaned_log_cape) -- signed, unbounded,
    # and a level in the exact "not a return" sense above. Neither declares a
    # derived_series transform, so neither has a route into a D4 portfolio.
    - fx_usd
    - cape_v

  percent_to_decimal: 0.01
  months_per_year: 12.0
  percent_to_decimal_statement: >-
    THE ONE CONVERSION, used by every transform below with no exception: a percent
    level is converted to decimal by multiplying by percent_to_decimal (0.01 above),
    and the conversion is applied ONCE, to the whole transform expression. Both terms
    of every transform below (the carry term and the duration term) are linear in the
    percent level, so a single leading factor of percent_to_decimal converts the entire
    result to a decimal monthly return. An annual percent rate is converted to a
    monthly carry by dividing by months_per_year (12.0 above; simple, not compounded:
    y/12, not (1+y)^(1/12)-1). Both percent_to_decimal and months_per_year are sealed
    values, read directly by ah.eval.metrics.tails at import time -- not independent
    constants duplicated in that module -- so an amendment to either value here changes
    every transform's output, and a test asserts the module's constants equal these.

  warm_up: >-
    ONE WARM-UP RULE for the whole file, applied identically by every definition: any
    month t whose complete input window is not available within the path takes the
    value 0.0. There is no other warm-up convention in this file. For the lagged
    transforms in `derived_series` the input window is {t-1, t}, so month 0 of every
    path is 0.0 and the warm-up length is 1 month. For `momentum` the input window is
    months [t - lookback, t - skip_months), so months 0..lookback-1 are flat
    (position 0.0, hence realized return 0.0) and the warm-up length is `lookback`
    months. Warm-up months are NOT dropped, masked, or treated as missing: they are
    zeros, and they are included in the pooled sample when VaR/ES is computed.
    KNOWN ASYMMETRY, RECORDED RATHER THAN CORRECTED (WP2.2 Task 4 fix pass, Important
    5). The generated and historical sides of a backtest carry DIFFERENT warm-up
    fractions, because the generated side is many short paths and the historical side is
    one long one: `momentum` (lookback 12) is structurally flat for 12/120 = 10% of a
    generated path but only 12/~800 = 1.5% of the historical series. A structurally flat
    month cannot produce an exceedance, so the exceedance rate a PERFECT generator would
    exhibit against history's own VaR_95 is about 0.915 * 5% = 4.57%, not 5% (CLAIMS-
    SWEEP CORRECTION: the multiplier read "0.95", which does not multiply to 4.57 and is
    not the quantity this paragraph derives. The factor is the DIFFERENTIAL warm-up
    fraction, generated minus historical -- 1 - (12/120 - 12/~800) = 0.915 -- because
    history's own flat months are already inside the VaR_95 estimate the generated side
    is judged against. 4.57%, and therefore every number downstream of it in this
    paragraph, is unchanged and correct) -- a small
    but real downward bias in Kupiec's p_hat for the rule-based strategies. It is NOT
    corrected by dropping warm-up months, because that would make the pooled sample of a
    metric differ from the pooled sample of the descriptive var_95/es_95 computed on the
    same strategy, and two different "the strategy's return path" conventions in one
    file is a worse defect than a quantified bias.
    ITS CONSEQUENCE, CORRECTED (WP2.2 Task 4 fix pass 2, BLOCKING 3 -- the arithmetic
    below is unchanged, only the READING of it was wrong and is replaced). At the sealed
    reference sample size of one 120-month path, a 4.57%-vs-5% discrepancy gives
    LR_pof ~ 0.049 (p ~ 0.82). The earlier wording called that "nothing" -- FALSE
    COMFORT. `backtest_reference_sample_size`'s normalization rescales EVERY departure
    from nominal coverage uniformly, whatever causes it: a GENUINE coverage defect of
    the identical magnitude (a generator whose true exceedance rate differs from 5% by
    the same ~0.43 percentage points the warm-up produces, for a reason that has nothing
    to do with warm-up) yields the exact SAME LR_pof ~ 0.049. So "0.049 is nothing" is
    not a property of the warm-up bias being small -- it is a property of 0.43pp being
    small relative to a one-path reference sample's power, and that property applies
    equally to a real defect of the same size. The honest statement is: THE WARM-UP BIAS
    IS A FIXED ~0.43-PERCENTAGE-POINT OFFSET IN p_hat (4.57% observed vs 5% nominal
    under a perfect generator) THAT EVERY SEALED THRESHOLD ON
    `kupiec_pof_chi2_tail_1path` MUST ACCOMMODATE -- and because any threshold loose
    enough to admit a perfect generator's own 4.57% is, by the same normalization, at
    least that loose for a genuine miscalibration of comparable size, the bias SETS A
    FLOOR ON THE SMALLEST REAL COVERAGE ERROR THIS BACKTEST FAMILY CAN DETECT for
    `momentum` and the other rule-based strategies. Under the pre-fix pooled sample size
    of 120,000 the SAME bias gave LR_pof ~ 49 -- a confident rejection of a correct
    generator, the opposite failure mode. `sixty_forty`/`carry` warm up for month 0 only
    (~0.7pp) and are far less affected either way. WP2.3 must accept this explicitly --
    setting no threshold tighter than the floor allows -- or amend the momentum
    lookback/path length; this paragraph records a decision to be made, not a
    demonstration that the bias may be ignored.

  backtest_reference_sample_size: >-
    THE POOLED SAMPLE SIZE OF EVERY D4 BACKTEST STATISTIC IS FIXED IN THIS FILE, NOT
    CHOSEN BY THE GENERATOR. Applies to all six Kupiec/Christoffersen names
    (`kupiec_pof_lr_1path`/`_chi2_tail_1path`,
    `christoffersen_independence_lr_1path`/`_chi2_tail_1path`,
    `christoffersen_conditional_coverage_lr_1path`/`_chi2_tail_1path` -- renamed by
    WP2.2 Task 4 fix pass 2, BLOCKING 1, from `..._stat`/`..._pvalue`: the second of each
    pair is a chi-square TAIL of a one-path-normalized statistic, and the paragraph below
    explicitly denies it is a significance level, so `_pvalue` was a name whose only
    justification was the reading this file itself rejects). Added by WP2.2 Task 4's fix
    pass, which found the previous definition gameable on the `n_paths` axis.
    THE PROBLEM. Both likelihood-ratio statistics are exactly LINEAR in their sufficient
    counts at fixed estimated proportions: Kupiec's is 2 * T * KL(p_hat || alpha) and
    Christoffersen's is 2 * N times a function of the three transition ratios alone.
    Pooling an ensemble's n_paths * months observations therefore multiplied both by
    n_paths, so HALVING THE ENSEMBLE HALVED THE STATISTIC AND RAISED THE P-VALUE:
    running 100 paths instead of 1024 let `kupiec_pof_chi2_tail_1path` clear a
    `min: 0.01` floor that the full ensemble would have failed. That is "the metric
    improves when the generator produces less", on four sealed names.
    THE DEFINITION, PINNED ON BOTH AXES (WP2.2 Task 4 fix pass 2, BLOCKING 2 / NEW-1
    corrects the second). Counts are still pooled across the whole ensemble -- that is
    what estimates p_hat and the transition ratios precisely -- and the reported
    statistic is then re-expressed at a REFERENCE SAMPLE SIZE OF ONE 120-MONTH PATH:
    T = 120 (`ah.eval.metrics.tails.BACKTEST_REFERENCE_MONTHS`) for Kupiec, N = 119
    transitions for Christoffersen -- A SEALED CONSTANT, NOT the judged ensemble's own
    `months`. The first fix pass re-expressed at "months", which closed the `n_paths`
    gameability but reopened the IDENTICAL failure on the `months` axis: because
    `reference_n` was read off the generated ensemble itself, a 60-month ensemble
    reported HALF the statistic (LR 3.84 -> 1.92, moving the tail from 0.05 to 0.17) that
    a 120-month ensemble with the SAME exceedance rate reported -- "the metric improves
    when the generator produces less" had moved from the `n_paths` axis to the `months`
    axis, not closed. Pinning T at the fixed constant 120 (matching this platform's
    standard production path length) closes it on both axes: the reported number is "the
    LR a SINGLE 120-month reference path would have produced, had it exhibited the
    exceedance rate and transition ratios the whole ensemble exhibits", invariant to
    n_paths AND to the ensemble's own path length, by construction.
    WHAT THE REPORTED P-VALUE THEN MEANS, stated because the metric name does not say
    it. `..._chi2_tail_1path` remains chi2_sf of the reported statistic, so it is that
    single 120-month reference path's p-value: an EFFECT SIZE on a p-value scale, NOT an
    asymptotically valid significance level at the pooled sample size, and NOT an
    asymptotically valid significance level at the judged ensemble's own path length
    either. This is deliberate. At n_paths = 1024 the pooled statistic rejects
    essentially any departure from nominal coverage however economically negligible,
    which makes a sealed threshold on it a statement about ensemble size rather than
    about tail fidelity. The rejected alternative was replacing the p-value with a
    coverage band on p_hat (`kupiec_exceedance_rate` = p_hat judged against a band
    directly, rather than through a chi-square tail at all), which would have changed
    six sealed metric names' MEANING rather than their scale -- WP2.3 may prefer it for
    exactly that reason (more honest, at the cost of redefining rather than merely
    renaming); see governance/retrofit-register.md for the option, recorded rather than
    built here.

  nan_metric_rule: >-
    A METRIC THAT EVALUATES TO NaN FAILS. One rule for the whole platform: an
    uncomputable metric has not demonstrated compliance, so it does not pass -- and it
    fails even against a threshold that declares no bounds at all, which a
    comparison-only implementation gets wrong (every comparison with NaN is false, so
    an unbounded threshold would vacuously "pass"). Both judging modules implement this
    identically and are tested on it: ah.eval.battery._passed and
    ah.battery.report.evaluate. Before WP2.2 Task 1's fix pass the two disagreed -- the
    Step-0 module treated NaN as a pass, the Step-2 module as a failure -- and both are
    inside this seal, so the same generator could have been judged either way depending
    on which battery ran.

  # --------------------------------------------------------------------------- #
  # Metric estimator conventions (WP2.2 Task 2 and its fix pass). Sealed here because
  # a band is meaningless without the estimator that produced it: two defensible
  # estimators of "the ACF decay rate" give materially different numbers on the same
  # data, and after the seal a change to any of the statements below is a dated,
  # post-hoc-flagged amendment.
  # --------------------------------------------------------------------------- #
  acf_estimator: >-
    ONE ACF CONVENTION for the whole platform: the Box-Jenkins sample autocorrelation
    with the OVERALL SAMPLE MEAN and an n-DENOMINATOR -- acf_k = gamma_k / gamma_0 with
    gamma_k = (1/n) * sum_{t=1..n-k} (x_t - xbar)(x_{t+k} - xbar) and gamma_0 =
    (1/n) * sum_t (x_t - xbar)^2. NOT numpy.corrcoef's pairwise-mean, (n-1)-denominator
    estimator; the two agree asymptotically but not at finite n. `acf_r_lag{k}` applies
    it to the raw series (k = 1..5); `acf_abs_lag{k}` applies it to |x - mean(x)|, the
    volatility proxy, (k = 1..24). Implemented once, in ah.eval.reference, and reused by
    the metric suite -- never restated.
  estimator_length_matching: >-
    THE ESTIMATOR IS LENGTH-DEPENDENT, AND BOTH SIDES OF EVERY BAND ARE MATCHED ON IT.
    The n-denominator convention above carries a finite-sample bias that is a function
    of the series length: the (n-k)/n shrinkage alone is ~20% at lag 24 on a 120-month
    generated path against ~2% on the ~1100-month historical series, and the
    mean-subtraction term is larger still for a persistent process. A reference band
    drawn at history's length is therefore NOT a criterion a short-path generator can
    satisfy even by reproducing history exactly -- the gap is an artifact of the
    estimator, not evidence about the generator. Every reference band is therefore drawn
    BY DEFAULT with `resample_length` equal to the judged ensemble's own path length:
    each moving-block bootstrap replicate carries that many months, drawn from the full
    train+validation sample, so both sides carry the identical bias.
    THIS IS A DEFAULT, NOT A BLANKET RULE (WP2.2 Task 4 fix pass 2, MINOR 6 -- an
    earlier version of this paragraph stated it as if it held everywhere). FOUR
    REGISTERED STATISTICS DEPART FROM IT (`length_matched=False` on their own
    registration record; CLAIMS-SWEEP CORRECTION -- this count read "THREE" while the
    sentence itself named four, and four registration records carry the flag:
    `lost_decade_frequency`, `long_inflation_era_frequency`, `tail_dependence_lower`
    and `tail_dependence_upper`. The list was never wrong; only this count of it was,
    the identical defect the twelve-vs-eleven correction in
    `structurally_unavailable_statistics` records. Counted, not estimated:
    `tests/test_prereg.py::test_the_sealed_length_matching_exception_count_is_the_registered_count`
    asserts it against the live registries in both directions):
    `lost_decade_frequency` and `long_inflation_era_frequency`
    (see their own `..._estimator` blocks below for why a 120-month replicate would make
    every replicate value 0.0 or 1.0), and `tail_dependence_lower`/`tail_dependence_upper`
    (see `tail_dependence_estimator` below -- at the production `resample_length` of 120
    the tail-observation floor was never met and every replicate was NaN). Every other
    registered statistic follows the default stated above. CONSEQUENCE, stated
    because it looks like a defect otherwise: a length-matched band's `point` (the
    statistic on all of history) is NOT expected to lie inside its own [lo, hi]. The
    rejected alternative was an (n-k) denominator, which would have to change every ACF
    in the platform at once and still corrects only the shrinkage term, leaving the
    mean-subtraction bias intact and still length-dependent.
    RESIDUAL, NOT COVERED: length matching is applied uniformly at the PATH length,
    which is right for the per-path statistics (every ACF, the decay, the leverage
    correlation) and wrong for the POOLED ones -- skew, excess_kurtosis, the Hill
    indices, the aggregational-Gaussianity kurtoses and crisis_corr_lift are computed by
    the metric suite over n_paths * months pooled observations while a replicate carries
    only months, and all of those estimators are small-sample biased. Their bands are
    conservatively wide and their bias is unmatched. See
    governance/retrofit-register.md RFR-15: WP2.3 must decide before sealing a band over
    any pooled statistic.
    ALSO NOT AUTOMATIC: a moving-block bootstrap preserves a lag-k relationship only for
    the pairs inside one block, keeping a (b-k)/b share of them, so the block length
    must comfortably exceed the longest judged lag (24) while still cutting history into
    enough blocks for a percentile band. The sealed default is 120 months
    (ah.eval.reference.DEFAULT_BLOCK_LENGTH); at the previous default of 24 every
    long-lag band was an artifact of the resampling rather than a statement about
    history.
    SCOPE OF THE (b-k)/b RULE (Minor 8, WP2.2 Task 2 fix pass 2): it governs the number
    of BLOCKS a replicate is stitched from, which only matters when a replicate spans
    more than one block. At production defaults (block_length=120,
    resample_length=ensemble.months <= 120), ceil(resample_length/block_length) = 1:
    every replicate IS a single contiguous block, so there is no seam at all and the
    band is an ordinary subsampling distribution, not a moving-block one -- statistically
    fine, but the seam-shrinkage argument above does not bind on this, the length-matched
    PRODUCTION path. It governs only the UNMATCHED path (resample_length unset, replicates
    built from the full ~1100-month history, where spanning multiple blocks is normal).
  acf_abs_decay_estimator: >-
    `acf_abs_decay` is the rate of the exponential value ~= A * exp(-rate * lag) fitted
    to the 24-point curve (acf_abs_lag1 .. acf_abs_lag24) BY ORDINARY LEAST SQUARES ON
    THE VALUES THEMSELVES, not in log space. For a fixed rate the amplitude has the
    closed form A*(rate) = sum_k v_k e_k / sum_k e_k^2 with e_k = exp(-rate * lag_k), so
    the fit reduces to a one-dimensional minimization of the profiled sum of squares:
    241 equally spaced grid points across rate in [-1.0, 5.0], then golden-section
    search within the bracketing interval to an interval width of 1e-10 (at most 200
    iterations). Deterministic, no RNG, no optimizer dependency. rate > 0 is decay;
    rate < 0 is growth and is reported signed, never floored at zero. NaN only for fewer
    than two lags, a non-finite value, or an all-zero curve.
    WHY LEVELS, NOT LOG SPACE: a log-space fit needs value > 0, and dropping the
    non-positive values is a ONE-SIDED SELECTION -- at lags where the true
    autocorrelation is ~0 only upward noise survives the filter, lifting the fitted tail
    and biasing the rate downward, worst exactly where a volatility-clustering curve is
    most informative. Clamping trades one bias for another. The levels fit consumes
    every lag whatever its sign, so no selection happens at all.
    WHY AN EXPONENTIAL AT ALL, given that the canonical stylized fact (Cont 2001) is a
    slow POWER-LAW decay of ACF(|r|): the number is read only as a comparative summary
    against the same estimator applied to reference replicates of the same length over
    the same fixed lag window, never as a claim about the true functional form; a
    log-log power-law fit is not a neutral alternative (equally misspecified if the truth
    is nearer exponential, and its log-spaced abscissa weights the first four lags more
    heavily still); and the long-memory information an exponential summary compresses
    away is not lost, because every acf_abs_lag{k} for k = 1..24 is separately registered
    and separately banded, so "slow decay" versus "fast decay with high short-memory
    persistence" is discriminated by the lag-24 band rather than by this number.
    RESIDUAL BIAS: a levels fit weights absolute residuals equally, so the large low-lag
    values dominate and the rate summarizes the curve's early decay more than its tail.
    Ensemble-side, the rate is fitted PER PATH and averaged (never fitted to a
    path-averaged curve, which is a materially less biased and therefore NON-comparable
    functional than the single-series estimator the reference band is built from).
    CENSORED AT THE SEARCH BOUNDS (Minor 8, WP2.2 Task 2 fix pass 2): a curve decaying
    genuinely faster than exp(-5.0 * lag) cannot be represented within the sealed
    [-1.0, 5.0] domain -- the profiled SSE keeps improving to the boundary and the fit
    returns approximately the bound itself (~5.0), NOT NaN. Not a correctness bug (both
    the ensemble side and the reference side censor identically, under the same
    estimator, so the comparison stays apples to apples), but a fact about the estimator
    that belongs in this definition rather than being discovered as a surprise cluster
    of values at 5.0.
  hill_tail_index_estimator: >-
    LEFT tail (losses), Hill (1975) ratio form. Losses are -x, sorted descending
    L_(1) >= ... >= L_(n); with k = max(1, round(tail_fraction * n)) and the (k+1)-th
    order statistic as threshold, alpha_hat = ( (1/k) * sum_{i=1..k} ln(L_(i)/L_(k+1)) )
    ^ -1. Registered at tail_fraction 0.05 and 0.01. A SMALLER alpha_hat is a FATTER
    tail. NaN -- never a number computed from the wrong side -- when n < k+1, when any of
    the top k+1 losses is <= 0, or when the mean log-ratio is <= 0. CONSEQUENCE: a level
    factor (a rate, a spread, an index) is normally all-positive and so reports NaN by
    construction; the Hill tail index of a level is not a meaningful quantity and NaN is
    the honest answer.
  agg_gaussianity_estimator: >-
    Excess kurtosis (the same m4/m2^2 - 3 population definition as `excess_kurtosis`) of
    NON-OVERLAPPING horizon-month sums, the partial tail dropped, computed within each
    path and then pooled across paths. Registered at horizons 3 and 12 months only:
    horizon 1 is the identity aggregation and is EXACTLY `excess_kurtosis`, so
    registering it again would put two sealed names and two thresholds on one number.
    The stylized fact is the ORDERING -- excess kurtosis decaying toward 0 as the horizon
    grows -- read with `excess_kurtosis` as its h=1 anchor. NaN below 30 pooled sums: the
    sample excess kurtosis of n draws has standard error ~sqrt(24/n), which is 0.9 at
    n = 30 and 2.4 at n = 4, so below that floor the number carries no information about
    the effect it exists to detect.
  leverage_correlation_estimator: >-
    corr(r_t, |r_{t+1} - mean(r)|) within one path, LAG 1 MONTH, Pearson. The volatility
    proxy is the same |x - mean(x)| used by `acf_abs_lag{k}` -- not a third,
    independently invented proxy. Negative is the classical leverage effect (a down
    month followed by higher realized volatility). NaN for a path shorter than 3 months.
  cross_block_corr_matrix_distance_estimator: >-
    FROBENIUS NORM of the entrywise difference between the generated ensemble's
    cross-block correlation matrix and the reference's, sqrt(sum((a-b)^2)), over exactly
    the factor axis that reference.py computes a cross-block `correlation` for. Chosen
    over the Herdin et al. normalized correlation-matrix distance because both matrices
    are already on the same bounded [-1, 1] scale, so no normalization is needed to make
    them comparable. Its value on history is identically zero (history's distance to
    itself), so it is registered in PANEL_STATS with no historical band and its threshold
    is an ABSOLUTE BOUND, not a band. WITHIN-BLOCK PAIRS ARE NOT COVERED -- reference.py
    registers no within-block pairwise correlation statistic to be a distance to
    (governance/retrofit-register.md RFR-14) -- which is why the metric carries the
    qualified name rather than a bare `corr_matrix_distance` that would overstate it.
    CONSEQUENCE: a single degenerate factor (zero pooled variance) makes its own
    correlation entries NaN and so NaNs this whole panel-level metric. That is correct
    under nan_metric_rule below; it is deliberately not softened by dropping the
    offending row, because silently shrinking the matrix would change WHICH pairs the
    sealed distance is a distance over, run to run. THE SAME RULE APPLIES TO A COVERED
    FACTOR A GENERATOR SIMPLY OMITS (WP2.2 Task 2 fix pass 2, Important 1): the matrix
    axis is fixed by the reference's covered factor set, never re-intersected with
    whatever the ensemble happens to emit, so an omitted factor NaNs the metric
    identically to a degenerate one rather than shrinking the matrix to a smaller,
    easier-to-satisfy distance. Without this, generating less was a way to pass an
    absolute-bound threshold more easily, not a way to fail it.

  # --------------------------------------------------------------------------- #
  # WP2.2 Task 3 (and its fix pass) estimator definitions. Task 2 established that
  # every registered statistic gets a `conventions.<name>_estimator` prose block
  # precisely so a band is reconstructible from this file alone; Task 3 shipped eight
  # estimators with none, leaving the constants that change the numbers
  # (VARIANCE_RATIO_MIN_SUMS, DRAWDOWN_MIN_EPISODES, LONG_INFLATION_MIN_RUN_MONTHS,
  # the 120-month decade window, nominal-not-real) living only in reference.py.
  # `tests/test_prereg.py::test_every_registered_statistic_has_an_estimator_definition`
  # is the machine check that no future statistic can be registered without one.
  # --------------------------------------------------------------------------- #
  elementary_moment_estimators: >-
    POPULATION (not sample-corrected) moments throughout, computed with numpy on the
    pooled or per-path array the metric suite hands over. `mean` = sum(x)/n; `std` =
    sqrt(sum((x - xbar)^2)/(n-1)), the (n-1) SAMPLE standard deviation (numpy ddof=1),
    NaN for n < 2. CORRECTION, WP2.2c Item 1: this sentence previously read
    "sqrt(sum((x - xbar)^2)/n), the n-denominator form (numpy's default ddof=0), NOT the
    (n-1) sample standard deviation" -- which is not, and never was, what
    ah.eval.reference._std computes (it has passed ddof=1 since WP2.2 Task 2). The text
    was wrong, not the code; both the reference band and the metric call that one
    function, so no number moves, but the sealed statement described an estimator the
    platform does not use. It went unnoticed for as long as it did precisely because no
    metric suite emitted `std` -- the statement judged nothing. Item 1 makes it
    load-bearing, so it is corrected here rather than sealed wrong.
    `skew` = m3 / m2^1.5 and `excess_kurtosis` =
    m4 / m2^2 - 3 with m_k = (1/n) * sum((x - xbar)^k) -- the population definitions, so
    neither carries the Fisher-Pearson small-sample correction that scipy.stats applies
    by default and the two must never be compared against a scipy-computed figure.
    `correlation` (cross-block) is the ordinary Pearson product-moment correlation,
    NaN when either leg has fewer than 2 observations or zero standard deviation.
    NOTE ON ddof, stated because it is not uniform across this file: `std` and the two
    variances inside `variance_ratio` use ddof=1; `skew`/`excess_kurtosis` use the
    population (ddof=0-equivalent) central moments. Both are stated rather than assumed
    because a band computed under one convention is not comparable to a value computed
    under the other.
    ENSEMBLE-SIDE POOLING FOR THE THREE STATISTICS EMITTED BY WP2.2c ITEM 1, stated
    because the choice is not the one order-independence alone would suggest.
    `<factor>.mean` and `<factor>.std` are computed PER PATH and averaged over paths,
    not over the pooled (path, month) population. The reference band for each is the
    sampling distribution of the statistic applied to ONE series of the ensemble's own
    path length, so the ensemble side must apply the same single-series functional --
    the identical rule acf_abs_decay_estimator already states. Pooling would fold the
    between-path dispersion of the path means into `std`, a quantity no reference
    replicate contains an analogue of, so a generator with correct within-path
    volatility but heterogeneous path means would read as too volatile. (`mean` is
    numerically identical under both conventions at equal path lengths; it follows the
    per-path one so the pair cannot drift apart.) Consequence: both are exempt from the
    pooled-statistic residual estimator_length_matching records -- they are matched to
    their bands in sample size AND in bias. `<a>~<b>.correlation` is POOLED, matching
    its sibling crisis_corr_lift in the same CROSS_BLOCK_STATS registry: a
    contemporaneous joint-marginal statistic references no previous observation, so
    pooling legitimately enlarges the sample, and it inherits the pooled residual.
    WHAT correlation CAN AND CANNOT CATCH: a Pearson correlation is invariant to a
    positive affine transform of either leg, so it is blind BY CONSTRUCTION to a
    location/scale drift and contributes nothing to that detection; it exists to catch a
    generator that breaks cross-block co-movement, which `cross_block_corr_matrix_distance`
    aggregates into one Frobenius number in which two offsetting per-pair errors cancel.
  acf_sum_estimator: >-
    CUMULATIVE ACF OVER A FIXED LAG WINDOW -- the Box-Pierce construction WITHOUT its n
    scaling, so it is a summary statistic and not a test statistic. acf_r_sum =
    sum_{k=1..5} rho_r(k); acf_abs_sum = sum_{k=1..24} rho_|r|(k), with rho computed by
    acf_estimator's convention (overall mean, n-denominator) over exactly the lags the
    acf_r_lag{k}/acf_abs_lag{k} statistics report individually. Per path, then averaged
    over paths, like every other time-ordered statistic in the monthly suite. NaN if ANY
    lag in the window is NaN -- never a partial sum over whichever lags happened to be
    computable, because a sum over a silently-varying number of terms is not comparable
    to its own band. length_matched=True: the per-lag estimator is length-biased, so the
    sum is too, and both sides must be evaluated at the same length.
    WHY THESE EXIST BESIDE THE PER-LAG FAMILY THEY SUM (WP2.2c Item 3): a per-lag band
    at a 120-month path length is wide (a lag-24 autocorrelation from 120 observations
    has SE ~0.09), so each comparison individually has little power and an aggregate
    over the COMPARISONS aggregates the noise with the signal -- measured, a control
    that destroys serial dependence outright left only 0.367 of 403 per-lag comparisons
    outside their bands. Summing the VALUES first pools the signal (24 lags of a
    persistent series contribute in one direction while their estimation errors partly
    cancel) and moves the same control to 0.615. The per-lag statistics remain
    separately registered, banded and reported; the sums are what carry a gate.
  band_exceedance_gate_estimator: >-
    THE FRACTION OF ONE FAMILY OF PER-FACTOR BAND COMPARISONS THAT FELL OUTSIDE ITS OWN
    TRAIN+VALIDATION BAND. Three families, defined in
    ah.eval.metrics.monthly.BAND_EXCEEDANCE_FAMILIES: moment (mean, std), tail (skew,
    excess_kurtosis, hill_tail_index_5pct/1pct, agg_gaussianity_3m/12m), dependence
    (acf_r_sum, acf_abs_sum, acf_abs_decay). For every active factor and every statistic
    in the family, the metric value THIS SAME SUITE reports is compared against the same
    StatBand the report renders beside it -- no estimator is restated and no second
    lookup path exists. A comparison is judged only where the band is USABLE
    (ah.eval.battery.band_is_usable: a band exists, its bounds are finite, and it is not
    zero-width); unusable bands leave both the numerator and the denominator. A NaN
    metric value with a usable band COUNTS AS AN EXCEEDANCE, per nan_metric_rule: a
    factor the ensemble simply omits is a failure, not an abstention, and "generating
    less" must never improve a metric. A family with no usable band at all is NaN, never
    a favourable 0.
    WHY AN AGGREGATE AND NOT A PER-NAME BAND GATE: a level-0.9 band has a 10% miss rate
    by construction and this tier makes ~570 comparisons, so gating each name at enforce
    rejects a PERFECT generator with probability indistinguishable from 1. The
    multiple-comparison structure belongs inside the metric, not ignored by it.
    THE BOUND (0.5, all three) is derived from this file's own sealed band `level` and a
    majority rule, and from nothing else: under the null E[fraction] <= 1 - level = 0.10,
    so Markov gives P(fraction > 0.5) <= 0.2 under ARBITRARY dependence between the
    comparisons, and Hoeffding over the ~13 effectively-independent factor units gives
    the same 0.5 at exp(-2*13*0.4^2) ~= 1.56% family-wise error rate (not the ~1% this
    file previously stated -- corrected in WP2.2c's honesty fix pass; the qualitative
    conclusion, that Hoeffding independently supports the same 0.5 bound Markov gives
    with room to spare, is unchanged). No control's measured value was consulted to
    choose it. See each threshold entry for the per-metric severity decision and its
    evidence.
    THE FAMILY MEMBERSHIP IS ALSO A REAL DEGREE OF FREEDOM, DISCLOSED HERE RATHER THAN
    LEFT IMPLICIT (WP2.2c honesty fix pass, Critical 1). The three families are a
    location/scale ("moment") vs shape ("tail") vs dependence taxonomy, defensible ex
    ante but not the only defensible one: `skew` is the third STANDARDIZED moment and
    is affine-invariant exactly like `mean`/`std`, so classing it with the tail
    statistics rather than the moment ones is a taxonomic choice, not a derivation, and
    it is outcome-determining. Measured at a real run against `factors.yaml` (seed
    4242): `nc3-shifted-bootstrap`'s `moment_band_exceedance_fraction` is 17/26 = 0.654
    (FAILS the 0.5 bound) as shipped; moving `skew` into the moment family gives
    19/39 = 0.487 (PASSES); adding `excess_kurtosis` too gives 22/52 = 0.423 (PASSES).
    Four comparisons out of 26 separate a fail from a pass on the taxonomy alone, on the
    control this gate's headline result rests on. This is NOT a finding that the
    taxonomy was fitted to the controls -- ah.eval.metrics.monthly.BAND_EXCEEDANCE_
    FAMILIES was written before this counterfactual was measured, and the location/
    scale-vs-shape-vs-dependence split is the ordinary statistical one -- but a sealed
    degree of freedom with a 4-comparison margin and a verdict-reversing alternative
    reading must be named, not merely exercised silently. A reader who classes `skew` as
    a moment rather than a shape statistic will reasonably disagree with the grouping
    shipped here, and is entitled to read this paragraph as the reason the disagreement
    is visible rather than buried.
    THE CONTROLS INFORMED THIS GATE'S DESIGN, WHICH MEANS THEY ARE NO LONGER INDEPENDENT
    EVIDENCE OF IT (WP2.2c honesty fix pass, Important 3). Three constructions of the
    dependence gate were measured against the five negative controls and the separating
    one was kept: the per-lag aggregate (403 comparisons, NC1 0.367/NC2 0.377, no
    separation from a majority bound), a two-stage majority-of-factors-by-majority-of-
    lags variant (0.077 for both NC1 and NC5, worse), and the acf_r_sum/acf_abs_sum
    construction actually sealed (NC1 0.615, NC2 0.718). The statistical argument for a
    Box-Pierce-style sum over a set of noisy per-lag comparisons is standard, and no
    bound was moved to fit a control -- but the honest statement, made nowhere before
    this paragraph, is that for these three gates the negative controls are NOT
    independent evidence that the gate design works: they were the evidence used to
    choose among candidate designs, and a design that failed to separate them was
    rejected before this file was sealed. Measured counterfactual: including the 403
    per-lag comparisons ALONGSIDE the two sums and the decay rate in one family gives
    NC1 0.389 -- UNCAUGHT at the sealed 0.5 bound. Nobody should later cite "catches 4 of
    5 negative controls" as independent validation of the gate DESIGN, as opposed to
    validation that the sealed bound (0.5, derived from `level` and never moved) is not
    trivially satisfied by these five constructions. The first genuinely independent
    test of this gate design is `bootstrap-v1` (WP2.4) -- a generator not used to choose
    among candidate statistics. This paragraph is the source material
    `G2-EVIDENCE.md` must draw from when it is written; see
    `governance/retrofit-register.md` for the tracking row.
  crisis_corr_lift_estimator: >-
    corr(a[crisis], b[crisis]) - corr(a, b), where `a` is the block-A factor, the
    threshold is the 10th PERCENTILE of `a` over the aligned sample, and the crisis
    subset is every co-dated observation with a <= threshold (a's worst decile by
    value -- for a return-bearing factor, its worst-loss months). A positive lift means
    A and B co-move more strongly in A's worst months than on average, which is the
    crisis-co-movement failure mode this statistic exists to catch. NaN if the crisis
    subset has fewer than 2 observations or either leg is degenerate within it.
  variance_ratio_estimator: >-
    Var(NON-OVERLAPPING k-month sums, ddof=1) / (k * Var(raw monthly values, ddof=1)),
    registered at k = 12, 36, 60, 120 months. Exactly 1.0 in expectation under an iid
    null, > 1 under positive serial correlation, < 1 under mean reversion.
    NON-OVERLAPPING sums, and the partial tail is dropped: overlapping k-month sums are
    the classical Lo-MacKinlay form and have smaller sampling variance, but they induce
    a (k-1)/k share of shared observations between neighbouring sums, which is itself a
    manufactured serial dependence -- exactly the artifact this statistic exists to
    detect rather than to create. NO small-sample or heteroskedasticity-robust
    correction is applied: this reports the ratio itself, a description, not a signed
    test statistic. NaN below 10 non-overlapping sums (VARIANCE_RATIO_MIN_SUMS: a
    variance's relative standard error is ~sqrt(2/n), ~45% at n=10 -- noisy but not
    meaningless, unlike the fourth-moment floor of 30 above) or below 2 raw values, or
    if the raw variance is exactly zero.
    ENSEMBLE SIDE: sums are formed independently WITHIN each path and then pooled by
    concatenation across paths, and the ratio is taken ONCE over the pooled arrays --
    never a per-path ratio averaged. RFR-15's pooled-statistic length mismatch applies.
    CONSEQUENCE AT k=120, stated because it looks like a defect otherwise: the
    reference band needs >= 10 non-overlapping 120-month sums, i.e. >= 1200 months
    (100 years) of history -- at or beyond what even this platform's longest series
    provide -- so `variance_ratio_120m`'s historical band is NaN in practice. The
    ensemble side is still computable (pooling across paths supplies the sums), so the
    metric reports a value with no band to judge it against. WP2.3 must not seal an
    `enforce` band on it without noticing that.
  mean_reversion_halflife_estimator: >-
    ln(0.5) / ln(|phi|) months, with phi the lag-1 sample autocorrelation under
    `acf_estimator` above -- the ALREADY-REGISTERED estimator, not a second,
    independently fitted OLS AR(1) coefficient (for an AR(1) process the population
    lag-1 autocorrelation IS phi, so this is a correct fit rather than an
    approximation). The MAGNITUDE |phi| drives the decay, not signed phi, so an
    oscillating-but-decaying process (-1 < phi < 0) still gets a finite, meaningful
    half-life instead of the log of a negative number. DECIDED BOUNDARIES: |phi| >= 1
    returns +inf ("never reverts", meaningfully different from "uncomputable", and a
    reader scanning for a persistence problem should see an explicit infinity, not a
    blank cell); phi == 0 returns 0.0 (the limit of ln(0.5)/ln(m) as m -> 0); phi NaN
    returns NaN. ENSEMBLE SIDE: fitted PER PATH and averaged -- an AR(1) half-life is a
    property of one path's own time-ordered series, and concatenating paths first would
    manufacture a lag-1 relationship at every path seam.
  drawdown_episode_estimator: >-
    An EPISODE is a maximal run of consecutive months whose running drawdown is < 0,
    where running drawdown is wealth/cummax(wealth) - 1 with wealth = cumprod(1 + r)
    (ah.data.derive.drawdown_state, reused not reimplemented). A month at exactly 0.0
    (a new high) ends the episode. `depth` is the positive magnitude of the episode's
    trough; `duration` is its length in months. An episode still open at the series'
    final observation IS counted, ending there -- a stated property of a finite window.
    Three separately registered scalar summaries, not a distribution object:
    `drawdown_median_depth`, `drawdown_median_duration` (medians over the pooled
    episode arrays) and `drawdown_depth_duration_rank_corr` (Spearman rank correlation
    = Pearson correlation of average ranks, ties averaged; no scipy).
    FLOOR: NaN below 10 pooled episodes (DRAWDOWN_MIN_EPISODES). Without it a generator
    whose paths mostly never draw down contributes no episodes from those paths and is
    scored on the minority that did -- a median from a single pooled episode was legal,
    so generating fewer drawdowns made the median shallower instead of failing the
    metric. 10 matches VARIANCE_RATIO_MIN_SUMS: a sample median's asymptotic standard
    error is ~1.25*sigma/sqrt(n), ~40% of a standard deviation at n=10.
    OVERFLOW IS NaN, NOT "NO DRAWDOWNS": if compounding overflows, wealth/cummax is
    inf/inf = NaN and NaN < 0.0 is False, which under the episode rule reads as "at a
    new high" -- so an overflowed path used to report ZERO episodes, the favourable
    answer, and then vanish from the pooled concatenation. Any non-finite running
    drawdown now yields one NaN episode, which NaNs every summary that reads it.
    RESTRICTED to conventions.return_bearing_factors on the ensemble side: compounding
    a LEVEL series (a rate, a spread, an index) via (1+level).cumprod() is not merely
    uninformative, it is numerically wrong.
    ENSEMBLE SIDE: episodes are extracted independently WITHIN each path (never
    spanning a path boundary) and pooled by concatenation; RFR-15 applies.
  lost_decade_frequency_estimator: >-
    The FRACTION of the input series' own OVERLAPPING 120-month windows (stride 1
    month) whose compounded total return, prod(1 + r) - 1, is <= 0.0. NaN if the series
    is shorter than 120 months (a decade is the unit of the statistic; a value from a
    shorter window is a different quantity) or if any window's compounded value is
    non-finite -- an overflowed product is NaN, never the favourable "not a lost
    decade" answer that inf <= 0 -> False used to give.
    OVERLAPPING here, NON-OVERLAPPING in variance_ratio above, and the two are
    consistent rather than contradictory: overlapping SUMS manufacture serial
    dependence in the very variance a variance ratio measures, whereas this statistic
    is a MEAN OF INDICATORS, for which overlap introduces no bias in the estimated
    marginal probability and costs only effective sample size -- which is the band's
    job to report, not the point estimate's. Calendar-aligned non-overlapping decades
    would rest the whole statistic on ~9 windows and on an arbitrary tiling phase.
    NOMINAL, NOT REAL (CPI-deflated). "Lost decade" is classically a real-return
    concept; this statistic is registered in SINGLE_FACTOR_STATS, whose reference-side
    function is applied to exactly ONE factor's own column, so no CPI series is
    reachable from it. A deflated version needs a joint equity+CPI reference
    computation. Recorded as governance/retrofit-register.md RFR-21 for WP2.3: seal the
    nominal version as a stated limitation, or build the joint deflated one first.
    NOT LENGTH-MATCHED (see estimator_length_matching for the default this departs
    from): a 120-month replicate holds exactly ONE window, which makes every replicate
    value 0.0 or 1.0 and the percentile band either [0, 1] (admits everything) or
    [0, 0] / [1, 1] (fails everything). Replicates are therefore drawn at the FULL
    train+validation length, recorded as `resample_length: null` on the band. That is
    the correct reading of length matching rather than an exception to it: matching
    exists because the ACF family's ESTIMATOR is biased by series length, whereas here
    the 120-month window fixes the length scale internally and identically on both
    sides, and the outer length changes only how many windows the frequency averages
    over -- i.e. its own sampling error, which is exactly what the band measures.
    CONSEQUENCE: the band is wide, reflecting history's ~9-14 effectively independent
    decades. That is DN-1.1 Sec.II.6's "wide-band consistency, honestly reported
    (n ~ 14)" for this tier, not a defect to be tightened away.
    ENSEMBLE SIDE: computed per path (one window per production-length path) and
    averaged, which IS the pooled frequency because every path is the same length.
  long_inflation_era_frequency_estimator: >-
    The FRACTION of the CPI LEVEL series' own overlapping 120-month windows that
    contain a sustained high-inflation era. An ERA is a run of >= 24 consecutive months
    (LONG_INFLATION_MIN_RUN_MONTHS -- long enough to distinguish a multi-year
    inflationary era from a single hot print, short enough to fit inside one generated
    decade) with year-on-year CPI inflation at or above the Step-1 regime ruleset's own
    `cpi_high` threshold (regime_ruleset_v1: 4.0 PERCENT; ah.data.derive.yoy returns
    percent, and the threshold is reused rather than independently re-chosen, so the
    number is traceable to that ruleset's version). The whole run must lie inside the
    window. NaN below 120 level months.
    WINDOWED ON THE LEVEL, NOT ON cpi_yoy: derive.yoy consumes the first 12 months of
    whatever it is given, so a 120-month LEVEL window holds 108 cpi_yoy months --
    ample for a 24-month run -- whereas windowing cpi_yoy at 120 would need 132 level
    months and make the statistic uncomputable on exactly the 120-month paths a
    generator produces.
    Registered for `cpi` only on the ensemble side: unlike the factor-agnostic
    mathematical statistics, this one is inherently ABOUT inflation, and running it on
    (say) equity_vol's level would not measure an inflation era.
    NOT LENGTH-MATCHED, for the identical reason given under
    lost_decade_frequency_estimator; the same wide-band consequence applies.
  ergodicity_gap_estimator: >-
    |mean(long_path) - mean(ensemble pooled)| / std(ensemble pooled, ddof=1): the
    discrepancy between the TIME average of one long single realization and the
    CROSS-SECTIONAL average of an ensemble of short paths, in units of the process's
    own pooled dispersion. This is DN-1.1 Sec.II.6's 10yr row read literally
    ("ergodicity (long-path vs ensemble stats)"). Under ergodicity the two averages
    converge to the same population mean and the gap -> 0 whatever the process's
    persistence; under genuine non-ergodicity (the ensemble mixing several long-run
    regimes while any one realization stays inside one forever) it stays bounded away
    from 0. FIRST MOMENTS ONLY -- a second-moment version would be a second registered
    name and is deliberately not registered.
    STRUCTURALLY UNAVAILABLE TODAY (governance/retrofit-register.md RFR-20):
    ah.eval.battery.run_battery is handed one Ensemble of production-length paths and
    no long path, and no generator exists yet to ask for one, so the metric is NaN for
    every generator and is MARKED `status: structurally_unavailable` in the report. The
    reference side is NaN too and always will be: history is one realization and there
    is no historical ENSEMBLE to compare it against.
    WHAT THIS REPLACED, recorded because it is the reason the definition changed before
    sealing: the first version compared Var(per-path time averages) against
    Var(pooled)/months. At the production path length that is algebraically
    |variance_ratio_120m - 1| -- two sealed names for one number, the duplication this
    file already refused when it dropped agg_gaussianity horizon 1 for being
    excess_kurtosis -- and its iid-within-path null made a perfectly ergodic stationary
    AR(1) with phi = 0.9 read as a gap of ~18, i.e. it would have failed a CORRECT
    generator of every persistent factor (ust_10y, cpi, hy_spread).
  regime_duration_estimator: >-
    The mean, median and 90th percentile of the length in months of consecutive runs of
    a single regime label, where labels come from ah.data.derive.label_regime under
    regime_ruleset_v1 (recorded on each metric's own `metadata` in the battery report,
    not only in code, because WP2.6 refits on these labels).
    STRUCTURALLY UNAVAILABLE TODAY (governance/retrofit-register.md RFR-17): label_regime
    needs five inputs (usrec, cpi_yoy, growth_yoy, drawdown, hy_oas); cpi, equity_mkt
    and hy_spread supply three, but `usrec` (fred.USREC) and `growth_yoy` (fred.INDPRO)
    are registered Step-1 catalog series with NO factor mapping in factors.yaml at all --
    DN-1.1 Sec.II.2's Layer-1 climate state variables, not yet generator-visible.
    Inventing a substitute value for the missing two would bias every classification
    toward whatever default was chosen, so all three metrics are NaN and MARKED
    `status: structurally_unavailable`.
  ten_year_return_vs_valuation_estimator: >-
    Ordinary least squares of forward 10-year return on starting valuation
    (`cape_v` = demeaned log CAPE, ah.data.derive.demeaned_log_cape), in closed form and
    with no scipy: slope = Sxy/Sxx, R^2 = 1 - SS_res/SS_tot, registered as two separate
    scalars `..._slope` and `..._r2`. (NaN, NaN) below 3 paired points or when cape_v is
    exactly constant; R^2 alone is NaN when the response is exactly constant.
    STRUCTURALLY UNAVAILABLE TODAY (governance/retrofit-register.md RFR-18): no
    valuation/CAPE factor exists in factors.yaml, though the raw shiller.cape series IS
    registered in requirements.yaml. NaN and MARKED `status: structurally_unavailable`;
    the estimator itself is built and tested against synthetic ground truth so it is
    ready the day a valuation factor lands.
  ten_year_tier_coverage: >-
    THE 10yr TIER IS 73% STRUCTURALLY UNAVAILABLE, AND THIS IS A DISCLAIMER, NOT A
    RESULT (WP2.2c Item 5). 16 of its 22 metrics carry status
    STRUCTURALLY_UNAVAILABLE and are NaN for every generator, always: 14
    `<factor>.ergodicity_gap` (one per active factor) and
    `ten_year_return_vs_valuation_{slope,r2}`. The three causes are all missing INPUTS,
    not missing code, and none can be closed by anything in this work package:
    (a) no valuation factor -- factors.yaml maps no CAPE / cyclically-adjusted earnings
    series, so the DN-1.1 Sec.II.6 "10y return vs starting valuation" row cannot be
    posed at all; (b) no recession or growth indicator (`usrec`, `growth_yoy`) for the
    regime-duration mapping; (c) `ergodicity_gap` compares one LONG path against the
    ensemble's cross-sectional moments and no generator in the platform emits a path
    longer than its horizon, so the statistic has no historical analog either
    (has_historical_analog=False -- its band is NaN by construction).
    CONSEQUENCE, STATED SO IT IS NOT READ AS A PASS: `nc2-shuffled`, whose time ordering
    is destroyed outright and which is DESIGNATED to this tier among others, produces
    ZERO substantive failures in it. The 10yr tier caught nothing in WP2.2b and catches
    nothing in WP2.2c. Every 10yr row in a battery report is either a NaN or one of the
    two decade-FREQUENCY statistics (lost_decade_frequency,
    long_inflation_era_frequency), which measure how often a decade-shaped event occurs
    and not decade DYNAMICS. NC2 is caught at enforce by the monthly tier instead; a
    generator whose decade-scale behaviour was wrong while its monthly behaviour was
    right would NOT be caught anywhere.
    WHO CLOSES IT: a valuation factor is a Step-1 data addition (a new
    requirements.yaml series plus a factors.yaml mapping, hence a block/factor amendment
    once sealed) -- recorded as governance/retrofit-register.md RFR-42, unowned today
    and NOT owned by WP2.3; the regime-duration inputs arrive with WP2.6, which fits the
    semi-Markov regime skeleton on Step-1 labels; `ergodicity_gap` needs a generator
    capability (emit a single multi-century path) that WP2.5's climate model could
    supply and no current generator does. WP2.3 must seal this tier as UNAVAILABLE
    rather than as a tier that passed, and G2-EVIDENCE.md must not cite a 10yr pass.
  mc_error_is_not_the_small_n_band: >-
    THE MONTE-CARLO ERROR AND THE REFERENCE BAND ANSWER DIFFERENT QUESTIONS, and only
    one of them is DN-1.1's n ~ 14. `ah.eval.battery.mc_error` is the batch-means
    standard error of a metric over the GENERATED ensemble's own paths: with 1024
    generated decades it is small by construction and says only "this generator's own
    sampling noise is small". It says nothing whatever about how uncertain HISTORY's
    value of the same statistic is, which -- at ~9-14 effectively independent historical
    decades for a 10yr-tier metric -- is the dominant uncertainty and the one DN-1.1
    Sec.II.6 means by "honestly reported (n ~ 14)". That uncertainty lives in the
    reference band, and `_require_mc_error_reported` (which enforces "bands or it didn't
    happen" for the 10yr tier) must not be read as having supplied it.

  # --------------------------------------------------------------------------- #
  # WP2.2 Task 4 estimator definitions: the D4-strategy-level tail backtests
  # (elicitability, Kupiec, Christoffersen, VaR/ES itself), cross-block tail
  # dependence, and the three utility-tier metrics. Same rule as every block above:
  # `tests/test_prereg.py::test_every_registered_statistic_has_an_estimator_definition`
  # requires one of these for every name in `ah.eval.reference.STRATEGY_STATS` /
  # the two new `CROSS_BLOCK_STATS` entries / the three new `PANEL_STATS` entries.
  # --------------------------------------------------------------------------- #
  d4_var_es_estimator: >-
    `var_95`/`es_95`/`var_99`/`es_99`, one set per D4 strategy (thresholds.strategies
    key `"<strategy_id>.var_95"` etc.), are the GENERATED ensemble's own realized
    historical VaR/ES on that strategy's pooled return path (all paths x all months
    flattened), computed by `ah.eval.metrics.tails.var_es` -- identically the estimator
    WP2.1b sealed (loss_sign above): losses are the negative of returns, VaR at level p
    is the p-quantile of the pooled loss distribution, ES at level p is the mean loss at
    or beyond VaR_p. Levels 0.95 and 0.99. Descriptive report metrics: the GENERATED
    ensemble's own tail risk, not compared against a historical band of their own (see
    elicitability_score_estimator below for the value that actually compares generated
    to historical).
  elicitability_score_estimator: >-
    THE FISSLER-ZIEGEL (2016) STRICTLY CONSISTENT SCORING RULE for the joint (VaR, ES)
    pair, in this platform's positive-loss-magnitude convention (loss_sign above), at
    level p = 0.95 (tail probability alpha = 1 - p = 0.05). Let ell_t = -r_t (loss;
    r_t the GENERATED ensemble's pooled realized return for one strategy), V the
    forecast VaR (a positive loss magnitude), E > 0 the forecast ES (a positive loss
    magnitude, E >= V). The score for one observation:
      s_t = 1{ell_t >= V} * (ell_t - V) / (alpha * E) + V/E + ln(E) - 1
    and the reported value is the MEAN of s_t over every pooled observation. LOWER IS
    BETTER: this platform reports the score to be MINIMIZED, and V, E ARE MINIMIZED IN
    EXPECTATION EXACTLY AT THE TRUE VaR_alpha AND ES_alpha OF THE LOSS DISTRIBUTION
    ell_t IS DRAWN FROM (a first-order-conditions derivation is in
    ah.eval.metrics.tails.elicitability_score's docstring) -- this is what makes it a
    CONSISTENT SCORING RULE for the pair, and is the property
    `tests/test_tails.py` checks by asserting a mis-specified (V, E) scores strictly
    worse than the true pair on a fixed sample, not merely that the number is finite.
    WHICH SIDE SUPPLIES (V, E) AND WHICH SUPPLIES ell_t -- the entire content of this
    metric, and CORRECTED BY THE WP2.2 TASK 4 FIX PASS (this block previously stated the
    inverted assignment). (V, E) ARE ESTIMATED FROM THE GENERATED ENSEMBLE (`var_es`
    applied to the generated ensemble's own pooled realized return path for that
    strategy) AND ell_t ARE THE HISTORICAL (train+validation) REALIZATIONS of that SAME
    D4 strategy's own return series -- `ah.eval.metrics.tails._historical_strategy_returns`
    (the strategy's own legs, inner-joined onto their shared date overlap from
    `ah.eval.reference.ReferenceStats.historical_series`; never a fresh catalog read,
    never re-deriving strategy arithmetic, since the SAME `ah.eval.metrics.tails.
    strategy_returns` function evaluates both the historical panel, wrapped as a
    single-path Ensemble, and the generated ensemble). This is the TAIL-GAN direction
    (DN-1.1 Sec.II.4's citation [5], the auxiliary term WP2.8's L3 loss minimizes), and
    it is the ONLY direction the consistency derivation above licenses: that derivation
    establishes optimality IN (V, E) WITH THE REALIZATIONS HELD FIXED, so the pair under
    judgement must be the generator's and the realizations must be history's. It is
    coercive -- as the generated E shrinks toward 0 the score diverges to +inf -- and by
    strict consistency it is MINIMIZED EXACTLY WHEN THE GENERATED (VaR_95, ES_95) EQUALS
    HISTORY'S OWN. A low score means the generator's tail risk reproduces history's,
    which is DN-1.1 Sec.II.6's "VaR/ES elicitability on D4 strategies... beats bootstrap
    (G2)" row read literally.
    THE INVERTED ASSIGNMENT IS A DEFECT, NOT A VARIANT, and is recorded here so a future
    reader cannot re-introduce it: freezing (V, E) at HISTORY's values and varying the
    GENERATED losses collapses the score to c1 * mean((ell - V)^+) + c2 with c1 > 0 -- a
    monotone increasing function of generated tail heaviness whose global minimum is a
    generator emitting IDENTICALLY ZERO. Measured on the pre-fix code with historical
    V = 0.0410, E = 0.0583: -2.856 for a generator matching history, -3.124 at half
    volatility, -3.139 (best) for identically zero. Since this score is WP2.8's
    auxiliary loss, shipping it would have trained the generator toward zero volatility.
    THE TEST THAT DISTINGUISHES THE TWO WIRINGS varies the generated SAMPLE with history
    fixed (tests/test_tails.py::test_elicitability_metric_is_minimized_by_matching_history);
    the scoring-rule consistency test above varies (V, E) on a fixed sample and passes
    under either wiring, so it is not sufficient on its own. Auxiliary G1 term (Fissler-
    Ziegel's general family) is 0 -- the simplest member of the family, chosen because
    the auxiliary G2 term (`1/E`, the log-barrier antiderivative `ln E`) alone is
    already sufficient for strict consistency and needs no code-side default for a
    second family parameter. NaN if E <= 0 (the GENERATED ensemble has no positive ES
    magnitude at all -- an identically-zero generator lands here, and NaN fails under
    nan_metric_rule), if the historical strategy return series cannot be built because a
    leg's factor has no Step-1 source (commodities), or if alpha is outside (0, 1).
  kupiec_pof_estimator: >-
    Kupiec (1995) proportion-of-failures unconditional-coverage LIKELIHOOD-RATIO TEST,
    at level p = 0.95 (alpha = 0.05), on the exceedance indicator sequence
    I_t = 1{ell_t >= V_hist} -- ell_t the GENERATED ensemble's pooled realized loss,
    V_hist the HISTORICAL VaR_95 (see elicitability_score_estimator: the SAME
    historical forecast, never re-derived a second way). With T = len(I), x = sum(I)
    (observed exceedances), p_hat = x/T (observed rate):
      LR_pof = -2 * ln[ (1-alpha)^(T-x) * alpha^x / ( (1-p_hat)^(T-x) * p_hat^x ) ]
    with the 0*ln(0) := 0 convention (an exact-boundary count, x=0 or x=T, contributes
    0 to the corresponding term rather than raising). Under H0 (true rate = alpha),
    LR_pof ~ chi-square(1) asymptotically; `kupiec_pof_chi2_tail_1path` = P(chi-square(1)
    > LR_pof), computed WITHOUT scipy via the exact closed form for one degree of
    freedom, chi2_sf(x, 1) = 2 * (1 - Phi(sqrt(x))), Phi the standard normal CDF
    (statistics.NormalDist().cdf) -- verified against the standard chi-square(1) 95th
    percentile critical value 3.841. A SMALL p-value (large LR_pof) rejects H0: the
    generated ensemble's exceedance rate against history's own VaR threshold disagrees
    with the nominal rate. NOT length-matched to a resample band (see
    estimator_length_matching): this is a test statistic on the GENERATED ensemble's
    own pooled sequence, evaluated against a fixed asymptotic chi-square null, not a
    quantity with a train+validation reference band of its own.
    THE POOLED SAMPLE SIZE IS FIXED IN THIS DEFINITION, NOT CHOSEN BY THE GENERATOR AND
    NOT READ FROM THE GENERATED ENSEMBLE'S OWN PATH LENGTH EITHER (WP2.2 Task 4 fix
    pass, widened by fix pass 2's BLOCKING 2 -- see backtest_reference_sample_size below
    for the full statement, which applies identically to the Christoffersen
    statistics). T = 120 (`ah.eval.metrics.tails.BACKTEST_REFERENCE_MONTHS`), a SEALED
    CONSTANT, not n_paths * months and not the judged ensemble's own `months`: the
    ensemble's pooled exceedances estimate p_hat, and the reported LR is then evaluated
    at that fixed reference T = 120. Without pinning T, LR_pof = 2 * T * KL(p_hat ||
    alpha) scaled linearly with n_paths (fixed pre-seal) AND with months (the residual
    gap fix pass 2 closed): asking the generator for 100 paths instead of 1024, OR for
    60 months instead of 120, divided the statistic and raised the p-value -- a metric
    improved by generating less, on names WP2.3 seals, on either axis.
  christoffersen_independence_estimator: >-
    Christoffersen (1998) INDEPENDENCE LIKELIHOOD-RATIO TEST on the SAME exceedance
    indicator sequence I_t kupiec_pof_estimator defines, testing whether exceedances
    cluster in time (a VaR model that is well-calibrated on average but whose failures
    come in runs is still a bad model). Let n_ij count observed one-step transitions
    I_t=i -> I_{t+1}=j for i,j in {0,1}, pi_01 = n01/(n00+n01), pi_11 = n11/(n10+n11)
    (transition-conditional exceedance probabilities), pi = (n01+n11)/(n00+n01+n10+n11)
    (the unconditional rate under H0: independence, i.e. pi_01 = pi_11 = pi):
      LR_ind = -2 * [ L(pi; n01+n11, n00+n10) - L(pi_01; n01, n00) - L(pi_11; n11, n10) ]
    with L(p; n1, n0) = n1*ln(p) + n0*ln(1-p) (0*ln(0) := 0, so a count of zero in
    either cell of a term never needs that term's probability to be defined -- handles
    every degenerate transition-count case, including a state visited zero times,
    without a special case). Under H0, LR_ind ~ chi-square(1). ENSEMBLE-WIDE
    AGGREGATION: n_ij are SUMMED across every path's own transitions (never a
    transition spanning two different paths -- the identical "never cross a path
    boundary" rule every time-ordered statistic in this platform follows), which is the
    mathematically correct combination of K independent Markov chains' joint likelihood
    (the joint log-likelihood over independent chains sharing one transition matrix IS
    the sum of the per-chain log-likelihoods, which reduces exactly to using the summed
    counts) -- not a per-path LR averaged, which would be a different, noisier
    statistic. The summed counts are then re-expressed at a reference sample size of
    ONE 120-MONTH reference path's transitions (119 = BACKTEST_REFERENCE_MONTHS - 1),
    a SEALED CONSTANT exactly as kupiec_pof_estimator's T = 120 is -- NOT the judged
    ensemble's own `months - 1` -- see backtest_reference_sample_size. p-value via the
    SAME chi2_sf(x, 1) as kupiec_pof_estimator.
    MINIMUM-EXCEEDANCE FLOOR (WP2.2 Task 4 fix pass): NaN unless the judged sequence
    contains at least BACKTEST_MIN_EXCEEDANCES = 10 exceedances in total. With zero
    exceedances n01 = n10 = n11 = 0, so under the 0*ln(0) := 0 convention EVERY
    log-likelihood term vanishes and LR_ind is exactly 0 with a p-value of 1.0 at every
    T -- a MAXIMALLY FAVOURABLE independence score for a generator whose losses never
    reach history's VaR at all. Same floor shape as DRAWDOWN_MIN_EPISODES /
    TAIL_DEPENDENCE_MIN_TAIL_OBS. Kupiec is deliberately NOT floored: zero exceedances
    against a 5% nominal rate is exactly the case its LR is built to reject, and
    flooring it would disarm the one test that already punishes a suppressed tail.
  christoffersen_conditional_coverage_estimator: >-
    THE JOINT TEST: `christoffersen_conditional_coverage_lr_1path` = LR_pof + LR_ind (the
    two already-defined statistics, summed) ~ chi-square(2) under H0 (correct
    unconditional coverage AND independence, jointly). p-value via the exact closed
    form for TWO degrees of freedom, chi2_sf(x, 2) = exp(-x/2) (verified against the
    standard chi-square(2) 95th percentile critical value 5.991: exp(-5.991/2) = 0.05).
    Both components are the reference-sample-size-normalized statistics defined above,
    so the sum is too. NaN if either component statistic is NaN -- fewer than 2
    observations in the sequence, or fewer than BACKTEST_MIN_EXCEEDANCES exceedances
    (the independence floor propagates here by construction, which is correct: NaN fails
    under nan_metric_rule, so a zero-tail generator still fails this name).
  tail_dependence_estimator: >-
    NONPARAMETRIC empirical tail-dependence coefficient (Frahm, Junker & Schmidt 2005),
    computed between an active CROSS-BLOCK FACTOR PAIR's pooled ensemble observations
    (never a D4 strategy -- this is the one WP2.2 Task 4 statistic keyed like
    ah.eval.reference's existing cross-block statistics, "<factorA>~<factorB>.<stat>",
    per DN-1.1's "corr matrix" row reading "tail-dependence coefficients" as a factor-
    pair, not a strategy-level, criterion). Rank-based pseudo-observations
    U = rank(a)/(n+1), V = rank(b)/(n+1) (ties averaged, the identical ranking
    ah.eval.reference.spearman_rank_correlation already uses). At the SEALED tail
    fraction 0.05 (TAIL_DEPENDENCE_TAIL_FRACTION, matching hill_tail_index_estimator's
    own 5% convention rather than an independently chosen number):
      upper: u = 0.95; lambda_U = mean(1{U > u AND V > u}) / 0.05
      lower: u = 0.05; lambda_L = mean(1{U <= u AND V <= u}) / 0.05
    Both estimate P(other variable in its tail | one variable in its tail) at threshold
    u: exactly 1.0 for a comonotone pair at every fraction; converging to 0 as the
    fraction shrinks under independence (a small, nonzero value at THIS finite
    fraction -- 0.05 in expectation under independence -- is the honest, expected
    outcome, not a defect). NaN below 10 observations actually inside the tail
    (n * fraction, TAIL_DEPENDENCE_MIN_TAIL_OBS -- the same floor shape as
    VARIANCE_RATIO_MIN_SUMS/DRAWDOWN_MIN_EPISODES) or if the two arrays are not the
    same length. Computed identically on both sides (a real train+validation band via
    the existing block-bootstrap machinery, and the generated ensemble's own pooled
    factor pair), unlike the D4-strategy backtests above.
    NOT LENGTH-MATCHED, and this is load-bearing rather than a tuning choice (WP2.2 Task
    4 fix pass, Important 3; contrast estimator_length_matching, whose blanket "every
    reference band is drawn at the judged ensemble's own path length" does not hold for
    these two). The floor above needs n >= 10 / 0.05 = 200 observations before the
    estimator returns a number at all, so at the production resample_length of 120 EVERY
    bootstrap replicate was NaN and the band was (nan, nan) with n_valid_resamples = 0 --
    an empty band on a registered, sealable statistic, and the earlier claim in this
    block that the band came "for free" was false at production settings. Both entries
    are therefore registered length_matched=False on
    ah.eval.reference.RegisteredCrossStat, drawing their replicates at the full
    train+validation length. The justification is the same one lost_decade_frequency
    uses: the coefficient is a joint-exceedance FRACTION at a fixed 5% tail, whose value
    does not depend on series length -- only its sampling error does, which is exactly
    what the band measures. correlation and crisis_corr_lift stay matched.
    RESIDUAL, NOT COVERED: the generated side pools n_paths * months observations
    (~120,000) against a ~1,100-observation historical point and full-length replicates,
    so three different sample sizes meet in one comparison. The estimator is a bounded
    fraction and not strongly length-biased, but this is the same class of gap
    estimator_length_matching's RFR-15 residual records for the pooled statistics, and
    WP2.3 must judge it before sealing a band here.
  discriminative_score_estimator: >-
    A CLASSIFIER TRAINED TO DISTINGUISH real windows of factor dynamics from generated
    ones, reported as |BALANCED test accuracy - 0.5| (0 = indistinguishable; the
    generator fools the classifier). Windows: non-overlapping UTILITY_WINDOW_MONTHS=24-month blocks,
    extracted independently WITHIN each real factor's own train+validation series
    (ah.eval.reference.ReferenceStats.historical_series) and within each generated
    path (never spanning a path or series boundary), for every active factor present on
    BOTH sides. Features: [mean, std] of each window (2 numbers), POOLED across every
    contributing factor and window into one (N, 2) matrix per side (real label 1,
    generated label 0) -- a factor's own scale is not removed, so a generator with a
    shifted mean or variance for ANY active factor remains detectable. Classifier:
    logistic regression (bias + 2 weights) with L2 penalty 1e-3, fit by full-batch
    gradient descent (see gradient_descent_fit_estimator for the step size and stopping
    criterion; zero weight initialization -- the convex logistic loss needs no random
    init) on a SEEDED random TRAIN_FRACTION=0.7 CLASS-STRATIFIED split of the pooled,
    labelled example set; features standardized (z-score) using the TRAIN split's own
    mean/std only (never the test split's, avoiding a leakage channel in the feature
    scaling itself).
    CLASS IMBALANCE IS THE DEFINING CONSTRAINT OF THIS METRIC, and the WP2.2 Task 4 fix
    pass rewrote this paragraph because the first definition measured the imbalance
    rather than the generator. The two sides are never the same size: real windows number
    history_months/24 per factor, generated windows (months/24) * n_paths -- roughly
    100:1 at production scale. RAW accuracy under 100:1 imbalance is maximized at 0.99 by
    the constant majority-class predictor, so |raw accuracy - 0.5| sat near its 0.5
    maximum whatever the generator did; measured with the two distributions held
    IDENTICAL, the pre-fix score was 0.008 at a 1:1 ratio, 0.333 at 5:1, 0.447 at 20:1
    and 0.493 at 150:1 -- and it IMPROVED as the ensemble shrank toward balance, another
    metric gameable by generating less. Three changes, all three necessary:
    (a) the train/test split is CLASS-STRATIFIED -- train_fraction of EACH class -- so
    the test split always holds both classes and the split cannot itself create
    imbalance; (b) the fit is weighted by INVERSE CLASS FREQUENCY (each class's weights
    summing to 0.5), so the majority class does not simply own the logistic objective;
    and (c) the reported value is |BALANCED accuracy - 0.5|, balanced accuracy being
    0.5 * (recall_real + recall_generated), the unweighted mean of the two per-class
    recalls -- whose value for ANY constant predictor is exactly 0.5 at every class
    ratio. Reported value is in [0, 0.5]. NaN if fewer than 4 pooled examples or if
    EITHER class has fewer than 2 (a stratified split needs one of each class to fit on
    and one to score on).
    Determinism: seed = UTILITY_FIT_SEED (a sealed module constant, NOT the battery's own
    run seed -- see ah.eval.metrics.utility's module docstring), driving the stratified
    split via numpy.random.Generator(PCG64(seed)) and nothing else, with the two classes
    drawn in a fixed order (real, then generated) so the draw sequence is a function of
    the seed alone; gradient descent itself is deterministic given fixed data and zero
    init. Lower is better as a G2 criterion.
    THE NOISE FLOOR, DISCLOSED (WP2.2 Task 4 fix pass 2, MINOR 4). Balanced accuracy is
    the mean of two per-class recalls, and the real-class recall is estimated from only
    the TEST split's real examples: (1 - TRAIN_FRACTION) of the real windows, roughly
    0.3 * n_real_windows -- about 60 at this suite's typical scale (n_real_windows
    around 200 with 24-month windows over ~800-1100 months of history and several
    active factors pooled). A binomial proportion estimated from ~60 examples has
    standard error ~0.5/sqrt(60) ~ 0.065, so even a PERFECT generator (real and
    generated genuinely indistinguishable) reports |balanced_accuracy - 0.5| in roughly
    the 0.05-0.10 range from TEST-SPLIT SAMPLING NOISE ALONE, not the ~0 a noiseless
    estimator would return. A sealed threshold on this name must be set above that
    floor -- WP2.3 must not read a value in that range as evidence of a detectable
    generator defect.
  predictive_score_estimator: >-
    TRAIN-ON-SYNTHETIC, TEST-ON-REAL (TSTR) one-step-ahead prediction error. Model: a
    single linear map x_{t+1} = a + b*x_t + noise, fit by the SAME gradient-descent
    machinery discriminative_score_estimator uses (squared-error loss in place of
    logistic; zero init, L2 penalty 1e-3, step size and stopping criterion per
    gradient_descent_fit_estimator) on a SEEDED
    random 50% subsample of GENERATED one-step-ahead pairs (x_t, x_{t+1}), pooled
    across every active factor present in the ensemble and, within each factor, across
    every ensemble path (pairs never span a path boundary) -- the SAME [mean, std]-free
    standardization convention discriminative_score_estimator uses is applied here too
    (each factor's own values z-scored by that factor's REAL historical mean/std before
    pooling, so one linear model is not dominated by whichever factor happens to have
    the largest raw scale). Error: mean squared error of the fitted (a, b) evaluated
    on EVERY real one-step-ahead pair (ah.eval.reference.ReferenceStats.historical_series,
    no subsampling on the real/test side). Determinism: seed = UTILITY_FIT_SEED, driving
    the generated-pair subsample only.
  tstr_degradation_estimator: >-
    THE RATIO MSE_tstr / MSE_trtr (predictive_score_estimator's TSTR error divided by a
    TRAIN-ON-REAL-TEST-ON-REAL baseline), fit by the identical linear-model /
    gradient-descent machinery on a SEEDED random 50% shuffle-split of the REAL
    one-step-ahead pairs (fit half / eval half; seed = UTILITY_FIT_SEED, the same seed
    predictive_score_estimator's subsample uses, so one seed value drives every
    stochastic element of one battery run's utility tier -- via two independently
    constructed numpy.random.Generator(PCG64(seed)) instances, i.e. the SAME draw
    sequence rather than two successive draws from one shared generator). ORIENTATION: >= 1.0 means the
    synthetic-trained model predicts real one-step-ahead dynamics no better than a
    model trained directly on (half of) real data -- 1.0 is "no degradation" (the
    generator's dynamics are as informative as real data for this simple predictor);
    LOWER IS BETTER, and a value < 1.0 (the synthetic-trained model beating the
    real-trained baseline on its own held-out real data) is possible and not an error --
    it would mean the generator's larger effective sample size for fitting a two-
    parameter linear model outweighs the sim-to-real gap for this particular
    (intentionally simple) predictor. NaN if either MSE is NaN, or +inf if
    MSE_trtr == 0.0 exactly (a degenerate real series with zero one-step variance,
    against which no ratio is informative).

  gradient_descent_fit_estimator: >-
    THE ONE MODEL-FITTING PROCEDURE the whole utility tier uses -- logistic loss for
    discriminative_score_estimator, squared loss for predictive_score_estimator and
    tstr_degradation_estimator. Full-batch gradient descent on a linear model with a
    bias term appended as a constant feature; zero weight initialization (the losses are
    convex, so no random start is needed and none is used); L2 penalty 1e-3 applied to
    every weight INCLUDING the bias (a stated simplification); optional per-example
    weights, used only by discriminative_score_estimator's class balancing.
    STEP SIZE AND STOPPING CRITERION, added by the WP2.2 Task 4 fix pass because the
    procedure previously had neither and stopped being a measurement on some inputs. The
    step is min(0.1, 1/L), where L = c * (trace of the weighted second-moment matrix of
    the design, divided by the total weight) + 1e-3 bounds the loss's gradient-Lipschitz
    constant, with c = 1 for the squared loss and c = 0.25 for the logistic (the maximum
    of the sigmoid's derivative). Gradient descent on an L-smooth convex objective is
    monotonically non-increasing for any step <= 1/L, so the iteration is provably
    non-divergent at ANY input scale. Under the previous fixed step of 0.1 the squared
    loss diverged whenever lambda_max exceeded 20, which a generated ensemble with about
    4.5x real volatility reaches (the predictive design is z-scored by the REAL mean/std,
    so a mis-scaled generator is exactly the case that triggered it) -- the fit returned
    inf/nan, and the failure direction was safe but the metric had stopped being a
    measurement. On the well-scaled designs this suite normally builds, L is about 2, the
    0.1 cap binds, and the step is unchanged. The loop stops when the gradient's infinity
    norm falls below 1e-10, with a bound of 5000 epochs on work; a converged fit is
    therefore invariant to the epoch budget, which is what makes the returned weights a
    property of the data rather than of the schedule. The fit is otherwise pure and
    seed-free: all randomness in the utility tier is in WHICH EXAMPLES are selected,
    never in the fit itself.

  loss_sign: >-
    VaR and ES are reported as POSITIVE MAGNITUDES OF LOSS. Loss is the negative of
    return; VaR at level p is the p-quantile of the pooled loss distribution; ES at
    level p is the mean loss at or beyond VaR_p. A D4 strategy whose definition made
    VaR negative would be mis-specified, not merely unusual -- this is the property
    that catches a level being mistaken for a return.

  series_parameters: >-
    Inside a strategy's `params`, ANY KEY ENDING IN `_series` names a series the rule
    reads: its value must be either an active factor id or a `derived_series` id
    declared above. Rule target series are sealed data here, not constants in code, so
    a rule can never silently read a different factor than the one sealed. Every other
    `params` key is numeric.

  rebalance_cadences:
    - monthly
  rebalance_convention: >-
    ONE REBALANCE CADENCE is implemented in this version: `monthly`, listed in
    rebalance_cadences above. Every D4 strategy's `rebalance` field is checked at load
    time against that list, and the loader rejects any value not in it -- `rebalance`
    is stored data that the loader reads, not decorative metadata. `monthly` means
    portfolio weights are reset to their sealed target at the start of every month, with
    no drift carried between rebalances and no compounding within a month: each
    strategy's return for month t is computed directly from month t's resolved series
    values at the sealed weights (see static_weights_composition below for the
    static-weight case; the two rule strategies state their own per-month arithmetic
    directly in their `notes`). There is no other cadence implemented; declaring one
    (e.g. `quarterly`) without also adding the code that computes a quarterly return
    would be a self-contradictory amendment, so rebalance_cadences is exactly the set
    of cadences ah.eval.metrics.tails can compute today.

  static_weights_composition: >-
    For every `kind: static_weights` strategy (eqw_factors, sixty_forty,
    endowment_proxy), the realized return at month t is the ARITHMETIC WEIGHTED SUM of
    that month's resolved series values: sum_i weight_i * series_i_t, where series_i_t
    is either a return-bearing active factor's value directly or a `derived_series`
    value (already a monthly decimal return, per the transforms declared below). There
    is NO COMPOUNDING across the weighted legs and no cross-term between them -- each
    leg is linear and independent for the month, consistent with rebalance_convention's
    monthly reset. This is the same arithmetic the two `kind: rule` strategies state
    explicitly for their own legs in their `notes` (momentum's realized return =
    position_t * target_series_t; carry's = long_weight * long_series_t +
    funding_weight * funding_series_t); static_weights strategies use identical
    arithmetic, they simply have no per-leg formula field of their own to state it in.

  # WP2.2 Task 5 -- memorization tier (ah.eval.metrics.memorization).
  memorization_nn_distance_estimator: >-
    NEAREST-NEIGHBOUR DISTANCE FROM EACH GENERATED BLOCK TO THE NEAREST TRAIN WINDOW.
    A GENERATED "block" is a non-overlapping MEMORIZATION_BLOCK_MONTHS=24-month window
    of ONE factor's own path (never spanning a path boundary; 24 is reused from
    UTILITY_WINDOW_MONTHS, not a second arbitrary window length). The TRAIN-side
    CANDIDATE SET it is searched against is EVERY OFFSET (sliding windows, stride 1)
    of that factor's TRAIN split -- not the index-0-anchored grid of non-overlapping
    blocks used before WP2.2c Item 2. THE REASON, because it changes every value this
    metric family reports: chopping BOTH sides on one fixed grid made all three metrics
    a measurement of block PHASE rather than of copying. WP2.2b measured a literal,
    zero-noise verbatim replay of a training decade at near_duplicate_fraction = 0.2423,
    statistically indistinguishable from a plain block bootstrap's 0.2394, while the
    identical copy snapped to the grid scored 0.8875 -- i.e. a memorizer that began its
    replay on an odd month evaded the gate entirely. Windows crossing the
    TRAIN/VALIDATION boundary are still never formed on the real side. CONSEQUENCE:
    every nearest-neighbour distance is now a minimum over ~830 candidates rather than
    ~35 and so FALLS for every generator; nn_distance_p05/p50 values are not comparable
    across the WP2.2c boundary and WP2.3 must derive their floors from a post-WP2.2c
    run. Each block/window is the
    RAW 24-dimensional vector of monthly values over the window, standardized by that
    SAME factor's own TRAIN-split mean/std (never train+validation combined -- train is
    the population this metric checks copying against). Distance between two blocks of
    the SAME factor: Euclidean, sqrt(sum((u_i - v_i)^2)), over the standardized
    24-vector; blocks of DIFFERENT factors are never compared to each other. For every
    generated block (extracted independently within each path, pooled across paths and
    factors), its nearest-neighbour distance is the minimum such distance to any TRAIN
    block of the same factor. nn_distance_p05/nn_distance_p50 are the 5th percentile
    and median of that pooled distribution. Small values -> generated blocks sit close
    to specific training examples. TRAIN/VALIDATION split: the sealed
    ah.splits.TRAIN/VALIDATION date boundaries, applied directly to
    ReferenceStats.historical_series (already train+validation combined) -- never a
    second catalog read. NaN if the factor's TRAIN split carries fewer than 5
    non-overlapping blocks (see MEMORIZATION_MIN_TRAIN_BLOCKS_estimator), OR (Important
    3, WP2.2 Task 5 fix pass) if fewer than MEMORIZATION_MIN_GENERATED_BLOCKS=30 pooled
    GENERATED blocks result across every qualifying factor -- the identical
    generated-side floor ECONOMICS_MIN_OBS/CALIBRATION_MIN_GENERATED_SUMS already apply
    to their own suites: a one-path, 24-month ensemble yields exactly one generated
    block, which made nn_distance_p05/p50 a single observation and drifted
    membership_inference_auc toward its favourable 0.5 value purely from having too
    little to attack, not from genuinely not memorizing. Below the floor ALL FOUR
    metric names NaN together.
  membership_inference_auc_estimator: >-
    A DISTANCE-TO-NEAREST-SYNTHETIC-SAMPLE MEMBERSHIP-INFERENCE ATTACK. For every TRAIN
    block (see memorization_nn_distance_estimator for the block/standardization/
    distance definitions), its proximity signal is its OWN nearest-neighbour distance
    to the pooled GENERATED blocks of the same factor (note the direction: nearest
    GENERATED neighbour of a REAL block, the reverse of nn_distance's direction); the
    identical signal is computed for every VALIDATION block of the same factor. The
    attack classifies "is this a training block?" by smaller distance -> more likely
    training. membership_inference_auc is the AUC of that classifier, POOLED across
    every qualifying factor: the Mann-Whitney U statistic of {-distance : train} against
    {-distance : validation}, computed from average (tie-split) ranks of the pooled
    signal -- AUC = (rank_sum(train) - n_train*(n_train+1)/2) / (n_train*n_val). 0.5 =
    train and validation blocks are equally close to the generator's output (no
    detectable leakage); 1.0 = train blocks are systematically closer (the generator's
    output betrays which examples it trained on). NaN if either pooled population is
    empty.
  near_duplicate_fraction_estimator: >-
    FRACTION OF GENERATED BLOCKS WITHIN A DATA-DRIVEN EPSILON OF A TRAIN BLOCK. Reuses
    the SAME per-generated-block nearest-train-neighbour distance
    memorization_nn_distance_estimator pools. Epsilon, per factor: the 5th percentile
    (MEMORIZATION_EPSILON_PERCENTILE) of the distances obtained by taking each
    non-overlapping TRAIN block as a query and searching it against every SLIDING TRAIN
    WINDOW THAT DOES NOT OVERLAP IT -- self-calibrated to how close two genuinely
    INDEPENDENT historical trajectories of the factor ever naturally sit, so only a
    generated block sitting closer to some training example than all but the tightest
    5% of distinct historical examples ever sit to each other counts as a duplicate.
    THE CALIBRATION MOVES WITH THE SEARCH (WP2.2c Item 2), and must: a minimum over ~830
    candidates is systematically smaller than a minimum over 34, so enlarging the
    generated side's search while leaving the epsilon on the old grid would have raised
    every generator's score -- a false-positive machine, not a fix. Excluding only the
    query's own 24 months of overlap, rather than its whole grid cell, is likewise
    deliberate: a window offset by one month shares 23 of 24 values with the query and
    is not an independent trajectory, so counting it would drive epsilon to nearly zero
    and no generator could ever register as a duplicator.
    near_duplicate_fraction is the fraction of pooled generated blocks (pooled across
    every qualifying factor) whose nearest-train distance is below that factor's own
    epsilon. NaN if no factor's TRAIN split clears the 5-block floor (a leave-one-out
    epsilon needs >= 2 blocks to be defined at all).
    THE NULL VALUE IS 0.05, NOT 0, AND THE SEALED BOUND MUST RESPECT THAT: epsilon is by
    construction the 5th percentile of the independent-trajectory distance distribution,
    so a perfectly non-memorizing generator drawn from the same population scores ~0.05.
    Before Item 2 an independent draw scored a structural 0.0 only because it, like a
    verbatim copy, could not land on the fixed grid. See the threshold entry for the
    derivation of the 0.5 majority bound that replaced the old max of 0.05.

  # WP2.2 Task 5 -- calibration tier (ah.eval.metrics.calibration).
  pit_ks_stat_estimator: >-
    ROLLING-ORIGIN PIT AGAINST THE GENERATED ENSEMBLE'S OWN UNCONDITIONAL PREDICTIVE
    DISTRIBUTION, at horizon h in {12 ("1y"), 60 ("5y")} months, pooled over every
    ACTIVE, RETURN-BEARING factor (conventions.return_bearing_factors intersected with
    the active factor set) present in both ReferenceStats.historical_series and the
    judged ensemble. The predictive distribution for one factor at horizon h is the
    generated ensemble's own pooled population of NON-OVERLAPPING h-month sums
    (computed independently within each path via nonoverlapping_sums, then
    concatenated across paths -- the identical convention agg_gaussianity_estimator
    uses) -- deliberately UNCONDITIONAL, the same distribution used at every origin
    below, since nothing in the platform today produces a history-conditioned forecast
    (Step 3's job); this is the cheap baseline STEP2-GENERATOR-PLAN's brief calls for.
    The rolling origins are every h-month OVERLAPPING window of the REAL
    train+validation series, origin spacing 1 month (origin t covers [t, t+h);
    len(series) - h + 1 origins per factor -- fixed by history, not the generator, so
    not gameable by producing a shorter/longer ensemble). PIT for one realized origin
    sum s is the mid-rank empirical CDF of s against the generated pooled distribution
    (ties averaged: (count strictly less + 0.5 * count equal) / n). Every origin of
    every qualifying factor contributes one PIT value to one pooled sample (PIT values
    are unitless in [0, 1], so pooling across factors of different raw scales is safe).
    pit_ks_stat is the one-sample Kolmogorov-Smirnov statistic of that pooled PIT
    sample against Uniform(0, 1): D = max_i max(i/n - x_(i), x_(i) - (i-1)/n) on the
    sorted sample. Perfect calibration -> pooled PIT is uniform -> D = 0; LOWER IS
    BETTER. NaN if fewer than 30 (CALIBRATION_MIN_GENERATED_SUMS) pooled generated
    sums are available for EVERY factor at that horizon, or fewer than 30
    (CALIBRATION_MIN_ORIGINS) pooled PIT values result. TIER (Minor, WP2.2 Task 5 fix
    pass, reconsidered before sealing rather than after): pit_ks_stat_1y reports under
    DN-1.1's monthly tier; pit_ks_stat_5y reports under its 1_5yr tier -- a 60-month
    horizon statistic filed under "monthly" would read as a shorter-horizon claim than
    it makes, and re-tiering after this file seals is a dated amendment, so it is
    corrected now.
  interval_coverage_estimator: >-
    REALIZED COVERAGE OF A NOMINAL q% PREDICTION INTERVAL, q in {50, 90}, at horizon h
    in {12 ("1y"), 60 ("5y")} months -- shares pit_ks_stat_estimator's rolling-origin
    protocol (same predictive distribution, same real rolling origins, same two
    floors). Per factor: alpha = (1 - q/100) / 2; the interval is
    [quantile(alpha), quantile(1 - alpha)] of that factor's own generated pooled
    h-month-sum distribution. The pooled coverage INDICATOR (1 if a real origin sum
    falls inside its own factor's interval, else 0) is pooled across every qualifying
    factor and origin; interval_coverage_{q}_{1y,5y} is the mean of that pooled
    indicator. Perfect calibration -> the reported value equals q/100 -- NEITHER
    higher nor lower is "better": an over-wide generated distribution reads as
    OVER-coverage, exactly as much a calibration failure as under-coverage, so a
    sealed band brackets q/100 on both sides. Same two NaN floors as
    pit_ks_stat_estimator. Same TIER split as pit_ks_stat_estimator too:
    interval_coverage_{50,90}_1y report under monthly, interval_coverage_{50,90}_5y
    under 1_5yr.

  # WP2.2 Task 5 -- economic tier (ah.eval.metrics.economics). DN-1.1 Sec.II.6's
  # "Economic" row states this tier's own acceptance criterion as "Defensible ranges,
  # documented" against "Literature ranges" -- an ABSOLUTE bound, never a
  # train+validation bootstrap band, unlike every monthly/1-5yr/10yr entry above.
  implied_sharpe_estimator: >-
    A STRUCTURAL GAP, ALWAYS NaN TODAY -- not computed. DN-1.1's "Implied Sharpe ratios
    ... by regime" needs ah.data.derive.label_regime's six labels (EXP, SLOW, REC, CRI,
    STAG, REF), which needs FIVE inputs (usrec, cpi_yoy, growth_yoy, drawdown, hy_oas);
    only three are constructible from a generated factor (cpi -> cpi_yoy, equity_mkt ->
    drawdown, hy_spread -> hy_oas) -- usrec (NBER recession) and growth_yoy (industrial
    production) have no factors.yaml mapping at all, the identical structural gap
    regime_duration_estimator records. All six implied_sharpe_{EXP,SLOW,REC,CRI,STAG,REF}
    names are therefore NaN on every ensemble today, status=structurally_unavailable,
    carrying the regime ruleset version (ah.data.derive.regime_thresholds()["version"])
    they would be evaluated under once the gap closes. Recorded as
    governance/retrofit-register.md RFR-27.
  term_premium_estimator: >-
    mean(ust_10y - policy_rate), POOLED over every (path, month) observation of the
    generated ensemble. Both are LEVELS in percentage points
    (conventions.level_factors), so this is a level-space yield-curve slope, not a
    return -- no numeraire question arises. NaN if either factor is absent from the
    ensemble, if fewer than ECONOMICS_MIN_OBS=60 pooled observations result, or if any
    pooled observation is non-finite (poisons the whole metric rather than silently
    dropping it -- a NaN/inf comparison would otherwise never register as informative
    either way).
  equity_risk_premium_estimator: >-
    mean(equity_mkt - cash_tr_1m), POOLED over every (path, month) observation.
    equity_mkt is total-return (conventions.numeraire: total_return); cash_tr_1m is the
    SEALED derived_series entry declared above (bond_total_return on policy_rate at
    duration_years=0.0, i.e. the pure carry term: 0.01 * policy_rate_{t-1}/12, r_0=0.0)
    -- the SAME cash leg governance/retrofit-register.md RFR-12 already discusses, used
    here directly rather than a second, independently invented cash-rate decision. Same
    NaN rules as term_premium_estimator (absent leg, < 60 pooled observations, any
    non-finite observation).
  money_pump_estimator: >-
    A NO-ARBITRAGE AUDIT OVER THE ZERO-COST LEGS. severity: enforce, max: 0 -- must be
    exactly zero. conventions.numeraire_zero_cost_legs names every self-financing,
    costless overlay leg (resolved exactly as ah.eval.metrics.tails resolves any D4
    strategy leg: a raw active factor directly, or a declared derived_series). For each
    zero-cost leg and each PATH of the ensemble independently, the leg "violates" on
    that path iff every month's realized return is >= 0 AND at least one month's return
    is > 0 (never loses, sometimes gains, at zero committed capital -- a free lunch by
    construction). money_pump_violations is the COUNT of (leg, path) pairs violating,
    pooled across every qualifying leg (a total count, not a per-path average). NaN if
    no zero-cost leg is present in the ensemble, if fewer than 60 pooled (leg, path,
    month) observations result, or if any pooled observation is non-finite (poisons
    the whole metric -- a NaN/inf return never satisfies ">= 0" so silently ignoring it
    would let a generator dodge this audit by overflowing rather than complying).
    COVERAGE LIMITATION (Important 2, WP2.2 Task 5 fix pass): DN-1.1's own economic row
    names the audit as catching a strictly dominating COMBINATION of generated factors;
    this is a PER-LEG check only, with no search over weighted combinations of two or
    more zero-cost legs (e.g. a relative-value spread between smb and hml that
    dominates even though neither leg alone does). It catches the single-leg degenerate
    case by construction and is, for any genuinely stochastic leg, a real (if narrow)
    check -- but it is not the full combinatorial audit DN-1.1 describes.
    governance/retrofit-register.md RFR-29 records the gap. CONSEQUENCE WHEN NO
    ZERO-COST LEG IS PRESENT (Important 7): this NaNs the metric, which FAILS the
    sealed enforce/max:0 threshold under nan_metric_rule above -- deliberately, not a
    bug: an ensemble omitting every audited leg has not demonstrated compliance with an
    audit it cannot be checked against. WP2.4's generator must emit at least one of
    smb/hml/mom/credit_xs_hy for a real battery run to reach a genuine verdict here.
  floor_violations_estimator: >-
    STRUCTURAL FLOORS FROM DN-1.1 SEC.II.4 ("rates and spreads generated in softplus
    space with floors, i >= -1%, spread >= 100bp"). severity: enforce, max: 0. Two
    disjoint groups: RATE_FLOOR_FACTORS (policy_rate, ust_2y, ust_10y, hqm_curve) each
    floored at -1.0 (percentage points); SPREAD_FLOOR_FACTORS (ig_spread, hy_spread,
    funding_spread) each floored at 0.0.
    THE SPREAD FLOOR IS 0.0, NOT DN-1.1's LITERAL 100bp (WP2.2c Item 4). WP2.2b found
    this was the ONLY enforce gate in the battery that fired, that it fired identically
    for all five negative controls INCLUDING the three that replay real historical
    values verbatim, and that absent that one accident all five deliberately-broken
    generators would have been recorded as PASSING. It was not detecting anything: it
    was reporting that a realistic funding spread sits below 100bp. It does -- the TED
    spread spent most of 2010-2020 between 15 and 40bp. A floor that rejects the
    historical record is not a floor, and an enforce gate that fires for history cannot
    be evidence about a generator; worse, it masks the gates that are, because `passed`
    is already False before they are read. DN-1.1's floors are a GENERATIVE device (the
    softplus parameterization exists so the model cannot emit a negative spread) and
    100bp is a plausible softplus offset, not an empirical bound. The falsifiable
    statement that survives is that a credit or funding spread is a difference between a
    riskier yield and a safer one and cannot be negative. 0.0 is violated by no
    historical observation of any of the three factors and still catches the failure the
    gate exists for: nc1-iid-gaussian emits negative spreads and now fires this gate
    ALONE among the five, which is a detection rather than a constant. Recorded as a
    deviation from DN-1.1's literal text: governance/retrofit-register.md RFR-41, for
    WP2.3 to ratify. The alternative deliberately NOT taken -- deriving the floor from
    the train+validation panel's own observed minimum per factor -- would make this a
    band rather than a constraint, which is a different kind of object.
    cpi (an index level) and equity_vol (a
    volatility index) carry no DN-1.1-stated floor and are excluded. floor_violations is
    the POOLED count of (factor, path, month) observations below their factor's own
    floor, summed over every qualifying factor present in the ensemble. NaN if no
    floor-bearing factor is present, if fewer than 60 pooled observations result, or on
    any non-finite observation (poisons the whole metric, same reasoning as
    money_pump_estimator). CONSEQUENCE WHEN NO FLOOR-BEARING FACTOR IS PRESENT
    (Important 7, WP2.2 Task 5 fix pass): identical to money_pump_estimator's -- NaN
    FAILS the sealed enforce/max:0 threshold, deliberately. WP2.4's generator must emit
    at least one of policy_rate/ust_2y/ust_10y/hqm_curve/ig_spread/hy_spread/
    funding_spread for a real battery run to reach a genuine verdict here.
  policy_anchor_deviation_estimator: >-
    ROOT-MEAN-SQUARE DEVIATION FROM A SIMPLIFIED TAYLOR-TYPE ANCHOR. DN-1.1 Sec.II.2's
    policy anchor is i_t = r*_t + pi*_t + phi_pi*(pi_t - pi*_t) + phi_c*c_t + eps_t,
    but r*_t (neutral real rate), pi*_t (trend inflation) and c_t (the L2 cycle term)
    are LATENT Layer-1/Layer-2 states with no factors.yaml mapping -- an honest reading
    of DN-1.1's own equation cannot be evaluated from generated factors alone (the same
    gap ten_year_return_vs_valuation_estimator and implied_sharpe_estimator record).
    This metric substitutes a stated, simplified anchor built only from what a
    generator emits: anchor_t = TAYLOR_R_STAR + TAYLOR_PI_TARGET + TAYLOR_PHI_PI *
    (cpi_yoy_t - TAYLOR_PI_TARGET), where cpi_yoy_t = (cpi_t / cpi_{t-12} - 1) * 100
    (the generated cpi level's trailing 12-month percent change, ah.data.derive.yoy's
    convention). TAYLOR_R_STAR = 0.75 and TAYLOR_PHI_PI = 0.5 are DN-1.1 Sec.II.2's own
    table entries (mu_r and phi_pi prior means); TAYLOR_PI_TARGET = 2.0 is NOT from
    DN-1.1 (DN-1.1 states pi* itself has "a diffuse prior -- the target can drift",
    deliberately not a fixed number) -- it substitutes the conventional post-1990s
    central-bank inflation target from the literature, consistent with this tier's own
    "Literature ranges" reference-data column, used only because the model's own latent
    pi*_t is unavailable. The cycle term phi_c*c_t is DROPPED entirely (c_t has no
    generator-visible proxy and DN-1.1 gives no phi_c prior to substitute) -- a stated
    simplification. Reported value: sqrt(mean((policy_rate_t - anchor_t)^2)), POOLED
    over every (path, month >= 12) observation (month < 12 has no defined cpi_yoy).
    LOWER IS BETTER, BUT NOT UNBOUNDEDLY, AND 0 IS NOT THE TARGET (CRITICAL 1, WP2.2
    Task 5 fix pass -- the eighth instance of this work package's dominant failure
    mode, "a metric that improves when the generator produces less/simpler"). Real
    policy rates deviate from any Taylor-type anchor by roughly 1-2 percentage points
    RMS in practice (discretion, the dropped phi_c*c_t term, measurement noise); a
    generator whose policy_rate DETERMINISTICALLY equals anchor_t every month scores
    exactly 0.0 -- the numerically best possible value -- while being LESS realistic
    than a generator with genuine idiosyncratic variation. Exactly the same two-sided
    reasoning interval_coverage_estimator above already states explicitly for its own
    metric (over-coverage is exactly as much a failure as under-coverage): the sealed
    threshold below is TWO-SIDED (min bounded away from 0.0, not only a max), so a
    deterministic anchor-follower FAILS the low side. NaN if policy_rate or cpi is
    absent, if fewer than 12 months are available at all, if fewer than 60 pooled
    observations result, or on any non-finite observation.
  condition_adherence_inflation_estimator: >-
    WP2.2 Task 6. abs(mean(trailing-12m YoY CPI inflation) - factor_conditions.
    inflation.average_pct), per path, percentage points. The YoY transform is
    ah.eval.metrics.economics.cpi_yoy_from_level (the SAME function
    policy_anchor_deviation_estimator already uses), applied to the ensemble's cpi
    level and averaged over the whole path (months 12..end). condition_adherence_
    error_inflation is the POOLED MEAN of this per-path array across every path of
    every checked-in fixtures/worlds/conditional/*.json world tagged
    extensions.x_condition_type="inflation"; condition_adherence_error_p90_inflation
    is the pooled 90th percentile of the identical array. THOSE AUTHORED WORLDS ARE
    INSIDE THIS SEAL (ah.eval.prereg._REQUIRED_JUDGED_FIXTURE_GLOBS): they are sealed
    INPUT DATA in exactly the sense factors.yaml is, because this definition is stated
    over them by name -- editing one world's average_pct changes this statistic's value,
    so it is a lock violation requiring a dated amendment, not a fixture edit. MONTE-
    CARLO ERROR for every statistic in this suite is measured across REGENERATION SEEDS
    (ah.eval.metrics.conditional.conditional_mc_error: std, ddof=1, over
    CONDITIONAL_MC_ERROR_REPLICATES=8 further regenerations at
    meta.seed + 79190000*(r+1)), not across subsamples of the judged ensemble's paths --
    which no metric here reads, and which would therefore report a misleading 0.0.
    Lower is better without a
    two-sided floor (unlike policy_anchor_deviation_estimator): the WorldSpec
    EXPLICITLY asked for this exact number, so an exact hit is the correct answer, not
    a degenerate one. NaN (poisoning the WHOLE pooled metric, not dropping silently)
    if the ensemble's own generator_id has no registered generator, the generator
    raises, cpi is absent from a regenerated world's ensemble, or fewer than
    CONDITIONAL_MIN_OBS=20 pooled per-path observations result.
  condition_adherence_rate_estimator: >-
    WP2.2 Task 6. The mean of abs(realized_start - start_pct) and
    abs(realized_end - end_pct), per path, percentage points, over whichever of
    factor_conditions.policy_rate.{start_pct,end_pct} the world specifies (both, in
    every checked-in fixture) -- realized_start/realized_end are the path's own
    first-month/last-month policy_rate level. Pooled mean/p90 exactly as
    condition_adherence_inflation_estimator, across every world tagged
    extensions.x_condition_type="rate". Same NaN/poisoning rules (unresolvable
    generator, policy_rate absent, fewer than 20 pooled observations).
  condition_adherence_crisis_timing_estimator: >-
    WP2.2 Task 6. abs(quarter_of_worst_equity_shock - target_quarter), per path, in
    quarters. quarter_of_worst_equity_shock is the index (0-based, in quarters) of the
    non-overlapping 3-month block of equity_mkt with the most negative cumulative sum
    over the whole path (ah.eval.reference.nonoverlapping_sums, horizon_months=3,
    reused -- not a second windowing scheme); target_quarter is factor_conditions.
    crisis_windows[0].start_quarter + length_quarters/2 (the window's own midpoint).
    Pooled mean/p90 across every world tagged extensions.x_condition_type=
    "crisis_timing". Same NaN/poisoning rules as condition_adherence_inflation_
    estimator, substituting equity_mkt for cpi.
  condition_adherence_crisis_severity_estimator: >-
    WP2.2 Task 6. abs(realized_worst_quarterly_shock_pct - target_shock_pct), per
    path, percentage points. realized_worst_quarterly_shock_pct = max(0, -min(non-
    overlapping 3-month equity_mkt sums over the whole path)) * 100 -- the magnitude of
    the path's GLOBAL worst quarterly shock, deliberately NOT restricted to the
    specified crisis window (condition_adherence_error_crisis_timing already measures
    placement; conflating the two would double-count a timing miss as a severity
    failure too). target_shock_pct = factor_conditions.crisis_windows[0].severity *
    CRISIS_SEVERITY_REFERENCE_QUARTERLY_SHOCK_PCT (22.0) -- a STATED, SIMPLIFIED linear
    mapping: Q4 2008 S&P 500 total return was approximately -21.9% (rounded to 22.0),
    the historical event the WorldSpec schema's own crisis_windows.severity
    description names as the severity=1.0 anchor ("1 = 2008-scale"); no generator-
    visible quantity gives severity a formula of its own, the identical shape of
    substitution TAYLOR_PI_TARGET makes for policy_anchor_deviation_estimator. Pooled
    mean/p90 across every world tagged extensions.x_condition_type="crisis_severity".
    Same NaN/poisoning rules, substituting equity_mkt for cpi.
  off_support_estimator: >-
    WP2.2 Task 6, Part B. Sweeps exactly the "inflation" and "rate" condition types
    (see conditional.py's module docstring for why crisis_timing/crisis_severity are
    excluded -- no real-valued historical distance under this simple definition;
    WP2.7's support.py, Mahalanobis distance on encoder features, supersedes this
    placeholder for every condition type once encoder features exist). DISTANCE FROM
    SUPPORT: for a swept target v against a reference quantity X (trailing-12m YoY CPI
    inflation for "inflation"; the raw policy_rate level for "rate" -- both read from
    ReferenceStats.historical_series, train+validation only, never a fresh catalog
    read), distance(v) = abs(v - mean(X)) / std(X), an ordinary z-score. Four swept
    levels, each a STATED z-score constructing the actual target as mean(X) +
    z*std(X), clipped to the WorldSpec schema's own valid range for that field (READ
    from schemas/worldspec-v1.0.schema.json at run time, never restated in code):
    typical (z=0.0, the historical mean itself), p95/p99 (the standard-normal
    95th/99th-percentile z-scores 1.6448536269514722 / 2.3263478740408408 -- a
    Gaussian PROXY for "that far from the mean", not history's own empirical
    percentile), beyond (z=4.0, a stated counterfactual extreme). off_support_
    adherence_at_{level} is the pooled MEAN of condition_adherence_inflation_
    estimator's and condition_adherence_rate_estimator's own per-path error
    definitions (both percentage points, so directly poolable), evaluated at that
    level's swept target, across BOTH swept types. off_support_pass_rate_at_{level} is
    the fraction of the IDENTICAL pooled per-path error array at or below
    OFF_SUPPORT_PASS_TOLERANCE_PCT=2.0 percentage points (a stated, round tolerance in
    the shared unit). "Battery" here names this suite's OWN pooled checks across the
    two swept types at a level, NOT the full cross-suite validation battery -- see
    conditional.py's module docstring. Same NaN/poisoning rules as the four
    condition_adherence_*_estimator blocks above (unresolvable generator, absent
    factor, fewer than 20 pooled observations); additionally NaN if reference.
    historical_series lacks a usable support mean/std for EITHER swept type. That
    all-or-nothing rule is load-bearing: "across BOTH swept types" is this statistic's
    identity, so a vintage carrying policy_rate history but no cpi history must NaN
    rather than silently report the rate arm alone -- a different, smaller number under
    a name that says it means something else.

# --------------------------------------------------------------------------- #
# Derived series -- declared BEFORE d4_strategies, because strategies reference them.
#
# Each entry names its source factor, its transform, every parameter, and the
# closed-form formula in full, so the series is reconstructible from this file alone.
# Notation: y_t is the source factor's generated value at month t, IN PERCENT
# (conventions.units_of_level_factors); r_t is the derived monthly return, in DECIMAL.
# --------------------------------------------------------------------------- #
derived_series:
  govt_tr_10y:
    from: ust_10y
    transform: bond_total_return
    numeraire: total_return
    params: {duration_years: 8.5}
    formula: "r_t = 0.01 * ( y_{t-1}/12 - D*(y_t - y_{t-1}) ), D = duration_years = 8.5; r_0 = 0.0"
    notes: >-
      Long-government TOTAL RETURN from the 10y yield level. Two terms: carry, the
      previous month-end yield earned over one month (y_{t-1}/12, an annual percent
      rate divided by 12); and price, minus modified duration times the yield change
      over the month (-D*(y_t - y_{t-1})). The leading 0.01 is the single
      percent-to-decimal conversion (conventions.percent_to_decimal_statement); it is
      applied to the whole bracket, and both terms inside the bracket are in percent.
      SIGN: a RISING yield produces a NEGATIVE r_t, because the price term dominates
      for any realistic monthly yield change -- this is the whole point of the
      transform: a rising 10y yield must book a monthly loss on the total-return leg,
      not a gain, for any month 0..lookback where the yield change is not implausibly
      large relative to 1/D.
      LAG: r_t uses y_{t-1} for the carry term and the t-1 -> t change for the price
      term, so month 0 has no defined value and is 0.0 by the single warm-up rule
      (conventions.warm_up). duration_years = 8.5 is the sealed parameter: the
      approximate modified duration of a par 10-year Treasury at mid-single-digit
      yields. Convexity is deliberately omitted -- this is a first-order
      approximation, and stating it here means the omission is sealed, not accidental.

  credit_xs_hy:
    from: hy_spread
    transform: spread_excess_return
    numeraire: zero_cost
    params: {spread_duration_years: 4.0}
    formula: "r_t = 0.01 * ( s_{t-1}/12 - SD*(s_t - s_{t-1}) ), SD = spread_duration_years = 4.0; r_0 = 0.0"
    notes: >-
      High-yield credit EXCESS RETURN (excess of the duration-matched government
      leg) from the HY option-adjusted spread level. Same two-term shape as
      bond_total_return with spread duration in place of duration: carry, the previous
      month-end spread earned over one month (s_{t-1}/12); and price, minus spread
      duration times the spread change (-SD*(s_t - s_{t-1})). Same single leading 0.01
      percent-to-decimal conversion, same lag, same warm-up (r_0 = 0.0).
      SIGN: a WIDENING spread produces a NEGATIVE r_t, for the same reason as
      govt_tr_10y above -- the price term dominates any realistic monthly spread
      change, so credit excess return must book a loss when spreads widen, not a gain.
      spread_duration_years = 4.0 is the sealed parameter, the approximate spread
      duration of the broad US high-yield index. Default losses are deliberately NOT
      modelled: this is a spread-carry and
      spread-change decomposition only, so realized credit losses from defaults are
      absent and the series overstates high-yield excess return in a default wave.
      Sealed as a stated simplification.

  cash_tr_1m:
    from: policy_rate
    transform: bond_total_return
    numeraire: total_return
    params: {duration_years: 0.0}
    formula: "r_t = 0.01 * ( y_{t-1}/12 - 0.0*(y_t - y_{t-1}) ) = 0.01 * y_{t-1}/12; r_0 = 0.0"
    notes: >-
      One-month cash return, used as the funding leg of `carry`, earned at the
      OVERNIGHT POLICY RATE compounded simply over the month (y_{t-1}/12), not at a
      literal one-month term rate. Since WP2.2 Task 1's fix pass, `policy_rate` maps to
      fred.FEDFUNDS -- the effective federal funds rate, an actual overnight funding
      rate -- which is what makes that reading defensible; under the earlier
      fred.TB3MS mapping this entry would have been funding cash at a 3-month bill
      yield while calling it a one-month rate. french.rf (the Fama-French one-month
      bill return) is the literal one-month rate and is registered, but it is
      deliberately NOT used here: `carry`'s funding leg must be the same rate the
      generator emits as a factor, and the generator emits policy_rate, not french.rf.
      The residual difference (overnight vs one-month, a few basis points of term
      premium) is a stated, sealed simplification. policy_rate is a level in percent,
      so like every other level it may enter a strategy only through a declared
      transform -- this entry is that declaration, and it is why `carry` contains no
      bare percent-to-decimal arithmetic of its own. It reuses
      bond_total_return with duration_years = 0.0 rather than introducing a third
      transform: cash IS a zero-duration instrument, so the general bond formula
      collapses exactly to the carry term, as the formula above shows term by term.
      LAG: r_t uses y_{t-1}, i.e. funding is at the rate prevailing at the START of
      the month -- which is both the economically correct convention and the same lag
      as the long leg, so the two legs of `carry` are consistent. Month 0 is 0.0 by
      the single warm-up rule.

# --------------------------------------------------------------------------- #
# The D4 benchmark-strategy set.
#
# A `weights` key names EITHER an active factor id (return-bearing, used directly) OR
# a `derived_series` id declared above. Level factors never appear here.
# --------------------------------------------------------------------------- #
d4_strategies:
  eqw_factors:
    kind: static_weights
    rebalance: monthly
    lookback: null
    rule: null
    weights:
      equity_mkt: 0.2
      smb: 0.2
      hml: 0.2
      mom: 0.2
      commodities: 0.2
    params: {}
    notes: >-
      Equal weight across the active factor set's return-bearing series, used
      directly with no transform (see conventions.units_of_return_bearing_factors for
      exactly what is known -- and not known -- about their units). The remaining
      active factors (equity_vol, ig_spread, hy_spread, policy_rate, ust_2y, ust_10y,
      cpi, hqm_curve, funding_spread) are level/rate/spread series, not return-bearing,
      and are excluded from this strategy by construction: an equal-weight sleeve over
      "the return-bearing series" is defined on returns, and a level has no place in
      it. Two of them (ust_10y, hy_spread) do reach other D4 strategies, but only
      through the declared derived series above, never here. commodities has no Step-1
      data source yet; its weight is declared but its reference statistics are pending
      -- see rationale.d4_commodities_consequence for what that means for D4 overall.

  sixty_forty:
    kind: static_weights
    rebalance: monthly
    lookback: null
    rule: null
    weights:
      equity_mkt: 0.6
      govt_tr_10y: 0.4
    params: {}
    notes: >-
      60% equity (equity_mkt, used directly as a return), 40% long-government TOTAL
      RETURN via the govt_tr_10y derived series -- NOT the ust_10y level. This is the
      distinction that makes the strategy correct: a 60/40 bond leg must FALL when
      yields rise, which is exactly what govt_tr_10y does and what weighting the raw
      ust_10y level would have got backwards. ust_2y (short/intermediate) is not used.
      The bond leg's month 0 is 0.0 (conventions.warm_up), so the strategy's first
      month is 0.6 * equity_mkt_0.

  endowment_proxy:
    kind: static_weights
    rebalance: monthly
    lookback: null
    rule: null
    weights:
      # This is the flat, series-keyed table the loader reads. `proxy_mapping` below
      # is the sleeve-level breakdown; sleeves that share a series are summed here
      # (equity 0.45 + reits 0.20 = equity_mkt 0.65). The loader CHECKS that roll-up
      # against this table to within 1e-9 and fails the load if it disagrees, so the
      # two can never drift apart after the seal.
      equity_mkt: 0.65
      govt_tr_10y: 0.10
      credit_xs_hy: 0.15
      commodities: 0.10
    proxy_mapping:
      equity:
        weight: 0.45
        factor: equity_mkt
        reason: >-
          Public equity, plus the private-equity sleeve (buyout, growth, venture
          capital). De-smoothed private-equity returns are dominated by public-
          equity beta over the multi-year/tail horizons D4 targets (the same
          desmoothing logic ah.data.desmooth is built on); nearest factor proxy is
          equity_mkt. No separate private-equity factor exists in the manifest.
      reits:
        weight: 0.20
        factor: equity_mkt
        reason: >-
          Public and private real estate (REITs + direct real estate). No REITs or
          real-estate factor is declared in factors.yaml; over tail horizons listed
          REIT total returns carry a dominant equity beta, so equity_mkt is the
          nearest factor proxy. This is a stated simplification -- it drops REITs'
          secondary rate sensitivity.
      govt:
        weight: 0.10
        factor: govt_tr_10y
        reason: >-
          Fixed-income ballast, held as the long-government TOTAL RETURN derived
          series, not as the ust_10y level. Ballast is a return stream that gains when
          yields fall; the level would have booked the opposite sign.
      credit:
        weight: 0.15
        factor: credit_xs_hy
        reason: >-
          Public credit, plus the private-credit sleeve (direct lending, mezzanine,
          distressed). Private/direct-lending credit risk is economically closest to
          leveraged/high-yield corporate credit; nearest proxy is the credit_xs_hy
          derived series -- the high-yield EXCESS RETURN, not the hy_spread level. The
          level would have booked spread widening as a gain, i.e. exactly inverted the
          sleeve's crisis behaviour. No separate private-credit factor exists in the
          manifest.
      commodities:
        weight: 0.10
        factor: commodities
        reason: >-
          Real assets / infrastructure sleeve, proxied by the commodities factor --
          the nearest available real-asset exposure in the active manifest.
          Pending data: commodities has no Step-1 series yet (see factors.yaml and
          rationale.d4_commodities_consequence); this weight is declared but its
          reference statistics are pending until a source is registered.
    notes: >-
      Factor-level stand-in for a typical institutional endowment mix: equity /
      govt / credit / commodities / REITs, with private sleeves represented by
      their nearest proxy (proxy_mapping above states each sleeve's own weight, its
      proxy series, and the reason -- required so private-sleeve representation is
      explicit and auditable, WP2.1b Item 1). The govt and credit sleeves are held
      through derived series so that both carry the correct sign in a crisis. Sleeve-
      level tail behaviour is a Step-3 property once real mappings exist and is not a
      G2 criterion -- see the `rationale` block above.

  momentum:
    kind: rule
    rebalance: monthly
    lookback: 12
    rule: momentum_12_1
    weights: {}
    params:
      target_series: equity_mkt
      skip_months: 1
    notes: >-
      12-1 momentum on the equity factor, monthly rebalanced. The target series is
      sealed HERE, as params.target_series, not fixed in code. LOOKBACK IS DECLARED
      EXACTLY ONCE, in the `lookback` field above; `params` must NOT also carry a
      `lookback_months` key and the loader rejects it if present, so an amendment
      editing `lookback` alone can never be silently ignored. Signal at month t = sum
      of target_series' monthly values over months [t - lookback, t - skip_months) --
      i.e. t-12 .. t-2 inclusive (11 months); the most recent skip_months=1 month is
      excluded, the standard 12-1 convention that avoids short-term reversal
      contamination. Position is long-only and binary: fully invested (weight 1.0) if
      the signal is strictly positive (> 0.0), flat (weight 0.0) otherwise -- a signal
      of exactly 0.0 is flat. Realized return at month t = position_t *
      target_series_t. Warm-up: months 0..lookback-1 (the first 12) have no complete
      signal window and are flat, position 0.0 and realized return 0.0, per the single
      warm-up rule in conventions.warm_up.

  carry:
    kind: rule
    rebalance: monthly
    lookback: null
    rule: term_structure_carry
    weights: {}
    params:
      long_series: govt_tr_10y
      funding_series: cash_tr_1m
      long_weight: 1.0
      funding_weight: -1.0
    notes: >-
      Term-structure carry: a static, always-on long position in the long-government
      total return, funded at the one-month cash rate. Both legs are sealed here as
      params.long_series / params.funding_series, and BOTH ARE DERIVED SERIES, so
      neither leg contains a raw percent level and this definition needs no unit
      arithmetic of its own -- the percent-to-decimal conversion and the lag live in
      the derived_series declarations above, where they are stated once. Realized
      return at month t = long_weight * govt_tr_10y_t + funding_weight * cash_tr_1m_t
      = 1.0 * govt_tr_10y_t - 1.0 * cash_tr_1m_t. No timing signal, unlike momentum:
      the position is contemporaneous every month and `lookback` is null. This is why
      carry is `kind: rule` and not `static_weights`: a funded long-short position's
      exposures sum to 0.0, not 1.0, so it cannot satisfy the static_weights
      validation rule (weights must sum to 1.0 within 1e-9). Warm-up: both legs are
      0.0 in month 0 (conventions.warm_up), so carry's month 0 is 0.0.

# --------------------------------------------------------------------------- #
# Acceptance thresholds -- block-nested (WP2.1b Item 2 / Task 4).
#
# WHAT IS AND IS NOT IN THIS SECTION (WP2.3, read this before reading a number).
#
# THE PER-NAME REFERENCE BANDS ARE NOT HERE, AND THAT IS DELIBERATE. Every
# "<factor>.<stat>" band the battery judges against is computed at run time by
# ah.eval.reference.compute_reference from the sealed campaign vintage, at the sealed
# reference_run parameters, and is reproducible bit-for-bit from them -- so the bands
# ARE sealed, by the reference_run block plus the hashed code that computes them,
# without 975 numbers being transcribed into this file where they could drift. What
# lives HERE is the layer above: the family GATES that turn hundreds of band
# comparisons into a verdict, the structural AUDITS whose bound is a definition rather
# than an estimate, and a small set of per-name ABSOLUTE bounds.
#
# WHY NOT A PER-NAME ENFORCE BAND FOR EVERY STATISTIC. At ~570 monthly comparisons,
# gating each name at enforce against its own 90% band rejects a PERFECT generator with
# probability indistinguishable from 1 (1 - 0.9^570). That is why the three
# *_band_exceedance_fraction gates exist and why they, not per-name bands, are the
# blocking surface for fidelity.
#
# THE ABSOLUTE BOUNDS BELOW ARE "ABSURDITY BOUNDS", derived once, uniformly:
#     min/max = band_midpoint -+ K * band_half_width,  K = 4
# on the sealed reference run's own band for that name, INTERSECTED with the
# statistic's own structural range -- and where 4 half-widths falls outside that range,
# THAT SIDE IS NOT SEALED AT ALL (`null`) rather than sealed at a value that could
# never be violated, since a threshold that judges nothing reads in the artifact as a
# check that passed. K = 4 is derived, not chosen for effect: a 90% band's half-width
# is 1.645 sigma for a roughly normal statistic, so 4 half-widths is ~6.6 sigma, a
# two-sided rate of ~5e-11 per comparison and ~3e-8 family-wise over ~570 comparisons
# -- comfortably below the ~1/570 a per-name bound needs to avoid rejecting a correct
# generator, with room to spare for the non-normality of these statistics.
# WHAT THEY ADD over the band lookup, which is the only reason to seal them: an
# absolute bound still judges when the band does not exist. equity_mkt.variance_ratio_
# 60m's band is NaN on this run (n_valid_resamples = 0: a 120-month replicate cannot
# supply the 10 non-overlapping 60-month sums the estimator requires), and 33 of the
# negative-control run's comparisons rest on fully degenerate zero-width bands that
# ah.eval.battery.band_is_usable correctly bars from gating. On those, an absolute
# bound is the only judgment available.
#
# EVERY PER-NAME BOUND IS `report`, NOT `enforce`, AND THAT IS A STATED WEAKNESS.
# Two reasons, both real. (1) The pooled statistics (skew, excess_kurtosis, the Hill
# indices, the aggregational-Gaussianity kurtoses, crisis_corr_lift) are computed over
# n_paths*months pooled observations on the generated side while the band's replicates
# carry only `months`, and sample kurtosis of a fat-tailed process rises with sample
# size -- so a per-name enforce MAX on a pooled tail statistic, derived from a per-path
# band, could reject a CORRECT generator by an amount nobody has measured
# (limitations.pooled_vs_per_path_band_semantics). (2) No measurement of the gates' null
# exceedance rate exists yet (limitations.null_exceedance_rate_is_unverified), so the
# K = 4 argument rests on a normal approximation rather than on observation.
# CONSEQUENCE: the ENFORCE surface of this battery is exactly five names --
# moment_band_exceedance_fraction, dependence_band_exceedance_fraction,
# near_duplicate_fraction, money_pump_violations, floor_violations -- and nothing else.
# WP2.4's bootstrap-v1 run is what makes per-name enforce bounds derivable, by
# supplying the first real observation of the null; promoting any of them is then a
# dated threshold_change amendment.
#
# FOUR SECTIONS, FOUR KEY SHAPES, one per statistic scope (WP2.2 Task 4 adds the
# fourth, thresholds.strategies):
#   thresholds.blocks.<block>       key "<factor>.<stat>",           stat in
#                                   ah.eval.reference.SINGLE_FACTOR_STATS
#   thresholds.cross_blocks.<a|b>   key "<factorA>~<factorB>.<stat>", stat in
#                                   ah.eval.reference.CROSS_BLOCK_STATS
#   thresholds.panel                key "<stat>" (bare),              stat in
#                                   ah.eval.reference.PANEL_STATS
#   thresholds.strategies           key "<strategy_id>.<stat>",       strategy_id a
#                                   d4_strategies entry of THIS document, stat in
#                                   ah.eval.reference.STRATEGY_STATS
# A panel statistic is a property of the whole factor panel and belongs to no single
# factor or pair, so it carries no prefix at all. CLAIMS-SWEEP CORRECTION: this sentence
# ended "-- cross_block_corr_matrix_distance is the one entry today", which was true when
# WP2.2 Task 4 wrote it and false by the time it was sealed. Tasks 5 and 6 registered the
# band-exceedance gates, the memorization, calibration, economics and conditional
# statistics into PANEL_STATS, which today holds 49 names, of which this section seals 35
# -- and cross_block_corr_matrix_distance is merely the first of them. Nothing about the
# KEY SHAPE changed (a panel key is still a bare registered name, and verify() still
# rejects a prefixed one); only the count was stale, and it was stale in the direction
# that understates how much this section carries. `severity` is `enforce` (an
# out-of-band value blocks the gate) or
# `report` (recorded, non-blocking). ah.eval.prereg.verify() checks: every active block
# has a thresholds.blocks entry; no entry names an inactive block; every active
# cross-block pair (ah.factors.FactorManifest.cross_block_pairs(), currently just
# global|us) has a thresholds.cross_blocks entry; no entry names an inactive block;
# every severity is enforce/report; min <= max where both are given.
#
# The KEY NAMING RULE above is itself machine-checked, not merely stated: verify()
# rejects a per-block key that is not exactly "<factor>.<stat>" with the factor in that
# same block and the stat registered in SINGLE_FACTOR_STATS; a cross-block key that
# is not exactly "<factorA>~<factorB>.<stat>" with factorA drawn from the pair key's
# first block, factorB from its second (the pair key is sorted, and reference.py keys
# the statistic in that order), and the stat registered in CROSS_BLOCK_STATS; and a
# panel key that is not a bare name registered in PANEL_STATS. Without those checks a
# sealed `enforce` threshold could name a statistic nothing computes -- a threshold that
# judges nothing, silently, forever. NOTE, because it decides how a bad entry fails:
# once `sealed: true` lands, ah.eval.battery.run_battery calls verify() on EVERY
# invocation, so a key naming an unregistered statistic does not merely fail the seal --
# it stops every battery run.
# --------------------------------------------------------------------------- #
thresholds:
  blocks:
    # Every entry below is `band_midpoint -+ 4 * band_half_width` on the sealed
    # reference run's own band for that name, with the band quoted in each comment so
    # the arithmetic is checkable from this file alone, and with a side sealed `null`
    # wherever 4 half-widths leaves the statistic's structural range. Only names an
    # actual MetricSpec emits appear -- a threshold on a registered reference statistic
    # that no suite computes would judge nothing, silently, forever. NOTE that
    # `<factor>.mean`, `<factor>.std` and `<a>~<b>.correlation` ARE emitted as of WP2.2c
    # Item 1 (governance/retrofit-register.md RFR-34 is closed; RFR-58 records the
    # correction), and their bands are judged as a family by
    # moment_band_exceedance_fraction. They carry no per-name threshold here because a
    # family gate is the right instrument for them, not because they are unjudged.
    global:
      # band [-1.087435, 0.668305]; historical point 0.142349. Both sides bind: skew is
      # unbounded, so nothing clips.
      "equity_mkt.skew": {min: -3.7210, max: 3.3019, severity: report}
      # band [-0.389892, 5.443227]; historical point 7.503559. NOTE the point sits ABOVE
      # its own band -- expected and not a defect: `point` is computed on all 1134
      # months of history while the band is the interval a 120-month replicate produces,
      # and excess kurtosis is strongly sample-size dependent (see
      # conventions.estimator_length_matching). Lower side NOT sealed: 4 half-widths
      # reaches -9.14, below the structural minimum of -2 that excess kurtosis cannot go
      # under, so a `min` there could never be violated.
      "equity_mkt.excess_kurtosis": {min: null, max: 14.1929, severity: report}
      # band [-0.281798, 3.247541]; historical point 4.281881. DN-1.1's named
      # volatility-clustering statistic. The enforce judgment on this family is
      # dependence_band_exceedance_fraction, not this bound.
      "equity_mkt.acf_abs_sum": {min: -5.5758, max: 8.5416, severity: report}
      # band [-0.382038, 0.058947]; historical point -0.118227. DN-1.1's leverage
      # effect. Lower side NOT sealed: 4 half-widths reaches -1.0435, outside a
      # correlation's own [-1, 1] range.
      "equity_mkt.leverage_correlation": {min: null, max: 0.7204, severity: report}
      # band [1.890591, 5.874610]; historical point 2.517642. A Hill index is strictly
      # positive, so the lower side (4 half-widths reaches -4.09) is NOT sealed.
      "equity_mkt.hill_tail_index_5pct": {min: null, max: 11.8506, severity: report}
      # ------------------------------------------------------------------- #
      # CAMPAIGN-3 COMMODITIES FAMILY (ruling K2, AM-2026-08-10-001). The factor
      # is newly sourced (aqr.cmdty_ew_excess + french.rf, 1926-07..2020-12,
      # n=1134) -- the same footing every campaign-2 block addition had, and the
      # ONE exception to "no name added on the strength of seeing the run". The
      # five names mirror equity_mkt's exactly (the return-factor convention);
      # same recipe, same severity, bands from
      # artifacts/campaign3/reference-run.json. NOTE: no new cross_blocks entry
      # -- commodities joins the EXISTING global block, no new active pair
      # exists, and verify()'s one-entry-per-pair requirement is already met.
      # ------------------------------------------------------------------- #
      # band [-0.794507, 1.386598]; historical point 0.506187. Both sides bind.
      "commodities.skew": {min: -4.0662, max: 4.6583, severity: report}
      # band [-0.062816, 4.330426]; historical point 3.645502. Lower side NOT
      # sealed: 4 half-widths reaches -6.65, below the structural minimum of -2.
      "commodities.excess_kurtosis": {min: null, max: 10.9203, severity: report}
      # band [-0.726780, 3.471064]; historical point 4.071706. Both sides bind.
      "commodities.acf_abs_sum": {min: -7.0235, max: 9.7678, severity: report}
      # band [-0.258013, 0.248415]; historical point 0.066630. VACUOUS ON BOTH
      # SIDES and stated as such (the campaign-2 cross-pair honesty): 4
      # half-widths spans [-1.02, 1.01], outside a correlation's [-1, 1] range
      # in both directions, so neither side can bind.
      "commodities.leverage_correlation": {min: null, max: null, severity: report}
      # band [1.976939, 5.850324]; historical point 2.734947. A Hill index is
      # strictly positive, so the lower side (raw -3.83) is NOT sealed.
      "commodities.hill_tail_index_5pct": {min: null, max: 11.6604, severity: report}
    us:
      # `policy_rate.excess_kurtosis` WAS REMOVED AT THE FIRST SEAL AND IS RESTORED HERE,
      # at severity REPORT, not the enforce it originally carried. The history matters
      # because it is the one threshold in this file whose status has moved twice. The
      # pre-seal draft had it at `enforce`; the first seal removed it because policy_rate
      # had no train+validation data on the 2026-07-24 vintage, and under THE ONE NaN
      # RULE an enforce threshold on a NaN statistic FAILS EVERY RUN FOREVER (that is
      # the hole governance/retrofit-register.md RFR-5 asked WP2.3 to close, and
      # ah.eval.prereg.verify() enforces it mechanically). On campaign vintage
      # 2026-07-26.1 policy_rate has 798 train+validation months and a real band, so the
      # reason for removal is gone and the name is restored -- as `report`, like every
      # other per-name bound in this file, for the family-wise-error reason stated in
      # this section's header. Nothing else is restored with it: the enforce surface is
      # unchanged at five names, and no NEW per-name bound was added on the strength of
      # the new factor, because selecting names after seeing a run is how a threshold
      # gets fitted.
      # CAMPAIGN-3 (AM-2026-08-10-001): band re-derived on the extended panel
      # (policy_rate now 1934-01.., the fedfunds_pre1954 splice applied at read).
      # band [-1.465808, 1.746486]; historical point 1.537653. Lower side NOT sealed: 4
      # half-widths reaches -6.28, below excess kurtosis's structural minimum of -2.
      # Superseded campaign-2 values: band [-1.455738, 2.169716], max 7.6079.
      "policy_rate.excess_kurtosis": {min: null, max: 6.5649, severity: report}
      # CAMPAIGN-3: ust_10y extended to 1953-04 (GS10 + par-yield extension); band
      # moved accordingly. band [0.921987, 0.977457]; historical point 0.993587. A
      # PER-PATH statistic, so the pooled/per-path mismatch does not apply to it.
      # Upper side NOT sealed: 4 half-widths reaches 1.0607, outside an
      # autocorrelation's [-1, 1] range. The surviving `min` says a 10-year yield
      # LEVEL must stay persistent, which is the falsifiable content.
      # Superseded campaign-2 values: band [0.921121, 0.975344], min 0.8398.
      "ust_10y.acf_r_lag1": {min: 0.8388, max: null, severity: report}
      # CAMPAIGN-3 band [3.679321, 4.580812]; historical point 4.883684. Upper side
      # NOT sealed: 4 half-widths reaches 5.933, above the structural maximum of 5
      # for a sum of five autocorrelations. Superseded campaign-2: band
      # [3.659931, 4.564024], min 2.3038.
      "ust_10y.acf_r_sum": {min: 2.3271, max: null, severity: report}
      # CAMPAIGN-3 band [-1.159448, 0.824898]; historical point 0.463249. Lower side
      # NOT sealed (structural minimum -2, as for equity_mkt above). Superseded
      # campaign-2: band [-1.181082, 0.666286], max 3.4373.
      "ust_10y.excess_kurtosis": {min: null, max: 3.8014, severity: report}
      # band [-1.545279, 2.006997]; historical point -0.699652. Same structural clip.
      # CAMPAIGN-3: BIT-IDENTICAL to campaign-2 (cpi's data is unchanged and the
      # seed is kept -- the RFR-61 discipline demonstrating itself).
      "cpi.excess_kurtosis": {min: null, max: 7.3354, severity: report}
    # ----------------------------------------------------------------------- #
    # CAMPAIGN-2 BLOCK ADDITIONS (AM-2026-08-02-007/-008; merged here as part of
    # the campaign-2 re-seal -- the amendment payloads are the audit record and a
    # test asserts these entries equal them). Same recipe as every entry above:
    # the campaign-2 reference run's own band (quoted per entry; provenance
    # artifacts/campaign2/reference-run.json, sealed seed, RFR-61 outcome: every
    # checked pre-existing band recomputed BIT-IDENTICAL), mid -+ 4 half-widths,
    # a side sealed null where that leaves the statistic's structural range,
    # severity report throughout -- no new enforce name, for the family-wise-error
    # reason the section header states.
    fx:
      # CAMPAIGN-3 (AM-2026-08-10-001): fx_usd extended to 1953-04 -- the pegged
      # era enters via the parity/pre-2006 rules (proxy share disclosed per
      # multi_seed_decision_rule.proxy_share_disclosure) and every band below
      # moved. Superseded campaign-2 values quoted per entry.
      # band [0.904861, 0.986080]; point 0.995218. Upper side NOT sealed: 4
      # half-widths reaches 1.1079, outside an autocorrelation's [-1, 1]. The
      # surviving min says a trade-weighted dollar LEVEL must stay persistent --
      # the falsifiable content. Campaign-2: band [0.916783, 0.987438], min 0.8108.
      "fx_usd.acf_r_lag1": {min: 0.783, max: null, severity: report}
      # band [3.329675, 4.729389]; point 4.902614. Upper side NOT sealed (4
      # half-widths reaches 6.829, above the structural max of 5 for a sum of five
      # autocorrelations). Campaign-2: band [3.532848, 4.735283], min 1.7292.
      "fx_usd.acf_r_sum": {min: 1.2301, max: null, severity: report}
      # band [-1.584479, 2.824626]; point -0.851731. Lower side NOT sealed
      # (structural minimum -2). Campaign-2: band [-1.540829, 1.349860], max 5.6859.
      "fx_usd.excess_kurtosis": {min: null, max: 9.4383, severity: report}
    valuation:
      # band [0.924902, 0.983156]. Upper side NOT sealed ([-1, 1] clip, as fx).
      # cape_v is DN-1's v_t -- the min is a decade-scale persistence floor on the
      # valuation state itself.
      "cape_v.acf_r_lag1": {min: 0.8375, max: null, severity: report}
      # band [3.770594, 4.696413]. Upper side NOT sealed (structural max 5).
      "cape_v.acf_r_sum": {min: 2.3819, max: null, severity: report}
      # band [-1.409280, 0.997569]. Lower side NOT sealed (structural minimum -2).
      "cape_v.excess_kurtosis": {min: null, max: 4.6078, severity: report}
  cross_blocks:
    "global|us":
      # band [-0.479115, 0.479350]; historical point 0.033634. DN-1.1's crisis-
      # conditional correlation lift. Both sides bind, but only just: crisis_corr_lift
      # is a difference of two correlations and so lies structurally in [-2, 2], and 4
      # half-widths reaches +-1.917 -- so this bound rules out only the last 4% of the
      # statistic's range at each end. STATED rather than dressed up: it is a weak
      # bound, and it is weak because the historical band is nearly as wide as the
      # statistic can be. cross_block_corr_matrix_distance (panel section) and the
      # dependence gate carry the real cross-block judgment.
      # (Was "equity_mkt~ust_10y.correlation" until WP2.2 Task 2's fix pass moved it,
      # because a bare cross-block `.correlation` then had a reference band but no
      # emitting MetricSpec. WP2.2c Item 1 has since ADDED that MetricSpec, so the
      # original key would be judgeable again today -- it is not restored here because
      # `correlation` is now covered as a family by moment_band_exceedance_fraction and
      # `crisis_corr_lift` is the DN-1.1-named statistic.)
      # CAMPAIGN-3 band [-0.480506, 0.479405]; point 0.013595 (both legs' data
      # extended; the band barely moved). Campaign-2: {min: -1.9168, max: 1.9170}.
      "equity_mkt~ust_10y.crisis_corr_lift": {min: -1.9204, max: 1.9193, severity: report}
    # CAMPAIGN-2 PAIRS (AM-2026-08-02-007/-008). One representative
    # crisis_corr_lift per pair, chosen PRE-HOC on macro grounds and mirroring
    # the sealed convention above; same derivation, same weak-bound honesty.
    # THREE of the five seal NULL ON BOTH SIDES: their historical bands are so
    # wide that 4 half-widths exceeds the statistic's whole [-2, 2] range in both
    # directions, so no side can bind. The entry exists because verify() requires
    # every active pair to carry one, and a stated-vacuous bound is more honest
    # than a pretend one -- the real cross-block judgment for these pairs, as for
    # global|us above, is cross_block_corr_matrix_distance and the dependence gate.
    # CAMPAIGN-3, THE THREE FX PAIRS (AM-2026-08-10-001): their crisis_corr_lift
    # bands are NaN ON THE EXTENDED PANEL and the entries seal VACUOUS with the
    # reason stated, which is the same honesty rule the campaign-2 vacuous
