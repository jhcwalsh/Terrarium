    # RE-DERIVED FROM A POST-WP2.2c RUN (governance/retrofit-register.md RFR-40(a),
    # closed here). The pre-WP2.2c values (0.05 / 0.1) were computed against a fixed
    # 24-month train grid; Item 2 replaced that with an all-offsets sliding search, so a
    # nearest-neighbour distance is now a minimum over ~830 candidates rather than ~35
    # and falls for every generator. Those numbers do not mean what they meant and none
    # of them survives here.
    #
    # THE NULL, MEASURED ON THE SEALED CAMPAIGN VINTAGE. There is no generator to
    # calibrate against yet, but there does not need to be: the right null is
    # HISTORY'S OWN self-similarity, which is the same quantity
    # near_duplicate_fraction's epsilon is already defined as. For every non-overlapping
    # 24-month TRAIN block of every factor clearing MEMORIZATION_MIN_TRAIN_BLOCKS,
    # against every non-overlapping sliding window of the same factor -- i.e. exactly
    # the search a generated block gets -- the pooled leave-one-out nearest-neighbour
    # distance (n = 367, over 12 factors) has p05 = 0.0557 and p50 = 2.0742. That is
    # what "an independent historical trajectory" scores.
    # REPRODUCE WITH: uv run python scripts/measure_seal_evidence.py --out <path>.
    # That script is new at the re-seal and calls ah.eval.metrics.memorization's own
    # private helpers rather than reimplementing the search, so the null and the metric
    # the battery judges cannot measure different things. At the first seal these
    # numbers came from an uncommitted prototype and a reader could not check them.
    # RE-DERIVED ON THE NEW VINTAGE, and the movement is small and in the expected
    # direction: policy_rate adds 28 train blocks (n 339 -> 367) whose own p05 is 0.467,
    # above the pool's, and whose p50 is 1.053, below it -- so the pooled p05 rises
    # slightly (0.0548 -> 0.0557) and the pooled p50 falls (2.1660 -> 2.0742). Both
    # floors moved by under 5%. The composition mismatch noted below is unchanged and is
    # what makes the pool sensitive to which factors are in it at all.
    #
    # THE FLOORS ARE HALF THOSE VALUES, and the factor of two is a STATED MARGIN, not a
    # computed quantity: a generator drawn from the same population as history sits AT
    # the null by construction, so a floor set at the null would flag roughly half of
    # all well-behaved generators. Half the null flags a generator whose blocks sit
    # systematically twice as close to training windows as independent history ever
    # sits to itself. Both are `report` PRECISELY BECAUSE the margin is a judgment: an
    # enforce bound resting on an unmeasured factor of two would be a gate nobody
    # derived. near_duplicate_fraction below is the enforce memorization gate, and its
    # bound IS derived.
    #
    # KNOWN COMPOSITION MISMATCH, stated: the historical pooled null weights each factor
    # by its own train block count (cpi contributes 49 blocks, policy_rate 28,
    # equity_vol 10), while the generated side pools n_paths * (months // 24) blocks per
    # factor -- EQUAL weight across factors. The two pools are therefore not composed
    # alike, and the null is dominated by the most self-similar factors (cpi's own p05
    # is 0.0153; smb's is 2.1672). WP2.4 must report bootstrap-v1's measured values
    # against these floors.
    # CAMPAIGN-3 (AM-2026-08-10-001): floors re-derived on the extended panel
    # (artifacts/campaign3/seal-evidence.json; 650 pooled blocks over 16
    # factors). The composition caveat above SHARPENS: fx_usd's own per-factor
    # p05 is exactly 0.0 -- pegged-era 24-month windows are constant-to-
    # machine-precision and sit at zero distance from each other, so the
    # pooled 5th percentile now rests partly on an era where history IS
    # self-identical. A generated fx path reproducing the peg would be flagged
    # "close to training data" for being RIGHT; that is why these floors are
    # `report`, and the equal-weight generated-side caveat applies with more
    # force than at campaign-2. Superseded campaign-2 floors: p05 0.0279,
    # p50 1.0371 (comment values cpi 0.0153 / smb 2.1672 refer to the
    # campaign-2 pools; campaign-3 per-factor values are in the artifact).
    "nn_distance_p05": {min: 0.0918, max: null, severity: report}
    "nn_distance_p50": {min: 1.2950, max: null, severity: report}
    "membership_inference_auc": {min: null, max: 0.75, severity: report}
    # WP2.2c Item 2 + Item 3. severity: enforce, max: 0.5 -- a LOOSENED bound at a
    # RAISED severity, and both halves are deliberate.
    #
    # The bound. `near_duplicate_fraction`'s null value is not 0: epsilon is the
    # MEMORIZATION_EPSILON_PERCENTILE-th (5th) percentile of the distribution of "how
    # close does a genuinely independent historical trajectory get", so a perfectly
    # non-memorizing generator drawn from the same population scores ~0.05 BY
    # CONSTRUCTION. The previous max of 0.05 therefore sat exactly ON the null and, at
    # enforce, would have rejected roughly half of all well-behaved generators. 0.5 is
    # the majority rule this file's band_gates block derives once and applies uniformly:
    # "more than half the generated blocks sit closer to some training window than 95%
    # of independent historical windows ever sit to each other". Under the null that is
    # Binomial(n_blocks, 0.05) exceeding n_blocks/2 -- below 1e-20 at any realistic
    # block count. It is 10x looser than the value it replaces.
    #
    # The severity. WP2.2b showed the metric could not separate a literal verbatim copy
    # (0.2423) from a plain block bootstrap (0.2394) because it measured block phase;
    # post-Item-2 a copy scores ~1.0 and a short-block resampler ~0.05-0.33. NC4 fails
    # this gate at 0.7096 (corrected in WP2.2c's honesty fix pass -- previously stated
    # here as "~1.0") against a bound TEN TIMES LOOSER than the one it previously FAILED
    # by 31% (0.0654 measured against the old max of 0.05 -- previously misstated here
    # as "cleared by 31%": 0.0654 is 31% ABOVE 0.05, i.e. a failure of the old bound, not
    # a pass of it) -- which is the evidence that the promotion is not a threshold tuned
    # to make a control fire. Memorization is also a hard, non-statistical failure:
    # STEP2-GENERATOR-PLAN Sec.WP2.3's own decision rule names "memorization below floor"
    # as a promotion gate, not as a reported diagnostic.
    #
    # CONSEQUENCE FOR WP2.4, recorded here rather than discovered there
    # (governance/retrofit-register.md RFR-40): a stationary block bootstrap whose block
    # length reaches the sealed 24-month memorization window emits literal verbatim
    # historical windows and scores ~1.0 on this metric, so it FAILS this enforce gate.
    # That is the metric reporting a true fact about such a generator, not a defect --
    # but it means `bootstrap-v1` must either use blocks materially shorter than 24
    # months or carry a dated exemption in governance/amendment-log.yaml.
    # RESOLVED AT SEAL TIME, first option, no exemption needed:
    # bootstrap_v1.mean_block_months is 6. TWO CORRECTIONS TO THE PARAGRAPH ABOVE, both
    # measured on the sealed campaign vintage rather than inferred (see
    # bootstrap_v1.block_length_derivation and governance/retrofit-register.md RFR-52).
    # (1) The "~1.0" figure was measured on nc5, a FIXED-24-month-block stitch. Block
    # lengths in a stationary bootstrap are GEOMETRIC, which is a different object: a
    # 24-month generated window is verbatim only when no restart falls inside it, with
    # probability (1 - 1/L)^23 -- 38% at L=24, not 100%. Measured near_duplicate_fraction
    # is 0.064 at L=6, 0.187 at L=12, 0.284 at L=18 and 0.361 at L=24, so a geometric
    # resampler CLEARS this 0.5 gate at every length tested and this gate is not what
    # bounds the block length. (2) What does bound it is nn_distance_p05, which collapses
    # to exactly 0.0 once that verbatim rate passes its own 5th percentile, at L about 8.
    #
    # NAMED, NOT JUST FIXED (WP2.2c honesty fix pass, Important 4): this is the eleventh
    # instance of this work package's dominant failure mode ("a metric that improves
    # when the generator produces less/is less like history" -- nine found in the
    # original WP2.2 suite review, per ah.eval.negative_controls's module docstring,
    # plus the corr-matrix-distance absent-factor gaming vector and this metric's own
    # block-phase blindness before Item 2's fix) -- and the FIRST one inside the
    # blocking (enforce) surface rather than caught by a guard test before it shipped.
    # nc1-iid-gaussian -- the worst generator in this suite, the one every other gate in
    # the battery exists partly to catch -- scores 0.0 on this metric and passes it
    # perfectly: an iid Gaussian shares no 24-month block structure with history at all,
    # so it is maximally UNLIKE any training window, which this metric reads as maximally
    # non-memorizing. This is structural to every memorization/near-duplicate metric
    # (the whole point is to compare against history, and a generator with nothing in
    # common with history trivially cannot look too much like it) and is plan-grounded --
    # STEP2-GENERATOR-PLAN Sec.WP2.3 names "memorization below floor" as a real promotion
    # gate -- so it is not a defect to fix. It is named here so a reader does not read a
    # near_duplicate_fraction PASS as a positive result about a generator's fidelity: it
    # is silent on fidelity entirely and only informative about copying.
    "near_duplicate_fraction": {min: null, max: 0.5, severity: enforce}
