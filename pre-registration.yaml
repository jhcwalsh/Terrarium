# --------------------------------------------------------------------------- #
# claims_with_tests -- THE SEALED SENTENCES THAT DESCRIBE A CHECK, AND THE TESTS
# THAT PIN EACH ONE TO THE CODE.
#
# WHY THIS BLOCK EXISTS. This file's evidential value rests entirely on its sentences
# being TRUE ABOUT THE CODE. Twice they were not, and both survived multiple review
# passes:
#   - seal_scope.splice_py_reason asserted that `policy_rate` and `hy_spread` are in
#     reference_run.missing_factors "because the backfills are absent". The list is
#     [commodities, hy_spread]; policy_rate has 798 train+validation months.
#   - multi_seed_decision_rule.criterion_bearing_runs_only named three conditions and
#     pointed at BatteryReport.criterion_bearing as recording them. The code compared
#     n_paths and months and nothing else.
# Both were fixed, each with a test. The general problem was not: a sentence asserting
# a check is prose, and nothing made prose answerable to the implementation. The
# claims-sweep pass (2026-07-26) audited every such sentence in this file and in the
# hashed sources and found ELEVEN more: seven in this document, and four in hashed
# SOURCE prose -- factors.yaml's header and ah/eval/prereg.py's docstring each carrying
# a third and fourth copy of the same already-corrected false sentence, ah/splits.py
# still calling the sealed splits "provisional", and ah/eval/negative_controls.py
# citing a test that had been replaced when its finding closed. Recorded in
# governance/amendment-log.yaml (AM-2026-07-26-006/-007/-008) and
# governance/retrofit-register.md RFR-74/RFR-75. A defect class with a 100% escape rate
# through ordinary review. This block converts the one-time audit into a standing
# machine check, on the pattern ah.eval.prereg.ESTIMATOR_CONVENTION_KEYS already uses
# to make it impossible to register a statistic with no sealed estimator definition.
#
# WHAT IT GUARANTEES, exactly:
#   (1) EVERY `pinned_by` entry names a test function that really exists -- the file is
#       present and the function is defined in it. A claim cannot be "pinned" by a test
#       someone deleted or renamed.
#   (2) EVERY `covers` anchor still MATCHES this document, and every line it matches is
#       one a trigger phrase matched. Anchors must be at least 40 characters, so a vague
#       one cannot be stretched to cover the file. (Anchors are not required to be
#       unique: two sealed sections legitimately quote the same test name verbatim, and
#       an anchor that matches both covers both.) An anchor therefore cannot silently
#       detach from the sentence it locates, and re-wording a claim-bearing line breaks
#       this check until the registry is updated -- which, this file being sealed, is a
#       dated amendment.
#   (3) COMPLETENESS, within the stated detector: every line of this document containing
#       any `trigger_phrases` entry is covered by exactly one registered claim or is
#       listed in `not_a_code_claim` with a reason. A new sentence saying "verify()
#       rejects X" therefore fails the suite until someone either points it at a test or
#       declares, in the seal, that it is not a code claim.
#
# WHAT IT DOES NOT GUARANTEE, stated plainly because a check that oversells itself is
# worse than none:
#   (a) IT IS A KEYWORD DETECTOR, NOT A READER. A claim phrased without any trigger
#       phrase -- "the two can never diverge", "this is impossible by construction" --
#       is not detected and can be sealed unregistered. `trigger_phrases` is sealed
#       precisely so that WEAKENING the detector is itself a lock violation, but no list
#       of phrases catches all of English.
#   (b) IT DOES NOT CHECK THAT THE TEST TESTS THE CLAIM. It checks that the named test
#       exists, not that it asserts what the sentence says. A test that passes
#       vacuously satisfies this block. Only reading the test does that, and the
#       `claim` field is written to make such a reading cheap.
#   (c) IT COVERS THIS DOCUMENT ONLY, not the docstrings of the hashed sources. FOUR of
#       this pass's eleven findings were in hashed source prose (factors.yaml's header,
#       ah/eval/prereg.py's, ah/splits.py's and ah/eval/negative_controls.py's
#       docstrings) -- and the last of those was found only AFTER this block was first
#       drafted, which is itself the evidence that the uncovered surface is not
#       hypothetical. Those four were corrected but are not machine-covered here, and a
#       future one in that prose would escape this check. Extending the scan to the
#       hashed sources is the obvious next step, is unowned, and is deliberately not
#       built inside an audit pass.
#   (d) A `pinned_by: []` entry is a claim WITH NO TEST. It is not an oversight and not a
#       hole hidden by omission -- `status` says which it is, and `requirement_on_later_wp`
#       means the sentence is a sealed obligation on a work package that has not run yet,
#       so no test can exist. Those are the sentences to distrust first.
# --------------------------------------------------------------------------- #
claims_with_tests:
  detector_version: 1

  # The sealed detector. A line of this document containing any of these substrings is
  # a candidate CODE CLAIM and must be registered below. Sealed, not hardcoded in the
  # test, so that removing a phrase -- and thereby blinding the completeness check --
  # moves the lock digest and needs a dated amendment.
  trigger_phrases:
    - "verify()"
    - "run_battery"
    - "loader rejects"
    - "loader reads"
    - "loader CHECKS"
    - "machine-checked"
    - "machine-enforced"
    - "a test asserts"
    - "tests/test_"
    - "is the machine check"
    - "REJECTS"
    - "rejects a"
    - "rejects one"
    - "checks this exactly"
    - "checked at load time"
    - "asserted by test"
    - "cannot drift"
    - "records ALL THREE"
    - "is checked against"
    - "the code is checked"
    - "enforces"

  # Trigger hits that are NOT claims about this platform's code, each with the reason it
  # is exempt. Every entry is an anchor exactly as in `covers`, and the same
  # exactly-once rule applies -- an exemption cannot be widened by making it vague.
  not_a_code_claim:
    - anchor: "rejects a PERFECT generator with probability indistinguishable from 1. The"
      reason: >-
        A statement about the SAMPLING behaviour of a hypothetical per-name enforce
        gate, not about any code: nothing in the platform implements per-name enforce
        band gating, which is the point the sentence makes.
    - anchor: "# gating each name at enforce against its own 90% band rejects a PERFECT generator with"
      reason: >-
        The same statistical argument, restated in the thresholds header. No code
        performs the rejection being described.
    - anchor: "# ~570 monthly comparisons, gating each name at enforce rejects a PERFECT generator"
      reason: >-
        The same statistical argument again, in the band-exceedance-gate derivation.
    - anchor: "a_direct_run_battery_call_can_desync_its_reference: >-"
      reason: >-
        A YAML KEY, not a sentence. The claim it names is registered as
        `run_full_battery_cannot_desync_its_reference` below.

  claims:

    run_battery_verifies_the_document_and_the_lock:
      claim: >-
        Once `sealed: true`, ah.eval.battery.run_battery calls ah.eval.prereg.verify()
        -- including the lock digest recomputed from the files on disk -- on every
        invocation, so a modified YAML or a modified judged source stops the battery.
      covers:
        - "# `ah.eval.battery.run_battery` verifies this document AND the lock on every"
        - "# once `sealed: true` lands, ah.eval.battery.run_battery calls verify() on EVERY"
      pinned_by:
        - tests/test_eval_battery.py::test_run_battery_verifies_a_sealed_preregistration
        - tests/test_prereg.py::test_a_modified_yaml_with_a_stale_lock_fails_loudly
        - tests/test_prereg.py::test_modified_enforce_metric_code_with_a_stale_lock_fails_loudly
        - tests/test_prereg.py::test_verify_fails_when_sealed_and_lock_file_is_missing
      status: pinned

    the_extended_panel_reaches_the_excluded_decade:
      claim: >-
        The extended block_draw_span (1953-04..2020-12) contains the severe test's
        excluded decade and the 1965 start state, so the vacuousness that grounded
        the benchmark's severe-test exception is closed and the leg is posable for
        both sides -- the flip campaign-3's retirement of benchmark_exception
        rests on (AM-2026-08-10-001).
      covers:
        - "(tests/test_severe_blocks.py::TestTheExtendedPanelReachesTheDecade pins"
      pinned_by:
        - tests/test_severe_blocks.py::test_the_extended_span_reaches_the_excluded_decade
        - tests/test_severe_blocks.py::test_blocks_of_the_extended_span_can_intersect_it
      status: pinned

    every_active_pair_must_carry_a_cross_block_entry:
      claim: >-
        verify() requires a thresholds.cross_blocks entry for every active block
        pair -- which is why campaign-2's three vacuous (both-null) pair entries
        exist at all: the coverage requirement is machine-enforced, and a
        stated-vacuous bound satisfies it honestly where 4 half-widths exceeds
        the statistic's whole range. Campaign-3's commodities family cites the
        same fact from the other side: joining an EXISTING block creates no new
        active pair, so the requirement is already met with no new entry.
      covers:
        - "# directions, so no side can bind. The entry exists because verify() requires"
        - "# exists, and verify()'s one-entry-per-pair requirement is already met."
      pinned_by:
        - tests/test_prereg.py::test_verify_fails_when_cross_block_entry_missing
      status: pinned


    the_self_containment_rule_is_checked_by_tests:
      claim: >-
