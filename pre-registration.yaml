# pre-registration.yaml
#
# STATUS: UNSEALED. sealed: false below; WP2.3 is the only PR allowed to flip it.
#
# This file is the eventual target of the WP2.3 pre-registration seal: once sealed,
# every change to it becomes a dated, post-hoc-flagged amendment recorded in
# governance/amendment-log.yaml and visible in every evaluation report thereafter
# (Instructions/WP2.1b-PRE-SEAL-PATCH.md). It was created by WP2.1b Task 2 to hold the
# D4 benchmark-strategy set -- the portfolios whose VaR/ES define tail fidelity, and
# what the WP2.8 tail auxiliary loss optimizes -- and is extended here by WP2.1b Task 4
# with block-nested acceptance thresholds, the two Item-3 decisions (R5, J3), and the
# seal/amendment-log machinery (`ah.eval.prereg.seal()` / `ah.eval.prereg.verify()`).
#
# *** THRESHOLDS BELOW ARE PROVISIONAL PLACEHOLDERS. *** Every `min`/`max` in the
# `thresholds:` block is a stand-in so `ah.eval.prereg.verify()` has a real,
# non-trivial file to check end to end (WP2.1b Task 4's dry-run seal + verify,
# Instructions/WP2.1b-PRE-SEAL-PATCH.md Definition of done item 4) -- none of them is
# derived from a historical reference statistic. WP2.2's `ah.eval.reference` computes
# the real train+validation bands (per block, and per cross-block pair); WP2.3
# replaces every threshold below with one of those bands (or a stated, justified
# deviation) before sealing for real. Do not treat a `min`/`max` below as meaningful,
# and do not flip `sealed: true` from WP2.1b -- that act belongs to WP2.3 alone.
#
# SELF-CONTAINMENT RULE (WP2.1b Item 1 acceptance, line 25). Every value below must be
# sufficient, on its own, to reconstruct the D4 strategy set with no reference to code
# outside the sealed hash. Nothing in this file may *define* behaviour by pointing at a
# source file. Where a module is named, it is named only as the place the sealed
# definition happens to be implemented -- the definition itself is here, in full, and
# the code is checked against it by tests. If the two ever disagree, this file wins.
#
# The factor ids referenced below are the active factor namespace declared in
# factors.yaml (`global` + `us` blocks; the manifest loader is ah.factors.load_manifest).
#
# WHAT THE SEAL COVERS -- deliberately wider than STEP2-GENERATOR-PLAN Sec.WP2.3.
# CLAUDE.md states the invariant as "thresholds AND THE CODE THAT JUDGES THEM are hashed
# together before any training run." STEP2-GENERATOR-PLAN Sec.WP2.3 words the same
# requirement more narrowly (this file, the source of every enforce-tier metric, and
# eval/g2.py), which would leave outside the seal several modules that can move a
# pass/fail verdict on their own. The project owner has ruled that the invariant governs,
# so ah.eval.prereg.seal() hashes, by category:
#   - the acceptance thresholds and the factor namespace they are keyed to: this file and
#     the factors.yaml it names above, plus src/ah/factors.py (which decides which blocks
#     and factors are active at all);
#   - the metrics being judged: the enforce-tier metric suites under src/ah/eval/metrics/
#     that exist yet (WP2.2 adds the rest; a suite that does not exist yet is skipped).
#     NOTE: this is a fixed name list in prereg.py (_METRIC_SUITE_NAMES), not a directory
#     scan -- a helper module beside the suites, or a judging module anywhere else, joins
#     the seal only by being added to that list in the same PR that adds the module;
#   - the statistics the bands are derived from: src/ah/eval/reference.py;
#   - the split boundaries that define the reference data: src/ah/splits.py, which
#     hardcodes where train, validation and holdout begin and end -- moving
#     VALIDATION.end by a year silently changes every band in every block with no lock
#     violation unless this module is itself hashed;
#   - the code that compares values to thresholds and decides: src/ah/eval/prereg.py and
#     src/ah/eval/g2.py;
#   - the code that interprets the sealed D4 definitions above: src/ah/strategies.py;
#   - the code that renders the verdict: src/ah/battery/report.py and
#     src/ah/battery/stylized.py;
#   - the code that orchestrates metric suites into that verdict, and the code that
#     reads the historical panel feeding ah.eval.reference in the first place (WP2.2
#     Task 1): src/ah/eval/battery.py and src/ah/eval/panel.py -- judging code created
#     outside src/ah/eval/metrics/, joined to this list in the same commit that added
#     them.
# prereg.py hashing its own source is intentional and non-circular: the digest lands in
# pre-registration.lock, never back inside prereg.py.
# CONSEQUENCE, stated plainly so it is not a surprise during WP2.2: WP2.3 inherits this
# set, and once it seals, an edit to ANY of those files -- including a refactor of
# prereg.py or a new statistic registered in reference.py -- is a dated, post-hoc-flagged
# amendment in governance/amendment-log.yaml, exactly like an edit to this file.
# The lock records every hashed file as a repository-relative, forward-slashed path, so a
# lock sealed on one machine verifies in CI, in a reviewer's clone, and under WSL2.
#
# CONSIDERED AND EXCLUDED, deliberately, not by omission:
#   - src/ah/gen/base.py (Ensemble.factor()) -- the generator layer's container, the
#     defendant whose output is judged, not the judge itself. Hashing it would turn
#     every WP2.5-2.9 generator change into a dated amendment, inverting the seal's
#     purpose: it exists to freeze the judge, not the thing being judged.
#   - src/ah/battery/thresholds.yaml -- Step-0 legacy threshold data, every entry
#     status: todo (never blocking today), judged by the sealed battery/report.py but
#     not itself sealed. Its fate is a WP2.3 decision: seal it explicitly, or state
#     that this file's thresholds supersede it and it is inert. See
#     governance/retrofit-register.md.
#   - src/ah/data/derive.py and src/ah/data/splice.py -- NOT excluded on principle, just
#     not yet decided. derive.py supplies every `kind: derived` factor's transform (add,
#     difference, funding_stress) and assemble_panel; splice.py supplies the PROXY_RULES
#     that backfill policy_rate and hy_spread. Both therefore move sealed band values.
#     ah/eval/panel.py's _DERIVED_EXPRS table -- which IS sealed -- pins which helper
#     each factor uses and its units algebra, so the *binding* is inside the hash even
#     though the helper bodies are not. Sealing the modules themselves would make every
#     future Step-1 change a dated amendment. WP2.3 must decide explicitly; see
#     governance/retrofit-register.md RFR-10.

schema_version: "1.0"

# WP2.3 flips this to true at the moment of sealing. Nothing in WP2.1b sets it.
sealed: false

# Placeholder pending WP2.3: there is no real campaign yet, so this string names no
# real vintage. WP2.3 replaces it with the actual campaign_vintage_id being sealed
# against.
campaign_vintage_id: "provisional-unset"

# The sealed factor namespace (WP2.1b Task 1, ah.factors.load_manifest). Path is
# relative to this file; ah.eval.prereg.seal() reads it to know which factors.yaml to
# include in the sealed digest.
factor_manifest: factors.yaml

# Must equal factors.yaml's active_blocks at seal time -- ah.eval.prereg.verify()
# checks this exactly against the live FactorManifest, so the pre-registration can
# never silently drift from the manifest it was authored against.
active_blocks: [global, us]

rationale:
  d4_factor_level: >-
    the generator's outputs are factors; tail fidelity is therefore assessed on
    factor-level portfolios. The endowment proxy stands in for the institutional mix
    at the factor level. Sleeve-level tail behaviour is a Step-3 property, evaluated
    separately once mappings exist, and is not a G2 criterion.

  d4_derived_series: >-
    the generator emits some factors as period returns and others as levels (rates and
    spreads). A level is not a return and must never be summed with one. Every D4
    strategy is therefore defined over return-bearing factors directly, or over a
    *declared derived series* -- a named, fully-specified transform of exactly one
    level factor into a monthly decimal return. The `derived_series` block below is
    that declaration; it is sealed with the strategies and is the only route by which
    a level enters a D4 portfolio.

  d4_commodities_consequence: >-
    CONSEQUENCE AT SEAL TIME, stated for the D4 criterion as a whole and not only
    per-strategy: `commodities` has no Step-1 data source registered (see factors.yaml),
    and it carries weight in two of the five sealed D4 strategies -- 0.20 of
    `eqw_factors` and 0.10 of `endowment_proxy`. Two of the five D4 strategies
    therefore have NO COMPUTABLE REFERENCE STATISTICS at seal time. Any threshold
    sealed for `eqw_factors` or `endowment_proxy` is being sealed against a strategy
    that cannot yet be evaluated on historical data; those two thresholds are
    provisional in that specific sense and must be revisited (as a dated amendment)
    once a commodities series is registered under the requirements.yaml WP1.9
    emergent-requirements rule. The other three strategies (`sixty_forty`, `momentum`,
    `carry`) are unaffected.

# --------------------------------------------------------------------------- #
# Conventions -- one set of rules, applied to every definition in this file.
# --------------------------------------------------------------------------- #
conventions:
  # THE ONE NUMERAIRE. Every capital-committing leg of every D4 strategy is a monthly
  # TOTAL return in decimal units. Machine-enforced by ah.strategies at load time
  # against factors.yaml's `factor_sources.<factor>.numeraire` and each derived
  # series' own `numeraire:` field -- not prose.
  numeraire: total_return
  # The self-financing, long-short overlay legs. A zero-cost leg commits no capital, so
  # it is numeraire-neutral and may be combined with total-return legs; its weight is a
  # notional/risk budget rather than a capital share. This list must name exactly the
  # legs that declare `numeraire: zero_cost` -- the loader rejects an undeclared
  # zero-cost leg AND a dead entry here, so the exception can never grow silently.
  numeraire_zero_cost_legs: [smb, hml, mom, credit_xs_hy]
  numeraire_statement: >-
    ONE NUMERAIRE, TOTAL RETURN, applied to every capital-committing leg of every D4
    strategy. WP2.2 Task 1 originally mapped equity_mkt to french.mkt_rf -- Fama-
    French Mkt-RF, an EXCESS return over the one-month bill -- while govt_tr_10y is a
    long-government TOTAL return; sixty_forty (0.6 equity_mkt + 0.4 govt_tr_10y) and
    endowment_proxy therefore summed an excess-return leg with a total-return leg
    inside a fully-invested portfolio, understating the equity leg by the risk-free
    rate, and were about to be sealed that way. equity_mkt is now `kind: derived`,
    `add(french.mkt_rf, french.rf)` -- Mkt-RF plus the one-month bill that Mkt-RF is
    quoted net of -- a genuine total return, consistent with govt_tr_10y. The
    remaining legs are either total returns (govt_tr_10y, cash_tr_1m, and commodities
    once sourced) or DECLARED ZERO-COST overlays (smb, hml, mom -- long-short factor
    spreads; credit_xs_hy -- high yield excess of the duration-matched government leg,
    i.e. a duration-hedged long-HY/short-govt position). A zero-cost overlay commits no
    capital and so does not change the portfolio's numeraire; an `excess_return` leg
    would -- it is capital-committing yet quoted net of a rate -- and the loader rejects
    one outright. That distinction, not a general tolerance for mixing, is why this
    file can carry one numeraire and still hold long-short legs.
    CONSEQUENCE, not covered by the leg-level check above: the leg taxonomy governs
    what each LEG is quoted on, not what the STRATEGY's realized return series is
    quoted on, and those are different claims. A strategy holding a zero-cost overlay
    at less than 100% of its weight (eqw_factors at 0.6, endowment_proxy at 0.15 --
    both via credit_xs_hy and, for eqw_factors, also smb/hml/mom), or a `rule` strategy
    that is flat under its own rule for some months (momentum, in its 12-month warm-up
    and every month its signal is non-positive), is CASH-UNCOLLATERALIZED BY
    CONSTRUCTION: static_weights_composition and the rule strategies' own arithmetic
    (see their `notes`) credit no return at all to the uncommitted or unallocated
    capital, rather than crediting it the cash rate a genuinely fully-invested
    total-return portfolio would earn on an uninvested balance. The realized series is
    therefore below the total-return numeraire by exactly that uncommitted-capital cash
    return, for every affected month -- a strategy-level consequence the leg-level
    `zero_cost` declaration does not, and cannot, capture. See
    governance/retrofit-register.md RFR-12 for the full accounting (which strategies,
    by how much) and the options WP2.3 must choose between before sealing.
  units_of_return_bearing_factors: >-
    equity_mkt, smb, hml, mom and commodities are treated by D4 as monthly returns in
    DECIMAL units (0.01 = +1% for the month). They are used directly, with no
    transform. As of WP2.2 Task 1, factors.yaml's `factor_sources` section is the
    factor-to-series mapping, and it is a fact, not an assumption: equity_mkt is
    `kind: derived`, add(french.mkt_rf, french.rf) -- Mkt-RF put back onto a TOTAL
    return by adding the one-month risk-free rate it is quoted net of, per
    conventions.numeraire above; smb maps to french.smb, hml to french.hml, mom to
    french.mom (all `units: ret` in requirements.yaml), each a long-short spread return
    declared `numeraire: zero_cost`. commodities has no Step-1 series
    (`factor_sources.commodities.kind: unavailable`, governance/retrofit-register.md
    RFR-8); D4 assumes it will be a return-bearing TOTAL return once sourced (recorded
    machine-visibly as `factor_sources.commodities.numeraire: total_return`), and that
    assumption is recorded here rather than presented as a property of the manifest.

  # Machine-checked version of the prose above: EVERY active factor in factors.yaml
  # (global + us blocks) must appear in exactly one of return_bearing_factors /
  # level_factors below. The loader (ah.strategies) enforces both exhaustiveness and
  # disjointness at load time, and rejects a `d4_strategies.*.weights` entry that
  # names a level_factors member directly -- the only route by which a level enters a
  # D4 portfolio is a declared `derived_series` (see rationale.d4_derived_series). This
  # is the sealed source for that rule; there is no separate hand-maintained list
  # anywhere else, in code or in tests.
  return_bearing_factors:
    - equity_mkt
    - smb
    - hml
    - mom
    - commodities

  units_of_level_factors: >-
    policy_rate, ust_2y, ust_10y, hqm_curve, ig_spread, hy_spread, funding_spread, cpi
    and equity_vol are LEVELS, never period returns: seven of the nine are rates or
    spreads QUOTED IN PERCENT PER ANNUM (a generated value of 4.25 means 4.25 percent,
    not 0.0425). As of WP2.2 Task 1, factors.yaml's `factor_sources` section is the
    definitive factor-to-series mapping (this paragraph previously named "candidate"
    series before that mapping existed): policy_rate -> fred.FEDFUNDS (the ADMINISTERED
    effective federal funds rate, registered by WP2.2 Task 1 under the requirements.yaml
    WP1.9 rule -- NOT fred.TB3MS itself, which is a market bill yield and shares its
    construction with funding_spread's TED leg. A rule to backfill pre-1954-07 history
    from fred.TB3MS via ah.data.splice, flagged is_proxy, is REGISTERED but not applied
    by ah.data.refresh today, so read_factor_frames reads fred.FEDFUNDS unextended;
    factors.yaml's factor_sources.policy_rate.proxy_for and
    governance/retrofit-register.md RFR-10 have the current status), ust_2y ->
    fred.DGS2, ust_10y -> fred.DGS10, hqm_curve -> treasury.hqm_curve, ig_spread ->
    derived from fred.BAA - fred.AAA, hy_spread -> fred.HY_OAS, funding_spread ->
    derived from fred.TEDRATE -- all `units: pct` there or in requirements.yaml. cpi
    maps to fred.CPI (`units: index`), an index level; equity_vol maps to fred.VIX
    (`units: idx`), a volatility level. Neither cpi nor equity_vol is a
    percent-per-annum rate, but both are still a level rather than a return and are
    excluded from D4 on the same "not a return" basis -- no `derived_series` transform
    is declared for either, so neither currently has a route into a D4 portfolio at
    all. Levels are never summed with returns and never appear in a strategy's
    `weights` directly; they enter only through a `derived_series` entry. level_factors
    below is the sealed, exhaustive, machine-checked version of this list.
  level_factors:
    - policy_rate
    - ust_2y
    - ust_10y
    - hqm_curve
    - ig_spread
    - hy_spread
    - funding_spread
    - cpi
    - equity_vol

  percent_to_decimal: 0.01
  months_per_year: 12.0
  percent_to_decimal_statement: >-
    THE ONE CONVERSION, used by every transform below with no exception: a percent
    level is converted to decimal by multiplying by percent_to_decimal (0.01 above),
    and the conversion is applied ONCE, to the whole transform expression. Both terms
    of every transform below (the carry term and the duration term) are linear in the
    percent level, so a single leading factor of percent_to_decimal converts the entire
    result to a decimal monthly return. An annual percent rate is converted to a
    monthly carry by dividing by months_per_year (12.0 above; simple, not compounded:
    y/12, not (1+y)^(1/12)-1). Both percent_to_decimal and months_per_year are sealed
    values, read directly by ah.eval.metrics.tails at import time -- not independent
    constants duplicated in that module -- so an amendment to either value here changes
    every transform's output, and a test asserts the module's constants equal these.

  warm_up: >-
    ONE WARM-UP RULE for the whole file, applied identically by every definition: any
    month t whose complete input window is not available within the path takes the
    value 0.0. There is no other warm-up convention in this file. For the lagged
    transforms in `derived_series` the input window is {t-1, t}, so month 0 of every
    path is 0.0 and the warm-up length is 1 month. For `momentum` the input window is
    months [t - lookback, t - skip_months), so months 0..lookback-1 are flat
    (position 0.0, hence realized return 0.0) and the warm-up length is `lookback`
    months. Warm-up months are NOT dropped, masked, or treated as missing: they are
    zeros, and they are included in the pooled sample when VaR/ES is computed.

  nan_metric_rule: >-
    A METRIC THAT EVALUATES TO NaN FAILS. One rule for the whole platform: an
    uncomputable metric has not demonstrated compliance, so it does not pass -- and it
    fails even against a threshold that declares no bounds at all, which a
    comparison-only implementation gets wrong (every comparison with NaN is false, so
    an unbounded threshold would vacuously "pass"). Both judging modules implement this
    identically and are tested on it: ah.eval.battery._passed and
    ah.battery.report.evaluate. Before WP2.2 Task 1's fix pass the two disagreed -- the
    Step-0 module treated NaN as a pass, the Step-2 module as a failure -- and both are
    inside this seal, so the same generator could have been judged either way depending
    on which battery ran.

  # --------------------------------------------------------------------------- #
  # Metric estimator conventions (WP2.2 Task 2 and its fix pass). Sealed here because
  # a band is meaningless without the estimator that produced it: two defensible
  # estimators of "the ACF decay rate" give materially different numbers on the same
  # data, and after the seal a change to any of the statements below is a dated,
  # post-hoc-flagged amendment.
  # --------------------------------------------------------------------------- #
  acf_estimator: >-
    ONE ACF CONVENTION for the whole platform: the Box-Jenkins sample autocorrelation
    with the OVERALL SAMPLE MEAN and an n-DENOMINATOR -- acf_k = gamma_k / gamma_0 with
    gamma_k = (1/n) * sum_{t=1..n-k} (x_t - xbar)(x_{t+k} - xbar) and gamma_0 =
    (1/n) * sum_t (x_t - xbar)^2. NOT numpy.corrcoef's pairwise-mean, (n-1)-denominator
    estimator; the two agree asymptotically but not at finite n. `acf_r_lag{k}` applies
    it to the raw series (k = 1..5); `acf_abs_lag{k}` applies it to |x - mean(x)|, the
    volatility proxy, (k = 1..24). Implemented once, in ah.eval.reference, and reused by
    the metric suite -- never restated.
  estimator_length_matching: >-
    THE ESTIMATOR IS LENGTH-DEPENDENT, AND BOTH SIDES OF EVERY BAND ARE MATCHED ON IT.
    The n-denominator convention above carries a finite-sample bias that is a function
    of the series length: the (n-k)/n shrinkage alone is ~20% at lag 24 on a 120-month
    generated path against ~2% on the ~1100-month historical series, and the
    mean-subtraction term is larger still for a persistent process. A reference band
    drawn at history's length is therefore NOT a criterion a short-path generator can
    satisfy even by reproducing history exactly -- the gap is an artifact of the
    estimator, not evidence about the generator. Every reference band is therefore drawn
    with `resample_length` equal to the judged ensemble's own path length: each
    moving-block bootstrap replicate carries that many months, drawn from the full
    train+validation sample, so both sides carry the identical bias. CONSEQUENCE, stated
    because it looks like a defect otherwise: a length-matched band's `point` (the
    statistic on all of history) is NOT expected to lie inside its own [lo, hi]. The
    rejected alternative was an (n-k) denominator, which would have to change every ACF
    in the platform at once and still corrects only the shrinkage term, leaving the
    mean-subtraction bias intact and still length-dependent.
    RESIDUAL, NOT COVERED: length matching is applied uniformly at the PATH length,
    which is right for the per-path statistics (every ACF, the decay, the leverage
    correlation) and wrong for the POOLED ones -- skew, excess_kurtosis, the Hill
    indices, the aggregational-Gaussianity kurtoses and crisis_corr_lift are computed by
    the metric suite over n_paths * months pooled observations while a replicate carries
    only months, and all of those estimators are small-sample biased. Their bands are
    conservatively wide and their bias is unmatched. See
    governance/retrofit-register.md RFR-15: WP2.3 must decide before sealing a band over
    any pooled statistic.
    ALSO NOT AUTOMATIC: a moving-block bootstrap preserves a lag-k relationship only for
    the pairs inside one block, keeping a (b-k)/b share of them, so the block length
    must comfortably exceed the longest judged lag (24) while still cutting history into
    enough blocks for a percentile band. The sealed default is 120 months
    (ah.eval.reference.DEFAULT_BLOCK_LENGTH); at the previous default of 24 every
    long-lag band was an artifact of the resampling rather than a statement about
    history.
    SCOPE OF THE (b-k)/b RULE (Minor 8, WP2.2 Task 2 fix pass 2): it governs the number
    of BLOCKS a replicate is stitched from, which only matters when a replicate spans
    more than one block. At production defaults (block_length=120,
    resample_length=ensemble.months <= 120), ceil(resample_length/block_length) = 1:
    every replicate IS a single contiguous block, so there is no seam at all and the
    band is an ordinary subsampling distribution, not a moving-block one -- statistically
    fine, but the seam-shrinkage argument above does not bind on this, the length-matched
    PRODUCTION path. It governs only the UNMATCHED path (resample_length unset, replicates
    built from the full ~1100-month history, where spanning multiple blocks is normal).
  acf_abs_decay_estimator: >-
    `acf_abs_decay` is the rate of the exponential value ~= A * exp(-rate * lag) fitted
    to the 24-point curve (acf_abs_lag1 .. acf_abs_lag24) BY ORDINARY LEAST SQUARES ON
    THE VALUES THEMSELVES, not in log space. For a fixed rate the amplitude has the
    closed form A*(rate) = sum_k v_k e_k / sum_k e_k^2 with e_k = exp(-rate * lag_k), so
    the fit reduces to a one-dimensional minimization of the profiled sum of squares:
    241 equally spaced grid points across rate in [-1.0, 5.0], then golden-section
    search within the bracketing interval to an interval width of 1e-10 (at most 200
    iterations). Deterministic, no RNG, no optimizer dependency. rate > 0 is decay;
    rate < 0 is growth and is reported signed, never floored at zero. NaN only for fewer
    than two lags, a non-finite value, or an all-zero curve.
    WHY LEVELS, NOT LOG SPACE: a log-space fit needs value > 0, and dropping the
    non-positive values is a ONE-SIDED SELECTION -- at lags where the true
    autocorrelation is ~0 only upward noise survives the filter, lifting the fitted tail
    and biasing the rate downward, worst exactly where a volatility-clustering curve is
    most informative. Clamping trades one bias for another. The levels fit consumes
    every lag whatever its sign, so no selection happens at all.
    WHY AN EXPONENTIAL AT ALL, given that the canonical stylized fact (Cont 2001) is a
    slow POWER-LAW decay of ACF(|r|): the number is read only as a comparative summary
    against the same estimator applied to reference replicates of the same length over
    the same fixed lag window, never as a claim about the true functional form; a
    log-log power-law fit is not a neutral alternative (equally misspecified if the truth
    is nearer exponential, and its log-spaced abscissa weights the first four lags more
    heavily still); and the long-memory information an exponential summary compresses
    away is not lost, because every acf_abs_lag{k} for k = 1..24 is separately registered
    and separately banded, so "slow decay" versus "fast decay with high short-memory
    persistence" is discriminated by the lag-24 band rather than by this number.
    RESIDUAL BIAS: a levels fit weights absolute residuals equally, so the large low-lag
    values dominate and the rate summarizes the curve's early decay more than its tail.
    Ensemble-side, the rate is fitted PER PATH and averaged (never fitted to a
    path-averaged curve, which is a materially less biased and therefore NON-comparable
    functional than the single-series estimator the reference band is built from).
    CENSORED AT THE SEARCH BOUNDS (Minor 8, WP2.2 Task 2 fix pass 2): a curve decaying
    genuinely faster than exp(-5.0 * lag) cannot be represented within the sealed
    [-1.0, 5.0] domain -- the profiled SSE keeps improving to the boundary and the fit
    returns approximately the bound itself (~5.0), NOT NaN. Not a correctness bug (both
    the ensemble side and the reference side censor identically, under the same
    estimator, so the comparison stays apples to apples), but a fact about the estimator
    that belongs in this definition rather than being discovered as a surprise cluster
    of values at 5.0.
  hill_tail_index_estimator: >-
    LEFT tail (losses), Hill (1975) ratio form. Losses are -x, sorted descending
    L_(1) >= ... >= L_(n); with k = max(1, round(tail_fraction * n)) and the (k+1)-th
    order statistic as threshold, alpha_hat = ( (1/k) * sum_{i=1..k} ln(L_(i)/L_(k+1)) )
    ^ -1. Registered at tail_fraction 0.05 and 0.01. A SMALLER alpha_hat is a FATTER
    tail. NaN -- never a number computed from the wrong side -- when n < k+1, when any of
    the top k+1 losses is <= 0, or when the mean log-ratio is <= 0. CONSEQUENCE: a level
    factor (a rate, a spread, an index) is normally all-positive and so reports NaN by
    construction; the Hill tail index of a level is not a meaningful quantity and NaN is
    the honest answer.
  agg_gaussianity_estimator: >-
    Excess kurtosis (the same m4/m2^2 - 3 population definition as `excess_kurtosis`) of
    NON-OVERLAPPING horizon-month sums, the partial tail dropped, computed within each
    path and then pooled across paths. Registered at horizons 3 and 12 months only:
    horizon 1 is the identity aggregation and is EXACTLY `excess_kurtosis`, so
    registering it again would put two sealed names and two thresholds on one number.
    The stylized fact is the ORDERING -- excess kurtosis decaying toward 0 as the horizon
    grows -- read with `excess_kurtosis` as its h=1 anchor. NaN below 30 pooled sums: the
    sample excess kurtosis of n draws has standard error ~sqrt(24/n), which is 0.9 at
    n = 30 and 2.4 at n = 4, so below that floor the number carries no information about
    the effect it exists to detect.
  leverage_correlation_estimator: >-
    corr(r_t, |r_{t+1} - mean(r)|) within one path, LAG 1 MONTH, Pearson. The volatility
    proxy is the same |x - mean(x)| used by `acf_abs_lag{k}` -- not a third,
    independently invented proxy. Negative is the classical leverage effect (a down
    month followed by higher realized volatility). NaN for a path shorter than 3 months.
  cross_block_corr_matrix_distance_estimator: >-
    FROBENIUS NORM of the entrywise difference between the generated ensemble's
    cross-block correlation matrix and the reference's, sqrt(sum((a-b)^2)), over exactly
    the factor axis that reference.py computes a cross-block `correlation` for. Chosen
    over the Herdin et al. normalized correlation-matrix distance because both matrices
    are already on the same bounded [-1, 1] scale, so no normalization is needed to make
    them comparable. Its value on history is identically zero (history's distance to
    itself), so it is registered in PANEL_STATS with no historical band and its threshold
    is an ABSOLUTE BOUND, not a band. WITHIN-BLOCK PAIRS ARE NOT COVERED -- reference.py
    registers no within-block pairwise correlation statistic to be a distance to
    (governance/retrofit-register.md RFR-14) -- which is why the metric carries the
    qualified name rather than a bare `corr_matrix_distance` that would overstate it.
    CONSEQUENCE: a single degenerate factor (zero pooled variance) makes its own
    correlation entries NaN and so NaNs this whole panel-level metric. That is correct
    under nan_metric_rule below; it is deliberately not softened by dropping the
    offending row, because silently shrinking the matrix would change WHICH pairs the
    sealed distance is a distance over, run to run. THE SAME RULE APPLIES TO A COVERED
    FACTOR A GENERATOR SIMPLY OMITS (WP2.2 Task 2 fix pass 2, Important 1): the matrix
    axis is fixed by the reference's covered factor set, never re-intersected with
    whatever the ensemble happens to emit, so an omitted factor NaNs the metric
    identically to a degenerate one rather than shrinking the matrix to a smaller,
    easier-to-satisfy distance. Without this, generating less was a way to pass an
    absolute-bound threshold more easily, not a way to fail it.

  # --------------------------------------------------------------------------- #
  # WP2.2 Task 3 (and its fix pass) estimator definitions. Task 2 established that
  # every registered statistic gets a `conventions.<name>_estimator` prose block
  # precisely so a band is reconstructible from this file alone; Task 3 shipped eight
  # estimators with none, leaving the constants that change the numbers
  # (VARIANCE_RATIO_MIN_SUMS, DRAWDOWN_MIN_EPISODES, LONG_INFLATION_MIN_RUN_MONTHS,
  # the 120-month decade window, nominal-not-real) living only in reference.py.
  # `tests/test_prereg.py::test_every_registered_statistic_has_an_estimator_definition`
  # is the machine check that no future statistic can be registered without one.
  # --------------------------------------------------------------------------- #
  elementary_moment_estimators: >-
    POPULATION (not sample-corrected) moments throughout, computed with numpy on the
    pooled or per-path array the metric suite hands over. `mean` = sum(x)/n; `std` =
    sqrt(sum((x - xbar)^2)/n), the n-denominator form (numpy's default ddof=0), NOT the
    (n-1) sample standard deviation; `skew` = m3 / m2^1.5 and `excess_kurtosis` =
    m4 / m2^2 - 3 with m_k = (1/n) * sum((x - xbar)^k) -- the population definitions, so
    neither carries the Fisher-Pearson small-sample correction that scipy.stats applies
    by default and the two must never be compared against a scipy-computed figure.
    `correlation` (cross-block) is the ordinary Pearson product-moment correlation,
    NaN when either leg has fewer than 2 observations or zero standard deviation.
    NOTE ON ddof, stated because it is not uniform across this file: the two variances
    inside `variance_ratio` DO use ddof=1 (see its own block); the elementary moments
    here do not. Both are stated rather than assumed because a band computed under one
    convention is not comparable to a value computed under the other.
  crisis_corr_lift_estimator: >-
    corr(a[crisis], b[crisis]) - corr(a, b), where `a` is the block-A factor, the
    threshold is the 10th PERCENTILE of `a` over the aligned sample, and the crisis
    subset is every co-dated observation with a <= threshold (a's worst decile by
    value -- for a return-bearing factor, its worst-loss months). A positive lift means
    A and B co-move more strongly in A's worst months than on average, which is the
    crisis-co-movement failure mode this statistic exists to catch. NaN if the crisis
    subset has fewer than 2 observations or either leg is degenerate within it.
  variance_ratio_estimator: >-
    Var(NON-OVERLAPPING k-month sums, ddof=1) / (k * Var(raw monthly values, ddof=1)),
    registered at k = 12, 36, 60, 120 months. Exactly 1.0 in expectation under an iid
    null, > 1 under positive serial correlation, < 1 under mean reversion.
    NON-OVERLAPPING sums, and the partial tail is dropped: overlapping k-month sums are
    the classical Lo-MacKinlay form and have smaller sampling variance, but they induce
    a (k-1)/k share of shared observations between neighbouring sums, which is itself a
    manufactured serial dependence -- exactly the artifact this statistic exists to
    detect rather than to create. NO small-sample or heteroskedasticity-robust
    correction is applied: this reports the ratio itself, a description, not a signed
    test statistic. NaN below 10 non-overlapping sums (VARIANCE_RATIO_MIN_SUMS: a
    variance's relative standard error is ~sqrt(2/n), ~45% at n=10 -- noisy but not
    meaningless, unlike the fourth-moment floor of 30 above) or below 2 raw values, or
    if the raw variance is exactly zero.
    ENSEMBLE SIDE: sums are formed independently WITHIN each path and then pooled by
    concatenation across paths, and the ratio is taken ONCE over the pooled arrays --
    never a per-path ratio averaged. RFR-15's pooled-statistic length mismatch applies.
    CONSEQUENCE AT k=120, stated because it looks like a defect otherwise: the
    reference band needs >= 10 non-overlapping 120-month sums, i.e. >= 1200 months
    (100 years) of history -- at or beyond what even this platform's longest series
    provide -- so `variance_ratio_120m`'s historical band is NaN in practice. The
    ensemble side is still computable (pooling across paths supplies the sums), so the
    metric reports a value with no band to judge it against. WP2.3 must not seal an
    `enforce` band on it without noticing that.
  mean_reversion_halflife_estimator: >-
    ln(0.5) / ln(|phi|) months, with phi the lag-1 sample autocorrelation under
    `acf_estimator` above -- the ALREADY-REGISTERED estimator, not a second,
    independently fitted OLS AR(1) coefficient (for an AR(1) process the population
    lag-1 autocorrelation IS phi, so this is a correct fit rather than an
    approximation). The MAGNITUDE |phi| drives the decay, not signed phi, so an
    oscillating-but-decaying process (-1 < phi < 0) still gets a finite, meaningful
    half-life instead of the log of a negative number. DECIDED BOUNDARIES: |phi| >= 1
    returns +inf ("never reverts", meaningfully different from "uncomputable", and a
    reader scanning for a persistence problem should see an explicit infinity, not a
    blank cell); phi == 0 returns 0.0 (the limit of ln(0.5)/ln(m) as m -> 0); phi NaN
    returns NaN. ENSEMBLE SIDE: fitted PER PATH and averaged -- an AR(1) half-life is a
    property of one path's own time-ordered series, and concatenating paths first would
    manufacture a lag-1 relationship at every path seam.
  drawdown_episode_estimator: >-
    An EPISODE is a maximal run of consecutive months whose running drawdown is < 0,
    where running drawdown is wealth/cummax(wealth) - 1 with wealth = cumprod(1 + r)
    (ah.data.derive.drawdown_state, reused not reimplemented). A month at exactly 0.0
    (a new high) ends the episode. `depth` is the positive magnitude of the episode's
    trough; `duration` is its length in months. An episode still open at the series'
    final observation IS counted, ending there -- a stated property of a finite window.
    Three separately registered scalar summaries, not a distribution object:
    `drawdown_median_depth`, `drawdown_median_duration` (medians over the pooled
    episode arrays) and `drawdown_depth_duration_rank_corr` (Spearman rank correlation
    = Pearson correlation of average ranks, ties averaged; no scipy).
    FLOOR: NaN below 10 pooled episodes (DRAWDOWN_MIN_EPISODES). Without it a generator
    whose paths mostly never draw down contributes no episodes from those paths and is
    scored on the minority that did -- a median from a single pooled episode was legal,
    so generating fewer drawdowns made the median shallower instead of failing the
    metric. 10 matches VARIANCE_RATIO_MIN_SUMS: a sample median's asymptotic standard
    error is ~1.25*sigma/sqrt(n), ~40% of a standard deviation at n=10.
    OVERFLOW IS NaN, NOT "NO DRAWDOWNS": if compounding overflows, wealth/cummax is
    inf/inf = NaN and NaN < 0.0 is False, which under the episode rule reads as "at a
    new high" -- so an overflowed path used to report ZERO episodes, the favourable
    answer, and then vanish from the pooled concatenation. Any non-finite running
    drawdown now yields one NaN episode, which NaNs every summary that reads it.
    RESTRICTED to conventions.return_bearing_factors on the ensemble side: compounding
    a LEVEL series (a rate, a spread, an index) via (1+level).cumprod() is not merely
    uninformative, it is numerically wrong.
    ENSEMBLE SIDE: episodes are extracted independently WITHIN each path (never
    spanning a path boundary) and pooled by concatenation; RFR-15 applies.
  lost_decade_frequency_estimator: >-
    The FRACTION of the input series' own OVERLAPPING 120-month windows (stride 1
    month) whose compounded total return, prod(1 + r) - 1, is <= 0.0. NaN if the series
    is shorter than 120 months (a decade is the unit of the statistic; a value from a
    shorter window is a different quantity) or if any window's compounded value is
    non-finite -- an overflowed product is NaN, never the favourable "not a lost
    decade" answer that inf <= 0 -> False used to give.
    OVERLAPPING here, NON-OVERLAPPING in variance_ratio above, and the two are
    consistent rather than contradictory: overlapping SUMS manufacture serial
    dependence in the very variance a variance ratio measures, whereas this statistic
    is a MEAN OF INDICATORS, for which overlap introduces no bias in the estimated
    marginal probability and costs only effective sample size -- which is the band's
    job to report, not the point estimate's. Calendar-aligned non-overlapping decades
    would rest the whole statistic on ~9 windows and on an arbitrary tiling phase.
    NOMINAL, NOT REAL (CPI-deflated). "Lost decade" is classically a real-return
    concept; this statistic is registered in SINGLE_FACTOR_STATS, whose reference-side
    function is applied to exactly ONE factor's own column, so no CPI series is
    reachable from it. A deflated version needs a joint equity+CPI reference
    computation. Recorded as governance/retrofit-register.md RFR-21 for WP2.3: seal the
    nominal version as a stated limitation, or build the joint deflated one first.
    NOT LENGTH-MATCHED (see estimator_length_matching for the default this departs
    from): a 120-month replicate holds exactly ONE window, which makes every replicate
    value 0.0 or 1.0 and the percentile band either [0, 1] (admits everything) or
    [0, 0] / [1, 1] (fails everything). Replicates are therefore drawn at the FULL
    train+validation length, recorded as `resample_length: null` on the band. That is
    the correct reading of length matching rather than an exception to it: matching
    exists because the ACF family's ESTIMATOR is biased by series length, whereas here
    the 120-month window fixes the length scale internally and identically on both
    sides, and the outer length changes only how many windows the frequency averages
    over -- i.e. its own sampling error, which is exactly what the band measures.
    CONSEQUENCE: the band is wide, reflecting history's ~9-14 effectively independent
    decades. That is DN-1.1 Sec.II.6's "wide-band consistency, honestly reported
    (n ~ 14)" for this tier, not a defect to be tightened away.
    ENSEMBLE SIDE: computed per path (one window per production-length path) and
    averaged, which IS the pooled frequency because every path is the same length.
  long_inflation_era_frequency_estimator: >-
    The FRACTION of the CPI LEVEL series' own overlapping 120-month windows that
    contain a sustained high-inflation era. An ERA is a run of >= 24 consecutive months
    (LONG_INFLATION_MIN_RUN_MONTHS -- long enough to distinguish a multi-year
    inflationary era from a single hot print, short enough to fit inside one generated
    decade) with year-on-year CPI inflation at or above the Step-1 regime ruleset's own
    `cpi_high` threshold (regime_ruleset_v1: 4.0 PERCENT; ah.data.derive.yoy returns
    percent, and the threshold is reused rather than independently re-chosen, so the
    number is traceable to that ruleset's version). The whole run must lie inside the
    window. NaN below 120 level months.
    WINDOWED ON THE LEVEL, NOT ON cpi_yoy: derive.yoy consumes the first 12 months of
    whatever it is given, so a 120-month LEVEL window holds 108 cpi_yoy months --
    ample for a 24-month run -- whereas windowing cpi_yoy at 120 would need 132 level
    months and make the statistic uncomputable on exactly the 120-month paths a
    generator produces.
    Registered for `cpi` only on the ensemble side: unlike the factor-agnostic
    mathematical statistics, this one is inherently ABOUT inflation, and running it on
    (say) equity_vol's level would not measure an inflation era.
    NOT LENGTH-MATCHED, for the identical reason given under
    lost_decade_frequency_estimator; the same wide-band consequence applies.
  ergodicity_gap_estimator: >-
    |mean(long_path) - mean(ensemble pooled)| / std(ensemble pooled, ddof=1): the
    discrepancy between the TIME average of one long single realization and the
    CROSS-SECTIONAL average of an ensemble of short paths, in units of the process's
    own pooled dispersion. This is DN-1.1 Sec.II.6's 10yr row read literally
    ("ergodicity (long-path vs ensemble stats)"). Under ergodicity the two averages
    converge to the same population mean and the gap -> 0 whatever the process's
    persistence; under genuine non-ergodicity (the ensemble mixing several long-run
    regimes while any one realization stays inside one forever) it stays bounded away
    from 0. FIRST MOMENTS ONLY -- a second-moment version would be a second registered
    name and is deliberately not registered.
    STRUCTURALLY UNAVAILABLE TODAY (governance/retrofit-register.md RFR-20):
    ah.eval.battery.run_battery is handed one Ensemble of production-length paths and
    no long path, and no generator exists yet to ask for one, so the metric is NaN for
    every generator and is MARKED `status: structurally_unavailable` in the report. The
    reference side is NaN too and always will be: history is one realization and there
    is no historical ENSEMBLE to compare it against.
    WHAT THIS REPLACED, recorded because it is the reason the definition changed before
    sealing: the first version compared Var(per-path time averages) against
    Var(pooled)/months. At the production path length that is algebraically
    |variance_ratio_120m - 1| -- two sealed names for one number, the duplication this
    file already refused when it dropped agg_gaussianity horizon 1 for being
    excess_kurtosis -- and its iid-within-path null made a perfectly ergodic stationary
    AR(1) with phi = 0.9 read as a gap of ~18, i.e. it would have failed a CORRECT
    generator of every persistent factor (ust_10y, cpi, hy_spread).
  regime_duration_estimator: >-
    The mean, median and 90th percentile of the length in months of consecutive runs of
    a single regime label, where labels come from ah.data.derive.label_regime under
    regime_ruleset_v1 (recorded on each metric's own `metadata` in the battery report,
    not only in code, because WP2.6 refits on these labels).
    STRUCTURALLY UNAVAILABLE TODAY (governance/retrofit-register.md RFR-17): label_regime
    needs five inputs (usrec, cpi_yoy, growth_yoy, drawdown, hy_oas); cpi, equity_mkt
    and hy_spread supply three, but `usrec` (fred.USREC) and `growth_yoy` (fred.INDPRO)
    are registered Step-1 catalog series with NO factor mapping in factors.yaml at all --
    DN-1.1 Sec.II.2's Layer-1 climate state variables, not yet generator-visible.
    Inventing a substitute value for the missing two would bias every classification
    toward whatever default was chosen, so all three metrics are NaN and MARKED
    `status: structurally_unavailable`.
  ten_year_return_vs_valuation_estimator: >-
    Ordinary least squares of forward 10-year return on starting valuation
    (`cape_v` = demeaned log CAPE, ah.data.derive.demeaned_log_cape), in closed form and
    with no scipy: slope = Sxy/Sxx, R^2 = 1 - SS_res/SS_tot, registered as two separate
    scalars `..._slope` and `..._r2`. (NaN, NaN) below 3 paired points or when cape_v is
    exactly constant; R^2 alone is NaN when the response is exactly constant.
    STRUCTURALLY UNAVAILABLE TODAY (governance/retrofit-register.md RFR-18): no
    valuation/CAPE factor exists in factors.yaml, though the raw shiller.cape series IS
    registered in requirements.yaml. NaN and MARKED `status: structurally_unavailable`;
    the estimator itself is built and tested against synthetic ground truth so it is
    ready the day a valuation factor lands.
  mc_error_is_not_the_small_n_band: >-
    THE MONTE-CARLO ERROR AND THE REFERENCE BAND ANSWER DIFFERENT QUESTIONS, and only
    one of them is DN-1.1's n ~ 14. `ah.eval.battery.mc_error` is the batch-means
    standard error of a metric over the GENERATED ensemble's own paths: with 1000
    generated decades it is small by construction and says only "this generator's own
    sampling noise is small". It says nothing whatever about how uncertain HISTORY's
    value of the same statistic is, which -- at ~9-14 effectively independent historical
    decades for a 10yr-tier metric -- is the dominant uncertainty and the one DN-1.1
    Sec.II.6 means by "honestly reported (n ~ 14)". That uncertainty lives in the
    reference band, and `_require_mc_error_reported` (which enforces "bands or it didn't
    happen" for the 10yr tier) must not be read as having supplied it.

  # --------------------------------------------------------------------------- #
  # WP2.2 Task 4 estimator definitions: the D4-strategy-level tail backtests
  # (elicitability, Kupiec, Christoffersen, VaR/ES itself), cross-block tail
  # dependence, and the three utility-tier metrics. Same rule as every block above:
  # `tests/test_prereg.py::test_every_registered_statistic_has_an_estimator_definition`
  # requires one of these for every name in `ah.eval.reference.STRATEGY_STATS` /
  # the two new `CROSS_BLOCK_STATS` entries / the three new `PANEL_STATS` entries.
  # --------------------------------------------------------------------------- #
  d4_var_es_estimator: >-
    `var_95`/`es_95`/`var_99`/`es_99`, one set per D4 strategy (thresholds.strategies
    key `"<strategy_id>.var_95"` etc.), are the GENERATED ensemble's own realized
    historical VaR/ES on that strategy's pooled return path (all paths x all months
    flattened), computed by `ah.eval.metrics.tails.var_es` -- identically the estimator
    WP2.1b sealed (loss_sign above): losses are the negative of returns, VaR at level p
    is the p-quantile of the pooled loss distribution, ES at level p is the mean loss at
    or beyond VaR_p. Levels 0.95 and 0.99. Descriptive report metrics: the GENERATED
    ensemble's own tail risk, not compared against a historical band of their own (see
    elicitability_score_estimator below for the value that actually compares generated
    to historical).
  elicitability_score_estimator: >-
    THE FISSLER-ZIEGEL (2016) STRICTLY CONSISTENT SCORING RULE for the joint (VaR, ES)
    pair, in this platform's positive-loss-magnitude convention (loss_sign above), at
    level p = 0.95 (tail probability alpha = 1 - p = 0.05). Let ell_t = -r_t (loss;
    r_t the GENERATED ensemble's pooled realized return for one strategy), V the
    forecast VaR (a positive loss magnitude), E > 0 the forecast ES (a positive loss
    magnitude, E >= V). The score for one observation:
      s_t = 1{ell_t >= V} * (ell_t - V) / (alpha * E) + V/E + ln(E) - 1
    and the reported value is the MEAN of s_t over every pooled observation. LOWER IS
    BETTER: this platform reports the score to be MINIMIZED, and V, E ARE MINIMIZED IN
    EXPECTATION EXACTLY AT THE TRUE VaR_alpha AND ES_alpha OF THE LOSS DISTRIBUTION
    ell_t IS DRAWN FROM (a first-order-conditions derivation is in
    ah.eval.metrics.tails.elicitability_score's docstring) -- this is what makes it a
    CONSISTENT SCORING RULE for the pair, and is the property
    `tests/test_tails.py` checks by asserting a mis-specified (V, E) scores strictly
    worse than the true pair on a fixed sample, not merely that the number is finite.
    FORECAST SOURCE, load-bearing for the G2 tail-fidelity criterion: V, E are NOT
    fitted on the same GENERATED sample being scored (which would trivially minimize
    the score by construction, proving nothing) -- they are the HISTORICAL
    (train+validation) VaR_95/ES_95 of that SAME D4 strategy's own realized return
    series, `var_es` applied to `ah.eval.metrics.tails._historical_strategy_returns`
    (the strategy's own legs, inner-joined onto their shared date overlap from
    `ah.eval.reference.ReferenceStats.historical_series` -- never a fresh catalog read,
    never re-deriving strategy arithmetic: the SAME `ah.eval.metrics.tails.
    strategy_returns` function evaluates both the historical panel, wrapped as a
    single-path Ensemble, and the generated ensemble). A low score means the GENERATED
    ensemble's realized tail losses are well-approximated by HISTORY's own VaR/ES
    forecast -- i.e. the generator reproduces history's tail risk -- which is DN-1.1
    Sec.II.6's "VaR/ES elicitability on D4 strategies... beats bootstrap (G2)" row read
    literally: this is the auxiliary loss WP2.8's L3 training optimizes, and is the tail
    objective a flipped orientation would silently invert. Auxiliary G1 term (Fissler-
    Ziegel's general family) is 0 -- the simplest member of the family, chosen because
    the auxiliary G2 term (`1/E`, the log-barrier antiderivative `ln E`) alone is
    already sufficient for strict consistency and needs no code-side default for a
    second family parameter. NaN if E <= 0 (no positive ES magnitude to score against,
    e.g. the historical strategy has no computable VaR/ES because a leg's factor has no
    Step-1 source -- commodities) or if alpha is outside (0, 1).
  kupiec_pof_estimator: >-
    Kupiec (1995) proportion-of-failures unconditional-coverage LIKELIHOOD-RATIO TEST,
    at level p = 0.95 (alpha = 0.05), on the exceedance indicator sequence
    I_t = 1{ell_t >= V_hist} -- ell_t the GENERATED ensemble's pooled realized loss,
    V_hist the HISTORICAL VaR_95 (see elicitability_score_estimator: the SAME
    historical forecast, never re-derived a second way). With T = len(I), x = sum(I)
    (observed exceedances), p_hat = x/T (observed rate):
      LR_pof = -2 * ln[ (1-alpha)^(T-x) * alpha^x / ( (1-p_hat)^(T-x) * p_hat^x ) ]
    with the 0*ln(0) := 0 convention (an exact-boundary count, x=0 or x=T, contributes
    0 to the corresponding term rather than raising). Under H0 (true rate = alpha),
    LR_pof ~ chi-square(1) asymptotically; `kupiec_pof_pvalue` = P(chi-square(1) > LR_pof),
    computed WITHOUT scipy via the exact closed form for one degree of freedom,
    chi2_sf(x, 1) = 2 * (1 - Phi(sqrt(x))), Phi the standard normal CDF
    (statistics.NormalDist().cdf) -- verified against the standard chi-square(1) 95th
    percentile critical value 3.841. A SMALL p-value (large LR_pof) rejects H0: the
    generated ensemble's exceedance rate against history's own VaR threshold disagrees
    with the nominal rate. NOT length-matched to a resample band (see
    estimator_length_matching): this is a test statistic on the GENERATED ensemble's
    own pooled sequence, evaluated against a fixed asymptotic chi-square null, not a
    quantity with a train+validation reference band of its own.
  christoffersen_independence_estimator: >-
    Christoffersen (1998) INDEPENDENCE LIKELIHOOD-RATIO TEST on the SAME exceedance
    indicator sequence I_t kupiec_pof_estimator defines, testing whether exceedances
    cluster in time (a VaR model that is well-calibrated on average but whose failures
    come in runs is still a bad model). Let n_ij count observed one-step transitions
    I_t=i -> I_{t+1}=j for i,j in {0,1}, pi_01 = n01/(n00+n01), pi_11 = n11/(n10+n11)
    (transition-conditional exceedance probabilities), pi = (n01+n11)/(n00+n01+n10+n11)
    (the unconditional rate under H0: independence, i.e. pi_01 = pi_11 = pi):
      LR_ind = -2 * [ L(pi; n01+n11, n00+n10) - L(pi_01; n01, n00) - L(pi_11; n11, n10) ]
    with L(p; n1, n0) = n1*ln(p) + n0*ln(1-p) (0*ln(0) := 0, so a count of zero in
    either cell of a term never needs that term's probability to be defined -- handles
    every degenerate transition-count case, including a state visited zero times,
    without a special case). Under H0, LR_ind ~ chi-square(1). ENSEMBLE-WIDE
    AGGREGATION: n_ij are SUMMED across every path's own transitions (never a
    transition spanning two different paths -- the identical "never cross a path
    boundary" rule every time-ordered statistic in this platform follows), which is the
    mathematically correct combination of K independent Markov chains' joint likelihood
    (the joint log-likelihood over independent chains sharing one transition matrix IS
    the sum of the per-chain log-likelihoods, which reduces exactly to using the summed
    counts) -- not a per-path LR averaged, which would be a different, noisier
    statistic. p-value via the SAME chi2_sf(x, 1) as kupiec_pof_estimator.
  christoffersen_conditional_coverage_estimator: >-
    THE JOINT TEST: `christoffersen_conditional_coverage_stat` = LR_pof + LR_ind (the
    two already-defined statistics, summed) ~ chi-square(2) under H0 (correct
    unconditional coverage AND independence, jointly). p-value via the exact closed
    form for TWO degrees of freedom, chi2_sf(x, 2) = exp(-x/2) (verified against the
    standard chi-square(2) 95th percentile critical value 5.991: exp(-5.991/2) = 0.05).
    NaN if either component statistic is NaN (e.g. fewer than 2 observations in the
    sequence).
  tail_dependence_estimator: >-
    NONPARAMETRIC empirical tail-dependence coefficient (Frahm, Junker & Schmidt 2005),
    computed between an active CROSS-BLOCK FACTOR PAIR's pooled ensemble observations
    (never a D4 strategy -- this is the one WP2.2 Task 4 statistic keyed like
    ah.eval.reference's existing cross-block statistics, "<factorA>~<factorB>.<stat>",
    per DN-1.1's "corr matrix" row reading "tail-dependence coefficients" as a factor-
    pair, not a strategy-level, criterion). Rank-based pseudo-observations
    U = rank(a)/(n+1), V = rank(b)/(n+1) (ties averaged, the identical ranking
    ah.eval.reference.spearman_rank_correlation already uses). At the SEALED tail
    fraction 0.05 (TAIL_DEPENDENCE_TAIL_FRACTION, matching hill_tail_index_estimator's
    own 5% convention rather than an independently chosen number):
      upper: u = 0.95; lambda_U = mean(1{U > u AND V > u}) / 0.05
      lower: u = 0.05; lambda_L = mean(1{U <= u AND V <= u}) / 0.05
    Both estimate P(other variable in its tail | one variable in its tail) at threshold
    u: exactly 1.0 for a comonotone pair at every fraction; converging to 0 as the
    fraction shrinks under independence (a small, nonzero value at THIS finite
    fraction -- 0.05 in expectation under independence -- is the honest, expected
    outcome, not a defect). NaN below 10 observations actually inside the tail
    (n * fraction, TAIL_DEPENDENCE_MIN_TAIL_OBS -- the same floor shape as
    VARIANCE_RATIO_MIN_SUMS/DRAWDOWN_MIN_EPISODES) or if the two arrays are not the
    same length. Computed identically on both sides (a real train+validation band via
    the existing block-bootstrap machinery, and the generated ensemble's own pooled
    factor pair), unlike the D4-strategy backtests above.
  discriminative_score_estimator: >-
    A CLASSIFIER TRAINED TO DISTINGUISH real windows of factor dynamics from generated
    ones, reported as |test accuracy - 0.5| (0 = indistinguishable; the generator fools
    the classifier). Windows: non-overlapping UTILITY_WINDOW_MONTHS=24-month blocks,
    extracted independently WITHIN each real factor's own train+validation series
    (ah.eval.reference.ReferenceStats.historical_series) and within each generated
    path (never spanning a path or series boundary), for every active factor present on
    BOTH sides. Features: [mean, std] of each window (2 numbers), POOLED across every
    contributing factor and window into one (N, 2) matrix per side (real label 1,
    generated label 0) -- a factor's own scale is not removed, so a generator with a
    shifted mean or variance for ANY active factor remains detectable. Classifier:
    logistic regression (bias + 2 weights) with L2 penalty 1e-3, fit by full-batch
    gradient descent (learning rate 0.1, 200 epochs, zero weight initialization -- the
    convex logistic loss needs no random init) on a SEEDED random TRAIN_FRACTION=0.7
    shuffle-split of the pooled, labelled example set; features standardized (z-score)
    using the TRAIN split's own mean/std only (never the test split's, avoiding a
    leakage channel in the feature scaling itself). Reported value is
    |test-set accuracy - 0.5|. Determinism: seed = UTILITY_FIT_SEED (a sealed module
    constant, NOT the battery's own run seed -- see ah.eval.metrics.utility's module
    docstring), driving the shuffle-split via numpy.random.Generator(PCG64(seed)) and
    nothing else (gradient descent itself is deterministic given fixed data and zero
    init). Lower is better as a G2 criterion.
  predictive_score_estimator: >-
    TRAIN-ON-SYNTHETIC, TEST-ON-REAL (TSTR) one-step-ahead prediction error. Model: a
    single linear map x_{t+1} = a + b*x_t + noise, fit by the SAME gradient-descent
    machinery discriminative_score_estimator uses (squared-error loss in place of
    logistic; learning rate 0.1, 200 epochs, zero init, L2 penalty 1e-3) on a SEEDED
    random 50% subsample of GENERATED one-step-ahead pairs (x_t, x_{t+1}), pooled
    across every active factor present in the ensemble and, within each factor, across
    every ensemble path (pairs never span a path boundary) -- the SAME [mean, std]-free
    standardization convention discriminative_score_estimator uses is applied here too
    (each factor's own values z-scored by that factor's REAL historical mean/std before
    pooling, so one linear model is not dominated by whichever factor happens to have
    the largest raw scale). Error: mean squared error of the fitted (a, b) evaluated
    on EVERY real one-step-ahead pair (ah.eval.reference.ReferenceStats.historical_series,
    no subsampling on the real/test side). Determinism: seed = UTILITY_FIT_SEED, driving
    the generated-pair subsample only.
  tstr_degradation_estimator: >-
    THE RATIO MSE_tstr / MSE_trtr (predictive_score_estimator's TSTR error divided by a
    TRAIN-ON-REAL-TEST-ON-REAL baseline), fit by the identical linear-model /
    gradient-descent machinery on a SEEDED random 50% shuffle-split of the REAL
    one-step-ahead pairs (fit half / eval half; seed = UTILITY_FIT_SEED, the SAME seed
    predictive_score_estimator's subsample uses, so one seed drives every stochastic
    element of one battery run's utility tier). ORIENTATION: >= 1.0 means the
    synthetic-trained model predicts real one-step-ahead dynamics no better than a
    model trained directly on (half of) real data -- 1.0 is "no degradation" (the
    generator's dynamics are as informative as real data for this simple predictor);
    LOWER IS BETTER, and a value < 1.0 (the synthetic-trained model beating the
    real-trained baseline on its own held-out real data) is possible and not an error --
    it would mean the generator's larger effective sample size for fitting a two-
    parameter linear model outweighs the sim-to-real gap for this particular
    (intentionally simple) predictor. NaN if either MSE is NaN, or +inf if
    MSE_trtr == 0.0 exactly (a degenerate real series with zero one-step variance,
    against which no ratio is informative).

  loss_sign: >-
    VaR and ES are reported as POSITIVE MAGNITUDES OF LOSS. Loss is the negative of
    return; VaR at level p is the p-quantile of the pooled loss distribution; ES at
    level p is the mean loss at or beyond VaR_p. A D4 strategy whose definition made
    VaR negative would be mis-specified, not merely unusual -- this is the property
    that catches a level being mistaken for a return.

  series_parameters: >-
    Inside a strategy's `params`, ANY KEY ENDING IN `_series` names a series the rule
    reads: its value must be either an active factor id or a `derived_series` id
    declared above. Rule target series are sealed data here, not constants in code, so
    a rule can never silently read a different factor than the one sealed. Every other
    `params` key is numeric.

  rebalance_cadences:
    - monthly
  rebalance_convention: >-
    ONE REBALANCE CADENCE is implemented in this version: `monthly`, listed in
    rebalance_cadences above. Every D4 strategy's `rebalance` field is checked at load
    time against that list, and the loader rejects any value not in it -- `rebalance`
    is stored data that the loader reads, not decorative metadata. `monthly` means
    portfolio weights are reset to their sealed target at the start of every month, with
    no drift carried between rebalances and no compounding within a month: each
    strategy's return for month t is computed directly from month t's resolved series
    values at the sealed weights (see static_weights_composition below for the
    static-weight case; the two rule strategies state their own per-month arithmetic
    directly in their `notes`). There is no other cadence implemented; declaring one
    (e.g. `quarterly`) without also adding the code that computes a quarterly return
    would be a self-contradictory amendment, so rebalance_cadences is exactly the set
    of cadences ah.eval.metrics.tails can compute today.

  static_weights_composition: >-
    For every `kind: static_weights` strategy (eqw_factors, sixty_forty,
    endowment_proxy), the realized return at month t is the ARITHMETIC WEIGHTED SUM of
    that month's resolved series values: sum_i weight_i * series_i_t, where series_i_t
    is either a return-bearing active factor's value directly or a `derived_series`
    value (already a monthly decimal return, per the transforms declared below). There
    is NO COMPOUNDING across the weighted legs and no cross-term between them -- each
    leg is linear and independent for the month, consistent with rebalance_convention's
    monthly reset. This is the same arithmetic the two `kind: rule` strategies state
    explicitly for their own legs in their `notes` (momentum's realized return =
    position_t * target_series_t; carry's = long_weight * long_series_t +
    funding_weight * funding_series_t); static_weights strategies use identical
    arithmetic, they simply have no per-leg formula field of their own to state it in.

# --------------------------------------------------------------------------- #
# Derived series -- declared BEFORE d4_strategies, because strategies reference them.
#
# Each entry names its source factor, its transform, every parameter, and the
# closed-form formula in full, so the series is reconstructible from this file alone.
# Notation: y_t is the source factor's generated value at month t, IN PERCENT
# (conventions.units_of_level_factors); r_t is the derived monthly return, in DECIMAL.
# --------------------------------------------------------------------------- #
derived_series:
  govt_tr_10y:
    from: ust_10y
    transform: bond_total_return
    numeraire: total_return
    params: {duration_years: 8.5}
    formula: "r_t = 0.01 * ( y_{t-1}/12 - D*(y_t - y_{t-1}) ), D = duration_years = 8.5; r_0 = 0.0"
    notes: >-
      Long-government TOTAL RETURN from the 10y yield level. Two terms: carry, the
      previous month-end yield earned over one month (y_{t-1}/12, an annual percent
      rate divided by 12); and price, minus modified duration times the yield change
      over the month (-D*(y_t - y_{t-1})). The leading 0.01 is the single
      percent-to-decimal conversion (conventions.percent_to_decimal_statement); it is
      applied to the whole bracket, and both terms inside the bracket are in percent.
      SIGN: a RISING yield produces a NEGATIVE r_t, because the price term dominates
      for any realistic monthly yield change -- this is the whole point of the
      transform: a rising 10y yield must book a monthly loss on the total-return leg,
      not a gain, for any month 0..lookback where the yield change is not implausibly
      large relative to 1/D.
      LAG: r_t uses y_{t-1} for the carry term and the t-1 -> t change for the price
      term, so month 0 has no defined value and is 0.0 by the single warm-up rule
      (conventions.warm_up). duration_years = 8.5 is the sealed parameter: the
      approximate modified duration of a par 10-year Treasury at mid-single-digit
      yields. Convexity is deliberately omitted -- this is a first-order
      approximation, and stating it here means the omission is sealed, not accidental.

  credit_xs_hy:
    from: hy_spread
    transform: spread_excess_return
    numeraire: zero_cost
    params: {spread_duration_years: 4.0}
    formula: "r_t = 0.01 * ( s_{t-1}/12 - SD*(s_t - s_{t-1}) ), SD = spread_duration_years = 4.0; r_0 = 0.0"
    notes: >-
      High-yield credit EXCESS RETURN (excess of the duration-matched government
      leg) from the HY option-adjusted spread level. Same two-term shape as
      bond_total_return with spread duration in place of duration: carry, the previous
      month-end spread earned over one month (s_{t-1}/12); and price, minus spread
      duration times the spread change (-SD*(s_t - s_{t-1})). Same single leading 0.01
      percent-to-decimal conversion, same lag, same warm-up (r_0 = 0.0).
      SIGN: a WIDENING spread produces a NEGATIVE r_t, for the same reason as
      govt_tr_10y above -- the price term dominates any realistic monthly spread
      change, so credit excess return must book a loss when spreads widen, not a gain.
      spread_duration_years = 4.0 is the sealed parameter, the approximate spread
      duration of the broad US high-yield index. Default losses are deliberately NOT
      modelled: this is a spread-carry and
      spread-change decomposition only, so realized credit losses from defaults are
      absent and the series overstates high-yield excess return in a default wave.
      Sealed as a stated simplification.

  cash_tr_1m:
    from: policy_rate
    transform: bond_total_return
    numeraire: total_return
    params: {duration_years: 0.0}
    formula: "r_t = 0.01 * ( y_{t-1}/12 - 0.0*(y_t - y_{t-1}) ) = 0.01 * y_{t-1}/12; r_0 = 0.0"
    notes: >-
      One-month cash return, used as the funding leg of `carry`, earned at the
      OVERNIGHT POLICY RATE compounded simply over the month (y_{t-1}/12), not at a
      literal one-month term rate. Since WP2.2 Task 1's fix pass, `policy_rate` maps to
      fred.FEDFUNDS -- the effective federal funds rate, an actual overnight funding
      rate -- which is what makes that reading defensible; under the earlier
      fred.TB3MS mapping this entry would have been funding cash at a 3-month bill
      yield while calling it a one-month rate. french.rf (the Fama-French one-month
      bill return) is the literal one-month rate and is registered, but it is
      deliberately NOT used here: `carry`'s funding leg must be the same rate the
      generator emits as a factor, and the generator emits policy_rate, not french.rf.
      The residual difference (overnight vs one-month, a few basis points of term
      premium) is a stated, sealed simplification. policy_rate is a level in percent,
      so like every other level it may enter a strategy only through a declared
      transform -- this entry is that declaration, and it is why `carry` contains no
      bare percent-to-decimal arithmetic of its own. It reuses
      bond_total_return with duration_years = 0.0 rather than introducing a third
      transform: cash IS a zero-duration instrument, so the general bond formula
      collapses exactly to the carry term, as the formula above shows term by term.
      LAG: r_t uses y_{t-1}, i.e. funding is at the rate prevailing at the START of
      the month -- which is both the economically correct convention and the same lag
      as the long leg, so the two legs of `carry` are consistent. Month 0 is 0.0 by
      the single warm-up rule.

# --------------------------------------------------------------------------- #
# The D4 benchmark-strategy set.
#
# A `weights` key names EITHER an active factor id (return-bearing, used directly) OR
# a `derived_series` id declared above. Level factors never appear here.
# --------------------------------------------------------------------------- #
d4_strategies:
  eqw_factors:
    kind: static_weights
    rebalance: monthly
    lookback: null
    rule: null
    weights:
      equity_mkt: 0.2
      smb: 0.2
      hml: 0.2
      mom: 0.2
      commodities: 0.2
    params: {}
    notes: >-
      Equal weight across the active factor set's return-bearing series, used
      directly with no transform (see conventions.units_of_return_bearing_factors for
      exactly what is known -- and not known -- about their units). The remaining
      active factors (equity_vol, ig_spread, hy_spread, policy_rate, ust_2y, ust_10y,
      cpi, hqm_curve, funding_spread) are level/rate/spread series, not return-bearing,
      and are excluded from this strategy by construction: an equal-weight sleeve over
      "the return-bearing series" is defined on returns, and a level has no place in
      it. Two of them (ust_10y, hy_spread) do reach other D4 strategies, but only
      through the declared derived series above, never here. commodities has no Step-1
      data source yet; its weight is declared but its reference statistics are pending
      -- see rationale.d4_commodities_consequence for what that means for D4 overall.

  sixty_forty:
    kind: static_weights
    rebalance: monthly
    lookback: null
    rule: null
    weights:
      equity_mkt: 0.6
      govt_tr_10y: 0.4
    params: {}
    notes: >-
      60% equity (equity_mkt, used directly as a return), 40% long-government TOTAL
      RETURN via the govt_tr_10y derived series -- NOT the ust_10y level. This is the
      distinction that makes the strategy correct: a 60/40 bond leg must FALL when
      yields rise, which is exactly what govt_tr_10y does and what weighting the raw
      ust_10y level would have got backwards. ust_2y (short/intermediate) is not used.
      The bond leg's month 0 is 0.0 (conventions.warm_up), so the strategy's first
      month is 0.6 * equity_mkt_0.

  endowment_proxy:
    kind: static_weights
    rebalance: monthly
    lookback: null
    rule: null
    weights:
      # This is the flat, series-keyed table the loader reads. `proxy_mapping` below
      # is the sleeve-level breakdown; sleeves that share a series are summed here
      # (equity 0.45 + reits 0.20 = equity_mkt 0.65). The loader CHECKS that roll-up
      # against this table to within 1e-9 and fails the load if it disagrees, so the
      # two can never drift apart after the seal.
      equity_mkt: 0.65
      govt_tr_10y: 0.10
      credit_xs_hy: 0.15
      commodities: 0.10
    proxy_mapping:
      equity:
        weight: 0.45
        factor: equity_mkt
        reason: >-
          Public equity, plus the private-equity sleeve (buyout, growth, venture
          capital). De-smoothed private-equity returns are dominated by public-
          equity beta over the multi-year/tail horizons D4 targets (the same
          desmoothing logic ah.data.desmooth is built on); nearest factor proxy is
          equity_mkt. No separate private-equity factor exists in the manifest.
      reits:
        weight: 0.20
        factor: equity_mkt
        reason: >-
          Public and private real estate (REITs + direct real estate). No REITs or
          real-estate factor is declared in factors.yaml; over tail horizons listed
          REIT total returns carry a dominant equity beta, so equity_mkt is the
          nearest factor proxy. This is a stated simplification -- it drops REITs'
          secondary rate sensitivity.
      govt:
        weight: 0.10
        factor: govt_tr_10y
        reason: >-
          Fixed-income ballast, held as the long-government TOTAL RETURN derived
          series, not as the ust_10y level. Ballast is a return stream that gains when
          yields fall; the level would have booked the opposite sign.
      credit:
        weight: 0.15
        factor: credit_xs_hy
        reason: >-
          Public credit, plus the private-credit sleeve (direct lending, mezzanine,
          distressed). Private/direct-lending credit risk is economically closest to
          leveraged/high-yield corporate credit; nearest proxy is the credit_xs_hy
          derived series -- the high-yield EXCESS RETURN, not the hy_spread level. The
          level would have booked spread widening as a gain, i.e. exactly inverted the
          sleeve's crisis behaviour. No separate private-credit factor exists in the
          manifest.
      commodities:
        weight: 0.10
        factor: commodities
        reason: >-
          Real assets / infrastructure sleeve, proxied by the commodities factor --
          the nearest available real-asset exposure in the active manifest.
          Pending data: commodities has no Step-1 series yet (see factors.yaml and
          rationale.d4_commodities_consequence); this weight is declared but its
          reference statistics are pending until a source is registered.
    notes: >-
      Factor-level stand-in for a typical institutional endowment mix: equity /
      govt / credit / commodities / REITs, with private sleeves represented by
      their nearest proxy (proxy_mapping above states each sleeve's own weight, its
      proxy series, and the reason -- required so private-sleeve representation is
      explicit and auditable, WP2.1b Item 1). The govt and credit sleeves are held
      through derived series so that both carry the correct sign in a crisis. Sleeve-
      level tail behaviour is a Step-3 property once real mappings exist and is not a
      G2 criterion -- see the `rationale` block above.

  momentum:
    kind: rule
    rebalance: monthly
    lookback: 12
    rule: momentum_12_1
    weights: {}
    params:
      target_series: equity_mkt
      skip_months: 1
    notes: >-
      12-1 momentum on the equity factor, monthly rebalanced. The target series is
      sealed HERE, as params.target_series, not fixed in code. LOOKBACK IS DECLARED
      EXACTLY ONCE, in the `lookback` field above; `params` must NOT also carry a
      `lookback_months` key and the loader rejects it if present, so an amendment
      editing `lookback` alone can never be silently ignored. Signal at month t = sum
      of target_series' monthly values over months [t - lookback, t - skip_months) --
      i.e. t-12 .. t-2 inclusive (11 months); the most recent skip_months=1 month is
      excluded, the standard 12-1 convention that avoids short-term reversal
      contamination. Position is long-only and binary: fully invested (weight 1.0) if
      the signal is strictly positive (> 0.0), flat (weight 0.0) otherwise -- a signal
      of exactly 0.0 is flat. Realized return at month t = position_t *
      target_series_t. Warm-up: months 0..lookback-1 (the first 12) have no complete
      signal window and are flat, position 0.0 and realized return 0.0, per the single
      warm-up rule in conventions.warm_up.

  carry:
    kind: rule
    rebalance: monthly
    lookback: null
    rule: term_structure_carry
    weights: {}
    params:
      long_series: govt_tr_10y
      funding_series: cash_tr_1m
      long_weight: 1.0
      funding_weight: -1.0
    notes: >-
      Term-structure carry: a static, always-on long position in the long-government
      total return, funded at the one-month cash rate. Both legs are sealed here as
      params.long_series / params.funding_series, and BOTH ARE DERIVED SERIES, so
      neither leg contains a raw percent level and this definition needs no unit
      arithmetic of its own -- the percent-to-decimal conversion and the lag live in
      the derived_series declarations above, where they are stated once. Realized
      return at month t = long_weight * govt_tr_10y_t + funding_weight * cash_tr_1m_t
      = 1.0 * govt_tr_10y_t - 1.0 * cash_tr_1m_t. No timing signal, unlike momentum:
      the position is contemporaneous every month and `lookback` is null. This is why
      carry is `kind: rule` and not `static_weights`: a funded long-short position's
      exposures sum to 0.0, not 1.0, so it cannot satisfy the static_weights
      validation rule (weights must sum to 1.0 within 1e-9). Warm-up: both legs are
      0.0 in month 0 (conventions.warm_up), so carry's month 0 is 0.0.

# --------------------------------------------------------------------------- #
# Acceptance thresholds -- block-nested (WP2.1b Item 2 / Task 4).
#
# *** PROVISIONAL PLACEHOLDERS -- see the file header. *** None of the min/max values
# below comes from a historical reference statistic; they exist only so
# ah.eval.prereg.verify() has real block/cross-block coverage to check. WP2.2's
# ah.eval.reference computes the real train+validation bands and WP2.3 replaces every
# entry below with one before sealing.
#
# FOUR SECTIONS, FOUR KEY SHAPES, one per statistic scope (WP2.2 Task 4 adds the
# fourth, thresholds.strategies):
#   thresholds.blocks.<block>       key "<factor>.<stat>",           stat in
#                                   ah.eval.reference.SINGLE_FACTOR_STATS
#   thresholds.cross_blocks.<a|b>   key "<factorA>~<factorB>.<stat>", stat in
#                                   ah.eval.reference.CROSS_BLOCK_STATS
#   thresholds.panel                key "<stat>" (bare),              stat in
#                                   ah.eval.reference.PANEL_STATS
#   thresholds.strategies           key "<strategy_id>.<stat>",       strategy_id a
#                                   d4_strategies entry of THIS document, stat in
#                                   ah.eval.reference.STRATEGY_STATS
# A panel statistic is a property of the whole factor panel and belongs to no single
# factor or pair, so it carries no prefix at all -- cross_block_corr_matrix_distance is
# the one entry today. `severity` is `enforce` (an out-of-band value blocks the gate) or
# `report` (recorded, non-blocking). ah.eval.prereg.verify() checks: every active block
# has a thresholds.blocks entry; no entry names an inactive block; every active
# cross-block pair (ah.factors.FactorManifest.cross_block_pairs(), currently just
# global|us) has a thresholds.cross_blocks entry; no entry names an inactive block;
# every severity is enforce/report; min <= max where both are given.
#
# The KEY NAMING RULE above is itself machine-checked, not merely stated: verify()
# rejects a per-block key that is not exactly "<factor>.<stat>" with the factor in that
# same block and the stat registered in SINGLE_FACTOR_STATS; a cross-block key that
# is not exactly "<factorA>~<factorB>.<stat>" with factorA drawn from the pair key's
# first block, factorB from its second (the pair key is sorted, and reference.py keys
# the statistic in that order), and the stat registered in CROSS_BLOCK_STATS; and a
# panel key that is not a bare name registered in PANEL_STATS. Without those checks a
# sealed `enforce` threshold could name a statistic nothing computes -- a threshold that
# judges nothing, silently, forever. NOTE, because it decides how a bad entry fails:
# once `sealed: true` lands, ah.eval.battery.run_battery calls verify() on EVERY
# invocation, so a key naming an unregistered statistic does not merely fail the seal --
# it stops every battery run.
# --------------------------------------------------------------------------- #
thresholds:
  blocks:
    global:
      # PROVISIONAL placeholder -- not derived from history (see file header).
      "equity_mkt.skew": {min: -3.0, max: 3.0, severity: enforce}
      # PROVISIONAL placeholder -- not derived from history (see file header).
      "equity_mkt.excess_kurtosis": {min: -2.0, max: 30.0, severity: report}
    us:
      # PROVISIONAL placeholder -- not derived from history (see file header).
      # (Was "policy_rate.std": WP2.2 Task 2 fix pass 2, Minor 3 -- `std` is a
      # registered SINGLE_FACTOR_STATS reference statistic (a historical band gets
      # computed for it) but `build_monthly_suite` emits no metric under that name, so
      # the threshold judged nothing, silently, forever: no enforce-severity threshold
      # may name a statistic no metric actually produces. `excess_kurtosis` IS produced
      # for every active factor including policy_rate.)
      "policy_rate.excess_kurtosis": {min: -2.0, max: 50.0, severity: enforce}
      # PROVISIONAL placeholder -- not derived from history (see file header).
      # (Named acf_r_lag1, not acf_1: WP2.2 Task 2's fix pass folded the two lag-1 ACF
      # statistics into the lag-indexed scheme so that no two registered names compute
      # one number. Free while sealed: false; a dated amendment afterwards.)
      "ust_10y.acf_r_lag1": {min: -1.0, max: 1.0, severity: report}
  cross_blocks:
    "global|us":
      # PROVISIONAL placeholder -- not derived from history (see file header).
      # (Was "equity_mkt~ust_10y.correlation": WP2.2 Task 2 fix pass 2, Minor 3 --
      # `correlation` is a registered CROSS_BLOCK_STATS reference statistic (the
      # reference band is computed for it, and it feeds cross_block_corr_matrix_distance
      # internally) but `build_monthly_suite` emits no metric under a bare `.correlation`
