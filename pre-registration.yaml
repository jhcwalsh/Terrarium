# --------------------------------------------------------------------------- #
# limitations -- WHAT THIS SEAL DOES NOT ESTABLISH.
#
# Read this block before citing any threshold in this file as evidence of anything. A
# sealed threshold establishes that a criterion was fixed BEFORE the evidence was
# collected; it does not establish that the criterion has the operating characteristics
# one would like it to have. Every item below is measured or structural, not
# speculative, and each names what would close it.
# --------------------------------------------------------------------------- #
limitations:

  null_exceedance_rate_is_unverified: >-
    THE HEADLINE ONE. The three *_band_exceedance_fraction gates are derived from a
    per-comparison miss rate of 0.10, which is (1 - level) for this file's sealed band
    `level: 0.9`. THAT 0.10 IS THE BAND'S OWN DEFINITION, NOT A MEASUREMENT: it is what
    a percentile band means by construction, not an observed false-positive rate. Two
    gaps follow. (1) The analytic exceedance rates quoted in the gates' own derivation
    (~3.0e-8 for the moment family, ~1.0e-10 for the dependence family) assume the
    comparisons are near-INDEPENDENT, and they are not -- the factor panel is
    correlated, and one factor's own statistics are correlated with each other, so the
    true rate is larger by an unknown factor. Only the Markov bound (P(fraction > 0.5)
    <= 0.10/0.5 = 0.2) survives arbitrary dependence, and 0.2 is not a small number.
    (2) NO NEGATIVE CONTROL IS A KNOWN-GOOD GENERATOR, so nothing in the suite measures
    the null rate empirically either: the three undistorted controls score 0.231-0.308
    on the moment gate, which is NOT a false-positive rate, because an iid draw, a
    shuffle and a 24-month-block stitch all genuinely have the wrong local dispersion at
    a 120-month scale. WHAT CLOSES IT: bootstrap-v1 (WP2.4) is the first generator that
    is MEANT to match history, and its measured exceedance fractions are the first real
    observation of the null. If they sit materially above 0.10 per comparison the
    bounds need a dated amendment -- and WP2.4 must report them whether or not it likes
    the answer.

  three_gates_were_designed_against_the_controls: >-
    The three *_band_exceedance_fraction gates' STATISTIC was chosen by measuring three
    candidate constructions against the five negative controls and keeping the one that
    separates them (the 403-per-lag aggregate scored nc1 at 0.389 -- UNCAUGHT at 0.5;
    the two-stage majority variant scored 0.077 for both nc1 and nc5 -- no separation;
    the acf_r_sum/acf_abs_sum joint statistic separates them). The BOUND never moved
    (0.5 is a majority rule derived from `level`, not from any control's score) and no
    control was weakened -- but that is a limit on how bad the practice was, not a
    denial that it happened. CONSEQUENCE, and it is a rule not a caveat: G2-EVIDENCE.md
    MUST NOT cite "the battery catches 4 of 5 negative controls" as independent
    validation of these three gates' DESIGN. It is not independent; the controls were
    the evidence used to choose the design. It remains valid as a statement that the
    battery detects those five specific defects. bootstrap-v1 is the first genuinely
    independent test. See governance/retrofit-register.md RFR-45.

  every_negative_control_number_is_from_a_synthetic_fixture: >-
    Every measured negative-control value quoted anywhere in this file -- 0.654 for
    nc3's moment gate, 0.615/0.718 for nc1/nc2's dependence gate, 0.234 for nc1's tail
    gate, 0.7096 for nc4's near_duplicate_fraction, the 148 knife-edge comparisons, the
    16-of-22 10yr-tier count -- comes from tests/test_negative_controls.py's SYNTHETIC
    panel, not from the sealed campaign vintage. The STRUCTURAL findings hold for any
    data (a majority rule over a family cannot fire when the failure is confined to a
    minority of that family; a metric that improves when the generator produces less is
    broken whatever the panel). THE MAGNITUDES DO NOT TRANSFER. The control suite also
    runs at 16 paths while this file's criterion size is 1024, so no control number is a
    criterion-bearing measurement either. Nothing in G2-EVIDENCE.md may quote a control
    magnitude as a property of the campaign data.

  the_campaign_vintage_is_missing_two_of_fourteen_factors: >-
    commodities (declared unavailable; RFR-8) and hy_spread (mapped to fred.HY_OAS,
    whose ~3 years of licensed history -- 37 monthly observations -- all fall inside the
    holdout). See reference_run.missing_factors for the full account. Consequences that
    are easy to miss: TWO of five D4 strategies have no computable historical statistics,
    and they are not both attributable to commodities (endowment_proxy would stay
    uncomputable if commodities were sourced tomorrow, because of credit_xs_hy); the
    `global` block's sealed thresholds rest on five factors, not seven; and every
    threshold keyed to either factor is rejected by verify() rather than silently
    judging nothing.
    NEITHER IS FIXABLE BY REFRESHING AGAIN, and this is the difference between them and
    policy_rate, which WAS. `commodities` has no free, already-connectored total-return
    series at all -- the honest candidates are licensed, so it is a licensing decision
    plus a manual-intake schema. `hy_spread` is a licensing LIMIT: FRED serves only ~3
    years of BAMLH0A0HYM2 under ICE terms, so no refresh will ever produce a
    train+validation sample for it; the registered ah.data.splice `hy_oas_pre1996` rule
    (a Baa-Aaa proxy) is the only route, and applying it is a campaign restart and a
    dated amendment. A reader who sees that the campaign vintage was refreshed once
    should not infer that the remaining gaps are one refresh away. They are not.
    CAMPAIGN-2 SUPERSESSION (AM-2026-08-02-009): the hy_spread half of this paragraph
    fired exactly as written -- the splice rule was applied (with a PINNED fit, since
    its only licensed fitting window lies inside the holdout; owner decision
    2026-08-02), the vintage moved to 2026-08-02.4, and hy_spread left
    reference_run.missing_factors. The commodities half stands unchanged. The
    fourteen-declared-factors count in this key's name is itself historical: the fx
    and valuation block additions bring the declared active set to sixteen, fifteen
    with data.

  pooled_vs_per_path_band_semantics: >-
    governance/retrofit-register.md RFR-15/RFR-26, sealed as a stated limitation rather
    than fixed. Bootstrap replicates are length-matched to the judged ensemble's PATH
    length (120 months), which is correct for every per-path statistic under the
    n-denominator ACF estimator this file fixes as its convention. It is the WRONG
    length for the POOLED statistics: skew, excess_kurtosis, the two Hill indices, the
    aggregational-Gaussianity kurtoses and crisis_corr_lift are computed over
    n_paths*months pooled observations on the generated side while a replicate carries
    only `months`, and all of those estimators are small-sample biased -- so for those
    names the two sides match in neither sample size nor bias. The bands are
    CONSERVATIVELY WIDE in consequence (a fat-tailed generator reads as further from
    history than it is), which is the safe direction, and it is why the tail gate's
    inability to fire (below) is the bigger problem. tail_dependence_lower/upper carry a
    worse, THREE-way version of the same mismatch (generated side pooled at
    n_paths*months; historical point estimate on the full ~1100-month series; the band's
    replicates drawn at full sample length, not length-matched at all), and RFR-15's two
    stated remedies do not apply to them. Closing either needs per-statistic resample
    lengths inside ah.eval.reference's draw structure, which changes what every pooled
    band IS.

  the_tail_gate_cannot_fire: >-
    tail_band_exceedance_fraction is sealed `report`, so the tail machinery blocks
    NOTHING at enforce, and that is a real gap rather than a preference. The gate is a
    majority rule over a family spanning every active factor, but a tail failure is
    characteristically confined to the return-bearing ones (4 of 13 declared-available
    factors), so it cannot reach 0.5 however severe it is -- nc1-iid-gaussian, which
    replaces every fat tail in the panel with a Gaussian one, scores 0.234 while
    producing 11 substantive tail band failures on exactly the excess_kurtosis /
    hill_tail_index statistics DN-1.1 Sec.II.6 names. A GENERATOR THAT GOT THE DYNAMICS
    RIGHT AND THE TAILS WRONG PASSES AT ENFORCE TODAY. Sealing it at enforce anyway
    would be worse: a gate that cannot fire reads in the artifact as a check that
    passed. Lowering the 0.5 bound was rejected outright -- it is derived from `level`
    and a majority rule, and moving it to make a control fire would destroy the only
    evidence the gate is not fitted. See governance/retrofit-register.md RFR-43, and
    live_options.per_factor_tail_gate below for the construction that would close it.

  knife_edge_band_comparisons: >-
    governance/retrofit-register.md RFR-38. 148 of 3035 finite (value, band)
    comparisons in the negative-control run sit at EXACTLY zero distance from a band
    edge, passing only because the bracket is closed; 33 of those rest on a fully
    degenerate [0.0, 0.0] band. WP2.2c closed the degenerate half structurally
    (ah.eval.battery.band_is_usable bars a zero-width band from gating and marks it
    `band_degenerate` in the report) and made every margin visible (`band_distance` on
    every banded result). The exact-boundary half is SEALED AS IS: a tie-breaking
    convention (exact boundary fails, or a tolerance) would change the semantics of
    every band in the battery, and no evidence exists today that either direction is
    right. What is no longer true is that a verdict flip has no identified cause -- the
    BLAS-thread-count hypothesis is falsified and knife-edge comparisons are the
    explanation.

  within_block_correlation_is_unjudged: >-
    governance/retrofit-register.md RFR-14, sealed as scope rather than closed.
    ah.eval.reference computes a `correlation` statistic only for factor pairs drawn
    from two DIFFERENT blocks, so equity_mkt~hy_spread (both `global`) has no reference
    band, and cross_block_corr_matrix_distance covers cross-block pairs only -- which is
    why it carries that scope in its name. A GENERATOR COULD GET EVERY CROSS-BLOCK
    CORRELATION RIGHT AND EVERY WITHIN-BLOCK ONE WRONG and nothing here would notice.
    Adding a within-block pairwise statistic is a structural change to the reference
    layer, not a rename, and it would change what this file seals.

  a_direct_run_battery_call_can_desync_its_reference: >-
    governance/retrofit-register.md RFR-16, sealed as a stated caller contract. Every
    production path goes through ah.eval.battery.run_full_battery, which computes the
    reference, registers the suites against it and passes the same object to
    run_battery -- it cannot desync by construction. A caller invoking the lower-level
    run_battery directly with a `reference=` that does not match what the registered
    specs closed over gets no error and no warning. The seal does not defend against
    that; the reference-identity guard that would is a change to MetricSpec's signature.

  the_economics_tier_reduces_to_five_of_eleven: >-
    On the sealed campaign vintage the `economic` tier has ELEVEN registered metrics and
    exactly FIVE that can produce a number. THE SIX THAT CANNOT are the
    `implied_sharpe_*` names, structurally unavailable for a reason no vintage refresh
    touches: ah.data.derive.label_regime needs `usrec` and `growth_yoy`, and no
    factors.yaml mapping exposes them as generator-visible factors, so no generated path
    can be regime-labelled at all (structurally_unavailable_statistics; RFR-27).
    RESTORED BY THE VINTAGE MOVE, and the first seal stated the opposite: `term_premium`
    (mean of ust_10y - policy_rate), `equity_risk_premium` (mean of equity_mkt -
    cash_tr_1m) and `policy_anchor_deviation` (a Taylor-type anchor evaluated at
    policy_rate) all need `policy_rate`, which the 2026-07-24 vintage did not contain and
    `2026-07-26.1` does. All three are computable, all three are `report`, and
    bootstrap_v1.factor_set now emits policy_rate so the generated side exists too.
    STILL TRUE, AND STILL THE POINT: the two ENFORCE names in this tier are
    `money_pump_violations` and `floor_violations` -- hard structural audits with
    `max: 0` -- and the three restored names are `report`, so the tier's BLOCKING
    surface is still exactly two audits. G2-EVIDENCE.md must not present a clean
    economics tier as evidence that DN-1.1 Sec.II.6's economic row was checked: it is
    checked in five of eleven places, blocking in two, and silent on regime-conditioned
    risk premia entirely.
    A CAVEAT THAT COMES WITH THE RESTORATION, stated because it is easy to lose:
    `policy_rate`'s train+validation history starts 1954-07 (n = 798), the second
    shortest in the panel after the 1990s starters, so every one of these three
    estimators rests on a materially shorter sample than the equity-side statistics
    beside them, and `term_premium`/`equity_risk_premium` are means over the
    ust_10y/equity_mkt overlap with it, not over those factors' own histories.

  the_10yr_tier_is_unavailable_not_passing: >-
    16 of the 22 metrics in DN-1.1 Sec.II.6's 10yr tier (73%) are structurally
    unavailable -- 14 ergodicity_gap instances plus both ten_year_return_vs_valuation_*
    names. nc2-shuffled is DESIGNATED to this tier and produces zero substantive
    failures in it. G2-EVIDENCE.md MUST NOT cite a 10yr-tier pass; the tier is
    unavailable, not passing. See conventions.ten_year_tier_coverage and
    governance/retrofit-register.md RFR-37/RFR-42.

  named_estimator_substitutions: >-
    Four sealed estimators depart from their normative source, and are sealed with the
    departure stated rather than silently. (1) lost_decade_frequency is NOMINAL, not
    CPI-deflated -- a materially more permissive definition in an inflationary era; a
    joint equity+CPI reference computation is what a real one needs (RFR-21). (2)
    policy_anchor_deviation substitutes TAYLOR_PI_TARGET = 2.0 for DN-1.1's latent,
    deliberately-drifting pi*_t and drops the phi_c*c_t cycle term entirely for want of
    a generator-visible proxy (RFR-28). (3) money_pump_violations audits only whether a
    SINGLE zero-cost leg never loses money, never a weighted COMBINATION of two or more
    -- DN-1.1's own economic row names the combination case, and no search over
    combinations is performed (RFR-29). (4) The Kupiec/Christoffersen backtest family
    runs at the 95% level ONLY; at 99% the per-path exceedance count (~1.2 over 120
    months) leaves the Christoffersen transition matrix essentially empty at ANY
    ensemble size, and running Kupiec/elicitability at 99% while the four Christoffersen
    names could not follow would split one sealed family across two levels (RFR-23). A
    coverage-band reformulation of the Kupiec statistic (judging p_hat directly against
    a binomial band rather than routing it through a chi-square tail) was considered per
    RFR-24 and NOT adopted: it is a new statistic, not a rescaling, and adopting it here
    would have meant sealing a name whose behaviour no run in this repository has ever
    observed.

  band_exceedance_gate_mc_error_is_not_trustworthy_for_sizing: >-
    governance/retrofit-register.md RFR-44. The three gates' Monte-Carlo error bars come
    from the uniform path-subsampling estimator, and subsampling paths changes the
    metric VALUES the fraction is computed from -- so the subsample estimate is not an
    estimate of the same quantity at full path count. The reported error bar on those
    three names must not be used to size a band. The bounds sealed for them are not
    sized from it: they are a majority rule over a family, derived from `level`. This is
    a limitation on the DIAGNOSTIC, not on the bound.

# --------------------------------------------------------------------------- #
# live_options -- recorded, deliberately NOT implemented at seal time.
#
# Both would strengthen a gate this file seals. Neither is built, because each is a new
# statistic and a new threshold-authoring decision, and WP2.3's job was to seal what
# exists rather than to invent under time pressure. Recorded so a later work package
# finds a considered option rather than reinventing it -- and, in the second case,
# finds the trap that comes with it.
# --------------------------------------------------------------------------- #
live_options:
  baseline_relative_memorization_bound: >-
    Judge near_duplicate_fraction (or nn_distance_p05/p50) against a MATCHED-BLOCK-
    LENGTH resampler's own score rather than an absolute bound. WP2.2b rejected this on
    the ground that it "inherits the phase blindness" of the then-fixed-grid search;
    that reasoning is STALE, because WP2.2c Item 2 made the near-duplicate search
    phase-blind (sliding-window, all offsets), so a relative bound no longer inherits
    the confound it was rejected for. It has real power the absolute bound lacks:
    separating a literal copier from a matched-block resampler, which on an absolute
    scale can score similarly once block length reaches the 24-month memorization
    window. It bears directly on bootstrap_v1's sealed mean block length -- a relative
    bound would make that choice much less load-bearing. See
    governance/retrofit-register.md RFR-46.
  per_factor_tail_gate: >-
    Replace the tail family's majority rule with a per-factor combination (max-over-
    factors of within-factor exceedance, or a Simes/min-p combination across the active
    factors), with the bound derived from `level` and the family size. This is the
    return-bearing-scoped gate limitations.the_tail_gate_cannot_fire calls for, and it
    has power against a failure concentrated in a few units -- exactly nc1's shape. THE
    TRAP, stated so it travels with the option: choosing a construction BECAUSE it
    separates nc1 would repeat exactly the design-independence problem
    limitations.three_gates_were_designed_against_the_controls discloses. Whoever builds
    it must derive the bound from `level` and family size alone; if any candidate is
    validated against nc1 during that work, the same caveat must be recorded again
    rather than the catch cited as independent evidence. See
    governance/retrofit-register.md RFR-43/RFR-47.

# --------------------------------------------------------------------------- #
# bootstrap_v1 -- the frozen benchmark's FULL specification (STEP2-GENERATOR-PLAN
# Sec.WP2.3: "the bootstrap benchmark's full spec (block-length distribution,
# stationary form, stratification = Step-1 regime ruleset version)").
#
# WP2.4 implements this; it does not choose it. Everything below that is a number was
# either derived analytically or MEASURED on the sealed campaign vintage with a
# throwaway prototype resampler, at 200 paths x 120 months, 3 seeds, against the
# already-sealed gate bounds -- the GENERATOR spec was chosen to clear FIXED
# thresholds, and no threshold was moved to accommodate it. That direction matters and
# is the reason this block exists at all: leaving the block length to WP2.4 would have
# meant discovering during the bake-off that the benchmark fails an enforce gate.
# --------------------------------------------------------------------------- #
bootstrap_v1:
  generator_id: bootstrap-v1
  form: stationary_block_bootstrap
  form_statement: >-
    Politis-Romano stationary bootstrap. Draw a uniform start index in [0, T); at each
    subsequent month, with probability p = 1/mean_block_months draw a fresh uniform
    start, otherwise advance the current index by one, WRAPPING CIRCULARLY (index T
    maps to 0). Block lengths are therefore Geometric(p) with mean
    mean_block_months, which is what makes the resampled series stationary -- a
    fixed-length block bootstrap is not. The circular wrap is part of the definition,
    not an implementation convenience: without it, late-sample rows are under-sampled.
  block_length_distribution: geometric
  mean_block_months: 6

  block_length_derivation: >-
    THE CHOICE IS BOUNDED FROM BOTH SIDES BY GATES THIS FILE ALREADY SEALS, and 6 sits
    inside the resulting window with margin on both edges.
    REPRODUCE WITH: uv run python scripts/measure_block_length_window.py --out <path>
    (200 paths x 120 months, 3 seeds per L, drawn from block_draw_span at the sealed
    factor_set, judged against the sealed gate bounds). The script is committed at the
    re-seal; at the first seal these numbers came from an uncommitted prototype and a
    reader could not check them. THE GENERATOR SPEC WAS CHOSEN TO CLEAR FIXED
    THRESHOLDS AND NO THRESHOLD WAS MOVED TO ACCOMMODATE IT -- that direction is the
    whole reason this block exists.
    RE-MEASURED AT TWELVE FACTORS, AND THE WINDOW MOVED. Both edges are functions of the
    factor count -- the dependence gate's denominator grows with it, and every extra
    factor is another column a generated block has to match -- so the first seal's
    eleven-factor window could not simply be carried over. It narrowed slightly and
    shifted right; 6 remains inside it, which is the finding, not the assumption.
    LOWER BOUND -- dependence_band_exceedance_fraction (enforce, max 0.5). Short blocks
    destroy serial dependence. Measured (mean of 3 seeds, worst seed in brackets):
    L=3 scores 0.537 [0.556] and FAILS the gate outright; L=4 scores 0.481 [0.500];
    L=5 scores 0.407 [0.444]; L=6 scores 0.361 [0.361]; L=8 scores 0.333; L=10 scores
    0.306; L=12 scores 0.250; L=18 scores 0.194; L=24 scores 0.130 [0.194].
    L=4 IS EXCLUDED, AND ON A STATED PRINCIPLE RATHER THAN ON ITS MEAN: its worst seed
    lands on EXACTLY 0.500 against a `max` of 0.5, which passes only because a band's
    bracket is closed (limitations.knife_edge_band_comparisons -- the same knife-edge
    the negative-control run found 148 of). A benchmark whose enforce margin is zero in
    one seed of three is not a benchmark. The lower edge is therefore L >= 5, up from
    the first seal's L >= 4: at eleven factors L=3 scored 0.515 and L=4 was never
    measured; at twelve, L=3 scores 0.537 and L=4 is at the bound.
    UPPER BOUND -- the memorization surface. A stationary bootstrap emits a VERBATIM
    24-month historical window whenever no block restart falls inside it, which happens
    with probability (1 - 1/L)^23: 1.5% at L=6, 4.6% at L=8, 8.9% at L=10, 13.5% at
    L=12, 37.6% at L=24. Two consequences. (a) near_duplicate_fraction (enforce, max
    0.5) rises with L -- measured 0.065 at L=6, 0.106 at L=8, 0.194 at L=12, 0.304 at
    L=18, 0.364 at L=24 -- and clears 0.5 at every L tested, so this gate is NOT the
    binding constraint, contrary to what a reading of RFR-40 alone would suggest (that
    row measured nc5, a FIXED-24-month-block stitch, at ~0.93; geometric lengths are a
    different object and the fixed-block number does not transfer). (b)
    nn_distance_p05 is the 5th percentile of the generated blocks' nearest-neighbour
    distance, so it collapses to EXACTLY 0.0 as soon as the verbatim rate exceeds 5% --
    measured 0.693 at L=6, 0.394 at L=8, and 0.000 at L>=10, close to what
    (1 - 1/L)^23 predicts. THE UPPER EDGE TIGHTENED: at eleven factors the collapse was
    at L=12 (L=10 still scored 0.073); at twelve it is at L=10, and L=8's margin fell
    from 0.512 to 0.394. The upper bound is STRUCTURAL (a verbatim rate exceeding the
    metric's own 5th percentile), not a function of the numeric floor this file seals
    for that metric: at L=6 the measured 0.693 clears that floor (0.0279) by a factor
    of 25, so the choice is nowhere near knife-edge on a number WP2.3 itself authored.
    THE WINDOW IS THUS ROUGHLY 5 <= L <= 9 (it was roughly 4 <= L <= 8 at eleven
    factors), and 6 sits inside it, one step from the lower edge rather than in the
    middle. THAT ASYMMETRY IS STATED RATHER THAN SMOOTHED: L=6's dependence margin is
    0.361 against 0.5 -- comfortable -- while its memorization margin is a factor of 25
    on a floor this file authored, which is the softer of the two claims. If a future
    measurement moves the lower edge again, 6 is the number under pressure.
    RECORDED SO IT IS NOT MISREAD AS A FREE CHOICE: there is no L that both maximizes
    dependence fidelity and minimizes verbatim reproduction; the two gates pull in
    opposite directions and the benchmark sits between them by construction.

  moment_gate_risk_measured: >-
    THE THIRD RISK, RAISED IN ADVANCE AND MEASURED RATHER THAN ASSUMED. The moment
    family's `std` bands are length-matched: every replicate is a SINGLE CONTIGUOUS
    120-month window of history, so any ERA-MIXING generator converges toward
    full-sample dispersion, which for a persistent level sits above a typical single-era
    window's -- and a stationary bootstrap with mean block 6 mixes eras aggressively by
    construction. The concern is real (nc5-condition-ignoring, an undistorted resample
    of real history on the synthetic control panel, fails `std` on 6 of 13 factors for
    this reason alone) and it applies to an ENFORCE gate, so it had to be checked before
    sealing rather than discovered in WP2.4. MEASURED ON THE SEALED CAMPAIGN VINTAGE:
    `moment_band_exceedance_fraction` is 0.0833 -- 2 of 24 comparisons -- at EVERY mean
    block length tested from 3 to 24, in every seed, against a bound of 0.5. It does not
    vary with L at all, which is itself informative: the two failures come from the
    block_draw_span's 1990-2020 window differing from each factor's own full history,
    not from era mixing inside a path. RE-MEASURED AT TWELVE FACTORS: the same TWO
    comparisons fail, out of 24 rather than 22 (0.091 -> 0.0833), so `policy_rate`'s
    mean and std both land inside their bands over the 1990-2020 window and the finding
    is unchanged in substance. The gate is NOT binding for bootstrap-v1 and the risk is
    closed -- but note the number is not zero, and note also that this is exactly the
    comparison limitations.every_negative_control_number_is_from_a_synthetic_fixture
    warns about in the other direction: nc5's 6-of-13 is a synthetic-panel number and
    does not transfer to the campaign vintage, as this measurement shows.
    ALSO MEASURED AND ALSO FLAT IN L: `tail_band_exceedance_fraction` is 0.1364 at every
    L from 3 to 24 (it is `report`, so it gates nothing -- see
    limitations.the_tail_gate_cannot_fire, which is exactly why a number that small is
    not reassuring).

  block_draw_span_rule: >-
    The maximal contiguous train+validation span over which EVERY factor in
    factor_set (below) is simultaneously observed. Multivariate blocks mean one shared
    row index across all factors (never per-factor resampling), so a block can only be
    drawn where the whole panel exists.
  block_draw_span: {start: "1953-04-01", end: "2020-12-01", months: 813}
  block_draw_span_binding_factor: ust_2y
  block_draw_span_consequence: >-
    THE ROUTE OUT WAS TAKEN AT CAMPAIGN-3 (AM-2026-08-10-001): the first of the
    three routes below -- extension plus ratification plus campaign restart --
    completed end to end. The read-path flip is sealed (AM-2026-08-09-003), the
    extension modules and pinned artifacts are hashed, and every reference band
    is re-derived on the extended panel (artifacts/campaign3/reference-run.json,
    vintage 2026-08-10.1). The severe test is POSABLE FOR BOTH SIDES from this
    seal onward (see severe_test_protocol.benchmark_exception, retired).
    AMENDED BY AM-2026-08-09-002 (the span-53 ratification): the span above is
    1953-04..2020-12 (813 months), bound by ust_2y's GS1/GS3 donor floor, on the
    seven verified series extensions of 2026-08-09 -- SPEC NOW, WIRING AT
    CAMPAIGN-3, whose own pre-registration performs the read-path flip, hashes the
    extension modules, and re-derives every reference band on the extended panel.
    No sealed code serves the extended panel under this amendment; the campaign-2
    record keeps reproducing bit-identically until campaign-3's seal; no existing
    verdict is re-graded. The severe test becomes POSABLE FOR BOTH SIDES at
    campaign-3 (the benchmark span now contains 1966-84). The prose below is the
    G2-era record of the defect this amendment closes, kept verbatim as history.
    THE BENCHMARK'S LARGEST SINGLE DEFECT, stated here rather than discovered in WP2.4.
    equity_vol (fred.VIX) begins 1990-01, funding_spread (TED) 1986-01 and hqm_curve
    1984-01, while equity_mkt/smb/hml/mom reach back to 1926 and cpi to 1913 -- so
    requiring all twelve available factors simultaneously collapses a 108-year panel to
    a 31-year one. bootstrap-v1 CANNOT REACH ANY PRE-1990 EPISODE: not the 1970s
    stagflation, not 1973-74, not 1987, not the Depression.
    THE VINTAGE MOVE DID NOT CHANGE THIS BY ONE MONTH, and that is worth stating
    explicitly so nobody re-litigates it: `policy_rate` was restored with history back
    to 1954-07, but `equity_vol` binds the span and starts in 1990-01. The measurement
    is machine-produced -- scripts/measure_block_length_window.py reports
    `binding_factors: ['equity_vol']` for this factor_set -- so the sealed
    block_draw_span_binding_factor above is derived, not asserted. Restoring
    `policy_rate` moved the span's start by nothing; only dropping equity_vol from the
    factor set, or a ragged-panel bootstrap, would. Two direct consequences.
    (1) The severe test STEP2-GENERATOR-PLAN Sec.WP2.11 pins -- exclude the 1970s,
    regenerate from the 1965 climate state, compare 1966-84 -- IS NOT POSABLE for the
    benchmark at all, and G2-EVIDENCE.md must say so rather than report a benchmark
    severe-test result that does not exist. (2) The benchmark's tail statistics are
    drawn from a window whose worst equity drawdowns are 2000-02, 2008-09 and 2020;
    every sealed reference band it is judged against, by contrast, is computed on each
    factor's OWN full history, which for the equity factors is 1926 onward. The
    benchmark is therefore judged against bands wider and older than the data it can
    resample -- conservative for a pass, but it means a bootstrap-v1 pass is weaker
    evidence than it looks.
    THE THREE ROUTES OUT, none taken here because each is a WP2.4-or-later change:
    apply the registered ah.data.splice proxy rules and refresh to a vintage in which
    policy_rate and hy_spread carry long history (a campaign restart); drop the
    short-history factors from factor_set and resample a longer span with fewer
    factors; or build a ragged-panel bootstrap that draws blocks over the long span and
    admits factor-dependent availability (a genuinely new estimator). Any of the three
    is a dated amendment.

  # Campaign-2 (AM-2026-08-02-009): hy_spread restored (pinned splice), fx_usd and
  # cape_v added by the fx / valuation block_addition amendments (-007/-008).
  # Campaign-3 (AM-2026-08-10-001, ruling K2 + owner ruling 2026-08-10):
  # commodities joins -- sourced, banded, and EMITTED, so the restored
  # eqw_factors/endowment_proxy thresholds are judgeable on generated paths.
  factor_set: [cape_v, commodities, cpi, equity_mkt, equity_vol, funding_spread,
               fx_usd, hml, hqm_curve, hy_spread, ig_spread, mom, policy_rate,
               smb, ust_10y, ust_2y]
  factor_set_rule: >-
    Every active factor with train+validation data on the sealed campaign vintage --
    i.e. manifest.active_factors() minus reference_run.missing_factors. TWELVE of the
    fourteen declared (eleven at the first seal; `policy_rate` joins on campaign vintage
    2026-07-26.1). bootstrap-v1 emits exactly these and no others. This is also
    what makes the two economics audits reachable rather than NaN-forced
    (governance/retrofit-register.md RFR-30): the set contains smb/hml/mom (so
    money_pump_violations has zero-cost legs to audit) and policy_rate/ust_2y/ust_10y/
    hqm_curve plus ig_spread/funding_spread (so floor_violations has rate and spread
    factors to audit). `policy_rate`'s arrival additionally makes term_premium,
    equity_risk_premium and policy_anchor_deviation computable on the generated side and
    the `carry` D4 strategy computable on both -- see
    limitations.the_economics_tier_reduces_to_five_of_eleven. WP2.4 must also populate
    ah.gen.base.EnsembleMeta.active_blocks and validate it against the manifest (RFR-4).

  stratification: regime_ruleset_v1
  stratification_statement: >-
    Blocks are drawn stratified by the Step-1 regime label of their START month, using
    ah.data.derive.label_regime at ruleset version regime_ruleset_v1 with thresholds
    cpi_high=4.0, growth_weak=0.0, growth_slow=1.5, drawdown_crisis=-0.2, hy_crisis=8.0
    -- restated here so the stratification is reconstructible from this file alone.
    NOTE, because the vintage move might be misread as fixing this: label_regime's CRI
    branch needs hy_oas, and `hy_spread` is still absent. `policy_rate`'s restoration
    changes nothing here -- label_regime does not read it.
    Six labels: EXP, SLOW, REC, CRI, STAG, REF. UNCONDITIONAL sampling draws the start
    regime from the historical frequency of the six labels over block_draw_span.
    CONDITIONED sampling (a WorldSpec naming a regime sequence) pins the stratification
    path: the start regime of each block is the requested regime for that month.
    KNOWN GAP IN THE LABELS THEMSELVES: label_regime's CRI branch is
    `usrec AND (drawdown <= -0.2 OR hy_oas >= 8.0)`, and hy_oas has no train+validation
    data on the sealed vintage (reference_run.missing_factors), so over block_draw_span
    the CRI label rests on the drawdown disjunct ALONE. Every episode in 1990-2020 that
    should be CRI (2000-02, 2008-09, 2020) clears the -20% drawdown test, so no label
    is lost in practice -- but the rule is running one-legged and that must not be
    rediscovered as a surprise.

  conditioning_statement: >-
    bootstrap-v1 honours a WorldSpec's regime sequence (via stratification) and nothing
    else. It has NO mechanism for factor_conditions -- an inflation average, a rate
    endpoint, a crisis severity -- and will not acquire one. Its failure on the
    conditional tier is therefore EXPECTED AND IS THE POINT: STEP2-GENERATOR-PLAN
    Sec.WP2.2 says the bootstrap runs the conditional suite so that "its structural
    inability to honor novel conditions becomes measured evidence, not an aside". A
    conditional-tier failure by bootstrap-v1 is not a defect to fix and must not be
    reported as one.

  determinism: >-
    All randomness flows from one integer seed through
    numpy.random.Generator(PCG64(seed)); ensemble seeds are base_seed + 7919*k
    (CLAUDE.md's invariant). The same seed against the sealed vintage gives a
    digest-identical ensemble.

  what_wp24_must_report: >-
    Five numbers this file cannot supply and WP2.4 must, whatever they say. (1) The
    measured per-comparison band exceedance rate, which is the FIRST empirical
    observation of the null the three gates' 0.10 premise assumes (see
    limitations.null_exceedance_rate_is_unverified). (2) Its own three
    *_band_exceedance_fraction values at the sealed criterion ensemble size -- the
    numbers above are from a 200-path prototype, not a criterion-bearing run. (3)
    Whether the sealed mean_block_months of 6 still sits inside the window at 1024
    paths; the window's edges were measured at 200, and the re-seal's own re-measurement
    at twelve factors MOVED BOTH EDGES (5 <= L <= 9, from 4 <= L <= 8), which is direct
    evidence that this window is not a fixed property of the method. (4) Its measured
    elicitability_score for each computable D4 strategy, so a derived bound can replace
    the one sealed threshold in this file derived from nothing. (5) Its measured
    term_premium and equity_risk_premium -- both newly computable on this vintage and
    both still sealed at an authored, un-derived bound.

# --------------------------------------------------------------------------- #
# ablation_systems -- the five systems evaluated on identical seeds, splits and the
# frozen campaign vintage (STEP2-GENERATOR-PLAN Sec.WP2.10). Frozen here so the
# ablation cannot grow an extra arm after results are seen.
# --------------------------------------------------------------------------- #
ablation_systems:
  A: {id: structure-only, description: "L1 climate + L2 regimes + Gaussian residuals", neural: false}
  B: {id: neural-rollout, description: "L3 chained directly, no waypoints, no L1 anchor", neural: true}
  C: {id: neural-only, description: "L3 blocks + naive chaining, no L1", neural: true}
  D: {id: full-hierarchy, description: "the complete four-layer hierarchy; ONE sampler at campaign-3, hier-flow-v2 (hier-diffusion DOES NOT RACE -- the flow family was the promoted line and a diffusion retrain spends the K4 budget without a decision it would change; racing it later is a dated amendment). Superseded campaign-2 text: two samplers, hier-diffusion-v1 and hier-flow-v1.", neural: true}
  E: {id: bootstrap-v1, description: "the frozen benchmark on the EXTENDED span (AM-2026-08-09-002); campaign-2 text: the frozen benchmark specified above", neural: false}
  F: {id: har-masked, description: "system D's architecture with equity_vol MISSING pre-1986 (ruling K3; see multi_seed_decision_rule.har_masked_ablation)", neural: true}
ablation_rule: >-
  Exactly these six, no more (CAMPAIGN-3, AM-2026-08-10-001: F added by ruling
  K3, sealed BEFORE any training run -- the "sixth arm after any result is
  seen" prohibition below is untouched because no result exists). Neural
  systems (B, C, D, F) run >= 3 TRAINING seeds each; deterministic systems
  (A, E) run >= 3 SAMPLING seeds each. Every system is evaluated on the
  identical splits, the identical campaign vintage, and the sealed criterion
  ensemble size. ABLATION.md is generated, not hand-assembled, and shows
  cross-seed dispersion per metric. Adding a further arm after any result is
  seen is a dated, post-hoc-flagged amendment and must be reported as one.
  Superseded campaign-2 text, kept as history: "Exactly these five, no more.
  ... Adding a sixth arm after any result is seen is a dated,
  post-hoc-flagged amendment and must be reported as one."

# --------------------------------------------------------------------------- #
# tuning_protocol -- the forking-paths record (STEP2-GENERATOR-PLAN Sec.WP2.8).
# --------------------------------------------------------------------------- #
tuning_protocol:
  search_surface: validation_folds_only
  trial_budget_per_system: 40
  trial_budget_statement: >-
    40 configurations per neural system per sampler, counted as distinct config hashes
    logged to the experiment store, INCLUDING every abandoned or crashed run. The
    budget is a cap on the search, so a trial that was started counts whether or not it
    finished -- otherwise "restart it and don't count it" is an unbounded search. A
    system that exhausts its budget without a satisfactory config is reported as such;
    it does not receive more budget without a dated amendment.
  logging: >-
    Every trial logs config hash, git SHA, seed, and per-fold validation scores to
    experiments/<exp_id>/. The log must be complete and within budget before the final
    config is selected; an incomplete log invalidates the selection.
  selection_lambda: 1.0
  selection_criterion: >-
    The final config is the one minimizing
    S = mean_over_validation_folds(generative_objective)
        + selection_lambda * mean_over_validation_folds(D4_tail_elicitability_auxiliary),
    ties broken by the lower sampling cost (NFE). Stated in advance, in words and in
    closed form, so the selection cannot be rationalized after the fact.
    LAMBDA IS PINNED HERE AND IS NOT A HYPERPARAMETER. Re-seal fix, review Important 5:
    the first seal said "at the config's own sealed lambda", which pinned nothing -- no
    lambda was sealed anywhere, and "the config's own" would have let each trial carry
    its own weighting, which is not a selection criterion at all but a licence to pick
    the arm whose weighting flatters it. selection_lambda = 1.0 is EQUAL WEIGHT ON THE
    TWO RAW TERMS, and it is AUTHORED, NOT DERIVED: no generator exists, so no evidence
    about the two terms' relative scale exists either, and inventing a scale-aware value
    would be a fitted number wearing a derivation. It is named as provisional in
    governance/amendment-log.yaml pending D6, exactly like
    tuning_protocol.trial_budget_per_system.
    WHAT ACTUALLY MATTERS ABOUT IT, and why 1.0 is adequate despite being arbitrary: the
    load-bearing property is INVARIANCE, not level. The SAME selection_lambda applies to
    every ablation system, every sampler, every seed and every trial, so no arm is
    selected under a criterion another arm was not. Changing it is a dated
    protocol_change amendment.
    THE LIMIT OF THAT ARGUMENT, stated because the first version of it overreached
    (final-pass finding; the VALUE is unchanged and is not re-fitted): what is invariant
    is the RULE, not the effective weight. `generative_objective` is a DIFFERENT QUANTITY
    PER ARM and the arms are not on one scale -- ablation system D runs TWO SAMPLERS,
    hier-diffusion-v1 and hier-flow-v1, whose objectives are an ELBO (a bound) and an
    exact log-likelihood, and the trial budget is per system PER SAMPLER, so the two are
    separately selected under this criterion -- so a fixed lambda gives the D4 tail
    auxiliary a different EFFECTIVE weight in each. That is a real limitation of a fixed
    lambda across
    incommensurable objectives, and it cannot be repaired by choosing a different
    constant, because no constant is scale-aware and any scale-aware value would have to
    be read off the trials, which is forbidden two sentences down. CONSEQUENCE, binding
    on WP2.8: report BOTH terms of S separately -- per system and per sampler, with
    their scales -- so a reader can see what weight the auxiliary actually carried in
    each rather than inferring it from lambda. It may NEVER be chosen from the trials: selecting lambda
    by looking at trial outcomes is tuning the selection criterion, which is precisely
    the forking path this protocol exists to close, and doing it would make every
    subsequent comparison uninterpretable.
  prohibitions: >-
    No tuning of anything on the holdout, ever -- the holdout is reachable only through
    a FinalEvaluationToken minted in ah/eval/g2.py and is spent exactly once by WP2.11.
    No tuning against the negative-control suite. No tuning against any enforce-tier
    metric's threshold value. The acceptance filter in WP2.7 is separately barred from
    touching enforce-tier metrics at all, and STEP2-GENERATOR-PLAN Sec.WP2.7 requires
    that bar to be asserted by test against this manifest. CLAIMS-SWEEP CORRECTION: that
    last clause was sealed in the present tense -- "asserted by test against this
    manifest" -- as though the test existed. It does not, and cannot yet: WP2.7's
    assemble.py has not been written, so there is no filter-metric subset for a test to
    check disjointness of. This is a sealed REQUIREMENT ON WP2.7, in the same posture as
    multi_seed_decision_rule.criterion_bearing_runs_only's refusal requirement on
    WP2.11, and it is stated as one rather than described as a check already in place.
    The PROHIBITION itself is unchanged and binds whether or not the test exists.

# --------------------------------------------------------------------------- #
# severe_test_protocol -- pinned BEFORE the test is run (STEP2-GENERATOR-PLAN
# Sec.WP2.11). The point of pinning it is that a failure cannot be reinterpreted as a
# tuning opportunity afterwards.
# --------------------------------------------------------------------------- #
severe_test_protocol:
  design: >-
    Exclude the 1970s (1970-01-01 to 1979-12-31 inclusive) from the fitting sample.
    Refit L1 and L2 and RETRAIN L3 with the FROZEN architectures and hyperparameters of
    the primary runs -- refit/retrain only, NO fresh hyperparameter search on the
    reduced sample, no architecture change, no early-stopping-criterion change.
    Regenerate from the 1965 climate state and compare 1966-1984 behaviour through the
    horizon tier.
  reporting: >-
    The result is written up in G2-EVIDENCE.md EITHER WAY. A failure is a finding about
    the generator's ability to extrapolate to an era it never saw, which is the whole
    question the test asks; it is not grounds for re-tuning.
  benchmark_exception: >-
    RETIRED AT CAMPAIGN-3 (AM-2026-08-10-001): bootstrap-v1 CAN NOW RUN THIS
    TEST. Its block_draw_span is 1953-04..2020-12 (AM-2026-08-09-002), which
    contains the excluded decade AND the 1965 start state; the vacuousness
    that grounded this exception is exactly what the extended span closed
    (tests/test_severe_blocks.py::TestTheExtendedPanelReachesTheDecade pins
    the flip). The severe leg is POSABLE FOR BOTH SIDES and no system holds
    an exception. SUPERSEDED G2 TEXT, verbatim, kept as history: bootstrap-v1
    CANNOT RUN THIS TEST. Its block_draw_span is 1990-2020 (see
    bootstrap_v1.block_draw_span_consequence), which contains neither the
    excluded decade nor the 1965 start state, so "exclude the 1970s" is
    vacuous for it and "regenerate from 1965" is impossible. G2-EVIDENCE.md
    must record the benchmark's severe-test row as NOT POSABLE, with this
    reason, rather than as a pass, a fail, or an omission.
  severe_test_criterion: >-
    SEALED WITH THE PROCEDURE, RFR-77's lesson (a procedure without a
    criterion judges nothing). A system PASSES the severe leg iff its
    excluded-decade regeneration keeps EVERY enforce-tier severe statistic
    inside its sealed band over the 1966-1984 comparison window. A system
    that cannot pose the leg FAILS it -- no exception route exists any more.
    The result reports either way and a failure is a finding, not a tuning
    opportunity (reporting clause above, unchanged).

# --------------------------------------------------------------------------- #
# multi_seed_decision_rule -- the G2 promotion rule, IN WORDS, sealed before any
# training run (STEP2-GENERATOR-PLAN Sec.WP2.3).
#
# WP2.11 implements it in ah/eval/g2.py, which today contains only the sanctioned
# holdout-token mint and no decision logic at all. That is stated rather than glossed:
# what is frozen here is the RULE, in words, before any evidence exists -- which is the
# whole point of pre-registering it. g2.py is already inside the seal, so when WP2.11
# writes the executable form it cannot diverge from these words without a dated
# amendment and a re-seal, and this block is what it will be read against.
# --------------------------------------------------------------------------- #
multi_seed_decision_rule:
  minimum_seeds: 3

  # --- WHAT "THE TAIL TIER" IS. Re-seal fix, review Critical 1. ---------------- #
  # The first seal's rule said "beats bootstrap-v1 on the tail tier" and NOTHING IN THE
  # CODE RESOLVED THAT PHRASE. ah.eval.battery.TIERS is
  # (monthly, 1_5yr, 10yr, economic, severe) -- there is no `tail` tier, and every
  # metric ah.eval.metrics.tails.build_tails_suite registers carries tier="monthly".
  # A promotion rule whose first clause names a thing the battery cannot produce is not
  # a rule; WP2.11 would have had to invent the definition, after seeing results, which
  # is exactly what pre-registering a decision rule exists to prevent. Defined here.
  tail_tier_definition: >-
    THE TAIL TIER IS A SUITE, NOT A HORIZON TIER: it is exactly the metrics registered
    by ah.eval.metrics.tails.build_tails_suite, i.e. every MetricSpec with
    suite == "tails". Two families. (a) PER STRATEGY, for each of the five sealed
    d4_strategies, eleven names -- var_95, es_95, var_99, es_99, elicitability_score,
    and the three backtests' `_lr_1path`/`_chi2_tail_1path` pairs (kupiec_pof,
    christoffersen_independence, christoffersen_conditional_coverage). (b) PER ACTIVE
    CROSS-BLOCK FACTOR PAIR, tail_dependence_lower and tail_dependence_upper. THE
    COMPARISON SET is family (a) restricted to the strategies with computable
    historical statistics -- the five d4_strategies minus
    reference_run.uncomputable_d4_strategies, which on this vintage is eqw_factors and
    endowment_proxy, leaving sixty_forty, momentum and carry as the comparison set --
    plus all of family (b). CORRECTED BY AMENDMENT AM-2026-07-29-001 (2026-07-29,
    post_hoc TRUE -- the first post-hoc entry in this project's amendment log). Until
    that amendment this clause read "which on this vintage is sixty_forty, momentum and
    carry", which names the COMPLEMENT of the sealed field it glosses. The field
    reference_run.uncomputable_d4_strategies is, and has been since the campaign vintage
    moved to 2026-07-26.1, [eqw_factors, endowment_proxy]: the FIELD was right, the
    GLOSS was wrong, and only the gloss has moved. THE DEFECT WAS NOT INERT. Read
    literally, the gloss made the comparison set the two strategies whose historical
    side is NaN on this vintage, and the NaN rule in beats_definition would then make no
    seed a beat for any system ever -- an automatic SHIP-BENCHMARK independent of all
    evidence -- whereas the field's reading leaves a comparison set that a challenger
    can win. It was found while extracting WP2.10's results, WITH THOSE RESULTS ALREADY
    IN HAND, and the correction is in the direction that makes a promotion possible.
    governance/amendment-log.yaml AM-2026-07-29-001 records that in full and must be
    read before weighing any PROMOTE verdict that rests on this clause.
    A name whose historical side is NaN
    is excluded from the comparison rather than counted as a tie, because a comparison
    against nothing is not a comparison. This definition is machine-checked against the
    live suite by tests/test_prereg.py; the document is normative if they disagree.
  beats_definition: >-
    "C BEATS B ON THE TAIL TIER IN A SEED" means BOTH of the following, computed on
    criterion-bearing runs of C and B at the sealed ensemble_size against the sealed
    campaign_vintage_id. (i) OBJECTIVE: C's mean elicitability_score over the
    comparison set's strategies is STRICTLY LOWER than B's. elicitability_score is the
    only directional scalar in the suite -- it is a strictly consistent joint (VaR, ES)
    scoring function of the GENERATED forecast against the HISTORICAL realizations, so
    lower is unambiguously better and the two generators' values are on one scale (see
    conventions.elicitability_score_estimator, and note limitations.
    named_estimator_substitutions: the family runs at 95% only). (ii) NO TAIL-BAND
    REGRESSION: C's count of comparison-set metrics falling OUTSIDE their sealed
    reference band (ah.eval.battery.band_is_usable bands only; degenerate and NaN bands
    are excluded from the count for both sides alike) is LESS THAN OR EQUAL TO B's.
    WHAT CLAUSE (ii) ACTUALLY RANGES OVER, disclosed rather than left to be discovered
    at WP2.11 (final-pass finding; this is DISCLOSURE, the clause itself is unchanged
    and remains deterministic): clause (ii) is scoped to USABLE REFERENCE BANDS, and
    ah.eval.reference.RegisteredStrategyStat carries NO `fn` -- by construction, since a
    backtest statistic or a scoring-rule value has no "history's own value of the same
    statistic" to band (see that registry's section header). So NO bootstrap band exists,
    or can exist, for any of the eleven strategy statistics, and clause (ii) is evaluated
    ENTIRELY over family (b), the cross-block tail_dependence_lower/upper comparisons
    (63 usable bands on this vintage) -- ZERO strategy-level metrics enter it. It does
    not touch var_95/es_95/es_99 for any strategy, and must not be read as covering them:
    those enter the rule only through clause (i)'s elicitability_score, and through the
    sealed thresholds.strategies bounds, which gate independently of this rule. THE
    ALTERNATIVE, named for the record because it was available and was not taken: writing
    clause (ii) against the sealed THRESHOLDS rather than against reference bands would
    have covered the strategy statistics, since thresholds.strategies does bound them.
    It is not adopted here because changing the clause after WP2.4's benchmark numbers
    exist is exactly the post-hoc rewriting this file exists to prevent; a later work
    package may propose it as a dated protocol_change amendment, before any challenger
    is evaluated. NaN RULE, in the same direction as conventions.nan_metric_rule: if either side's
    elicitability_score is NaN for any strategy in the comparison set, the seed is NOT
    a beat -- not a tie, not an exclusion. THE POOLED ALTERNATIVE, stated as an exact
    inequality rather than a gesture: let d_s be (C - B)'s mean elicitability_score
    difference in seed s over the >= 3 seeds; C beats B pooled iff mean_s(d_s) < 0 AND
    |mean_s(d_s)| > sd_s(d_s) with sd computed at ddof=1. Clause (ii) must still hold in
    every seed for the pooled route -- the pooled arm relaxes the objective, not the
    band-regression check.
  benchmark_draw_span_bias: >-
    CLAUSE RETIRED AT CAMPAIGN-3 (AM-2026-08-10-001): the mechanism this clause
    disclosed is GONE -- bootstrap-v1 resamples 1953-04..2020-12, so both
    sides of the head-to-head see 1973-74, 1987 and the stagflation decade,
    and no common-window restriction is required. REPLACED BY
    proxy_share_disclosure, the asymmetry the extended span introduces in
    its place. SUPERSEDED G2 TEXT, verbatim, kept as history: THE
    HEAD-TO-HEAD IS BIASED TOWARD PROMOTION, AND BY A MECHANISM THAT HAS NOTHING TO
    DO WITH EITHER GENERATOR'S QUALITY. Re-seal fix, review Critical 2. bootstrap-v1
    can only resample bootstrap_v1.block_draw_span (1990-01..2020-12; see
    block_draw_span_consequence), whose worst equity drawdowns are 2000-02, 2008-09 and
    2020. A challenger fitted on the full train+validation span has seen 1929-33,
    1937, 1973-74 and 1987. Both are then scored against the SAME historical
    realizations, which include all of it. So on any tail statistic that rewards
    reproducing the deep pre-1990 left tail -- elicitability_score first among them --
    the benchmark is handicapped by its data window, not by its form, and a challenger
    can win clause (i) without being a better generator in any sense G2 cares about.
    THE DIRECTION IS TOWARD PROMOTION, which is the direction that matters here: the
    plan's own posture is that SHIP-BENCHMARK is a successful outcome, so a bias in
    favour of the challenger is a bias against the conservative verdict. CONSEQUENCE,
    binding on WP2.11: G2-EVIDENCE.md must report this alongside any PROMOTE verdict,
    and must report the challenger-vs-benchmark elicitability comparison restricted to
    the 1990-2020 realizations as well as on the full sample. Neither number gates --
    the sealed rule is the sealed rule -- but a PROMOTE that survives only on the full
    sample and vanishes on the common window is a promotion of a data window. THE
    ROUTES OUT are block_draw_span_consequence's three, all amendments; none is taken.
  proxy_share_disclosure: >-
    THE EXTENDED SPAN'S OWN DISCLOSED ASYMMETRY, replacing the retired
    draw-span bias clause (AM-2026-08-09-002's disclosure, promoted to a
    sealed reporting requirement). Every verdict table computed over the
    extended span MUST report, per factor, the proxy share of the months
    that produced it -- and for equity_vol, the HAR share separately from
    the VXO share, because HAR months are MODEL OUTPUT (owner ruling D6
    admitted them as span data; this clause is the standing price). Neither
    number gates -- the sealed rule is the sealed rule -- but a verdict
    whose winning margin concentrates in high-proxy-share months must say
    so in G2-EVIDENCE.md's campaign-3 successor, and the K3 masked cell
    (har_masked_ablation) is the measured check on the equity_vol case.
  har_masked_ablation: >-
    RULING K3, operationalized. The ablation grid carries a MASKED variant
    of the promoted-family system: identical architecture, hyperparameters
    and seeds, with equity_vol treated as MISSING before 1986-01. The
    included-vs-masked comparison is reported in the campaign evidence.
    DEMOTION CRITERION, sealed before any training run: the HAR-included
    variant is DEMOTED to report-only -- the masked variant becomes the
    criterion-bearing configuration -- if (a) masking flips ANY enforce-tier
    clause of this decision rule for that system, or (b) the pooled
    decision-alpha difference between included and masked exceeds half the
    sealed beats-margin (|mean_s(d_s)| of clause (i)'s pooled route). A
    demotion is a finding about learning-from-our-own-reconstruction and
    reports as one.
  rule: >-
    PROMOTE the challenger over bootstrap-v1 only if ALL FOUR of the following hold.
    (1) TAIL SUPERIORITY: the challenger beats bootstrap-v1 on the tail tier in EVERY
    seed; or, pooled across seeds, beats it by more than the cross-seed dispersion of
    the difference. Both "the tail tier" and "beats" are defined exactly, above, in
    tail_tier_definition and beats_definition; neither may be reinterpreted at WP2.11.
    (2) NO ENFORCE-TIER REGRESSION on the monthly or 1_5yr tiers
    relative to bootstrap-v1. (3) MEMORIZATION BELOW FLOOR: every memorization-tier
    enforce threshold passes, in every seed. (4) ZERO CONSTRAINT VIOLATIONS:
    money_pump_violations and floor_violations are exactly 0 in every seed.
    Otherwise SHIP-BENCHMARK: bootstrap-v1 remains the default generator_id and
    G2-EVIDENCE.md says so plainly. A SHIP-BENCHMARK verdict is a successful outcome of
    Step 2, not a failure of it. Read clause (1) with benchmark_draw_span_bias.
  conditional_tier_is_not_gating: >-
    Conditional-tier results are REPORTED alongside the verdict and DO NOT GATE
    promotion. Sealed rationale, verbatim from the plan's reasoning: the platform's
    purpose weighs conditioning, but historical tail fidelity remains the falsifiable
    criterion, so conditioning is evidence rather than a gate at G2. Revisit at G3.
    This is also the sealed basis of decisions.S2-NC5-EXEMPTION -- the same rule that
    keeps conditioning non-gating is what exempts NC5 from the enforce criterion, and
    the two cannot be separated.
  criterion_bearing_runs_only: >-
    Every number entering this rule must come from a run at the sealed ensemble_size,
    against the sealed campaign_vintage_id, with a verified pre-registration and a
    matching lock. ah.eval.battery records `criterion_bearing` on every report (and
    prints it in bold when false), and it records ALL THREE of those conditions:
    ensemble.n_paths and ensemble.months against ensemble_size, ensemble.meta.vintage_id
    against campaign_vintage_id, and -- implicitly but not weakly -- the verified
    pre-registration and matching lock, because the field is only computed on the branch
    where ah.eval.prereg.verify(..., lock_path=...) has already returned without
    raising. FINAL-PASS CORRECTION: until this seal only the SIZE was compared. The
    vintage was carried onto the report and never checked, so a full-size run against a
    superseded vintage -- still reachable through the catalog's append-only pointer
    history, and possibly incomplete (see governance/retrofit-register.md RFR-62) --
    was stamped criterion_bearing: true. The sentence above was the sealed requirement
    and the code did not meet it; the code was extended to meet it rather than the
    sentence weakened to describe it. WP2.11's ah/eval/g2.py MUST refuse a report where
    it is false. That refusal does not exist yet -- g2.py contains only the
    holdout-token mint today -- so THAT part remains a sealed REQUIREMENT on WP2.11, not
    a description of a check already in place.
