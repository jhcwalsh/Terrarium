    # battery uses, so the sealed bands and the judged values cannot diverge in how a
    # strategy is built):
    #   sixty_forty  n = 708 months (1962-2020, limited by ust_10y's start),
    #                mean 0.00770, sd 0.02971, VaR95 0.04214, ES95 0.06001,
    #                VaR99 0.07122, ES99 0.08692, realized 95% exceedance rate 0.0508.
    #   momentum     n = 1134 months (1926-2020), mean 0.00803, sd 0.04110,
    #                VaR95 0.05613, ES95 0.09102, VaR99 0.11535, ES99 0.15597,
    #                realized 95% exceedance rate 0.0503.
    #   carry        n = 708 months (1962-2020; the ust_10y/policy_rate overlap, and
    #                ust_10y still binds it -- policy_rate reaches back to 1954-07),
    #                mean 0.00124, sd 0.02390, VaR95 0.03482, ES95 0.05203,
    #                VaR99 0.06364, ES99 0.08126, realized 95% exceedance rate 0.0508.
    # sixty_forty's and momentum's numbers are UNCHANGED from the first seal, to every
    # digit: neither strategy touches policy_rate, and a per-factor statistic on this
    # panel is a function of that factor's own column, so adding a twelfth factor moved
    # nothing that did not depend on it. That is stated because it is the check a reader
    # should want: a vintage change that silently moved unrelated bands would mean the
    # bands were not what the file says they are.
    # WHAT CARRY IS, read from its own numbers rather than assumed: a funded long-short
    # position. Its mean (0.00124/month) is an order of magnitude below the two long-only
    # strategies' and its dispersion is the lowest of the three, which is what a
    # duration-carry trade looks like -- most of sixty_forty's bond-leg return is the
