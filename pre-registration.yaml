  # ._check_strategy_threshold_key). NOT exhaustive over every registered strategy stat,
  # deliberately: `var_99`/`es_99` and the four Christoffersen names carry no sealed
  # threshold because limitations.named_estimator_substitutions records why the backtest
  # family runs at 95% only.
  strategies:
