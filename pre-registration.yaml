    # min: 0.05, not 0.0. A pass RATE is bounded in [0, 1], so `min: 0.0` judges
    # nothing at all -- it is a threshold that can never be violated, which is worse
    # than no threshold (it reads in the artifact as a check that passed). 0.05 is the
    # smallest non-vacuous floor consistent with the descending provisional ladder
    # above: at z=4.0 we still provisionally expect at least 1 path in 20 to land
    # within OFF_SUPPORT_PASS_TOLERANCE_PCT of the swept target. Provisional, `report`,
    # and replaced by WP2.3's real band like every other value in this block.
    "off_support_pass_rate_at_beyond": {min: 0.05, max: null, severity: report}
