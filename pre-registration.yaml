# --------------------------------------------------------------------------- #
# structurally_unavailable_statistics -- names that are NaN on every ensemble, always.
#
# A statistic here cannot be computed on ANY generator's output because an input it
# needs does not exist anywhere in the platform yet (a missing factors.yaml mapping, or
# a generator capability nothing implements). ah.eval.battery marks the corresponding
# MetricSpec `status: structurally_unavailable`, and under THE ONE NaN RULE
# (conventions.nan_metric_rule) a NaN `enforce` metric FAILS -- so an `enforce`
# threshold on any name below would fail EVERY RUN FOREVER, reading in the artifact as
# a real generator defect rather than as a platform gap.
#
# Before WP2.3 that status was VISIBLE on the metric but not ENFORCED on the threshold.
# ah.eval.prereg.verify() now REJECTS `severity: enforce` on any statistic named here,
# on every battery invocation. All TEN names below are sealed `report` or omitted
# deliberately; none carries an enforce threshold. (Count history: a re-seal fix
# corrected "eleven" to "twelve"; campaign-2 (AM-2026-08-02-008) removed the two
# ten_year_return_vs_valuation_* names -- their factor gap closed -- leaving TEN:
# ergodicity_gap, three regime_duration_*, six implied_sharpe_*. Counted, not
# estimated: tests/test_prereg.py asserts the list against what a real suite
# registration marks, in both directions.)
#
# NOTE ON THE (first) VINTAGE MOVE: none of these is restored by a refresh alone. All twelve are
# blocked by a missing factors.yaml MAPPING (usrec/growth_yoy for the regime names,
# shiller.cape for the valuation names) or by a generator capability nothing implements
# (a long path, for ergodicity_gap) -- never by a series being absent from a snapshot,
# which is what the refresh fixed for policy_rate. This block is unchanged.
#
# The list is sealed HERE rather than imported from ah.eval.battery for two reasons:
# the metric suites cannot be imported by ah.eval.prereg (they import ah.eval.battery,
# which imports prereg), and this file must be reconstructible on its own -- a reader
# must see which names were known-unavailable at seal time without running the code.
# tests/test_prereg.py asserts this list equals, in BOTH directions, the set a real
# suite registration actually marks.
#
# `restored_by` names the work package that closes the gap; `unscheduled` means no
# owner exists today and one must be given before G2 (governance/retrofit-register.md
# RFR-42 says so for the valuation factor specifically).
# --------------------------------------------------------------------------- #
structurally_unavailable_statistics:
  ergodicity_gap:
    restored_by: WP2.5
    reason: >-
      DN-1.1 Sec.II.6 defines it as long-path vs ensemble moments. The estimator is
      built and tested (ah.eval.reference.ergodicity_gap, against an ergodic AR(1), an
      iid process and a genuinely non-ergodic regime mixture), but run_battery is
      handed one Ensemble of production-length paths and no long path, and no generator
      can emit one. WP2.5's climate model is the first that could. Registered for all
      fourteen declared active factors, so this one name accounts for fourteen of the
      twenty-five unavailable metric instances. See governance/retrofit-register.md
      RFR-20 (which also records what this metric REPLACED: an earlier version that was
      algebraically |variance_ratio_120m - 1| and would have failed a CORRECT generator
      of every persistent factor). variance_ratio_120m remains registered and
      computable, so the underlying serial-dependence question is not unmeasured.
  # The three regime_duration_* names and the six implied_sharpe_* names share ONE
  # blocker, stated once here and referenced by each: ah.data.derive.label_regime needs
  # `usrec` (NBER recession) and `growth_yoy` (industrial production) to label a
  # generated month. Both series ARE registered in requirements.yaml with working
  # connectors and both ARE in the sealed vintage -- the blocker is purely that no
  # factors.yaml mapping exposes them as generator-visible output factors, which is a
  # generator-namespace decision, not a data-sourcing one (governance/retrofit-
  # register.md RFR-22 records that the WP1.9 emergent-requirements route was considered
  # for exactly this and does not apply). WP2.6's semi-Markov regime skeleton is what
  # makes a generated path regime-labelled. See RFR-17 (durations) and RFR-27 (Sharpes).
  regime_duration_mean:
    restored_by: WP2.6
    reason: no regime label can be attached to a generated path; see the note above and RFR-17.
  regime_duration_p50:
    restored_by: WP2.6
    reason: no regime label can be attached to a generated path; see the note above and RFR-17.
  regime_duration_p90:
    restored_by: WP2.6
    reason: no regime label can be attached to a generated path; see the note above and RFR-17.
  implied_sharpe_EXP:
    restored_by: WP2.6
    reason: >-
      DN-1.1 Sec.II.6's "implied Sharpe ratios by regime"; same regime-label blocker as
      regime_duration_*. Six regime labels, six unavailable names. See RFR-27.
  implied_sharpe_SLOW:
    restored_by: WP2.6
    reason: same regime-label blocker as regime_duration_*; see RFR-27.
  implied_sharpe_REC:
    restored_by: WP2.6
    reason: same regime-label blocker as regime_duration_*; see RFR-27.
  implied_sharpe_CRI:
    restored_by: WP2.6
    reason: same regime-label blocker as regime_duration_*; see RFR-27.
  implied_sharpe_STAG:
    restored_by: WP2.6
    reason: same regime-label blocker as regime_duration_*; see RFR-27.
