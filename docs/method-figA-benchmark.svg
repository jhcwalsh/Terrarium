<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Georgia, 'Times New Roman', serif">
  <style>
    .t  { font-size: 19px; fill: #111827; }
    .st { font-size: 13px; fill: #6b7280; font-style: italic; }
    .pt { font-size: 13.5px; fill: #111827; }
    .s  { font-size: 12px; fill: #374151; }
    .m  { font-size: 11px; fill: #6b7280; }
    .v  { font-size: 11px; fill: #374151; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
    .zero { stroke: #9ca3af; stroke-width: 1; }
  </style>
  <rect width="960" height="420" fill="#fcfcfb"/>

  <text x="40" y="30" class="t">The kill criterion: five challengers against the bootstrap benchmark</text>
  <text x="40" y="50" class="st">d = challenger &#8722; benchmark, mean tail (elicitability) score over the 60/40, momentum and carry books; lower is better, negative beats the benchmark</text>

  <!-- legend -->
  <g>
    <rect x="40" y="62" width="10" height="10" rx="2" fill="#2563eb"/>
    <text x="55" y="71" class="s">hier-flow-v1 (promoted)</text>
    <rect x="205" y="62" width="10" height="10" rx="2" fill="#b45309"/>
    <text x="220" y="71" class="s">hier-diffusion-v1</text>
    <rect x="340" y="62" width="10" height="10" rx="2" fill="#9ca3af"/>
    <text x="355" y="71" class="s">other challengers</text>
  </g>

  <!-- ============ Panel 1: mean d, all systems ============ -->
  <text x="40" y="102" class="pt">1 &#183; Mean score vs benchmark</text>
  <!-- x-scale: d in [-0.5, +0.5] -> x = 170 + 260*d ; zero at 170 -->
  <line x1="170" y1="115" x2="170" y2="300" class="zero"/>
  <line x1="40"  y1="115" x2="40"  y2="300" class="grid"/>
  <line x1="300" y1="115" x2="300" y2="300" class="grid"/>
  <text x="40"  y="313" class="m" text-anchor="middle">-0.5</text>
  <text x="170" y="313" class="m" text-anchor="middle">0</text>
  <text x="300" y="313" class="m" text-anchor="middle">+0.5</text>
  <text x="160" y="328" class="m" text-anchor="end">&#8592; beats benchmark</text>

  <!-- abl-a: d=+0.412 -> bar 170..277 -->
  <text x="44" y="128" class="s">abl-a structure-only</text>
  <rect x="170" y="132" width="107" height="10" rx="4" fill="#9ca3af"/>
  <text x="281" y="141" class="v">+0.41</text>
  <!-- abl-b: d=-0.015 -> bar 166..170 -->
  <text x="44" y="165" class="s">abl-b neural-rollout</text>
  <rect x="166" y="169" width="4" height="10" fill="#9ca3af"/>
  <text x="162" y="178" class="v" text-anchor="end">-0.01</text>
  <!-- abl-c: d=+17.9, off scale -->
  <text x="44" y="202" class="s">abl-c neural-only</text>
  <rect x="170" y="206" width="126" height="10" fill="#9ca3af"/>
  <path d="M 296 206 l 8 5 l -8 5 z" fill="#9ca3af"/>
  <text x="256" y="228" class="v">+17.9, off scale</text>
  <!-- hier-diffusion: d=-0.227 -> bar 111..170 -->
  <text x="44" y="243" class="s">hier-diffusion-v1</text>
  <rect x="111" y="247" width="59" height="10" rx="4" fill="#b45309"/>
  <text x="107" y="256" class="v" text-anchor="end">-0.23</text>
  <!-- hier-flow: d=-0.297 -> bar 93..170 -->
  <text x="44" y="280" class="s">hier-flow-v1</text>
  <rect x="93" y="284" width="77" height="10" rx="4" fill="#2563eb"/>
  <text x="89" y="293" class="v" text-anchor="end">-0.30</text>

  <!-- ============ Panel 2: per-seed consistency ============ -->
  <text x="360" y="102" class="pt">2 &#183; Every seed, separately</text>
  <!-- x-scale: d in [-0.40, 0] -> x = 620 + 650*d ; zero at 620 -->
  <line x1="620" y1="115" x2="620" y2="300" class="zero"/>
  <line x1="360" y1="115" x2="360" y2="300" class="grid"/>
  <line x1="490" y1="115" x2="490" y2="300" class="grid"/>
  <text x="360" y="313" class="m" text-anchor="middle">-0.40</text>
  <text x="490" y="313" class="m" text-anchor="middle">-0.20</text>
  <text x="620" y="313" class="m" text-anchor="middle">0 = benchmark</text>

  <text x="364" y="138" class="s">seed 0</text>
  <line x1="360" y1="150" x2="620" y2="150" class="grid"/>
  <circle cx="439" cy="150" r="5" fill="#2563eb" stroke="#fcfcfb" stroke-width="2"/>
  <circle cx="465" cy="150" r="5" fill="#b45309" stroke="#fcfcfb" stroke-width="2"/>

  <text x="364" y="193" class="s">seed 1</text>
  <line x1="360" y1="205" x2="620" y2="205" class="grid"/>
  <circle cx="422" cy="205" r="5" fill="#2563eb" stroke="#fcfcfb" stroke-width="2"/>
  <circle cx="479" cy="205" r="5" fill="#b45309" stroke="#fcfcfb" stroke-width="2"/>

  <text x="364" y="248" class="s">seed 2</text>
  <line x1="360" y1="260" x2="620" y2="260" class="grid"/>
  <circle cx="420" cy="260" r="5" fill="#2563eb" stroke="#fcfcfb" stroke-width="2"/>
  <circle cx="474" cy="260" r="5" fill="#b45309" stroke="#fcfcfb" stroke-width="2"/>

  <text x="430" y="132" class="v" fill="#2563eb" text-anchor="middle">flow</text>
  <text x="473" y="132" class="v" fill="#b45309" text-anchor="middle">diffusion</text>
  <text x="364" y="290" class="m">flow wins in all three seeds; span 0.03 on a mean of -0.30</text>

  <!-- ============ Panel 3: restricted window ============ -->
  <text x="680" y="102" class="pt">3 &#183; Restricted to 1990&#8211;2020</text>
  <!-- x-scale: d in [-0.40, 0] -> x = 940 + 650*d ; zero at 940 -->
  <line x1="940" y1="115" x2="940" y2="300" class="zero"/>
  <line x1="680" y1="115" x2="680" y2="300" class="grid"/>
  <line x1="810" y1="115" x2="810" y2="300" class="grid"/>
  <text x="680" y="313" class="m" text-anchor="middle">-0.40</text>
  <text x="810" y="313" class="m" text-anchor="middle">-0.20</text>
  <text x="940" y="313" class="m" text-anchor="middle">0</text>

  <text x="684" y="150" class="s">hier-flow-v1</text>
  <line x1="747" y1="170" x2="712" y2="170" stroke="#2563eb" stroke-width="2"/>
  <path d="M 712 170 l 8 -4 l 0 8 z" fill="#2563eb"/>
  <circle cx="747" cy="170" r="5" fill="#fcfcfb" stroke="#2563eb" stroke-width="2"/>
  <circle cx="704" cy="170" r="5" fill="#2563eb" stroke="#fcfcfb" stroke-width="2"/>
  <text x="935" y="192" class="v" text-anchor="end">full -0.30</text>
  <text x="684" y="192" class="v" fill="#2563eb">restricted -0.36</text>

  <text x="684" y="235" class="s">hier-diffusion-v1</text>
  <line x1="792" y1="255" x2="775" y2="255" stroke="#b45309" stroke-width="2"/>
  <path d="M 775 255 l 8 -4 l 0 8 z" fill="#b45309"/>
  <circle cx="792" cy="255" r="5" fill="#fcfcfb" stroke="#b45309" stroke-width="2"/>
  <circle cx="767" cy="255" r="5" fill="#b45309" stroke="#fcfcfb" stroke-width="2"/>
  <text x="796" y="277" class="v">full -0.23</text>
  <text x="684" y="277" class="v" fill="#b45309">restricted -0.27</text>

  <text x="684" y="298" class="m">open = full, filled = restricted; the margin widens</text>

  <!-- footnote -->
  <text x="40" y="360" class="m">Verdict (sealed rule, all four clauses): hier-flow-v1 PROMOTE; the other four SHIP-BENCHMARK &#8212; itself a designed-for outcome, not a failure of the process.</text>
  <text x="40" y="376" class="m">Three seeds per system, 1024 paths &#215; 120 months, data vintage 2026-07-26.1. Panel 3 is the seal-required draw-span bias check; neither of its numbers gates.</text>
  <text x="40" y="392" class="m">Source: G2-EVIDENCE.md &#167;2&#8211;&#167;3.</text>
</svg>
