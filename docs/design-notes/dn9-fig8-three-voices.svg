<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Georgia, 'Times New Roman', serif">
  <rect width="1000" height="620" fill="#fbfaf7"/>
  <text x="44" y="42" font-size="19" fill="#14181d">Three voices, three ways of being wrong</text>
  <text x="44" y="64" font-size="13" fill="#5c6570" font-style="italic">What each names as the primary concern, month by month. SECOND WIND, months 42–70.</text>

  <!-- x axis -->
  <g font-size="10" fill="#5c6570" text-anchor="middle">
    <text x="160" y="112">m44</text><text x="270" y="112">m47</text><text x="380" y="112">m49</text>
    <text x="490" y="112">m52</text><text x="600" y="112">m55</text><text x="710" y="112">m58</text><text x="820" y="112">m63</text><text x="920" y="112">m70</text>
  </g>
  <line x1="120" y1="120" x2="960" y2="120" stroke="#ded6c7"/>

  <!-- event markers -->
  <line x1="490" y1="120" x2="490" y2="470" stroke="#8f2e26" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="496" y="136" font-size="10" fill="#8f2e26">gating · HY +187bp</text>
  <line x1="820" y1="120" x2="820" y2="470" stroke="#8f2e26" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="826" y="136" font-size="10" fill="#8f2e26">forced sale</text>

  <!-- COMMITTEE -->
  <text x="44" y="180" font-size="12" fill="#14181d" letter-spacing="1.5">COMMITTEE</text>
  <text x="44" y="196" font-size="9.5" fill="#5c6570">mandate-bound</text>
  <rect x="120" y="160" width="370" height="26" fill="#8f2e26" opacity="0.8"/>
  <text x="305" y="177" font-size="10.5" fill="#fff" text-anchor="middle">inflation</text>
  <rect x="490" y="160" width="200" height="26" fill="#8a5a2b" opacity="0.85"/>
  <text x="590" y="177" font-size="10.5" fill="#fff" text-anchor="middle">financial stability</text>
  <rect x="690" y="160" width="270" height="26" fill="#2f5d50" opacity="0.8"/>
  <text x="825" y="177" font-size="10.5" fill="#fff" text-anchor="middle">employment</text>
  <text x="496" y="206" font-size="10" fill="#8f2e26">first acknowledgement — after the event</text>

  <!-- ECONOMIST -->
  <text x="44" y="266" font-size="12" fill="#14181d" letter-spacing="1.5">ECONOMIST</text>
  <text x="44" y="282" font-size="9.5" fill="#5c6570">raises risks freely</text>
  <rect x="120" y="246" width="150" height="26" fill="#8f2e26" opacity="0.8"/>
  <text x="195" y="263" font-size="10.5" fill="#fff" text-anchor="middle">inflation</text>
  <rect x="270" y="246" width="220" height="26" fill="#8a5a2b" opacity="0.85"/>
  <text x="380" y="263" font-size="10.5" fill="#fff" text-anchor="middle">private credit funding</text>
  <rect x="490" y="246" width="200" height="26" fill="#8a5a2b" opacity="0.6"/>
  <text x="590" y="263" font-size="10.5" fill="#fff" text-anchor="middle">credit, confirmed</text>
  <rect x="690" y="246" width="270" height="26" fill="#2f5d50" opacity="0.7"/>
  <text x="825" y="263" font-size="10.5" fill="#fff" text-anchor="middle">labour · policy stance</text>
  <line x1="270" y1="240" x2="270" y2="228" stroke="#2f5d50"/>
  <text x="276" y="226" font-size="10" fill="#2f5d50">named 5 months early</text>

  <!-- economist's unrealised flags -->
  <g font-size="9.5" fill="#5c6570">
    <text x="120" y="300">also flagged, never happened:</text>
  </g>
  <g>
    <rect x="160" y="308" width="120" height="16" fill="#e6ded0" stroke="#c9bfae"/>
    <text x="220" y="320" font-size="9" fill="#5c6570" text-anchor="middle">dollar funding m44</text>
    <rect x="290" y="308" width="120" height="16" fill="#e6ded0" stroke="#c9bfae"/>
    <text x="350" y="320" font-size="9" fill="#5c6570" text-anchor="middle">fiscal accident m49</text>
    <rect x="700" y="308" width="150" height="16" fill="#e6ded0" stroke="#c9bfae"/>
    <text x="775" y="320" font-size="9" fill="#5c6570" text-anchor="middle">sovereign repricing m71</text>
  </g>

  <!-- COLUMNISTS -->
  <text x="44" y="376" font-size="12" fill="#14181d" letter-spacing="1.5">COLUMNISTS</text>
  <text x="44" y="392" font-size="9.5" fill="#5c6570">the latest print</text>
  <rect x="120" y="356" width="400" height="26" fill="#8f2e26" opacity="0.8"/>
  <text x="320" y="373" font-size="10.5" fill="#fff" text-anchor="middle">inflation · inflation · inflation</text>
  <rect x="520" y="356" width="170" height="26" fill="#8a5a2b" opacity="0.85"/>
  <text x="605" y="373" font-size="10.5" fill="#fff" text-anchor="middle">credit contagion</text>
  <rect x="690" y="356" width="270" height="26" fill="#2f5d50" opacity="0.8"/>
  <text x="825" y="373" font-size="10.5" fill="#fff" text-anchor="middle">recession · recession</text>
  <line x1="520" y1="388" x2="520" y2="400" stroke="#8f2e26"/>
  <text x="530" y="400" font-size="10" fill="#8f2e26">turns after the gating — always one print behind</text>

  <!-- dispersion band -->
  <text x="44" y="450" font-size="12" fill="#14181d" letter-spacing="1.5">DISPERSION</text>
  <text x="44" y="466" font-size="9.5" fill="#5c6570">across columnists</text>
  <polyline points="120,455 220,458 320,460 420,452 490,420 560,412 660,440 760,452 860,458 960,456"
            fill="none" stroke="#14181d" stroke-width="2"/>
  <text x="470" y="428" font-size="10" fill="#14181d" text-anchor="end">widens at the turn</text>
  <text x="180" y="444" font-size="10" fill="#5c6570">collapsed — consensus strong</text>

  <!-- footer lesson -->
  <line x1="44" y1="496" x2="956" y2="496" stroke="#14181d" stroke-width="0.7"/>
  <g font-size="12">
    <text x="44" y="520" fill="#2b3238"><tspan fill="#14181d">The Committee</tspan> could not name private credit until it became a stability question. Structurally last, not slow.</text>
    <text x="44" y="544" fill="#2b3238"><tspan fill="#14181d">The economist</tspan> named it five months early — alongside three risks that never happened. That ratio is the honesty condition.</text>
    <text x="44" y="568" fill="#2b3238"><tspan fill="#14181d">The columnists</tspan> turned after the gating, with everyone else, which is what following them costs.</text>
    <text x="44" y="596" fill="#8f2e26" font-style="italic">None of the three ever named the distribution drought — the thing that actually emptied the cash account at m63.</text>
  </g>
</svg>
