<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 800" width="1020" height="800" font-family="Georgia, 'Times New Roman', serif">
  <rect width="1020" height="800" fill="#f6f2e9"/>
  <rect x="20" y="20" width="980" height="760" fill="#fdfcf8" stroke="#ded6c7"/>

  <text x="510" y="66" font-size="30" fill="#14181d" text-anchor="middle" letter-spacing="6">THE WIRE</text>
  <line x1="44" y1="80" x2="976" y2="80" stroke="#14181d" stroke-width="2.2"/>
  <line x1="44" y1="84" x2="976" y2="84" stroke="#14181d" stroke-width="0.7"/>
  <text x="44" y="104" font-size="11.5" fill="#5c6570" font-style="italic">Year 4, Quarter 3 · October–December</text>
  <text x="976" y="104" font-size="11.5" fill="#5c6570" text-anchor="end" font-style="italic">Second Wind · slate sw-4417-q15</text>

  <!-- DASHBOARD RAIL -->
  <rect x="44" y="118" width="932" height="86" fill="#f0ebe0" stroke="#ded6c7"/>
  <text x="56" y="138" font-size="9.5" fill="#5c6570" letter-spacing="3">THE DASHBOARD THIS QUARTER</text>

  <g font-size="10" fill="#5c6570">
    <text x="56" y="160">POLICY &amp; RATES</text><text x="290" y="160">MACRO</text>
    <text x="524" y="160">PUBLIC MARKETS</text><text x="758" y="160">THE BOOK</text>
  </g>
  <g font-size="14.5" fill="#14181d">
    <text x="56" y="182">5.00%  <tspan font-size="11" fill="#8f2e26">+25bp</tspan></text>
    <text x="290" y="182">CPI 4.6%  <tspan font-size="11" fill="#8f2e26">+0.2</tspan></text>
    <text x="524" y="182">−6.8%  <tspan font-size="11" fill="#8f2e26">qtr</tspan></text>
    <text x="758" y="182">127.1  <tspan font-size="11" fill="#8f2e26">−3.5</tspan></text>
  </g>
  <g font-size="11" fill="#2b3238">
    <text x="56" y="198">2s10s −41bp · 10y 4.31%</text>
    <text x="290" y="198">Unemp 3.9% · Growth 1.1%</text>
    <text x="524" y="198">HY OAS 447bp · vol elevated</text>
    <text x="758" y="198">priv 34.6% · cash 2.2% · DPI 0.90×</text>
  </g>
  <line x1="278" y1="146" x2="278" y2="196" stroke="#ded6c7"/>
  <line x1="512" y1="146" x2="512" y2="196" stroke="#ded6c7"/>
  <line x1="746" y1="146" x2="746" y2="196" stroke="#ded6c7"/>

  <!-- POLICY (lead, double width) -->
  <rect x="44" y="220" width="580" height="300" fill="#fdfcf8" stroke="#14181d" stroke-width="1.2"/>
  <rect x="44" y="220" width="580" height="20" fill="#14181d"/>
  <text x="54" y="234" font-size="9.5" fill="#fdfcf8" letter-spacing="3">POLICY · explains: target rate +25bp</text>
  <rect x="404" y="224" width="76" height="14" fill="#fdfcf8"/><text x="442" y="234.5" font-size="8.5" fill="#8f2e26" text-anchor="middle" letter-spacing="1">SURPRISE</text>
  <rect x="486" y="224" width="128" height="14" fill="#8f2e26"/><text x="550" y="234.5" font-size="8.5" fill="#fdfcf8" text-anchor="middle" letter-spacing="1">HAWKISH +0.25</text>
  <text x="56" y="272" font-size="27" fill="#14181d">Committee raises to 5.00%,</text>
  <text x="56" y="302" font-size="27" fill="#14181d">and drops the sentence</text>
  <text x="56" y="332" font-size="27" fill="#14181d">everyone was watching</text>
  <text x="56" y="356" font-size="12" fill="#14181d" font-weight="bold">Futures had priced a hold at better than four-to-one.</text>

  <text x="56" y="384" font-size="9.5" fill="#5c6570" letter-spacing="2.5">CHANGES FROM THE SEPTEMBER STATEMENT</text>
  <g font-size="11.5">
    <text x="56" y="404" fill="#2b3238">...expand at a <tspan text-decoration="line-through" fill="#8f8378">moderate</tspan> <tspan fill="#14181d" font-weight="bold">slowed</tspan> pace.</text>
    <text x="56" y="422" fill="#2b3238">Inflation <tspan text-decoration="line-through" fill="#8f8378">remains elevated</tspan> <tspan fill="#14181d" font-weight="bold">has moved higher</tspan>.</text>
    <text x="56" y="440" fill="#8f8378" text-decoration="line-through">The Committee expects inflation to return to its objective.</text>
    <text x="56" y="458" fill="#14181d" font-weight="bold">Additional firming may be appropriate.</text>
  </g>
  <line x1="56" y1="472" x2="612" y2="472" stroke="#ded6c7"/>
  <text x="56" y="490" font-size="11" fill="#2b3238">Two dissents, opposite directions — first in eleven meetings.</text>
  <text x="56" y="508" font-size="11" fill="#8f2e26">T+30min: 2y +18bp · 10y +4bp · equities −1.9% · dollar +0.7%</text>

  <!-- WHY box -->
  <rect x="636" y="220" width="340" height="300" fill="#f0ebe0" stroke="#8a5a2b" stroke-width="1.2"/>
  <text x="648" y="240" font-size="9.5" fill="#8a5a2b" letter-spacing="2.5">WHY THEY MOVED · rule monitor</text>
  <g font-size="11.5" fill="#2b3238">
    <text x="648" y="270">Neutral nominal  r* + π*</text><text x="964" y="270" text-anchor="end" fill="#14181d">4.20</text>
    <text x="648" y="296">Inflation 1.2pp above trend</text><text x="964" y="296" text-anchor="end" fill="#14181d">+0.66</text>
    <text x="648" y="322">Cycle offset</text><text x="964" y="322" text-anchor="end" fill="#14181d">−0.12</text>
  </g>
  <line x1="648" y1="336" x2="964" y2="336" stroke="#8a5a2b"/>
  <text x="648" y="358" font-size="12.5" fill="#14181d">Rule implies</text><text x="964" y="358" font-size="12.5" text-anchor="end" fill="#14181d">4.75</text>
  <text x="648" y="382" font-size="12.5" fill="#14181d">Committee went to</text><text x="964" y="382" font-size="12.5" text-anchor="end" fill="#14181d">5.00</text>
  <line x1="648" y1="396" x2="964" y2="396" stroke="#8a5a2b" stroke-width="1.6"/>
  <text x="648" y="422" font-size="13" fill="#8f2e26">Judgement  ε</text><text x="964" y="422" font-size="20" text-anchor="end" fill="#8f2e26">+0.25</text>
  <text x="648" y="456" font-size="11.5" fill="#2b3238" font-style="italic">The extra quarter point is judgement,</text>
  <text x="648" y="473" font-size="11.5" fill="#2b3238" font-style="italic">not arithmetic — and the deleted</text>
  <text x="648" y="490" font-size="11.5" fill="#2b3238" font-style="italic">sentence is where it is written down.</text>
  <text x="648" y="510" font-size="10" fill="#5c6570">Also: December left the range unchanged.</text>

  <!-- three lower cards -->
  <g>
    <rect x="44" y="536" width="300" height="200" fill="#fdfcf8" stroke="#ded6c7"/>
    <rect x="44" y="536" width="300" height="18" fill="#f0ebe0"/>
    <text x="54" y="549" font-size="9" fill="#5c6570" letter-spacing="2">MACRO</text>
    <rect x="176" y="539" width="76" height="14" fill="#e6ded0"/><text x="214" y="549.5" font-size="8.5" fill="#2b3238" text-anchor="middle">BELOW −1.1σ</text>
    <rect x="258" y="539" width="70" height="14" fill="#8f2e26"/><text x="293" y="549.5" font-size="8.5" fill="#fdfcf8" text-anchor="middle">HAWKISH</text>
    <text x="56" y="582" font-size="19" fill="#14181d">Payrolls hold up,</text>
    <text x="56" y="604" font-size="19" fill="#14181d">awkwardly</text>
    <g font-size="10.5" fill="#2b3238">
      <text x="56" y="630">3.9% against 4.1% expected — the fourth</text>
      <text x="56" y="646">month the labour market has refused to</text>
      <text x="56" y="662">soften on schedule. Forecasters have</text>
      <text x="56" y="678">over-predicted in seven of nine months.</text>
      <text x="56" y="702">It gave the Committee no reason to stop.</text>
    </g>
    <text x="56" y="722" font-size="9.5" fill="#8a5a2b" font-style="italic">a good number, tagged hawkish — the paper never tags</text>
    <text x="56" y="734" font-size="9.5" fill="#8a5a2b" font-style="italic">what it means for your book</text>
  </g>

  <g>
    <rect x="360" y="536" width="300" height="200" fill="#fdfcf8" stroke="#ded6c7"/>
    <rect x="360" y="536" width="300" height="18" fill="#f0ebe0"/>
    <text x="370" y="549" font-size="9" fill="#5c6570" letter-spacing="2">MARKETS</text>
    <rect x="492" y="539" width="76" height="14" fill="#e6ded0"/><text x="530" y="549.5" font-size="8.5" fill="#2b3238" text-anchor="middle">2s10s −33bp</text>
    <rect x="574" y="539" width="70" height="14" fill="#8f2e26"/><text x="609" y="549.5" font-size="8.5" fill="#fdfcf8" text-anchor="middle">HAWKISH</text>
    <text x="372" y="582" font-size="19" fill="#14181d">Deepest inversion of</text>
    <text x="372" y="604" font-size="19" fill="#14181d">the cycle</text>
    <g font-size="10.5" fill="#2b3238">
      <text x="372" y="630">Two-year yields +71bp this quarter. Ten-</text>
      <text x="372" y="646">year yields +4. The entire move is the</text>
      <text x="372" y="662">front end repricing to a Committee that</text>
      <text x="372" y="678">has stopped promising anything.</text>
      <text x="372" y="702">HY +45bp to 447 — orderly, and read by</text>
      <text x="372" y="718">two strategists as complacent.</text>
    </g>
  </g>

  <g>
    <rect x="676" y="536" width="300" height="200" fill="#fdfcf8" stroke="#ded6c7"/>
    <rect x="676" y="536" width="300" height="18" fill="#f0ebe0"/>
    <text x="686" y="549" font-size="9" fill="#5c6570" letter-spacing="2">THE BOOK</text>
    <rect x="790" y="539" width="66" height="14" fill="#e6ded0"/><text x="823" y="549.5" font-size="8.5" fill="#2b3238" text-anchor="middle">DPI 0.90×</text>
    <rect x="862" y="539" width="106" height="14" fill="#8f2e26"/><text x="915" y="549.5" font-size="8.5" fill="#fdfcf8" text-anchor="middle">DETERIORATING</text>
    <text x="688" y="582" font-size="19" fill="#14181d">Calls accelerate as</text>
    <text x="688" y="604" font-size="19" fill="#14181d">distributions lag</text>
    <g font-size="10.5" fill="#2b3238">
      <text x="688" y="630">Calls 1.18× plan; distributions 0.90×.</text>
      <text x="688" y="646">Third consecutive quarter below.</text>
      <text x="688" y="668">Cash 2.6% → 2.2%. Private weight to</text>
      <text x="688" y="684">34.6% — 80bp of that came from public</text>
      <text x="688" y="700">markets falling, not from anything the</text>
      <text x="688" y="716">institution did.</text>
    </g>
  </g>

  <line x1="44" y1="752" x2="976" y2="752" stroke="#14181d" stroke-width="0.7"/>
  <text x="44" y="770" font-size="9.5" fill="#5c6570">SIMULATED WORLD · no firm or person is real · not investment advice · nothing on the wire moves a price</text>
</svg>
