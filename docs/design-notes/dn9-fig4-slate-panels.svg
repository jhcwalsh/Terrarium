<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" font-family="Georgia, 'Times New Roman', serif">
  <rect width="980" height="620" fill="#fbfaf7"/>

  <text x="44" y="42" font-size="19" fill="#14181d">Four panels, four slots, seven slates</text>
  <text x="44" y="64" font-size="13" fill="#5c6570" font-style="italic">SECOND WIND · seed 4417 · each announcement explains a movement the player can already see</text>

  <!-- column headers -->
  <g font-size="11" fill="#5c6570" text-anchor="middle">
    <text x="268" y="106">Y2 Q3</text>
    <text x="368" y="106">Y4 Q2</text>
    <text x="468" y="106">Y4 Q3</text>
    <text x="568" y="106">Y5 Q2</text>
    <text x="668" y="106">Y5 Q3</text>
    <text x="768" y="106">Y6 Q1</text>
    <text x="868" y="106">Y10 Q4</text>
  </g>
  <line x1="228" y1="116" x2="918" y2="116" stroke="#ded6c7"/>

  <!-- highlight the forced sale column -->
  <rect x="728" y="116" width="80" height="404" fill="#8f2e26" opacity="0.06"/>
  <line x1="728" y1="116" x2="728" y2="520" stroke="#8f2e26" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="808" y1="116" x2="808" y2="520" stroke="#8f2e26" stroke-width="0.8" stroke-dasharray="3 3"/>

  <!-- ROW 1 POLICY -->
  <text x="44" y="152" font-size="12.5" fill="#14181d" letter-spacing="2">POLICY</text>
  <text x="44" y="168" font-size="10.5" fill="#5c6570">target rate</text>
  <polyline points="268,190 368,158 468,148 568,148 668,156 768,172 868,196" fill="none" stroke="#2b3238" stroke-width="2.2"/>
  <g font-size="10" fill="#2b3238" text-anchor="middle">
    <text x="268" y="210">2.50</text><text x="368" y="150">4.75</text><text x="468" y="140">5.00</text>
    <text x="568" y="140">5.00</text><text x="668" y="148">4.75</text><text x="768" y="192">3.75</text><text x="868" y="216">2.25</text>
  </g>
  <circle cx="468" cy="148" r="4" fill="#8f2e26"/>
  <text x="468" y="128" font-size="9.5" fill="#8f2e26" text-anchor="middle">ε=+0.31</text>
  <line x1="228" y1="228" x2="918" y2="228" stroke="#ded6c7"/>

  <!-- ROW 2 MACRO -->
  <text x="44" y="262" font-size="12.5" fill="#14181d" letter-spacing="2">MACRO</text>
  <text x="44" y="278" font-size="10.5" fill="#5c6570">CPI y/y</text>
  <polyline points="268,300 368,254 468,250 568,278 668,290 768,296 868,302" fill="none" stroke="#2b3238" stroke-width="2.2"/>
  <g font-size="10" fill="#2b3238" text-anchor="middle">
    <text x="268" y="318">2.4</text><text x="368" y="246">4.4</text><text x="468" y="242">4.6</text>
    <text x="568" y="270">3.6</text><text x="668" y="308">3.1</text><text x="768" y="314">2.9</text><text x="868" y="320">2.6</text>
  </g>
  <circle cx="368" cy="254" r="4" fill="#8f2e26"/>
  <text x="368" y="232" font-size="9.5" fill="#8f2e26" text-anchor="middle">+2.3σ</text>
  <line x1="228" y1="330" x2="918" y2="330" stroke="#ded6c7"/>

  <!-- ROW 3 PUBLIC MARKETS -->
  <text x="44" y="364" font-size="12.5" fill="#14181d" letter-spacing="2">MARKETS</text>
  <text x="44" y="380" font-size="10.5" fill="#5c6570">equity vs peak</text>
  <polyline points="268,356 368,368 468,388 568,428 668,410 768,368 868,352" fill="none" stroke="#2b3238" stroke-width="2.2"/>
  <g font-size="10" fill="#2b3238" text-anchor="middle">
    <text x="268" y="348">peak</text><text x="368" y="360">−2%</text><text x="468" y="404">−9%</text>
    <text x="568" y="446">−24%</text><text x="668" y="426">−16%</text><text x="768" y="356">−6%</text><text x="868" y="342">record</text>
  </g>
  <line x1="228" y1="458" x2="918" y2="458" stroke="#ded6c7"/>

  <!-- ROW 4 THE BOOK -->
  <text x="44" y="492" font-size="12.5" fill="#14181d" letter-spacing="2">THE BOOK</text>
  <text x="44" y="508" font-size="10.5" fill="#5c6570">cash % · DPI vs plan</text>
  <polyline points="268,484 368,492 468,498 568,506 668,502 768,516 868,478" fill="none" stroke="#8f2e26" stroke-width="2.4"/>
  <g font-size="10" fill="#8f2e26" text-anchor="middle">
    <text x="268" y="476">3.1 · 1.02</text><text x="368" y="484">2.6 · 0.91</text><text x="468" y="490">2.2 · 0.90</text>
    <text x="568" y="498">1.4 · 0.71</text><text x="668" y="494">1.9 · 0.68</text>
    <text x="768" y="536" font-size="10.5">0.0 · 0.41</text><text x="868" y="470">4.4 · 1.41</text>
  </g>
  <circle cx="768" cy="516" r="5.5" fill="#8f2e26"/>
  <text x="768" y="556" font-size="10.5" fill="#8f2e26" text-anchor="middle" font-weight="bold">FORCED SALE</text>

  <!-- the punchline -->
  <line x1="44" y1="578" x2="936" y2="578" stroke="#14181d" stroke-width="0.8"/>
  <text x="44" y="600" font-size="12.5" fill="#2b3238">
    <tspan font-style="italic">Year 6 Q1: policy easing, inflation solved, listed markets 6% from a record — and the institution is selling at 62 cents.</tspan>
  </text>
</svg>
