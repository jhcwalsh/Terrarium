<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="Georgia, 'Times New Roman', serif">
  <rect width="980" height="560" fill="#fbfaf7"/>
  <text x="44" y="42" font-size="19" fill="#14181d">One renderer, three verdicts</text>
  <text x="44" y="64" font-size="13" fill="#5c6570" font-style="italic">Nothing switches. Only the terms move — and the residual is the story.</text>

  <!-- three columns -->
  <g>
    <!-- RAISE -->
    <rect x="44" y="90" width="280" height="352" fill="#fdfcf8" stroke="#ded6c7"/>
    <rect x="44" y="90" width="280" height="26" fill="#8f2e26"/>
    <text x="184" y="108" font-size="12.5" fill="#fdfcf8" text-anchor="middle" letter-spacing="4">RAISE · m47</text>

    <g font-size="11.5" fill="#2b3238">
      <text x="60" y="142">r* + π*</text><text x="308" y="142" text-anchor="end" fill="#14181d">4.20</text>
      <text x="60" y="168">inflation gap</text><text x="308" y="168" text-anchor="end" fill="#14181d">+0.66</text>
      <text x="60" y="194">cycle</text><text x="308" y="194" text-anchor="end" fill="#14181d">−0.12</text>
    </g>
    <line x1="60" y1="206" x2="308" y2="206" stroke="#ded6c7"/>
    <g font-size="11.5" fill="#2b3238">
      <text x="60" y="228">anchor</text><text x="308" y="228" text-anchor="end" fill="#14181d">4.74</text>
      <text x="60" y="252">smoothed ρ=0.85</text><text x="308" y="252" text-anchor="end" fill="#14181d">4.75</text>
      <text x="60" y="276">realised</text><text x="308" y="276" text-anchor="end" fill="#14181d" font-size="13">5.00</text>
    </g>
    <line x1="60" y1="290" x2="308" y2="290" stroke="#8f2e26" stroke-width="1.4"/>
    <text x="60" y="318" font-size="12.5" fill="#8f2e26">ε</text>
    <text x="308" y="322" font-size="26" fill="#8f2e26" text-anchor="end">+0.25</text>
    <text x="184" y="352" font-size="12.5" fill="#14181d" text-anchor="middle">Hawkish surprise</text>
    <g font-size="10.5" fill="#5c6570">
      <text x="60" y="378">2 dissents, two-sided</text>
      <text x="60" y="396">statement drops a sentence</text>
      <text x="60" y="414">2y +18bp in 30 minutes</text>
    </g>
  </g>

  <g>
    <!-- HOLD -->
    <rect x="350" y="90" width="280" height="352" fill="#fdfcf8" stroke="#ded6c7"/>
    <rect x="350" y="90" width="280" height="26" fill="#5c6570"/>
    <text x="490" y="108" font-size="12.5" fill="#fdfcf8" text-anchor="middle" letter-spacing="4">HOLD · m48</text>

    <g font-size="11.5" fill="#2b3238">
      <text x="366" y="142">r* + π*</text><text x="614" y="142" text-anchor="end" fill="#14181d">4.25</text>
      <text x="366" y="168">inflation gap</text><text x="614" y="168" text-anchor="end" fill="#14181d">+0.58</text>
      <text x="366" y="194">cycle</text><text x="614" y="194" text-anchor="end" fill="#14181d">−0.16</text>
    </g>
    <line x1="366" y1="206" x2="614" y2="206" stroke="#ded6c7"/>
    <g font-size="11.5" fill="#2b3238">
      <text x="366" y="228">anchor</text><text x="614" y="228" text-anchor="end" fill="#14181d">4.67</text>
      <text x="366" y="252">smoothed ρ=0.85</text><text x="614" y="252" text-anchor="end" fill="#14181d">4.95</text>
      <text x="366" y="276">realised</text><text x="614" y="276" text-anchor="end" fill="#14181d" font-size="13">5.00</text>
    </g>
    <line x1="366" y1="290" x2="614" y2="290" stroke="#5c6570" stroke-width="1.4"/>
    <text x="366" y="318" font-size="12.5" fill="#5c6570">ε</text>
    <text x="614" y="322" font-size="26" fill="#5c6570" text-anchor="end">+0.05</text>
    <text x="490" y="352" font-size="12.5" fill="#14181d" text-anchor="middle">Uneventful hold</text>
    <g font-size="10.5" fill="#5c6570">
      <text x="366" y="378">no dissents</text>
      <text x="366" y="396">firming language retained</text>
      <text x="366" y="414">loses the slot contest → one line</text>
    </g>
  </g>

  <g>
    <!-- CUT -->
    <rect x="656" y="90" width="280" height="352" fill="#fdfcf8" stroke="#ded6c7"/>
    <rect x="656" y="90" width="280" height="26" fill="#2f5d50"/>
    <text x="796" y="108" font-size="12.5" fill="#fdfcf8" text-anchor="middle" letter-spacing="4">CUT · m55</text>

    <g font-size="11.5" fill="#2b3238">
      <text x="672" y="142">r* + π*</text><text x="920" y="142" text-anchor="end" fill="#14181d">3.80</text>
      <text x="672" y="168">inflation gap</text><text x="920" y="168" text-anchor="end" fill="#14181d">0.00</text>
      <text x="672" y="194">cycle</text><text x="920" y="194" text-anchor="end" fill="#14181d">−0.52</text>
    </g>
    <line x1="672" y1="206" x2="920" y2="206" stroke="#ded6c7"/>
    <g font-size="11.5" fill="#2b3238">
      <text x="672" y="228">anchor</text><text x="920" y="228" text-anchor="end" fill="#14181d">3.28</text>
      <text x="672" y="252">smoothed ρ=0.85</text><text x="920" y="252" text-anchor="end" fill="#14181d">4.74</text>
      <text x="672" y="276">realised</text><text x="920" y="276" text-anchor="end" fill="#14181d" font-size="13">4.75</text>
    </g>
    <line x1="672" y1="290" x2="920" y2="290" stroke="#2f5d50" stroke-width="1.4"/>
    <text x="672" y="318" font-size="12.5" fill="#2f5d50">ε</text>
    <text x="920" y="322" font-size="26" fill="#2f5d50" text-anchor="end">+0.01</text>
    <text x="796" y="352" font-size="12.5" fill="#14181d" text-anchor="middle">Fully anticipated</text>
    <g font-size="10.5" fill="#5c6570">
      <text x="672" y="378">no dissents, flat statement</text>
      <text x="672" y="396">nothing in 30 minutes</text>
      <text x="672" y="414">a boring meeting, by arithmetic</text>
    </g>
  </g>

  <!-- the defect callout -->
  <rect x="44" y="462" width="892" height="72" fill="#f7ece9" stroke="#8f2e26" stroke-width="1.1"/>
  <text x="60" y="484" font-size="11" fill="#8f2e26" letter-spacing="2.5">WITHOUT THE SMOOTHING TERM (App C.6)</text>
  <text x="60" y="506" font-size="12.5" fill="#2b3238">Raw residual against the unsmoothed DN-1 anchor:  RAISE <tspan fill="#14181d">+0.26</tspan>   ·   HOLD <tspan fill="#14181d">+0.33</tspan>   ·   CUT <tspan fill="#8f2e26" font-size="15">+1.47</tspan></text>
  <text x="60" y="524" font-size="11.5" fill="#2b3238" font-style="italic">"The Committee delivered a 147bp hawkish surprise while cutting" is not a sentence the page can carry. The anchor has no inertia.</text>
</svg>
