<svg viewBox="0 0 860 470" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <style>
    .h { font-size: 15.5px; font-weight: bold; fill: #1a1a1a; }
    .s { font-size: 12.5px; fill: #333; }
    .m { font-size: 11.5px; fill: #666; font-style: italic; }
    .truep { fill: #f2f6fa; stroke: #2c5a7a; stroke-width: 1.8; }
    .repp  { fill: #faf3f0; stroke: #9a4a2f; stroke-width: 1.8; }
  </style>

  <!-- TRUE PLANE -->
  <rect x="30" y="40" width="360" height="180" rx="8" class="truep"/>
  <text x="210" y="68" text-anchor="middle" class="h" fill="#2c5a7a">TRUE PLANE  —  latent state s</text>
  <text x="50" y="96" class="s">Full L1–L4 world state</text>
  <text x="50" y="118" class="s">True value of every private holding</text>
  <text x="50" y="140" class="s">True portfolio weights</text>
  <text x="50" y="170" class="m">Held exactly by the designer.</text>
  <text x="50" y="188" class="m">This is what a learned world model</text>
  <text x="50" y="204" class="m">does not have: privileged ground truth.</text>

  <!-- OBSERVATION OPERATOR -->
  <rect x="440" y="60" width="180" height="140" rx="8" fill="#fff" stroke="#333" stroke-width="1.8"/>
  <text x="530" y="88" text-anchor="middle" class="h">O — observation</text>
  <text x="530" y="106" text-anchor="middle" class="h">operator</text>
  <text x="530" y="132" text-anchor="middle" class="s">appraisal smoothing:</text>
  <text x="530" y="152" text-anchor="middle" class="s" font-style="italic">MA of lagged true returns</text>
  <text x="530" y="178" text-anchor="middle" class="m">Geltner (1991);</text>
  <text x="530" y="194" text-anchor="middle" class="m">Getmansky–Lo–Makarov (2004)</text>

  <g stroke="#333" stroke-width="1.8" fill="#333">
    <line x1="390" y1="130" x2="434" y2="130"/><polygon points="440,130 430,125 430,135"/>
  </g>

  <!-- REPORTED PLANE -->
  <rect x="30" y="260" width="360" height="170" rx="8" class="repp"/>
  <text x="210" y="288" text-anchor="middle" class="h" fill="#9a4a2f">REPORTED PLANE  —  observation ω</text>
  <text x="50" y="316" class="s">Smoothed private marks</text>
  <text x="50" y="338" class="s">Understated volatility and beta</text>
  <text x="50" y="360" class="s">Private weight understated in a drawdown</text>
  <text x="50" y="392" class="m">What the books say. What the agent sees.</text>
  <text x="50" y="410" class="m">What spending and rebalancing run off.</text>

  <g stroke="#333" stroke-width="1.8" fill="#333">
    <path d="M 530 200 L 530 345 L 396 345" fill="none"/>
    <polygon points="390,345 400,340 400,350"/>
  </g>

  <!-- AGENT -->
  <rect x="470" y="285" width="150" height="120" rx="8" fill="#fff" stroke="#555" stroke-width="1.6"/>
  <text x="545" y="313" text-anchor="middle" class="h">Agent</text>
  <text x="545" y="335" text-anchor="middle" class="s">human allocator</text>
  <text x="545" y="353" text-anchor="middle" class="s">or machine</text>
  <text x="545" y="381" text-anchor="middle" class="m">sees ω, not s</text>

  <!-- three properties -->
  <rect x="650" y="240" width="185" height="190" rx="8" fill="#fbfbf7" stroke="#aaa" stroke-width="1.2"/>
  <text x="742" y="266" text-anchor="middle" class="h" font-size="13.5">Why O is different</text>
  <text x="664" y="292" class="s" font-weight="bold">1. Biased, not noisy</text>
  <text x="664" y="309" class="m">one-directional for quarters</text>
  <text x="664" y="334" class="s" font-weight="bold">2. Empirically calibrated</text>
  <text x="664" y="351" class="m">weights fitted per asset class</text>
  <text x="664" y="376" class="s" font-weight="bold">3. Inverting it is the task</text>
  <text x="664" y="393" class="m">mental de-smoothing is the</text>
  <text x="664" y="408" class="m">skill under evaluation</text>

  <text x="30" y="455" class="m">Designed partial observability: the observation channel is a modelled institutional process, not sensor noise — and the inversion problem is the point.</text>
</svg>
