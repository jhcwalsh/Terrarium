<svg viewBox="0 0 860 620" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <style>
    .h { font-size: 14px; font-weight: bold; fill: #1a1a1a; }
    .s { font-size: 11.5px; fill: #333; }
    .m { font-size: 10.5px; fill: #666; font-style: italic; }
    .mono { font-size: 11px; font-family: 'Courier New', monospace; fill: #1a1a1a; }
    .spec { fill: #f2f6fa; stroke: #2c5a7a; stroke-width: 1.5; }
    .learn{ fill: #fdf6ee; stroke: #b07030; stroke-width: 1.7; }
    .obs  { fill: #faf3f0; stroke: #9a4a2f; stroke-width: 1.7; }
    .agent{ fill: #ffffff; stroke: #555; stroke-width: 1.5; }
    .rep  { fill: #f4f7f4; stroke: #4a6a4a; stroke-width: 1.5; }
  </style>

  <text x="30" y="28" class="h" font-size="16">The complete system</text>

  <!-- LEFT COLUMN: generative stack -->
  <text x="150" y="58" class="m" text-anchor="middle">TRUE PLANE (designer holds exactly)</text>

  <rect x="60" y="68" width="180" height="44" rx="5" class="spec"/>
  <text x="150" y="86" text-anchor="middle" class="h">L1 climate  x</text>
  <text x="150" y="103" text-anchor="middle" class="mono">T₁ specified</text>

  <rect x="60" y="130" width="180" height="44" rx="5" class="spec"/>
  <text x="150" y="148" text-anchor="middle" class="h">L2 regime  r</text>
  <text x="150" y="165" text-anchor="middle" class="mono">T₂ specified Markov</text>

  <rect x="60" y="192" width="180" height="44" rx="5" class="learn"/>
  <text x="150" y="210" text-anchor="middle" class="h">L3 factors  m</text>
  <text x="150" y="227" text-anchor="middle" class="mono">G_θ learned, constrained</text>

  <rect x="60" y="254" width="180" height="44" rx="5" class="spec"/>
  <text x="150" y="272" text-anchor="middle" class="h">Cashflows  c</text>
  <text x="150" y="289" text-anchor="middle" class="mono">T_C specified (TA form)</text>

  <rect x="60" y="316" width="180" height="44" rx="5" class="spec"/>
  <text x="150" y="334" text-anchor="middle" class="h">Portfolio  p</text>
  <text x="150" y="351" text-anchor="middle" class="mono">T_P accounting + action</text>

  <g stroke="#2c5a7a" stroke-width="1.5" fill="#2c5a7a">
    <line x1="150" y1="112" x2="150" y2="124"/><polygon points="150,130 145,121 155,121"/>
    <line x1="150" y1="174" x2="150" y2="186"/><polygon points="150,192 145,183 155,183"/>
    <line x1="150" y1="236" x2="150" y2="248"/><polygon points="150,254 145,245 155,245"/>
    <line x1="150" y1="298" x2="150" y2="310"/><polygon points="150,316 145,307 155,307"/>
  </g>

  <!-- exogenous randomness -->
  <rect x="60" y="392" width="180" height="36" rx="5" fill="#fff" stroke="#999" stroke-dasharray="4,3"/>
  <text x="150" y="415" text-anchor="middle" class="mono">(w, σ, v) fixes all draws</text>
  <line x1="150" y1="392" x2="150" y2="366" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3"/>
  <polygon points="150,360 145,369 155,369" fill="#999"/>

  <!-- OBSERVATION OPERATOR -->
  <rect x="330" y="192" width="170" height="110" rx="6" class="obs"/>
  <text x="415" y="216" text-anchor="middle" class="h" fill="#9a4a2f">O — reporting</text>
  <text x="415" y="234" text-anchor="middle" class="h" fill="#9a4a2f">kernel</text>
  <text x="415" y="256" text-anchor="middle" class="mono">Ñ = Σ φ_k N_{t−k}</text>
  <text x="415" y="276" text-anchor="middle" class="m">biased, persistent,</text>
  <text x="415" y="291" text-anchor="middle" class="m">calibrated (GLM weights)</text>

  <g stroke="#333" stroke-width="1.6" fill="#333">
    <line x1="240" y1="247" x2="324" y2="247"/><polygon points="330,247 320,242 320,252"/>
  </g>
  <text x="283" y="238" class="m" text-anchor="middle">true state</text>

  <!-- OBSERVATION -->
  <rect x="330" y="352" width="170" height="70" rx="6" class="obs"/>
  <text x="415" y="376" text-anchor="middle" class="h" fill="#9a4a2f">Observation ω</text>
  <text x="415" y="396" text-anchor="middle" class="s">reported values, events,</text>
  <text x="415" y="412" text-anchor="middle" class="s">exact public factors</text>

  <g stroke="#9a4a2f" stroke-width="1.6" fill="#9a4a2f">
    <line x1="415" y1="302" x2="415" y2="346"/><polygon points="415,352 410,343 420,343"/>
  </g>

  <!-- AGENT -->
  <rect x="580" y="352" width="150" height="70" rx="6" class="agent"/>
  <text x="655" y="376" text-anchor="middle" class="h">Agent</text>
  <text x="655" y="396" text-anchor="middle" class="s">human or machine</text>
  <text x="655" y="412" text-anchor="middle" class="m">sees ω only</text>

  <g stroke="#555" stroke-width="1.6" fill="#555">
    <line x1="500" y1="387" x2="574" y2="387"/><polygon points="580,387 570,382 570,392"/>
  </g>

  <!-- action loop back -->
  <path d="M 655 422 L 655 470 L 150 470 L 150 434" fill="none" stroke="#555" stroke-width="1.6"/>
  <polygon points="150,428 145,437 155,437" fill="#555"/>
  <text x="402" y="463" class="s" text-anchor="middle">actions a_k at decision windows (rebalance · pacing · secondary)</text>

  <!-- REPLAY HARNESS -->
  <rect x="580" y="68" width="250" height="240" rx="6" class="rep"/>
  <text x="705" y="92" text-anchor="middle" class="h" fill="#4a6a4a">Replay harness</text>
  <text x="596" y="116" class="s">Same (w, σ, v); hybrid action</text>
  <text x="596" y="132" class="s">sequences (a₁…a_j, π_{j+1}…π_K)</text>
  <text x="596" y="158" class="mono">H₀ … H_K   (K+1 evaluations)</text>
  <text x="596" y="184" class="mono">c_j = (H_j − H_{j−1})/H₀</text>
  <text x="596" y="204" class="mono">Σ c_j = A   (Prop. 1)</text>
  <text x="596" y="230" class="s">Determinism: Prop. 2 —</text>
  <text x="596" y="246" class="s">replay is a function of the</text>
  <text x="596" y="262" class="s">run record</text>
  <text x="596" y="288" class="m">outputs: A, c_j per window,</text>
  <text x="596" y="302" class="m">risk measures, forced-sale log</text>

  <path d="M 705 352 L 705 314" fill="none" stroke="#4a6a4a" stroke-width="1.6"/>
  <polygon points="705,308 700,317 710,317" fill="#4a6a4a"/>
  <text x="712" y="335" class="m">run record</text>

  <!-- policy baseline note -->
  <rect x="330" y="68" width="170" height="70" rx="6" fill="#fff" stroke="#8a8a70" stroke-width="1.3"/>
  <text x="415" y="92" text-anchor="middle" class="h">Policy baseline π</text>
  <text x="415" y="112" text-anchor="middle" class="s">bands + pacing rule,</text>
  <text x="415" y="128" text-anchor="middle" class="s">acts on ω (reported)</text>
  <g stroke="#8a8a70" stroke-width="1.4" fill="#8a8a70">
    <line x1="500" y1="103" x2="574" y2="103"/><polygon points="580,103 570,98 570,108"/>
  </g>

  <!-- legend -->
  <rect x="30" y="520" width="800" height="80" rx="6" fill="#ffffff" stroke="#ccc"/>
  <rect x="46" y="536" width="24" height="13" class="spec"/><text x="78" y="547" class="s">specified</text>
  <rect x="160" y="536" width="24" height="13" class="learn"/><text x="192" y="547" class="s">learned (bounded)</text>
  <rect x="330" y="536" width="24" height="13" class="obs"/><text x="362" y="547" class="s">observation plane</text>
  <rect x="500" y="536" width="24" height="13" class="rep"/><text x="532" y="547" class="s">evaluation</text>
  <text x="46" y="576" class="m">The agent and the policy baseline both act on ω. The designer, and only the designer, holds the true plane — which is what makes the harness's scores well-defined.</text>
</svg>
