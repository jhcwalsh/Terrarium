<svg viewBox="0 0 860 430" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <style>
    .h { font-size: 14px; font-weight: bold; fill: #1a1a1a; }
    .s { font-size: 11.5px; fill: #333; }
    .m { font-size: 10.5px; fill: #666; font-style: italic; }
    .gate { fill: #f4f7f4; stroke: #4a6a4a; stroke-width: 1.5; }
    .fail { fill: #faf0f0; stroke: #8a2f2f; stroke-width: 1.5; }
  </style>

  <text x="30" y="28" class="h" font-size="16">The gauntlet — thresholds fixed before any model was trained</text>
  <text x="30" y="48" class="m">A battery specified after seeing results is a description. This one was written first, so it can fail.</text>

  <!-- generator in -->
  <rect x="30" y="80" width="150" height="56" rx="6" fill="#fdf6ee" stroke="#b07030" stroke-width="1.6"/>
  <text x="105" y="103" text-anchor="middle" class="h">Candidate</text>
  <text x="105" y="121" text-anchor="middle" class="h">generator</text>

  <!-- gates in sequence -->
  <g>
    <rect x="230" y="66" width="130" height="84" rx="6" class="gate"/>
    <text x="295" y="88" text-anchor="middle" class="h">Stylised facts</text>
    <text x="295" y="107" text-anchor="middle" class="s">fat tails, vol</text>
    <text x="295" y="122" text-anchor="middle" class="s">clustering, ACF decay</text>
    <text x="295" y="140" text-anchor="middle" class="m">Cont (2001)</text>

    <rect x="390" y="66" width="130" height="84" rx="6" class="gate"/>
    <text x="455" y="88" text-anchor="middle" class="h">Tail accuracy</text>
    <text x="455" y="107" text-anchor="middle" class="s">VaR &amp; ES at 95/99</text>
    <text x="455" y="122" text-anchor="middle" class="s">on frozen portfolios</text>
    <text x="455" y="140" text-anchor="middle" class="m">Tail-GAN scoring</text>

    <rect x="550" y="66" width="130" height="84" rx="6" class="gate"/>
    <text x="615" y="88" text-anchor="middle" class="h">Discriminability</text>
    <text x="615" y="107" text-anchor="middle" class="s">can a classifier tell</text>
    <text x="615" y="122" text-anchor="middle" class="s">synthetic from real?</text>
    <text x="615" y="140" text-anchor="middle" class="m">[[G2: score vs ceiling]]</text>
  </g>

  <g>
    <rect x="230" y="170" width="130" height="84" rx="6" class="gate"/>
    <text x="295" y="192" text-anchor="middle" class="h">Train-syn,</text>
    <text x="295" y="208" text-anchor="middle" class="h">test-real</text>
    <text x="295" y="228" text-anchor="middle" class="s">does it still work</text>
    <text x="295" y="243" text-anchor="middle" class="m">[[G2: degradation]]</text>

    <rect x="390" y="170" width="130" height="84" rx="6" class="gate"/>
    <text x="455" y="192" text-anchor="middle" class="h">Memorisation</text>
    <text x="455" y="212" text-anchor="middle" class="s">new paths, not</text>
    <text x="455" y="227" text-anchor="middle" class="s">replayed training data</text>
    <text x="455" y="245" text-anchor="middle" class="m">[[G2: NN floor]]</text>

    <rect x="550" y="170" width="130" height="84" rx="6" class="gate"/>
    <text x="615" y="192" text-anchor="middle" class="h">Held-out regime</text>
    <text x="615" y="212" text-anchor="middle" class="s">train without the 1970s,</text>
    <text x="615" y="227" text-anchor="middle" class="s">test on them</text>
    <text x="615" y="245" text-anchor="middle" class="m">self-designed; flagged as such</text>
  </g>

  <!-- flow arrows -->
  <g stroke="#4a6a4a" stroke-width="1.5" fill="#4a6a4a">
    <line x1="180" y1="108" x2="224" y2="108"/><polygon points="230,108 220,103 220,113"/>
    <line x1="360" y1="108" x2="384" y2="108"/><polygon points="390,108 380,103 380,113"/>
    <line x1="520" y1="108" x2="544" y2="108"/><polygon points="550,108 540,103 540,113"/>
    <path d="M 680 108 L 710 108 L 710 160 L 200 160 L 200 212 L 224 212" fill="none"/>
    <polygon points="230,212 220,207 220,217"/>
    <line x1="360" y1="212" x2="384" y2="212"/><polygon points="390,212 380,207 380,217"/>
    <line x1="520" y1="212" x2="544" y2="212"/><polygon points="550,212 540,207 540,217"/>
  </g>

  <!-- kill criterion -->
  <rect x="230" y="286" width="450" height="70" rx="6" class="fail"/>
  <text x="455" y="310" text-anchor="middle" class="h" fill="#8a2f2f">The kill criterion — written before training began</text>
  <text x="455" y="332" text-anchor="middle" class="s">The generator must beat a pre-specified statistical bootstrap.</text>
  <text x="455" y="348" text-anchor="middle" class="s" font-weight="bold">If it does not, the bootstrap ships instead. [[G2: outcome, either way]]</text>

  <g stroke="#4a6a4a" stroke-width="1.5" fill="#4a6a4a">
    <line x1="615" y1="254" x2="615" y2="266"/>
    <line x1="615" y1="266" x2="455" y2="266"/>
    <line x1="455" y1="266" x2="455" y2="280"/><polygon points="455,286 450,277 460,277"/>
  </g>

  <!-- outputs -->
  <rect x="30" y="286" width="150" height="70" rx="6" fill="#f2f6fa" stroke="#2c5a7a" stroke-width="1.6"/>
  <text x="105" y="312" text-anchor="middle" class="h" fill="#2c5a7a">Ships</text>
  <text x="105" y="332" text-anchor="middle" class="s">with its results table</text>
  <text x="105" y="347" text-anchor="middle" class="m">near-misses published</text>

  <g stroke="#2c5a7a" stroke-width="1.5" fill="#2c5a7a">
    <line x1="230" y1="321" x2="186" y2="321"/><polygon points="180,321 190,316 190,326"/>
  </g>

  <text x="30" y="392" class="s" font-weight="bold">Every published world's ensemble passes the same battery. The full specification is public — anyone can run it, extend it, or fail us with it.</text>
  <text x="30" y="410" class="m">[[Link: TERRARIUM-Bench when public]]</text>
</svg>
